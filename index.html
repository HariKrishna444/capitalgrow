/* Grouped <select> of every faculty member already in the directory
   (uploaded by EA / created anywhere in the system), grouped by home
   branch — lets HOD pick a known faculty member to assign as Coordinator
   instead of retyping their email every time. Selecting an option fills
   the email/name fields via fillCoordinatorFromDirectory() below. */
function facultyDropdownOptionsHtml(){
  const entries = App.state.users.filter(u=>u.systemRole==='FACULTY');
  if(entries.length===0) return `<option value="">— No faculty in the directory yet —</option>`;
  const branches = {};
  const noBranch = [];
  entries.forEach(u=>{ if(u.homeBranch){ (branches[u.homeBranch] = branches[u.homeBranch] || []).push(u); } else { noBranch.push(u); } });
  let html = `<option value="">— Pick an existing faculty member (optional) —</option>`;
  Object.keys(branches).sort().forEach(bk=>{
    html += `<optgroup label="${escapeHtml(branchLabel(bk))}">`;
    branches[bk].sort((a,b)=>a.name.localeCompare(b.name)).forEach(u=>{
      html += `<option value="${u.id}">${escapeHtml(u.name)} — ${escapeHtml(u.email)}</option>`;
    });
    html += `</optgroup>`;
  });
  if(noBranch.length){
    html += `<optgroup label="No branch set">`;
    noBranch.sort((a,b)=>a.name.localeCompare(b.name)).forEach(u=>{
      html += `<option value="${u.id}">${escapeHtml(u.name)} — ${escapeHtml(u.email)}</option>`;
    });
    html += `</optgroup>`;
  }
  return html;
}
function fillCoordinatorFromDirectory(userId){

/* Looks the typed Course Code up in SUBJECT_CATALOG and, when it resolves
   to exactly one semester, auto-selects it in the Semester dropdown (still
   freely overridable) and fills the Course Name if that field is still
   empty. When the same code maps to more than one semester (shouldn't
   normally happen — see resolveSemesterForCode) it lists the options
   instead of guessing. Unrecognized codes just get a quiet note; the
   Timetable Incharge can still fill Semester manually as before. */
function onNewCourseCodeChange(rawCode){
  const noteEl = document.getElementById('hod-newcourse-code-note');
  const semEl = document.getElementById('hod-newcourse-semester');
  const nameEl = document.getElementById('hod-newcourse-name');
  if(!noteEl || !semEl) return;
  const code = (rawCode||'').trim();
  if(!code){ noteEl.textContent = ''; return; }
  const result = resolveSemesterForCode(code);
  if(!result){
    noteEl.innerHTML = `Not in the Subject Catalog yet — set Semester manually.`;
    return;
  }
  if(result.semester){
    semEl.value = result.semester;
    const entry = result.entries[0];
    if(nameEl && !nameEl.value.trim()) nameEl.value = entry.name;
    const regsBranches = [...new Set(result.entries.map(e=>`${regulationFromCode(e.code)} ${e.branch}`))].join(', ');
    noteEl.innerHTML = `Matched in Subject Catalog (${escapeHtml(regsBranches)}) — Semester ${result.semester} filled in automatically.`;
  } else if(result.options){
    noteEl.innerHTML = `This code maps to different semesters depending on regulation/branch — pick the right one: `
      + result.options.map(o=>`<button type="button" class="btn btn-outline btn-sm" style="margin:2px 4px 0 0;" onclick="document.getElementById('hod-newcourse-semester').value='${o.sem}';${nameEl?`document.getElementById('hod-newcourse-name').value='${o.name.replace(/'/g,"\\'")}';`:''}">${escapeHtml(regulationFromCode(o.code))} ${escapeHtml(o.branch)} — Sem ${o.sem}</button>`).join('');
  }
}
window.onNewCourseCodeChange = onNewCourseCodeChange;

// Admin card for the Practical Internal Test / SEE Practical windows —
// see App.setPracticalWindow/clearPracticalWindow. Independent of the

// top of the legacy per-course CC/HOD Practical Internal deadline rather
// than replacing it (see approvalGroupPanel's pracLocked/seeLockedFinal).
function practicalWindowsCardHtml(){
  const toLocalInputValue = iso => { if(!iso) return ''; const d = new Date(iso); const pad = n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const windowCard = (kind, label, win) => {
    const now = Date.now();
    const startTs = win?.startDate ? new Date(win.startDate).getTime() : null;
    const endTs = win?.endDate ? new Date(win.endDate).getTime() : null;
    let badge = `<span class="status-pill status-draft">No restriction</span>`;
    if(win && (startTs || endTs)){
      if(startTs && now < startTs) badge = `<span class="status-pill status-draft">Upcoming — opens ${fmtDate(startTs)}</span>`;
      else if(endTs && now > endTs) badge = `<span class="status-pill status-rejected">Closed — window ended ${fmtDate(endTs)}</span>`;
      else badge = `<span class="status-pill status-approved">Open${endTs ? ` — until ${fmtDate(endTs)}` : ''}</span>`;
    }
    return `
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:${kind==='pracInternal'?'0':'18px'};">

          <input type="datetime-local" id="pw-start-${kind}" value="${toLocalInputValue(win?.startDate)}">
        </div>
        <div class="config-field">
          <label>Closes <span style="text-transform:none;">(optional)</span></label>
          <input type="datetime-local" id="pw-end-${kind}" value="${toLocalInputValue(win?.endDate)}">
        </div>
      </div>
      <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;">
        <button class="btn btn-sm" onclick="App.setPracticalWindow('${kind}', document.getElementById('pw-start-${kind}').value||null, document.getElementById('pw-end-${kind}').value||null)">Save</button>
        ${win && (win.startDate || win.endDate) ? `<button class="btn btn-outline btn-sm" onclick="App.clearPracticalWindow('${kind}')">Clear</button>` : ''}

  return `
    <div class="card">
      <div class="page-eyebrow" style="margin-bottom:2px;">Administrator</div>
      <div class="section-title" style="font-size:15px;">Practical Internal Test &amp; SEE Practical windows</div>
      <p class="section-meta" style="margin-top:4px;">Independent of the Term Test cycle above — both of these can be open at the same time as a Term Test, or on their own. Leave Opens/Closes blank for no restriction. Practical Internal Test also still respects any window the Course Coordinator has set on that section's Question Paper Setup page — both have to be open for the Course Instructor to enter marks.</p>

function getAuditEntries(){
  const entries = [];
  App.state.courses.forEach(c=>{ c.history.forEach(h=> entries.push({...h, code:c.code, name:c.name})); });
  entries.sort((a,b)=>b.ts-a.ts);
  return entries;
}
function getAuditEntriesForCourses(courses){
  const entries = [];
  courses.forEach(c=>{ (c.history||[]).forEach(h=> entries.push({...h, code:c.code, name:c.name})); });
  entries.sort((a,b)=>b.ts-a.ts);
  return entries;
}
function auditDateKey(ts){
  const d = new Date(ts);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function auditDateLabel(ts){
  return new Date(ts).toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'});
}

}

/* ---------- Term Test 1/2 marks export (PDF + XLSX) ----------
   Once the CI has forwarded a Term Test's marks on to the Course
   Coordinator (isTTForwarded), the entered marks stop being editable and
   become a fixed record worth taking off the app entirely — the CC (and
   anyone else who can view this page: EA/HOD) can pull down a PDF or
   Excel copy of exactly what was entered, in the same Part A/Part B
   template shape shown on screen, without having to screenshot the table
   or wait for the whole record to reach the Examination Branch's own
   export further down the pipeline. */
function ttExportTableData(course, cycle){
  const cycleLabel = TERM_TEST_LABELS[cycle] || cycle;
  const template = getCourseTemplate(course);
  const compKey = termTestComponentKey(template, cycle);
  const comp = template.cie.find(c=>c.key===compKey);
  const itemKey = cycle==='TT1' ? 'tt1' : 'tt2';
  const header = ['Student', 'Roll No',
    ...TT_SHORT_KEYS.map(k=>`${k.toUpperCase()} (/${TT_SHORT_EACH_MAX})`), 'Part A Total',
    ...TT_ALL_LONG_QKEYS.map(qKey=>`${qKey.toUpperCase()} (/${getLongPairMax(qKey)})`), 'Part B Total',
    'Term Test Total', `${cycleLabel} Scaled (/${comp.scaledMax})`];
  const rows = itemEntryStudents(course, itemKey).map(s=>{
    const detail = (s.marks && s.marks.ttDetail && s.marks.ttDetail[cycle]) || {};
    const calc = computeTermTestRaw(detail);
    const shortVals = TT_SHORT_KEYS.map(k=>ttNum(detail[k]));
    const longVals = TT_ALL_LONG_QKEYS.map(qKey=>{
      const d = detail[qKey] || {};
      const cfg = getQuestionConfig(course, cycle, qKey);
      if(cfg.split===cfg.fullValue) return ttNum(d.a);
      const av = ttNum(d.a), bv = ttNum(d.b);
      return (av==='' && bv==='') ? '' : `${av===''?0:av}+${bv===''?0:bv}`;
    });
    const cieScaled = round1((Math.min(calc.total, comp.rawMax)/comp.rawMax) * comp.scaledMax);
    return [s.name, s.rollNo || '', ...shortVals, calc.shortTotal, ...longVals, calc.longRaw, calc.total, cieScaled];
  });
  return { header, rows, cycleLabel, comp };
}
async function exportTTPdf(courseId, cycle){
  const course = await App.ensureCourseStudentsLoaded(courseId);
  if(!isTTForwarded(course, cycle)){ toast('Marks haven\'t been forwarded to the Course Coordinator yet.', 'err'); return; }
  try{
    await ensureJsPDFLoaded();
  }catch(e){
    toast('Could not load the PDF writer — check your connection and try again.', 'err');
    return;
  }
  const { header, rows, cycleLabel } = ttExportTableData(course, cycle);
  const { jsPDF } = window.jspdf;
  // Landscape: this table runs Student/Roll No + 5 Part A columns + Part A
  // Total + up to 6 Part B columns + Part B Total + Term Test Total +
  // Scaled — comfortably too wide for portrait, so it prints sideways
  // instead of getting crushed or cut off.
  const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
  const pageWidth = doc.internal.pageSize.getWidth();

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(13);
  doc.text(`${course.name} — ${course.code}`, pageWidth / 2, 32, { align: 'center' });
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  const metaLine = `${course.code} · Section ${course.section} · ${branchLabel(course.branch)}${course.regulation ? ` · ${course.regulation}` : ''} · ${cycleLabel} — Forwarded marks`;
  doc.text(metaLine, pageWidth / 2, 48, { align: 'center' });

  doc.autoTable({
    head: [header],
    body: rows.map(r => r.map(v => String(v))),
    startY: 60,
    theme: 'grid',
    styles: { fontSize: 7.5, halign: 'center', cellPadding: 3, textColor: [0, 0, 0], lineColor: [0, 0, 0], lineWidth: 0.5 },
    headStyles: { fillColor: [238, 238, 238], textColor: [0, 0, 0], fontStyle: 'bold', fontSize: 7 },
    columnStyles: { 0: { halign: 'left' } },
    margin: { left: 24, right: 24 },
  });

  const fileName = `${course.code}_Section${course.section}_${cycle}_marks.pdf`;
  doc.save(fileName);
}
window.exportTTPdf = exportTTPdf;
async function exportTTXlsx(courseId, cycle){
  const course = await App.ensureCourseStudentsLoaded(courseId);
  if(!isTTForwarded(course, cycle)){ toast('Marks haven\'t been forwarded to the Course Coordinator yet.', 'err'); return; }
  try{
    await ensureXLSXLoaded();
  }catch(e){
    toast('Could not load the spreadsheet writer — check your connection and try again.', 'err');
    return;
  }
  const { header, rows, cycleLabel } = ttExportTableData(course, cycle);
  const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
  const wb = XLSX.utils.book_new();
  const sheetName = (cycleLabel || 'Marks').replace(/[\\/?*[\]:]/g, '').slice(0, 31);
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  const fileName = `${course.code}_Section${course.section}_${cycle}_marks.xlsx`;
  try{
    XLSX.writeFile(wb, fileName);
  }catch(e){
    const blob = new Blob([XLSX.write(wb, { bookType: "xlsx", type: "array" })], { type: "application/octet-stream" });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fileName;
    a.click();
    URL.revokeObjectURL(a.href);
  }
}
window.exportTTXlsx = exportTTXlsx;

// XLSX.js (~1MB minified) is only used by EA/CC import features — loaded on
// demand the first time any of them is actually used, instead of blocking
// every page load (including Admin/Exam Branch/CI sessions that never touch
// it) with the full library. Cached after first load.
let _xlsxLoadPromise = null;
function ensureXLSXLoaded(){
  if(typeof XLSX !== 'undefined') return Promise.resolve();
  if(_xlsxLoadPromise) return _xlsxLoadPromise;
  _xlsxLoadPromise = new Promise((resolve, reject)=>{
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    script.onload = () => resolve();
    script.onerror = () => { _xlsxLoadPromise = null; reject(new Error('Failed to load the spreadsheet reader.')); };
    document.head.appendChild(script);
  });
  return _xlsxLoadPromise;
}

// jsPDF + autotable, loaded on demand the same way — used for real
// downloadable PDF exports (e.g. Term Test marks) instead of the old
// window.print() approach, which depended on the browser's print dialog
// and silently broke here: a separate @media print rule elsewhere in this
// file (added for the Seating Plan tool) hides everything on the page
// except its own #previewBody element, so #print-area — the div the old
// exportTTPdf/exportPrint relied on — was rendering fully blank whenever
// "Save as PDF" ran. Generating the PDF directly with jsPDF sidesteps that
// print-CSS conflict entirely.
let _jsPdfLoadPromise = null;
function ensureJsPDFLoaded(){
  if(typeof window.jspdf !== 'undefined' && window.jspdf.jsPDF) return Promise.resolve();
  if(_jsPdfLoadPromise) return _jsPdfLoadPromise;
  const loadScript = (src) => new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('Failed to load ' + src));
    document.head.appendChild(s);
  });
  _jsPdfLoadPromise = loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')
    .then(() => loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'))
    .catch((e) => { _jsPdfLoadPromise = null; throw e; });
  return _jsPdfLoadPromise;
}

}

  const grand = cieTotal + seeTotal;

  const actionCell = (html) => actions ? `<td style="${cs}text-align:left;padding:6px 10px;">${html||''}</td>` : '';

  const totalRowSpan = cie.length + see.length + 2; // + CIE Total row + SEE Total row

function renderCISubjectDetail(params){
  const course = App.getCourse(params.courseId);
  const wrap = el('<div></div>');
  const backBtn = `<button class="ghost-btn no-print" style="color:var(--ink);border-color:var(--rule);margin-bottom:14px;" onclick="App.navigate('ci-sections')">← Back to my subjects</button>`;

  if(!isCourseOwnerCI(course)){ wrap.innerHTML = `<div class="page-head">${backBtn}</div>${notYourSubjectHtml()}`; return wrap; }
  const enterMode = course.status==='draft' || course.editUnlocked;
  const template = course.evalType ? getCourseTemplate(course) : null;
  // Only the Term Test cycle the Administrator currently has fixed as
  // active is open here — e.g. while TT1 is active, "Enter Term Test 2"
  // stays disabled (and vice versa), so the CI can't get ahead of the
  // cycle that's actually been opened for the whole department.
  const activeCycle = App.state.currentTermTest?.cycle || null;
  let actions = null;
  if(template){
    const tt1Key = termTestComponentKey(template, 'TT1');
    const tt2Key = termTestComponentKey(template, 'TT2');
    const enterBtn = (label, onclick) => `<button class="btn ${enterMode?'':'btn-outline'} btn-sm" style="white-space:nowrap;" onclick="${onclick}">${label}</button>`;
    const disabledBtn = (label, reason) => `<button class="btn btn-outline btn-sm" style="white-space:nowrap;opacity:.5;cursor:not-allowed;" disabled title="${escapeHtml(reason)}">${label}</button>`;
    const viewBtn = (label, onclick) => `<button class="btn btn-outline btn-sm" style="white-space:nowrap;border-color:var(--seal-red);color:var(--seal-red);" onclick="${onclick}">${label}</button>`;
    // Shown in the Marks Entry column once an item's CI → CC → HOD chain
    // has reached 'done' (fully approved/verified) — green, same as every
    // other verified exam, replacing the plain "Enter ..." button. Stays
    // clickable so the CI can still open the page to view what was entered.
    const verifiedBtn = (label, onclick) => `<button class="btn btn-green btn-sm" style="white-space:nowrap;" onclick="${onclick}">✓ ${label} Verified</button>`;
    // Same green treatment for no-approval components (SIA, Regular
    // Lab/Skill Performance Assessment, Skill Certification, etc.) once
    // the CI has Submitted them (see App.submitNoApprovalComponent) —
    // "Completed" rather than "Verified" since nobody signs off on these.
    const completedBtn = (label, onclick) => `<button class="btn btn-green btn-sm" style="white-space:nowrap;" onclick="${onclick}">✓ ${label} Completed</button>`;
    actions = {
      component(comp, section){
        if(comp.key===tt1Key){

/* Toggles Full Screen mode for Term Test marks entry. Fullscreens
   document.documentElement (the whole page) — deliberately NOT the marks
   table div itself — because that div gets destroyed and rebuilt by
   renderContent() on every single mark saved (onchange fires on Tab/Enter),
   and a fullscreen-ed element getting removed from the DOM makes the
   browser silently exit fullscreen. An earlier version fullscreened the
   table div and tried to re-request fullscreen after each rebuild, which
   "worked" but caused a visible exit/re-enter flicker on every box. Since
   document.documentElement is never removed by that rebuild, fullscreening
   it means the browser's fullscreen state is simply never touched by
   normal marks entry — no exit, no flicker, ever.
   The actual "hide the clutter, make the table big" look is done with a
   `tt-fs-active` class on <body> (kept in sync with real browser fullscreen
   state via the fullscreenchange listener below, so pressing Esc — a
   totally valid way to leave fullscreen — cleans up the layout too, not
   just a click on this button). CSS elsewhere hides everything marked
   `.tt-fs-hide` and expands `.tt-fs-wrap` while that class is present. */
function toggleTTFullscreen(){
  if(document.body.classList.contains('tt-fs-active')){
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    document.body.classList.remove('tt-fs-active');
  } else if(document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen()
      .then(()=> document.body.classList.add('tt-fs-active'))
      .catch(()=> toast('Full screen isn\'t available in this browser/window — try opening DVS in its own tab.', 'err'));
  } else {
    toast('Full screen isn\'t supported in this browser.', 'err');
  }
  // Full Screen mode shrinks the table's font size/cell padding (see CSS),
  // which changes every header row's rendered height — so the sticky
  // header's per-row top offsets (applyStickyTableHeaders) need
  // recalculating against the new sizes, not just set once at initial
  // render. Deferred a tick so it runs after the tt-fs-active class change
  // (and the fullscreen request itself) has actually repainted.
  requestAnimationFrame(()=> applyStickyTableHeaders(document.getElementById('content')));
}
document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement) document.body.classList.remove('tt-fs-active');
  requestAnimationFrame(()=> applyStickyTableHeaders(document.getElementById('content')));
});

/* Structured Term Test entry — Q1-Q5 short answers (2 marks each) then
   Q6-Q11 long answers in 3 unit-paired choice questions, each split into
   parts (a)/(b). Both sides of a pair stay editable — the CI can enter
   marks for either or both while deciding — and whichever side totals
   higher is the one that counts toward that pair's score; that cell is
   highlighted so it's clear which one won. */
function renderCITermTestEntry(params){
  const course = App.getCourse(params.courseId);
  if(!course) return el('<div></div>');
  // Back goes to this section's Subject Detail page (where "Enter Term
  // Test 1/2" was actually clicked from), matching every other item-entry
  // page (ci-component-entry, ci-section-view) — it used to jump all the
  // way back to the top-level "My Subjects" list instead, skipping the
  // page the CI came from.
  const backBtnEarly = itemViewerBackBtnHtml(course, 'ci-subject-detail', {courseId:params.courseId}, `← Back to ${course.name}`);
  const tt = App.state.currentTermTest;
  const cycle = params.cycle || tt?.cycle || 'TT1';
  const itemKey = cycle==='TT1' ? 'tt1' : 'tt2';
  const ttFsWrapId = `tt-fs-${course.id}-${cycle}`;
  const searchKey = `${course.id}|${cycle}`;
  if(!canViewItemEntry(course, itemKey)){
    const wrapDenied = el('<div></div>');
    wrapDenied.innerHTML = `<div class="page-head">${backBtnEarly}<h2>Term Test</h2></div>${notYourSubjectHtml()}`;
    return wrapDenied;
  }
  const cycleLabel = TERM_TEST_LABELS[cycle];
  const activeCycleLabel = tt?.cycle && TERM_TEST_LABELS[tt.cycle];
  const fullLabel = activeCycleLabel && tt.academicYear && tt.semester ? `${tt.academicYear} · ${tt.semester} · ${activeCycleLabel}` : activeCycleLabel;
  const wrap = el('<div></div>');
  const backBtn = itemViewerBackBtnHtml(course, 'ci-subject-detail', {courseId:params.courseId}, `← Back to ${course.name}`);
  if(!tt){
    wrap.innerHTML = `<div class="page-head">${backBtn}<h2>Term Test</h2></div>${emptyStateHtml('No Term Test cycle active','The Administrator hasn\'t fixed a Term Test cycle yet.')}`;
    return wrap;
  }
  const template = course.evalType ? getCourseTemplate(course) : null;
  const compKey = template ? termTestComponentKey(template, cycle) : null;
  if(!compKey){
    wrap.innerHTML = `<div class="page-head">${backBtn}<h2>Term Test</h2></div>${emptyStateHtml('Not applicable', !course.evalType ? 'The Course Coordinator hasn\'t fixed an Evaluation Type for this section yet.' : `${cycleLabel} has no matching component on this section's Evaluation Type template.`)}`;
    return wrap;
  }
  const correctionMode = course.status==='approved' && course.editUnlocked;
  const forwarded = isTTForwarded(course, cycle);
  const ia = App.itemApproval(course.id, itemKey) || { stage:'ci', remark:'' };
  // If the EA/HOD has just sent this item back to the CI for correction,
  // the CI needs to be able to fix it even if the Term Test cycle has since
  // moved on (Administrator fixed the next cycle) or the entry window has
  // closed — otherwise a send-back would leave the CI with no way to act on
  // it at all. This mirrors correctionMode above (the Overall record's own
  // "reopen for editing" escape hatch), scoped to just this one item.
  const sentBackForCorrection = ia.stage==='ci' && !!ia.remark;
  // Mutual exclusivity: only the cycle the Administrator currently has
  // fixed is open for entry — if they've since moved on to another cycle
  // (or closed it outright), this one drops to read-only even mid-way
  // through, same as if the CI had already forwarded it. Unless this item
  // was just sent back for correction (see sentBackForCorrection above), in
  // which case that lock is lifted so the CI can actually fix it.
  const cycleIsActive = tt.cycle === cycle;
  const startTs = tt.startDate ? new Date(tt.startDate).getTime() : null;
  const endTs = tt.endDate ? new Date(tt.endDate).getTime() : null;
  const nowTs = Date.now();
  const withinWindow = (!startTs || nowTs>=startTs) && (!endTs || nowTs<=endTs);
  // isCourseOwnerCI(course) is required here — canViewItemEntry() lets the
  // assigned CC (and EA/HOD at their own stage) open this same shared page
  // at any time, not just their own turn, so they can see progress. Without
  // this check, a CC opening the page while it's still sitting at the CI's
  // stage would see every mark box as editable (and be able to type into
  // them) instead of read-only, since the stage/window checks below don't
  // know WHO is looking, only what stage the item is at.
  const editable = isItemCIFor(course, itemKey) && (course.status==='draft' || correctionMode) && forwarded && ia.stage==='ci' && (sentBackForCorrection || (cycleIsActive && withinWindow));
  // The marks-entry PERIOD is considered finished once the window has
  // closed (endDate passed) or the Administrator has moved the active
  // cycle on — at that point the CI can no longer edit marks, but (if they
  // haven't forwarded yet) they can now forward what they have on to the CC.
  // While the period is still open, only Save Progress is available; the
  // CI is not meant to forward mid-entry. A send-back for correction always
  // counts as "finished" too — the CI can fix the flagged issue and forward
  // it straight back on, without waiting for the cycle window itself.
  const periodFinished = sentBackForCorrection || !cycleIsActive || !withinWindow;
  const lockBannerHtml = sentBackForCorrection ? '' : (!cycleIsActive
    ? `<p class="section-meta" style="color:var(--seal-red);margin-top:6px;">The Administrator has moved the active cycle to <strong>${escapeHtml(TERM_TEST_LABELS[tt.cycle]||tt.cycle)}</strong> — ${escapeHtml(cycleLabel)} is now read-only here.</p>`
    : (!withinWindow ? `<p class="section-meta" style="color:var(--seal-red);margin-top:6px;">${startTs && nowTs<startTs ? `The marks-entry window for ${escapeHtml(cycleLabel)} opens ${fmtDate(startTs)}.` : `The marks-entry window for ${escapeHtml(cycleLabel)} closed ${endTs?fmtDate(endTs):''} — no further edits are allowed.`}</p>` : ''));
  const comp = template.cie.find(c=>c.key===compKey);

  // Unit/split are the Course Coordinator's call now — this page only shows
  // a read-only summary of what the CC has set, plus the forward status.
  // Marks entry itself stays locked until the CC forwards the setup.
  const shortQuestionSetupSummaryHtml = `<div style="margin-top:10px;">${TT_SHORT_KEYS.map(qKey=>{
    const cfg = getQuestionConfig(course, cycle, qKey);
    return `<span style="display:inline-block;margin:4px 10px 4px 0;padding:4px 10px;background:#F3EEDD;border:1px solid var(--rule);border-radius:6px;font-size:12.5px;">
      <strong>${qKey.toUpperCase()}</strong>: ${cfg.unit ? escapeHtml(cfg.unit) : `<span style="color:var(--seal-red);">Unit not set</span>`}
    </span>`;
  }).join('')}</div>`;
  const questionSetupSummaryHtml = `<div style="margin-top:10px;">${TT_ALL_LONG_QKEYS.map(qKey=>{
    const cfg = getQuestionConfig(course, cycle, qKey);
    return `<span style="display:inline-block;margin:4px 10px 4px 0;padding:4px 10px;background:#F3EEDD;border:1px solid var(--rule);border-radius:6px;font-size:12.5px;">
      <strong>${qKey.toUpperCase()}</strong>: ${cfg.unit ? escapeHtml(cfg.unit) : `<span style="color:var(--seal-red);">Unit not set</span>`} · ${cfg.split===cfg.fullValue?`${cfg.fullValue} (single)`:cfg.halfValue}
    </span>`;
  }).join('')}</div>`;

  // Class performance stats — highest / average / lowest, computed off the
  // raw Term Test Total (/50) so it reads the same for every Evaluation
  // Type regardless of how few or many marks that cycle is scaled to.
  // Computed BEFORE the row-by-row table below because ttScriptUploadCell
  // needs autoPicks to decide which single row gets an enabled Upload
  // button for each of Best/Average/Lowest.
  const entryStudents = itemEntryStudents(course, itemKey);
  const scored = entryStudents.map(s=>{
    const detail = (s.marks && s.marks.ttDetail && s.marks.ttDetail[cycle]) || {};
    return { student: s, total: computeTermTestRaw(detail).total };
  }).filter(x=>x.total>0);
  // Evaluated Script upload eligibility (autoPicks) is deliberately computed
  // off only the FULLY entered students, not every student with any nonzero
  // total — otherwise a student with just one question typed in could get
  // flagged "Lowest" and prompted to upload a script before their marks are
  // even finished. The Class Performance stat cards above still use the
  // broader `scored` list as-is, since "current running Highest/Average" is
  // useful progress info even mid-entry; it's specifically the upload
  // prompt that should wait for a complete entry.
  const fullyScored = scored.filter(x=>isTTFullyEntered((x.student.marks && x.student.marks.ttDetail && x.student.marks.ttDetail[cycle]) || {}));
  const autoPicks = computeTTAutoPicks(fullyScored);
  // The CC/EA/HOD remark trio is per-column optional table space: show a
  // given role's column only if either (a) it already has at least one
  // remark on it for this subject+cycle, so it's worth a read-only viewer's
  // screen space, or (b) the person looking at this page right now is the
  // one who's actually allowed to type into it — otherwise the very role
  // meant to add the FIRST remark would never see a box to add it in.
  // Empty + not-editable-by-this-viewer is the only case that's hidden.
  const anyRemark = (role) => entryStudents.some(s=>!!((((s.marks||{}).ttRemarks||{})[cycle]||{})[role]));
  const showRemarkCol = {
    cc: anyRemark('cc') || canEditTTStudentRemark(course, itemKey, 'cc'),
    ea: anyRemark('ea') || canEditTTStudentRemark(course, itemKey, 'ea'),
    hod: anyRemark('hod') || canEditTTStudentRemark(course, itemKey, 'hod'),
  };

  const rows = entryStudents.map(s=>{
    const absentHere = isAbsentForComponent(s, compKey);
    const rowEditable = editable && !absentHere;
    const detail = (s.marks && s.marks.ttDetail && s.marks.ttDetail[cycle]) || {};
    const calc = computeTermTestRaw(detail);
    const absentCell = `<td style="text-align:center;"><input type="checkbox" ${absentHere?'checked':''} ${editable?'':'disabled'}
      title="Absent for ${escapeHtml(cycleLabel)} only — clears just this exam's marks"
      onchange="if(confirm(this.checked ? 'Mark ${escapeHtml(s.name)} absent for ${escapeHtml(cycleLabel)}? This clears only this exam\\'s marks.' : 'Mark ${escapeHtml(s.name)} present again for ${escapeHtml(cycleLabel)}?')) App.setComponentAbsent('${course.id}','${s.id}','${compKey}',this.checked); else this.checked=!this.checked;"></td>`;
    const shortCells = absentHere ? `<td colspan="${TT_SHORT_KEYS.length}" class="mono" style="color:var(--text-soft);font-size:12px;text-align:center;">Absent</td>` : TT_SHORT_KEYS.map(k=>{
      const v = detail[k];
      const overMax = typeof v==='number' && (v>TT_SHORT_EACH_MAX || v<0);
      return `<td><input type="number" min="0" max="${TT_SHORT_EACH_MAX}" step="0.5" style="width:56px;"
        class="${overMax?'invalid':''}"
        data-markkey="${course.id}|${s.id}|${cycle}_${k}"
        value="${ttNum(v)}" ${rowEditable?'':'disabled'}
        onchange="App.setTermTestMark('${course.id}','${s.id}','${cycle}','${k}',null,this.value)"></td>`;
    }).join('');
    const longCells = absentHere ? `<td colspan="${TT_LONG_PAIRS.length*2}" class="mono" style="color:var(--text-soft);font-size:12px;text-align:center;">Absent</td>` : TT_LONG_PAIRS.map(({a,b,max})=>{
      const da = detail[a]||{}, db = detail[b]||{};
      const totalA = (typeof da.a==='number'?da.a:0)+(typeof da.b==='number'?da.b:0);
      const totalB = (typeof db.a==='number'?db.a:0)+(typeof db.b==='number'?db.b:0);
      const aWinning = totalA>0 && totalA>=totalB, bWinning = totalB>0 && totalB>totalA;
      const half = max/2;
      const cellFor = (qKey, winning) => {
        const cfg = getQuestionConfig(course, cycle, qKey);
        const winMark = winning ? ` style="background:#EAF3EA;"` : '';
        const av = (detail[qKey]||{}).a, bv = (detail[qKey]||{}).b;
        const fullCap = cfg.split===cfg.fullValue ? max : half;
        const aOverMax = typeof av==='number' && (av>fullCap || av<0);
        const bOverMax = typeof bv==='number' && (bv>half || bv<0);
        return cfg.split===cfg.fullValue
          ? `<td class="mono"${winMark} style="white-space:nowrap;text-align:center;">
              <span style="font-size:10px;color:var(--text-soft);">${qKey.toUpperCase()}</span>
              <input type="number" min="0" max="${max}" step="0.5" style="width:56px;text-align:center;" placeholder="/${max}"
                class="${aOverMax?'invalid':''}"
                data-markkey="${course.id}|${s.id}|${cycle}_${qKey}_a"
                value="${ttNum(av)}" ${rowEditable ? '' : 'disabled'}
                onchange="App.setTermTestMark('${course.id}','${s.id}','${cycle}','${qKey}','a',this.value)">
            </td>`
          : `<td class="mono"${winMark} style="white-space:nowrap;text-align:center;">
              <span style="font-size:10px;color:var(--text-soft);">${qKey.toUpperCase()}</span>
              <input type="number" min="0" max="${half}" step="0.5" style="width:44px;text-align:center;" placeholder="a/${half}"
                class="${aOverMax?'invalid':''}"
                data-markkey="${course.id}|${s.id}|${cycle}_${qKey}_a"
                value="${ttNum(av)}" ${rowEditable ? '' : 'disabled'}
                onchange="App.setTermTestMark('${course.id}','${s.id}','${cycle}','${qKey}','a',this.value)">
              <input type="number" min="0" max="${half}" step="0.5" style="width:44px;text-align:center;" placeholder="b/${half}"
                class="${bOverMax?'invalid':''}"
                data-markkey="${course.id}|${s.id}|${cycle}_${qKey}_b"
                value="${ttNum(bv)}" ${rowEditable ? '' : 'disabled'}
                onchange="App.setTermTestMark('${course.id}','${s.id}','${cycle}','${qKey}','b',this.value)">
            </td>`;
      };
      return cellFor(a, aWinning) + cellFor(b, bWinning);
    }).join('');
    const cieScaled = round1((Math.min(calc.total, comp.rawMax)/comp.rawMax) * comp.scaledMax);
    const searchHay = `${s.name||''} ${s.rollNo||''}`.toLowerCase();
    return `<tr data-tt-search="${escapeHtml(searchHay)}"${absentHere?' style="opacity:.55;"':''}>
      ${absentCell}
      <td>${studentNameCell(s)}</td>
      ${shortCells}
      <td class="total-cell hl-total">${absentHere?'—':calc.shortTotal}<span class="mono" style="font-weight:400;color:var(--text-soft);font-size:11px;">/${TT_SHORT_TOTAL_MAX}</span></td>
      ${longCells}
      <td class="total-cell hl-total">${absentHere?'—':calc.longRaw}<span class="mono" style="font-weight:400;color:var(--text-soft);font-size:11px;">/${TT_LONG_RAW_MAX}</span></td>
      <td class="total-cell hl-total">${absentHere?'—':calc.total}<span class="mono" style="font-weight:400;color:var(--text-soft);font-size:11px;">/${TT_TOTAL_MAX}</span></td>
      <td class="total-cell" style="font-weight:700;">${absentHere?'—':cieScaled}<span class="mono" style="font-weight:400;color:var(--text-soft);font-size:11px;">/${comp.scaledMax}</span></td>
      <td>${absentHere?'—':ttScriptUploadCell(course, cycle, s, editable, autoPicks)}</td>
      ${showRemarkCol.cc ? ttStudentRemarkCell(course, itemKey, cycle, s, 'cc') : ''}
      ${showRemarkCol.ea ? ttStudentRemarkCell(course, itemKey, cycle, s, 'ea') : ''}
      ${showRemarkCol.hod ? ttStudentRemarkCell(course, itemKey, cycle, s, 'hod') : ''}
    </tr>`;
  }).join('');

  let statsHtml = `<p class="section-meta">No marks entered yet for ${escapeHtml(cycleLabel)} — class stats will appear once at least one student has a score.</p>`;
  if(scored.length){
    const max = Math.max(...scored.map(x=>x.total));
    const min = Math.min(...scored.map(x=>x.total));
    const avg = round1(scored.reduce((a,x)=>a+x.total,0)/scored.length);
    const topStudents = scored.filter(x=>x.total===max).map(x=>x.student.name).join(', ');
    const lowStudents = scored.filter(x=>x.total===min).map(x=>x.student.name).join(', ');
    statsHtml = `<div style="display:flex;gap:14px;flex-wrap:wrap;">
      <div style="flex:1;min-width:180px;background:#EAF3EA;border:1px solid var(--rule);border-radius:8px;padding:10px 14px;">
        <div class="section-meta" style="font-weight:600;">Highest (Best)</div>
        <div style="font-size:20px;font-weight:700;font-family:'IBM Plex Mono',monospace;">${max}<span style="font-size:12px;font-weight:400;color:var(--text-soft);">/${TT_TOTAL_MAX}</span></div>
        <div class="section-meta" style="font-size:11.5px;">${escapeHtml(topStudents)}</div>
      </div>
      <div style="flex:1;min-width:180px;background:#F3EEDD;border:1px solid var(--rule);border-radius:8px;padding:10px 14px;">
        <div class="section-meta" style="font-weight:600;">Average</div>
        <div style="font-size:20px;font-weight:700;font-family:'IBM Plex Mono',monospace;">${avg}<span style="font-size:12px;font-weight:400;color:var(--text-soft);">/${TT_TOTAL_MAX}</span></div>
        <div class="section-meta" style="font-size:11.5px;">across ${scored.length} student${scored.length===1?'':'s'} scored so far</div>
      </div>
      <div style="flex:1;min-width:180px;background:#FBEFEF;border:1px solid var(--rule);border-radius:8px;padding:10px 14px;">
        <div class="section-meta" style="font-weight:600;">Lowest</div>
        <div style="font-size:20px;font-weight:700;font-family:'IBM Plex Mono',monospace;">${min}<span style="font-size:12px;font-weight:400;color:var(--text-soft);">/${TT_TOTAL_MAX}</span></div>
        <div class="section-meta" style="font-size:11.5px;">${escapeHtml(lowStudents)}</div>
      </div>
    </div>`;
  }

  const shortItems = TT_SHORT_KEYS.map(k=>{
    const cfg = getQuestionConfig(course, cycle, k);
    return { unit: cfg.unit, sub: `${k.toUpperCase()} — /${TT_SHORT_EACH_MAX}` };
  });
  const longItems = TT_LONG_PAIRS.flatMap(({a,b,max})=>[a,b].map(qKey=>{
    const cfg = getQuestionConfig(course, cycle, qKey);
    return { unit: cfg.unit, sub: `${qKey.toUpperCase()} — /${max} (${cfg.split===cfg.fullValue?'single':cfg.halfValue})` };
  }));
  const shortHeadGrp = groupedHeaderRows(shortItems);
  const longHeadGrp = groupedHeaderRows(longItems);

  wrap.innerHTML = `
    <div class="page-head tt-fs-hide">
      ${backBtn}
      <div class="page-eyebrow">${escapeHtml(cycleLabel)}${fullLabel && fullLabel!==cycleLabel ? ` (Active cycle: ${escapeHtml(fullLabel)})` : ''} · feeds into "${escapeHtml(comp.label)}"</div>
      <h2>${escapeHtml(course.name)}</h2>
      <p>Course Code: <strong>${escapeHtml(course.code)}</strong> · Section ${course.section} · ${branchLabel(course.branch)} ${statusPill(course)} ${etPill(course)}</p>
    </div>
    ${!forwarded ? emptyStateHtml('Marks entry locked', `Waiting on your Course Coordinator to finish and forward the ${escapeHtml(cycleLabel)} Question Paper Setup.`) : `
    <div class="tt-fs-hide">${itemApprovalStatusHtml(course, itemKey)}</div>
    <div class="tt-fs-hide">${lockBannerHtml}</div>
    ${!getItemRosterOverrides(course, itemKey).length ? `<div class="card tt-fs-hide" style="border-left:3px solid var(--warn);">
      <p class="section-meta" style="margin:0;">No roll-number list has been assigned for ${escapeHtml(cycleLabel)} yet — student roll numbers are <strong>not</strong> pulled in from Course Registration here. ${App.currentUser().systemRole==='ADMIN' ? `An Administrator needs to upload the roster first: <button class="btn btn-outline btn-sm" style="margin-left:6px;" onclick="App.navigate('admin-roster-assignment',{courseId:'${course.id}', itemKey:'${itemKey}'})">Assign Roster</button>` : 'Ask an Administrator to upload the roster from Roster Assignment before marks can be entered here.'}</p>
    </div>` : ''}
    <div class="card tt-fs-hide">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
        <button class="btn btn-outline btn-sm" style="pointer-events:none;">📊 ${escapeHtml(cycleLabel)} Analytics</button>
        <button class="btn btn-outline btn-sm no-print" onclick="toggleInlineAnalytics('${course.id}|${cycle}')">${isInlineAnalyticsOpen(course.id+'|'+cycle) ? 'Hide charts ▲' : 'Show charts ▼'}</button>
      </div>
      ${isInlineAnalyticsOpen(course.id+'|'+cycle) ? buildScoreAnalyticsCharts(scored, TT_TOTAL_MAX) : ''}
    </div>
    <div class="card tt-fs-hide">
      <div class="section-title" style="font-size:14px;">Class Performance — ${escapeHtml(cycleLabel)}</div>
      <div style="margin-top:8px;">${statsHtml}</div>
    </div>
    <div class="card tt-fs-wrap" id="${ttFsWrapId}">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
        <div class="section-title" style="font-size:16px;flex-shrink:0;">Enter ${escapeHtml(cycleLabel)} Marks</div>
        <div style="flex:1;min-width:200px;max-width:340px;">
          <input type="search" class="search-input" style="padding:8px 12px;font-size:13px;" placeholder="🔎 Search student by name or roll no…"
            value="${escapeHtml(ttSearchQueries[searchKey] || '')}"
            oninput="filterTTStudentRows('${course.id}','${cycle}', this.value)">
        </div>
        ${forwarded ? `
        <button class="btn btn-outline btn-sm no-print" style="flex-shrink:0;" onclick="exportTTPdf('${course.id}','${cycle}')" title="Download the entered ${escapeHtml(cycleLabel)} marks as a PDF">⬇ PDF</button>
        <button class="btn btn-outline btn-sm no-print" style="flex-shrink:0;" onclick="exportTTXlsx('${course.id}','${cycle}')" title="Download the entered ${escapeHtml(cycleLabel)} marks as an Excel file">⬇ XLSX</button>` : ''}
        <button class="btn btn-outline btn-sm no-print" style="flex-shrink:0;" onclick="toggleTTFullscreen()">
          <span class="tt-fs-enter-label">⛶ Full Screen</span><span class="tt-fs-exit-label">✕ Exit Full Screen</span>
        </button>
      </div>
      <div class="table-scroll" style="margin-top:10px;border-radius:6px;overflow:auto;box-shadow:var(--shadow-sm);border:1px solid var(--rule);">

        <!-- overflow:hidden was deliberately REMOVED from this table (unlike
             other .data-table instances) — an element with overflow!=visible
             becomes the nearest "scrolling ancestor" that position:sticky
             measures against, and since the <table> itself never actually
             scrolls, having overflow:hidden here silently hijacked that role
             from the real scrolling container (.table-scroll, right above),
             making the sticky Part A/B header a no-op: it just scrolled away
             with everything else instead of pinning. The rounded corners
             this used to provide now come from .table-scroll instead, which
             is the correct (and only) scrolling ancestor here. -->
        <table class="data-table sticky-thead" style="min-width:1400px;">
          <thead>
            <tr>
              <th rowspan="3" style="vertical-align:middle;">Student</th>
              <th rowspan="3" style="vertical-align:middle;">Absent</th>
              <th colspan="${TT_SHORT_KEYS.length}" style="text-align:center;background:var(--brass);color:#fff;">Part A</th>
              <th rowspan="3" class="hl-total" style="vertical-align:middle;">Part A<br>Total</th>
              <th colspan="${TT_ALL_LONG_QKEYS.length}" style="text-align:center;background:var(--brass);color:#fff;">Part B</th>
              <th rowspan="3" class="hl-total" style="vertical-align:middle;">Part B<br>Total</th>
              <th rowspan="3" class="hl-total" style="vertical-align:middle;">Term Test<br>Total</th>
              <th rowspan="3" style="vertical-align:middle;">${escapeHtml(cycleLabel)}<br>Scaled (/${comp.scaledMax})</th>
              <th rowspan="3" style="vertical-align:middle;">Evaluated<br>Script</th>
              ${showRemarkCol.cc ? `<th rowspan="3" style="vertical-align:middle;">CC<br>Remark</th>` : ''}
              ${showRemarkCol.ea ? `<th rowspan="3" style="vertical-align:middle;">EA<br>Remark</th>` : ''}
              ${showRemarkCol.hod ? `<th rowspan="3" style="vertical-align:middle;">HOD<br>Remark</th>` : ''}
            </tr>
            <tr>${shortHeadGrp.top}${longHeadGrp.top}</tr>
            <tr>${shortHeadGrp.sub}${longHeadGrp.sub}</tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      ${termTestActionBarHtml(course, itemKey, editable, periodFinished, ia)}
    </div>`}
  `;
  // Re-apply any in-progress search filter and the sticky header offsets
  // right after building the table markup above, so both survive the
  // full-rebuild that happens whenever a mark is saved (App.setTermTestMark
  // -> renderContent() -> this function runs again from scratch). See
  // ttSearchQueries and applyStickyTableHeaders for why each is needed.
  const activeQuery = (ttSearchQueries[searchKey] || '').trim().toLowerCase();
  if(activeQuery){
    wrap.querySelectorAll('tr[data-tt-search]').forEach(tr=>{
      tr.style.display = (tr.getAttribute('data-tt-search')||'').includes(activeQuery) ? '' : 'none';
    });
  }
  // NOTE: sticky header offsets (applyStickyTableHeaders) are deliberately
  // NOT applied here — `wrap` isn't attached to the document yet at this
  // point (the caller, renderContent's build(), does that), and
  // getBoundingClientRect() on a detached element returns all zeros, which
  // would collapse every header row's offset to 0 and overlap them. See
  // the call in renderContent() instead, which runs after appendChild.
  return wrap;
}
/* Sets which tab is active on the "My Subjects" marks-entry screen (ci-entry)
   before navigating there — lets the Lab Internals / Lab Externals sidebar
   shortcuts below drop the CI straight into the right tab instead of always
   landing on "Term Test & Lab Internal" by default. */
function openMarksTab(courseId, tab){
  activeMarksTab = tab;
  App.navigate('ci-entry', { courseId });
}
window.openMarksTab = openMarksTab;

/* "Lab Internals" sidebar shortcut — lists every section with a Lab Internal

      <h2>Lab Internals</h2>
      <p>Enter Lab Internal marks for your sections. This shares one HOD-approval group with Term Test 1/2, so it opens on the "Term Test &amp; Lab Internal" tab of that section's marks entry.</p>
    </div>
    ${rows.length===0 ? emptyStateHtml('No sections assigned','No course-sections are currently assigned to you as instructor.') : rows.map(({c,comp})=>`
      <div class="card">
        <div class="card-row">
          <div>
            <div class="section-title">${escapeHtml(c.name)}</div>
            ${courseMetaBlock(c)}
          </div>
          <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
            ${statusPill(c)}
            ${etPill(c)}

              !comp ? `<span class="status-pill status-draft">No Lab Internal component on this Evaluation Type</span>` : ''}
            <button class="btn ${comp?'':'btn-outline'} btn-sm" ${comp?'':'disabled'} onclick="openMarksTab('${c.id}','ttlab')">Enter Lab Internal Marks</button>
          </div>
        </div>

/* ---------- CI: single-component marks entry. One page per row of the
   Evaluation Type table (SIA, Practical Internal Test, Lab Performance,
   Project Assessment, SEE Practical, etc.) — deliberately NOT mixed
   together, so entering one component never touches another's marks. Term
   Test 1/2 have their own dedicated page (renderCITermTestEntry) and are
   not routed here. ---------- */
function renderCIComponentEntry(params){
  const course = App.getCourse(params.courseId);
  const wrap = el('<div></div>');
  const backBtn = itemViewerBackBtnHtml(course, 'ci-subject-detail', {courseId:params.courseId}, `← Back to ${course ? course.name : 'subject'}`);
  // Same role-sharing as the Term Test entry page — Practical Internal
  // Test / SEE Practical also carry their own CI -> CC -> HOD chain (no
  // EA step), so whoever currently owns that item's stage needs to be
  // able to open this page too, not just the CI. Guess the item key straight off the
  // component key in the URL (no need to resolve the full component yet).
  const itemKeyGuess = params.compKey==='pracInternal' ? 'pracInternal' : (params.compKey==='seePractical'||params.compKey==='seePracticalProject') ? 'seePractical' : null;
  if(course && !canViewItemEntry(course, itemKeyGuess)){ wrap.innerHTML = `<div class="page-head">${backBtn}</div>${notYourSubjectHtml()}`; return wrap; }
  if(!course || !course.evalType){ wrap.innerHTML = `<div class="page-head">${backBtn}</div>${emptyStateHtml('Not available','This section has no Evaluation Type fixed yet.')}`; return wrap; }
  const template = getCourseTemplate(course);
  const section = params.section==='see' ? 'see' : 'cie';
  const list = section==='cie' ? template.cie : seeDisplayComponents(template);
  const comp = list.find(c=>c.key===params.compKey);
  if(!comp){ wrap.innerHTML = `<div class="page-head">${backBtn}</div>${emptyStateHtml('Component not found','')}`; return wrap; }

  // Practical Internal Test and SEE Practical each carry their own
  // independent CI -> CC -> HOD chain, no EA step (see ITEM_FLOW_KEYS);
  // every other CIE/SEE component here has no approval chain at all and
  // stays editable for as long as the Overall record itself is InProgress.
  const itemKey = comp.key==='pracInternal' ? 'pracInternal' : (comp.key==='seePractical'||comp.key==='seePracticalProject') ? 'seePractical' : null;
  const ia = itemKey ? App.itemApproval(course.id, itemKey) : null;
  const correctionMode = course.status==='approved' && course.editUnlocked;
  // Same ownership check as the Term Test entry page: canViewItemEntry()
  // lets the assigned CC (and HOD at their own stage) open this page at
  // any time to watch progress, so "editable" can't be based on stage
  // alone — otherwise a CC viewing while it's still the CI's stage would
  // see live, typeable mark boxes instead of a read-only view.
  // SEE (Sem-End Exam) entry — SEE Practical, and any SEE Theory shown here
  // — is locked for as long as a Term Test cycle (TT1 or TT2) is currently
  // fixed as active; it only opens once the Administrator closes the
  // Term Test cycle out. Practical Internal Test has its own, separate
  // Course-Coordinator-set deadline (see pracInternalDeadlinePassed) —
  // every other component here is unaffected by either gate.
  const seeLocked = section==='see' && seeEntryLocked();
  const pracNotStarted = comp.key==='pracInternal' && pracInternalNotYetStarted(course);
  const pracEnded = comp.key==='pracInternal' && pracInternalDeadlinePassed(course);
  // Administrator-fixed windows (App.setPracticalWindow) — independent of,
  // and layered on top of, the gates above: entry needs every applicable
  // gate to pass, whichever one is currently stricter.
  const now = Date.now();
  const adminPracWindow = App.state.practicalInternalWindow;
  const adminPracNotStarted = comp.key==='pracInternal' && !!(adminPracWindow && adminPracWindow.startDate && now < new Date(adminPracWindow.startDate).getTime());
  const adminPracEnded = comp.key==='pracInternal' && !!(adminPracWindow && adminPracWindow.endDate && now > new Date(adminPracWindow.endDate).getTime());
  const adminSeeWindow = App.state.seePracticalWindow;
  const adminSeeNotStarted = section==='see' && !!(adminSeeWindow && adminSeeWindow.startDate && now < new Date(adminSeeWindow.startDate).getTime());
  const adminSeeEnded = section==='see' && !!(adminSeeWindow && adminSeeWindow.endDate && now > new Date(adminSeeWindow.endDate).getTime());
  const seeLockedFinal = seeLocked || adminSeeNotStarted || adminSeeEnded;
  const pracLocked = pracNotStarted || pracEnded || adminPracNotStarted || adminPracEnded;
  // No-approval components (no itemKey) can be Submitted by the CI once
  // every student has a mark — that locks them, the same as an approved
  // item, without ever going through a CI -> CC -> HOD chain (there isn't
  // one). Doesn't apply to Term Test / Practical Internal / SEE Practical,
  // which already have their own lock via the approval chain (ia.stage).
  const noApprovalLocked = !itemKey && noApprovalLockedFor(course, comp);

    : pracEnded
    ? `<div class="card" style="border-left:3px solid var(--seal-red);"><p class="section-meta" style="color:var(--seal-red);">The Practical Internal Test marks-entry window closed at ${fmtDate(new Date(course.pracInternalDeadline).getTime())} (set by the Course Coordinator) — entry is locked.</p></div>`

    : adminPracEnded

    : '';

  const bodyHtml = comp.key==='sia' ? siaEntryHtml(course, comp, editable) : (()=>{
    const rows = course.students.map(s=>{

      const overMax = typeof val==='number' && (val>comp.rawMax || val<0);
      const scaled = typeof val==='number' ? round1((Math.min(val,comp.rawMax)/comp.rawMax)*comp.scaledMax) : '—';
      return `<tr${absentHere?' style="opacity:.55;"':''}>
        <td>${studentNameCell(s)}</td>
        <td style="text-align:center;"><input type="checkbox" ${absentHere?'checked':''} ${editable?'':'disabled'}
          title="Absent for ${escapeHtml(comp.label)} only — clears just this exam's marks"
          onchange="if(confirm(this.checked ? 'Mark ${escapeHtml(s.name)} absent for ${escapeHtml(comp.label)}? This clears only this exam\\'s marks.' : 'Mark ${escapeHtml(s.name)} present again for ${escapeHtml(comp.label)}?')) App.setComponentAbsent('${course.id}','${s.id}','${comp.key}',this.checked); else this.checked=!this.checked;"></td>
        <td>${absentHere ? '<span class="mono" style="color:var(--text-soft);font-size:12px;">Absent</span>' : `<input type="number" min="0" max="${comp.rawMax}" step="0.5"
          class="${overMax?'invalid':''}"
          data-course="${course.id}" data-student="${s.id}" data-field="${comp.key}"
          data-markkey="${course.id}|${s.id}|${comp.key}"
          value="${val===undefined||val===null?'':val}" placeholder="/${comp.rawMax}"
          ${editable?'':'disabled'}
          onchange="onMarkChange(this)">`}</td>
        <td class="total-cell">${absentHere?'—':scaled}<span class="mono" style="font-weight:400;color:var(--text-soft);font-size:11px;">/${comp.scaledMax}</span></td>
      </tr>`;
    }).join('');
    return `<div class="table-scroll"><table class="data-table"><thead><tr><th>Student</th><th>Absent</th><th>${escapeHtml(comp.label)}<br><span style="text-transform:none;">max ${comp.rawMax}</span></th><th>Scaled<br><span style="text-transform:none;">max ${comp.scaledMax}</span></th></tr></thead><tbody>${rows}</tbody></table></div>`;
  })();

  wrap.innerHTML = `
    <div class="page-head">
      ${backBtn}
      <div class="page-eyebrow">${section==='cie'?'CIE':'SEE'} · ${escapeHtml(comp.label)}</div>
      <h2>${escapeHtml(course.name)}</h2>
      <p>Course Code: <strong>${escapeHtml(course.code)}</strong> · Section ${course.section} ${statusPill(course)} ${etPill(course)}
        ${!itemKey && noApprovalLocked ? `<span class="mono" style="color:var(--text-soft);font-size:11px;">· ${escapeHtml(comp.label)}:</span> <span class="status-pill status-approved">Completed</span>` : ''}
      </p>
      ${!itemKey && noApprovalLocked ? `<p class="section-meta" style="margin-top:4px;">The overall record for ${escapeHtml(course.code)} is still <strong>InProgress</strong> until every component is entered and the whole record is submitted — <strong>Completed</strong> above only means ${escapeHtml(comp.label)} itself is done and locked.</p>` : ''}
    </div>
    ${itemKey ? itemApprovalStatusHtml(course, itemKey) : ''}
    ${lockBannerHtml}
    <div class="card">
      <p class="section-meta" style="margin-bottom:10px;">
        ${escapeHtml(comp.label)} — raw /${comp.rawMax} scaled to /${comp.scaledMax}. ${note}
      </p>
      ${bodyHtml}
      ${itemKey ? itemActionBarHtml(course, itemKey, editable) : noApprovalSubmitBarHtml(course, comp, editable, noApprovalLocked, fullyEntered)}
    </div>
  `;
  return wrap;
}
/* Submit/lock bar for no-approval components (SIA, Regular Lab/Skill
   Performance Assessment, Skill Certification, etc.) — the counterpart to
   itemActionBarHtml, but with no Forward step since there's no chain to
   forward into: Submit just locks it once every student has a mark. */
function noApprovalSubmitBarHtml(course, comp, editable, locked, fullyEntered){
  if(locked){
    return `<div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center;">
      <span class="status-pill status-approved">✓ Submitted — locked for editing</span>
      ${App.currentUser().systemRole==='ADMIN' ? `<button class="btn btn-outline btn-sm" onclick="App.reopenNoApprovalComponent('${course.id}','${comp.key}')">Reopen for Editing</button>` : ''}
    </div>`;
  }

    <button class="btn btn-green btn-sm" ${fullyEntered?'':'disabled'} title="${fullyEntered?'':'Enter marks for every student first'}" onclick="App.submitNoApprovalComponent('${course.id}','${comp.key}')">Submit</button>
    ${!fullyEntered ? `<span class="section-meta" style="font-size:12px;">Enter marks for every student to enable Submit.</span>` : ''}
  </div>`;

/* ---------- CI: read-only roll-up of one section (CIE, SEE, or the
   combined Total) — reached via "View CIE Marks" / "View SEE Marks" /
   "View Total Marks". Marks entry itself never happens here; it's split
   across the per-component pages above, this is only for seeing every
   component side by side once they're all in. ---------- */
/* ---------- CI: Analytics — one page per item (Term Test 1, Term Test 2,
   Practical Internal Test, SEE Practical, or the Overall CIE/SEE/Grand
   Total), each with sortable, filterable columns. Kept as separate pages
   rather than one merged table, per component, so each reads cleanly on
   its own. Purely a read-only lens; nothing here writes back. ---------- */
let analyticsState = {};
function getAnalyticsState(courseId, itemKey){
  const k = courseId+'|'+itemKey;
  return analyticsState[k] || (analyticsState[k] = { sortKey:null, sortDir:'asc', filters:{} });
}
function setAnalyticsSort(courseId, itemKey, key){
  const st = getAnalyticsState(courseId, itemKey);
  if(st.sortKey===key) st.sortDir = st.sortDir==='asc' ? 'desc' : 'asc';
  else { st.sortKey = key; st.sortDir = 'asc'; }
  renderContent();
}
window.setAnalyticsSort = setAnalyticsSort;
function setAnalyticsFilter(courseId, itemKey, key, value){
  getAnalyticsState(courseId, itemKey).filters[key] = value;
  renderContent();
}
window.setAnalyticsFilter = setAnalyticsFilter;
/* Parses a quick numeric filter expression: ">40", "<20", ">=30", "<=15",
   "=45", or a bare number (treated as exact match). Blank or unparseable
   input means "no filter" — everything passes. */
function passesAnalyticsFilter(expr, value){
  const e = (expr||'').trim();
  if(!e) return true;
  const m = e.match(/^(>=|<=|>|<|=)?\s*(-?\d+(\.\d+)?)$/);
  if(!m) return true;
  if(value===null || value===undefined || isNaN(value)) return false;
  const op = m[1] || '=', num = parseFloat(m[2]);
  if(op==='>') return value>num;
  if(op==='<') return value<num;
  if(op==='>=') return value>=num;
  if(op==='<=') return value<=num;
  return value===num;
}
/* itemKey: 'tt1' | 'tt2' | 'pracInternal' | 'seePractical' | 'overall' */
function renderCIAnalytics(params){
  const course = App.getCourse(params.courseId);
  const itemKey = params.itemKey || 'overall';
  const wrap = el('<div></div>');
  const backBtn = `<button class="ghost-btn no-print" style="color:var(--ink);border-color:var(--rule);margin-bottom:14px;" onclick="App.navigate('ci-subject-detail',{courseId:'${params.courseId}'})">← Back to ${escapeHtml(course ? course.name : 'subject')}</button>`;
  if(!course || !course.evalType){ wrap.innerHTML = `<div class="page-head">${backBtn}</div>${emptyStateHtml('Not available','This section has no Evaluation Type fixed yet.')}`; return wrap; }
  const template = getCourseTemplate(course);
  const scaledOf = (raw, comp) => { if(typeof raw!=='number' || !comp) return null; const rawScale = componentRawScale(comp); return round1((Math.min(raw,rawScale)/rawScale)*comp.scaledMax); };

  // Which value column(s) this page shows, keyed the same way as the filter/sort state.
  let pageTitle = 'Analytics', columns = [];
  if(itemKey==='tt1' || itemKey==='tt2'){
    const cycle = itemKey==='tt1' ? 'TT1' : 'TT2';
    const key = termTestComponentKey(template, cycle);
    const comp = key ? template.cie.find(c=>c.key===key) : null;
    pageTitle = `Analytics — ${TERM_TEST_LABELS[cycle]}`;
    columns = [{ key:'val', label:TERM_TEST_LABELS[cycle], max: comp ? comp.scaledMax : null,
      value: s => comp ? scaledOf(s.marks[comp.key], comp) : null }];
  } else if(itemKey==='pracInternal' || itemKey==='seePractical'){
    const section = itemKey==='pracInternal' ? 'cie' : 'see';
    const list = section==='cie' ? template.cie : seeDisplayComponents(template);
    const comp = itemKey==='pracInternal' ? list.find(c=>c.key==='pracInternal') : list.find(c=>c.key==='seePractical'||c.key==='seePracticalProject');
    pageTitle = `Analytics — ${comp ? comp.label : (itemKey==='pracInternal'?'Practical Internal Test':'SEE Practical')}`;
    columns = [{ key:'val', label: comp ? comp.label : '—', max: comp ? comp.scaledMax : null,
      value: s => comp ? scaledOf(s.marks[comp.key], comp) : null }];
  } else {
    pageTitle = 'Analytics — Overall';
    const seeComps = seeDisplayComponents(template);
    const seeMax = round1(seeComps.reduce((a,c)=>a+c.scaledMax,0));
    columns = [
      { key:'cie', label:'CIE Total', max: CIE_MAX, value: s => round1(computeCIE(s, template.cie).total) },
      { key:'see', label:'SEE Total', max: seeMax, value: s => seeComps.length ? round1(computeCIE(s, seeComps).total) : null },
      { key:'grand', label:'Grand Total', max: round1(CIE_MAX+seeMax), value: s => {
          const cie = round1(computeCIE(s, template.cie).total);
          const see = seeComps.length ? round1(computeCIE(s, seeComps).total) : 0;
          return round1(cie+see);
        } },
    ];
  }

  const st = getAnalyticsState(course.id, itemKey);
  let rows = (course.students||[]).map(s=>{
    const r = { student: s };
    columns.forEach(c=>{ r[c.key] = c.value(s); });
    return r;
  });
  rows = rows.filter(r=>columns.every(c=>passesAnalyticsFilter(st.filters[c.key], r[c.key])));
  if(st.sortKey){
    const dir = st.sortDir==='asc' ? 1 : -1;
    rows.sort((a,b)=>{
      if(st.sortKey==='name') return a.student.name.localeCompare(b.student.name)*dir;
      const av = a[st.sortKey], bv = b[st.sortKey];
      if(av===null && bv===null) return 0;
      if(av===null) return 1; // blanks sort last regardless of direction
      if(bv===null) return -1;
      return (av-bv)*dir;
    });
  }
  const arrow = key => st.sortKey===key ? (st.sortDir==='asc' ? ' ▲' : ' ▼') : '';
  // Sort-label and filter-input are deliberately separate clickable targets
  // — the filter <input> stops the click from bubbling up to the header's
  // sort handler, otherwise focusing the box immediately re-triggers a
  // sort/re-render and you can never actually type into it.
  const filterInput = (colKey, placeholder) => `<input type="text" value="${escapeHtml(st.filters[colKey]||'')}" placeholder="${placeholder}"
    style="width:64px;font-size:11px;padding:3px 5px;margin-top:4px;"
    onclick="event.stopPropagation()"
    onchange="setAnalyticsFilter('${course.id}','${itemKey}','${colKey}', this.value)">`;
  const th = (colKey, label, max) => `<th>
    <span style="cursor:pointer;user-select:none;" onclick="setAnalyticsSort('${course.id}','${itemKey}','${colKey}')">${escapeHtml(label)}${max!=null?` (/${max})`:''}${arrow(colKey)}</span>
    ${colKey==='name' ? '' : `<br>${filterInput(colKey, '>40')}`}
  </th>`;

  const bodyRows = rows.map(r=>`<tr>
    <td>${escapeHtml(r.student.name)}</td>
    ${columns.map(c=>`<td class="total-cell">${r[c.key]===null||r[c.key]===undefined?'—':r[c.key]}${c.max!=null && r[c.key]!==null?`<span class="mono" style="font-weight:400;color:var(--text-soft);font-size:11px;">/${c.max}</span>`:''}</td>`).join('')}
  </tr>`).join('');

  wrap.innerHTML = `
    <div class="page-head">
      ${backBtn}
      <div class="page-eyebrow">${escapeHtml(pageTitle)}</div>
      <h2>${escapeHtml(course.name)}</h2>
      <p>Course Code: <strong>${escapeHtml(course.code)}</strong> · Section ${course.section} ${statusPill(course)} ${etPill(course)}</p>
    </div>
    <div class="card">
      <p class="section-meta" style="margin-bottom:10px;">Click a column heading to sort by it (click again to reverse). Type a filter under any column — <span class="mono">&gt;40</span>, <span class="mono">&lt;20</span>, <span class="mono">&gt;=30</span>, or a bare number for an exact match — to narrow the list to matching students. Filters combine across columns.</p>
      ${rows.length===0 ? emptyStateHtml('No students match', 'Loosen or clear a filter above to see students again.') : `
      <div class="table-scroll">
        <table class="data-table">
          <thead><tr>
            ${th('name','Student')}
            ${columns.map(c=>th(c.key, c.label, c.max)).join('')}
          </tr></thead>
          <tbody>${bodyRows}</tbody>
        </table>
      </div>`}
    </div>
  `;
  return wrap;
}
function renderCISectionView(params){

  // "View CIE Marks" and "View Total Marks" both hide Term Test 1/2/3 —

  const bodyHtml = section==='total' ? marksViewTable(course, false, true) : (()=>{
    const template = getCourseTemplate(course);
    const hideTermTest = section==='cie';
    const comps = section==='cie' ? nonTermTestCieComponents(template) : seeDisplayComponents(template);

        return `<td>${scaledVal===null?'—':`<span style="${overMax?'color:var(--seal-red);font-weight:600;':''}">${scaledVal}</span>`} <span class="mono" style="color:var(--text-soft);font-size:11px;">/${comp.scaledMax}</span></td>`;
      }).join('');
      const totalCell = hideTermTest ? '' : `<td class="total-cell">${calc.total}<span class="mono" style="font-weight:400;color:var(--text-soft);font-size:11px;">/${sectionMax}</span></td>`;
      return `<tr><td>${studentNameCell(s)}</td>${cells}${totalCell}</tr>`;
    }).join('');
    const head = comps.map(comp=>`<th>${comp.label}<br><span style="text-transform:none;">max ${comp.scaledMax}</span></th>`).join('');
    const totalHead = hideTermTest ? '' : `<th>${section==='cie'?'CIE':'SEE'} Total</th>`;
    const note = hideTermTest ? `<p class="section-meta" style="margin-bottom:10px;">Term Test 1/2/3 marks are entered and viewed on their own dedicated pages, not here — this view only covers SIA, Regular Lab Performance Assessment, Practical Internal Test, and any other non-Term-Test component, so no CIE Total is shown (it would be incomplete without the Term Test scores).</p>` : '';
    return comps.length ? `${note}<div class="table-scroll"><table class="data-table"><thead><tr><th>Student</th>${head}${totalHead}</tr></thead><tbody>${rows}</tbody></table></div>` : `<p class="section-meta">No ${section==='cie'?'non-Term-Test CIE':'SEE'} components on this Evaluation Type.</p>`;
  })();
  wrap.innerHTML = `
    <div class="page-head">
      ${backBtn}
      <div class="page-eyebrow">${pageTitle}</div>
      <h2>${escapeHtml(course.name)}</h2>
      <p>Course Code: <strong>${escapeHtml(course.code)}</strong> · Section ${course.section} ${statusPill(course)} ${etPill(course)}</p>
    </div>
    <div class="card">
      <p class="section-meta" style="margin-bottom:10px;">Every component here is entered on its own page — this is a read-only roll-up. Use the buttons on the subject page to enter or change marks.</p>
      ${bodyHtml}

  `;

}

      </div>
      ${editable ? `<p class="section-meta" style="margin-bottom:10px;">Marks are entered on their own pages now (one per component) — go back to the subject page to enter or change them. This table is a read-only roll-up so you can check everything's filled in before submitting.</p>` : ''}
      ${marksViewTable(course)}
      ${editable ? `
        <div style="display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap;">
          ${correctionMode ? `
            <button class="btn btn-outline" onclick="App.ciSaveDraft('${course.id}')">Save</button>
            <button class="btn" onclick="if(confirm('Finish correcting and re-lock this record?')) App.ciFinishEdit('${course.id}')">Finish &amp; Re-lock</button>
          ` : `
            <button class="btn btn-outline" onclick="App.ciSaveDraft('${course.id}')">Save InProgress</button>
            <button class="btn" ${complete?'':'disabled'} onclick="App.ciSubmit('${course.id}')">Submit for Review</button>
            ${complete ? '' : `<span class="section-meta">Complete every CIE component for all students to enable submission.</span>`}
          `}
        </div>` : `<p style="margin-top:16px;color:var(--text-soft);font-size:13.5px;">This record is ${statusSentenceLabel(course.status)} and is currently read-only.</p>
        ${approvedNotEditing && course.editRequestStatus!=='pending' ? `<button class="btn btn-outline btn-sm" style="margin-top:12px;" onclick="openRequestEditModal('${course.id}')">Request Marks Correction</button>` : ''}`}
    </div>
  `;

}
/* Read-only attendance summary — replaces the old global "mark absent"
   checkbox box (which wiped s.marks entirely; see the note above
   toggleStudentAbsent's removal). Absence is now set per exam, right on
   that exam's own entry page (App.setComponentAbsent) — this box is just
   a read-only look at who's absent from what, for a quick check before
   submitting. Only students absent from at least one component show up. */
function attendanceSummaryHtml(course){
  const students = course.students || [];
  const comps = course.evalType ? getCourseComponents(course).concat(getCourseSeeComponents(course)) : [];
  if(!students.length || !comps.length) return '';
  const rows = students.map(s=>{
    const absentFrom = comps.filter(comp=>isAbsentForComponent(s, comp.key));
    if(!absentFrom.length) return null;
    return `<div style="display:flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--rule);border-radius:6px;padding:4px 9px;">
      <strong>${escapeHtml(s.name)}</strong> — absent: ${absentFrom.map(c=>escapeHtml(c.label)).join(', ')}
    </div>`;
  }).filter(Boolean);
  if(!rows.length) return '';
  return `<div class="card">
    <div class="section-title" style="font-size:14px;">Attendance</div>
    <p class="section-meta" style="margin-top:4px;">Marked per exam on that exam's own entry page — this is a read-only summary of who's absent from what.</p>
    <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:10px;">${rows.join('')}</div>
  </div>`;
}

function ccCoordinationOptionsHtml(ccCourses){
  const seen = {};

/* All faculty accounts in the system (every branch), for the quick-pick
   Instructor dropdown — picking one just fills the email/name fields
   below; the actual assignment still goes through the same
   createFacultyIfNeeded path either way, existing account or new. */
function allFacultyOptionsHtml(){
  const facultyUsers = App.state.users.filter(u=>u.systemRole==='FACULTY').slice().sort((a,b)=>a.name.localeCompare(b.name));
  return facultyUsers.map(u=>`<option value="${escapeHtml(u.email)}" data-name="${escapeHtml(u.name)}">${escapeHtml(u.name)} — ${escapeHtml(u.email)}${u.homeBranch?` (${escapeHtml(u.homeBranch)})`:''}</option>`).join('');

function onCCInstructorPick(sel){
  if(!sel.value) return;
  const opt = sel.options[sel.selectedIndex];
  const emailEl = document.getElementById('cc-assign-instructor');
  const nameEl = document.getElementById('cc-assign-instructor-name');
  if(emailEl) emailEl.value = sel.value;
  if(nameEl) nameEl.value = opt.dataset.name || '';

window.onCCInstructorPick = onCCInstructorPick;
/* Re-populates Branch (to whichever branches can actually open a NEW
   section of THIS subject — see ccCreatableBranches) and then Section (to
   that Regulation+Branch's fixed range — see sectionOptionsFor). Both are
   now fully derived from the chosen Coordination; nothing left to
   manually mismatch. */
function refreshCCBranchOptions(){
  const baseEl = document.getElementById('cc-assign-base');
  const branchEl = document.getElementById('cc-assign-branch');
  if(!baseEl || !branchEl) return;
  const base = App.getCourse(baseEl.value);
  const code = base ? (base.code||'').trim().toUpperCase() : '';
  const regulation = regulationFromCode(code);
  const catalogBranch = catalogBranchForCode(code);
  const allowed = regulation ? ccCreatableBranches(regulation, catalogBranch) : [];
  branchEl.innerHTML = allowed.length ? allowed.map(b=>`<option value="${b}">${escapeHtml(BRANCH_LABELS[b])}</option>`).join('') : `<option value="">— Coordination's Regulation not recognized —</option>`;
  refreshCCSectionOptions();
}
window.refreshCCBranchOptions = refreshCCBranchOptions;
function refreshCCSectionOptions(){
  const baseEl = document.getElementById('cc-assign-base');
  const branchEl = document.getElementById('cc-assign-branch');
  const sectionEl = document.getElementById('cc-assign-section');
  if(!baseEl || !branchEl || !sectionEl) return;
  const base = App.getCourse(baseEl.value);
  const code = base ? (base.code||'').trim().toUpperCase() : '';
  const regulation = regulationFromCode(code);
  const options = (regulation && branchEl.value) ? sectionOptionsFor(regulation, branchEl.value) : [];
  sectionEl.innerHTML = options.length ? options.map(s=>`<option value="${s}">${s}</option>`).join('') : `<option value="">— No section range for this Branch —</option>`;
}
window.refreshCCSectionOptions = refreshCCSectionOptions;

function renderCCBranchGroupsHtml(ccCourses, term){
  const q = (term||'').trim().toLowerCase();
  const branches = {};
  ccCourses.forEach(c=>{
    const ciUser = getCourseCIUser(c.id);
    const hay = [c.code, c.name, branchLabel(c.branch), ciUser?.name, ciUser?.email].filter(Boolean).join(' ').toLowerCase();
    if(q && !hay.includes(q)) return;
    (branches[c.branch] = branches[c.branch] || []).push(c);
  });
  const branchKeys = Object.keys(branches);
  if(branchKeys.length===0) return emptyStateHtml('No matches', 'Try a different search term.');
  return branchKeys.map(bk=>{
    const list = branches[bk];
    return `
      <div class="branch-heading">${branchLabel(bk)}</div>
      ${list.map(c=>{
        const ciUser = getCourseCIUser(c.id);
        return `
        <div class="card">
          <div class="card-row">
            <div>
              <div class="section-title">${escapeHtml(c.name)}</div>
              <div class="section-meta">${courseMeta(c)}</div>
            </div>
            <div style="display:flex;align-items:center;gap:14px;">
              ${statusPill(c)}
              ${etPill(c)}
              <button class="btn ${c.status==='submitted'?'':'btn-outline'} btn-sm" onclick="App.navigate('cc-review',{courseId:'${c.id}'})">
                ${c.status==='submitted' ? 'Verify' : 'View'}
              </button>
            </div>
          </div>
          <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--rule-light);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
            <span class="section-meta">Instructor: ${ciUser ? escapeHtml(ciUser.name)+' ('+escapeHtml(ciUser.email)+')' : 'Unassigned'}${c.evalType ? ' · Evaluation Type: '+escapeHtml(evalTypeLabel(c.evalType)) : ''} · Roster: ${c.studentCount} student${c.studentCount===1?'':'s'}</span>
            <div style="display:flex;gap:10px;align-items:center;">
              ${c.status==='approved' ? `
                <span class="section-meta" style="font-weight:600;">Approved · locked — view only</span>
                <button class="btn btn-outline btn-sm" onclick="App.navigate('cc-roster',{courseId:'${c.id}'})">View Roster</button>
              ` : `
                <button class="btn btn-outline btn-sm" onclick="App.navigate('cc-roster',{courseId:'${c.id}'})">Manage Roster</button>
                ${ciUser
                  ? `<button class="btn btn-red btn-sm" onclick="if(confirm('Revoke Course Instructor access for ${escapeHtml(ciUser.name)} on ${c.code}?')) App.revokeRole('CI','${c.id}')">Revoke Instructor</button>`
                  : `<button class="btn btn-sm btn-outline" onclick="openAssignModal('CI','${c.id}')">Assign Instructor</button>`}
              `}
              ${c.evalType && ['TT1','TT2'].some(cycle=>termTestComponentKey(getCourseTemplate(c), cycle)) ? `<button class="btn btn-outline btn-sm" onclick="App.navigate('cc-termtest-setup',{courseId:'${c.id}'})">Question Paper Setup</button>` : ''}
            </div>
          </div>
          ${(c.subSections && c.subSections.length) ? `<div class="section-meta" style="margin-top:8px;">Section ${escapeHtml(c.section)} → ${c.subSections.map(s=>`${escapeHtml(s.code)} → ${s.facultyName ? escapeHtml(s.facultyName) : 'Not assigned'}`).join(', ')}</div>` : ''}
          ${lightweightCompletionChipsHtml(c)}
        </div>`;
      }).join('')}
    `;
  }).join('');
}
function updateCCBranchGroups(term){
  const user = App.currentUser();
