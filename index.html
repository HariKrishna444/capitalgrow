<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DVS — Digital Valuation System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#1B2A4A;
  --ink-2:#233457;
  --parchment:#EFE8D9;
  --parchment-2:#E5DCC6;
  --card:#F7F2E7;
  --brass:#A8832F;
  --brass-light:#C9A24A;
  --seal-green:#2F5233;
  --seal-red:#8B2E2E;
  --text:#24211C;
  --text-soft:#5B5546;
  --rule:#C9BFA4;
  --rule-light:#E3DAC3;
  --radius:2px;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--parchment);
  color:var(--text);
  font-family:'Source Serif 4', Georgia, serif;
  line-height:1.55;
}
h1,h2,h3,h4{
  font-family:'Fraunces', Georgia, serif;
  color:var(--ink);
  margin:0;
  letter-spacing:-0.01em;
  font-weight:600;
}
.mono{font-family:'IBM Plex Mono', monospace;}
.hidden{display:none !important;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ---------------- LOGIN ---------------- */
.login-view{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px;
  background:
    repeating-linear-gradient(to bottom, transparent 0 37px, rgba(233,225,201,0.05) 37px 38px),
    radial-gradient(circle at 82% 8%, rgba(200,162,74,0.14), transparent 42%),
    linear-gradient(160deg, var(--ink) 0%, var(--ink-2) 55%, #16233F 100%);
}
.login-card{
  max-width:480px;
  width:100%;
  color:var(--parchment);
}
.eyebrow{
  display:inline-flex;
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:var(--brass-light);
  border:1px solid rgba(201,162,74,0.5);
  padding:5px 12px;
  border-radius:2px;
}
.login-card h1{
  color:#FBF7EC;
  font-size:clamp(28px,4.4vw,38px);
  margin-top:18px;
  line-height:1.1;
}
.login-sub{
  margin-top:14px;
  color:#D8D0BC;
  font-size:15px;
  max-width:46ch;
}
.persona-list{
  margin-top:30px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.persona-group-label{
  margin-top:14px;
  font-size:10.5px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--brass-light);
  opacity:0.85;
}
.persona-group-label:first-child{margin-top:0;}
.persona-btn{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  background:rgba(247,242,231,0.05);
  border:1px solid rgba(201,162,74,0.28);
  color:#EFE8D9;
  padding:14px 16px;
  text-align:left;
  border-radius:2px;
  transition:background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
}
.persona-btn:hover{
  background:rgba(201,162,74,0.12);
  border-color:var(--brass-light);
  transform:translateX(2px);
}
.persona-btn .p-name{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:16px;
  display:block;
}
.persona-btn .p-desc{
  font-size:12.5px;
  color:#B9AF93;
  margin-top:3px;
  display:block;
}
.persona-btn .p-code{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  letter-spacing:0.08em;
  color:var(--brass-light);
  border:1px solid var(--brass-light);
  padding:3px 9px;
  border-radius:2px;
  flex-shrink:0;
}

/* ---------------- SHELL ---------------- */
.shell{min-height:100vh;display:flex;flex-direction:column;}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  height:60px;
  background:var(--ink);
  color:var(--parchment);
  border-bottom:2px solid var(--brass);
  position:relative;
  z-index:20;
}
.brand{display:flex;align-items:baseline;gap:10px;}
.brand-mark{
  font-family:'Fraunces', serif;
  font-weight:700;
  font-size:19px;
  letter-spacing:0.03em;
  color:#FBF7EC;
}
.brand-sub{font-size:11px;color:#B9AF93;letter-spacing:0.05em;}
.topbar-right{display:flex;align-items:center;gap:14px;position:relative;}
.bell-btn{
  background:none;border:none;color:#D8D0BC;
  position:relative;padding:6px;display:flex;
}
.bell-btn:hover{color:var(--brass-light);}
.bell-count{
  position:absolute;top:0;right:0;
  background:var(--seal-red);color:#fff;
  font-family:'IBM Plex Mono', monospace;
  font-size:9px;line-height:1;
  padding:2px 4px;border-radius:8px;
}
.notif-panel{
  position:absolute;top:46px;right:60px;
  width:320px;max-height:380px;overflow-y:auto;
  background:var(--card);color:var(--text);
  border:1px solid var(--rule);
  box-shadow:0 10px 30px rgba(0,0,0,0.25);
  z-index:30;
}
.notif-item{
  padding:12px 14px;border-bottom:1px solid var(--rule-light);
  font-size:13px;
}
.notif-item:last-child{border-bottom:none;}
.notif-item .n-title{font-weight:600;color:var(--seal-red);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.04em;text-transform:uppercase;}
.notif-item .n-body{margin-top:4px;color:var(--text-soft);}
.notif-item .n-time{margin-top:6px;font-size:10.5px;color:#8a8267;font-family:'IBM Plex Mono',monospace;}
.notif-empty{padding:20px;text-align:center;color:var(--text-soft);font-size:13px;}
.user-chip{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;}
.user-name{font-size:13px;color:#FBF7EC;}
.role-tag{font-size:10px;color:var(--brass-light);letter-spacing:0.06em;}
.ghost-btn{
  background:transparent;border:1px solid rgba(201,162,74,0.4);
  color:#D8D0BC;padding:7px 13px;font-size:12px;border-radius:2px;
  transition:all 0.15s ease;
}
.ghost-btn:hover{border-color:var(--brass-light);color:var(--brass-light);}

.body-shell{flex:1;display:flex;}
.sidebar{
  width:220px;flex-shrink:0;
  background:var(--parchment-2);
  border-right:1px solid var(--rule);
  padding:22px 0;
}
.nav-item{
  display:block;width:100%;text-align:left;
  background:none;border:none;
  padding:11px 22px;
  font-family:'IBM Plex Mono', monospace;
  font-size:12.5px;letter-spacing:0.03em;
  color:var(--text-soft);
  border-left:3px solid transparent;
}
.nav-item:hover{color:var(--ink);background:rgba(168,131,47,0.08);}
.nav-item.active{
  color:var(--ink);font-weight:600;
  border-left-color:var(--brass);
  background:rgba(168,131,47,0.1);
}
.content{flex:1;padding:32px 36px 60px;max-width:1080px;}

/* ---------------- SHARED COMPONENTS ---------------- */
.page-head{margin-bottom:24px;}
.page-eyebrow{
  font-family:'IBM Plex Mono', monospace;font-size:11px;
  letter-spacing:0.14em;text-transform:uppercase;color:var(--brass);
}
.page-head h2{font-size:26px;margin-top:6px;}
.page-head p{color:var(--text-soft);margin-top:8px;max-width:60ch;font-size:15px;}

.card{
  background:var(--card);border:1px solid var(--rule);
  padding:20px 22px;margin-bottom:16px;
}
.card-row{
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;flex-wrap:wrap;
}
.section-title{font-size:17px;font-family:'Fraunces',serif;font-weight:600;color:var(--ink);}
.section-meta{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-soft);margin-top:4px;}

.status-pill{
  font-family:'IBM Plex Mono', monospace;font-size:10.5px;
  letter-spacing:0.05em;text-transform:uppercase;
  padding:4px 10px;border-radius:20px;display:inline-block;border:1px solid transparent;
}
.status-draft{background:#E3DAC3;color:var(--text-soft);border-color:var(--rule);}
.status-submitted{background:#DDE6F0;color:#2E5C8A;border-color:#B7CBE0;}
.status-coordinated{background:#E1EEE2;color:#3E6E5B;border-color:#BFDCC2;}
.status-verified{background:#F1E6C9;color:var(--brass);border-color:#E1CE93;}
.status-approved{background:#DCEADD;color:var(--seal-green);border-color:#B9D3BA;}
.status-sentback{background:#F3DEDE;color:var(--seal-red);border-color:#E4B9B9;}

.btn{
  border:1px solid var(--ink);background:var(--ink);color:#FBF7EC;
  padding:9px 16px;font-size:13px;border-radius:2px;
  font-family:'Source Serif 4', serif; font-weight:600;
  transition:opacity 0.15s ease;
}
.btn:hover{opacity:0.85;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.btn-outline{
  background:transparent;color:var(--ink);border:1px solid var(--ink);
}
.btn-brass{background:var(--brass);border-color:var(--brass);color:#FBF7EC;}
.btn-green{background:var(--seal-green);border-color:var(--seal-green);color:#fff;}
.btn-red{background:transparent;border-color:var(--seal-red);color:var(--seal-red);}
.btn-red:hover{background:var(--seal-red);color:#fff;}
.btn-sm{padding:6px 12px;font-size:12px;}

table.data-table{
  width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px;
}
.data-table thead th{
  font-family:'IBM Plex Mono', monospace;font-size:10.5px;
  letter-spacing:0.06em;text-transform:uppercase;color:var(--text-soft);
  text-align:left;padding:9px 10px;border-bottom:1px solid var(--rule);
}
.data-table tbody td{padding:9px 10px;border-bottom:1px solid var(--rule-light);vertical-align:middle;}
.data-table tbody tr:last-child td{border-bottom:none;}
.data-table input[type=number]{
  width:64px;padding:5px 7px;border:1px solid var(--rule);
  background:#fff;font-size:13px;border-radius:2px;
}
.data-table input[type=number]:focus{outline:2px solid var(--brass-light);outline-offset:1px;}
.data-table input.invalid{border-color:var(--seal-red);background:#FBEFEF;}
.total-cell{font-family:'IBM Plex Mono', monospace;font-weight:600;color:var(--ink);}

.empty-state{
  padding:40px 20px;text-align:center;color:var(--text-soft);
  border:1px dashed var(--rule);background:var(--card);
}
.empty-state .em-title{font-family:'Fraunces',serif;color:var(--ink);font-size:17px;margin-bottom:6px;}

/* modal */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(20,26,40,0.55);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
}
.modal-box{
  background:var(--parchment);border:1px solid var(--rule);
  max-width:760px;width:100%;max-height:86vh;overflow-y:auto;
  padding:26px 28px 26px;box-shadow:0 20px 60px rgba(0,0,0,0.35);
}
.modal-box h3{font-size:20px;}
.modal-close{
  float:right;background:none;border:none;font-size:20px;color:var(--text-soft);line-height:1;
}
.remark-box{
  width:100%;min-height:80px;border:1px solid var(--rule);padding:10px;
  font-family:'Source Serif 4',serif;font-size:14px;margin-top:10px;background:#fff;
}
.audit-item{
  border-left:2px solid var(--rule);padding:8px 0 8px 14px;margin-bottom:4px;font-size:13px;
}
.audit-item .a-head{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--brass);letter-spacing:0.04em;text-transform:uppercase;}
.audit-item .a-body{margin-top:3px;color:var(--text);}
.audit-item .a-time{font-size:10.5px;color:var(--text-soft);margin-top:3px;font-family:'IBM Plex Mono',monospace;}

/* toast */
.toast-container{
  position:fixed;bottom:20px;right:20px;z-index:200;
  display:flex;flex-direction:column;gap:8px;
}
.toast{
  background:var(--ink);color:#FBF7EC;padding:12px 18px;
  border-left:3px solid var(--brass);font-size:13.5px;
  box-shadow:0 8px 24px rgba(0,0,0,0.3);min-width:240px;
  animation:toast-in 0.25s ease;
}
.toast.err{border-left-color:var(--seal-red);}
.toast.ok{border-left-color:var(--seal-green);}
@keyframes toast-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* weight bar reuse */
.weight-inline{display:flex;align-items:center;gap:10px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-soft);margin-top:4px;}
.weight-track{width:120px;height:7px;background:#DCD3B9;display:flex;overflow:hidden;}
.weight-cie{background:var(--ink);width:50%;}
.weight-see{background:var(--brass);width:50%;}

.config-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:18px;}
.config-field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-soft);margin-bottom:5px;}
.config-field input,.config-field select{
  width:100%;padding:8px 10px;border:1px solid var(--rule);background:#fff;font-size:13.5px;
}

.branch-heading{
  margin-top:22px;margin-bottom:8px;
  font-family:'IBM Plex Mono', monospace;font-size:11px;
  letter-spacing:0.14em;text-transform:uppercase;color:var(--brass);
  border-bottom:1px solid var(--rule-light);padding-bottom:6px;
}
.branch-heading:first-child{margin-top:0;}
.search-input{
  width:100%;padding:10px 12px;border:1px solid var(--rule);
  background:#fff;font-size:13.5px;border-radius:2px;
}
.search-input:focus{outline:2px solid var(--brass-light);outline-offset:1px;}

.table-scroll{overflow-x:auto;}
.tab-bar{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--rule);}
.tab-btn{
  background:none;border:none;padding:10px 16px;
  font-family:'IBM Plex Mono', monospace;font-size:11.5px;letter-spacing:0.04em;text-transform:uppercase;
  color:var(--text-soft);border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab-btn:hover{color:var(--ink);}
.tab-btn.active{color:var(--ink);font-weight:600;border-bottom-color:var(--brass);}
.tab-btn.locked{color:#a89f86;}
.tab-panel.hidden{display:none;}
.import-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px;}
.file-input-label{
  display:inline-flex;align-items:center;gap:8px;
  border:1px dashed var(--rule);padding:9px 14px;font-size:13px;color:var(--text-soft);
  border-radius:2px;cursor:pointer;background:#fff;
}
.file-input-label:hover{border-color:var(--brass);color:var(--ink);}

@media (max-width:820px){
  .body-shell{flex-direction:column;}
  .sidebar{width:100%;display:flex;overflow-x:auto;padding:10px 0;border-right:none;border-bottom:1px solid var(--rule);}
  .nav-item{white-space:nowrap;border-left:none;border-bottom:3px solid transparent;}
  .nav-item.active{border-left-color:transparent;border-bottom-color:var(--brass);}
  .content{padding:22px 16px 50px;}
  .notif-panel{right:16px;width:280px;}
}
#print-area{display:none;}
@media print{
  #app{display:none !important;}
  #print-area{display:block !important;}
  .topbar,.sidebar,.toast-container,#modal-root .modal-close, .no-print{display:none !important;}
  body{background:#fff;}
  .content{padding:0;max-width:none;}
}
</style>
</head>
<body>

  <div id="app">

    <!-- LOGIN VIEW -->
    <section id="login-view" class="login-view">
      <div class="login-card">
        <span class="eyebrow">Record No. DVS‑07</span>
        <h1>Digital Valuation System</h1>
        <p class="login-sub">Sign in with the email and password issued to you by the System Administrator.</p>
        <form id="login-form" class="login-form" style="margin-top:30px;display:flex;flex-direction:column;gap:14px;" onsubmit="return false;">
          <div class="config-field">
            <label style="color:var(--brass-light);">Email</label>
            <input id="login-email" type="email" autocomplete="username" placeholder="you@suh.in" style="width:100%;">
          </div>
          <div class="config-field">
            <label style="color:var(--brass-light);">Password</label>
            <input id="login-password" type="password" autocomplete="current-password" placeholder="••••••••" style="width:100%;">
          </div>
          <div id="login-error" class="section-meta hidden" style="color:#E38C8C;"></div>
          <button id="login-submit-btn" type="submit" class="btn" style="margin-top:4px;">Sign In</button>
          <p class="section-meta" style="color:#B9AF93;">No account or forgotten password? Contact your System Administrator — accounts and passwords are issued by them, not self-registered.</p>
        </form>
      </div>
    </section>

    <!-- APP SHELL -->
    <div id="shell" class="shell hidden">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">DVS</span>
          <span class="brand-sub mono">Digital Valuation System</span>
        </div>
        <div class="topbar-right">
          <button id="bell-btn" class="bell-btn" aria-label="Notifications">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            <span id="bell-count" class="bell-count hidden">0</span>
          </button>
          <div id="notif-panel" class="notif-panel hidden"></div>
          <div class="user-chip">
            <span id="user-name" class="user-name"></span>
            <span id="user-role" class="role-tag mono"></span>
          </div>
          <button id="logout-btn" class="ghost-btn">Sign out</button>
        </div>
      </header>

      <div class="body-shell">
        <nav id="sidebar" class="sidebar"></nav>
        <main id="content" class="content"></main>
      </div>
    </div>

  </div>

  <div id="toast-container" class="toast-container"></div>
  <div id="modal-root"></div>
  <div id="print-area"></div>

<script>
/* =========================================================
   Digital Valuation System (DVS) — client-side demo engine
   Vanilla JS, backed by a live Supabase Postgres database
   (see the schema/seed SQL — profiles, courses, students,
   assignments, notifications, course_history, app_settings,
   term_test_history).

   Role model:
   - Fixed system roles: ADMIN, HOD, EA, EXAM
   - FACULTY is the only "person" role — whether a faculty
     member currently behaves as a Course Coordinator (CC) or
     Course Instructor (CI) is derived at runtime from the
     `assignments` table, never stored on the user record.
   ========================================================= */

/* ---------------- Supabase connection ---------------- */
const SUPABASE_URL = 'https://dhmidutrazdhhiqsstxv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRobWlkdXRyYXpkaGhpcXNzdHh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzOTMwOTIsImV4cCI6MjA5OTk2OTA5Mn0.jXlLh7b737FzsKpavzr5lHzSn04mjcb1XhWZaPFn9ko';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const ROLE_LABELS = { ADMIN:'Administrator', HOD:'Head of Department', EA:'Executive Assistant', EXAM:'Examination Branch', FACULTY:'Faculty' };

const BRANCH_LABELS = { CSE:'CSE — Computer Science', AIML:'AIML — AI & Machine Learning', SAP:'SAP — Systems & Applications', ECE:'ECE — Electronics & Comm.', CSD:'CSD — CS & Design', CSC:'CSC — CS & Cyber Security' };
function branchLabel(b){ return BRANCH_LABELS[b] || b || '—'; }
// Which branches exist for each admitted batch — the Student Directory upload
// validates each row's Department against the list for the Batch selected.
// R24 predates the CSD/CSC programs, so only CSE/AIML are valid for it.
const BATCH_BRANCHES = { R24:['CSE','AIML'], R25:['CSE','AIML','SAP','CSD','CSC'] };
const BATCH_LABELS = { R24:'R24 (2024 admits)', R25:'R25 (2025 admits)' };

// ============================================================================
// EVALUATION TYPE (ET) TEMPLATES — sourced directly from the institution's
// official Evaluation Scheme sheet. Each template is identified by its
// Abbreviation (ET1, ET2, ET3, ETP1, ETP2, ETS, EPP, EP, EPS, ES, ESS1, ESS2,
// EAC) and defines the exact CIE + SEE components, their raw exam marks, and
// their scaled weight. The Course Coordinator fixes one template per course
// section (the app auto-detects it from the Subject Lookup Table by course
// code where possible, with manual override always available). Whichever
// template is fixed determines exactly which components the Course
// Instructor's marks-entry form renders — the form is generated automatically:
//   Select Subject → Lookup Subject Table → Get Abbreviation → Fetch
//   Evaluation Template → Generate Form Automatically
//
// NOTE: each template's `courses:[]` array below is legacy seed data and is
// no longer read anywhere in the app — the live "Courses Applicable" list
// now comes from the Supabase `subjects` table (see masterSubject() further
// down). It's left in place only for reference/history.
// Component shape: { key, label, rawMax, scaledMax }

function normalizeCode(code){ return (code||'').toString().trim().toUpperCase().replace(/\s+/g,''); }

// ============================================================================
// MASTER SUBJECTS — the "Courses Applicable" master list now lives in the
// live Supabase `subjects` table (id, code, abbr, course_type, name), not
// hardcoded in this file. App.state.subjects is populated on login/refresh
// by fetchStateFromSupabase(). This is the single source of truth for any
// subject-picker in the app — no hand-typed or invented course codes. Any
// dropdown built from this list is automatically, correctly mapped to its
// Evaluation Type, so a Coordinator can never fix a subject to the wrong ET.
// ============================================================================
function masterSubject(code){ return (App.state.subjects||[]).find(s=>normalizeCode(s.code)===normalizeCode(code)) || null; }
// Powers the auto-detect flow: Select Subject -> Lookup Subject Table ->
// Get Abbreviation -> Fetch Template — now backed by App.state.subjects.
function lookupAbbrForCode(code){ const s = masterSubject(code); return s ? s.abbr : null; }
function subjectNameForCode(code){ const s = masterSubject(code); return s ? s.name : null; }

/* Grouped <select> of every real subject (Courses Applicable), grouped by
   "Abbr — Course Type" so whoever is picking a subject can see exactly which
   Evaluation Type it fixes. Used by the CC's Course Instructor assignment flow. */
function subjectDropdownOptionsHtml(selectedCode){
  const groups = {};
  const order = [];
  (App.state.subjects||[]).forEach(s=>{
    const key = `${s.abbr} — ${s.courseType}`;
    if(!groups[key]){ groups[key] = []; order.push(key); }
    groups[key].push(s);
  });
  let html = `<option value="">— Select Subject (Courses Applicable) —</option>`;
  order.forEach(key=>{
    html += `<optgroup label="${escapeHtml(key)}">`;
    groups[key].forEach(s=>{
      html += `<option value="${escapeHtml(s.code)}" ${normalizeCode(selectedCode)===normalizeCode(s.code)?'selected':''}>${escapeHtml(s.code)} — ${escapeHtml(s.name)}</option>`;
    });
    html += `</optgroup>`;
  });
  return html;
}

function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ---------------- readable, business-code ids ----------------
   slugId turns any value into an uppercase A-Z0-9 token. bizId joins a
   few natural fields (subject code, roll no, email, etc) behind a
   prefix — e.g. bizId('CRS', ['CSE301','A']) -> 'CRS-CSE301-A' — and
   only falls back to the old random uid() when there's genuinely no
   natural field to build from. `existingIds` is whatever array of ids
   the new row would collide with; a numeric suffix is added until the
   candidate is unique. */
function slugId(v){ return String(v||'').toUpperCase().replace(/[^A-Z0-9]+/g,'').slice(0,24); }
function bizId(prefix, parts, existingIds){
  const base = (parts||[]).filter(p=>p!==null && p!==undefined && p!=='').map(slugId).join('-');
  if(!base) return uid(prefix.toLowerCase());
  const taken = new Set(existingIds||[]);
  let candidate = prefix + '-' + base;
  let n = 2;
  while(taken.has(candidate)){ candidate = prefix + '-' + base + '-' + n; n++; }
  return candidate;
}

/* fills every student's marks with plausible, complete values — used to seed a fully-approved demo record for the Examination Branch */

  const template = getCourseTemplate(course);
  course.students.forEach(s=>{

      s.marks[comp.key] = Math.round((comp.rawMax*0.78 + Math.random()*comp.rawMax*0.15)*2)/2;
    });
  });
}

/* ---------------- Supabase-backed persistence ----------------
   The app still works against one in-memory `state` object (same
   shape as before) so every render function is unchanged. On boot —
   and again right after sign-in — we fetch every table and assemble
   it into that shape. Every mutation happens in memory first (so the
   UI stays instant), then a *targeted* sync function pushes only the
   row(s) that actually changed, instead of re-writing everything. */

async function fetchStateFromSupabase(){
  const [profilesR, coursesR, completionR, assignmentsR, notificationsR, historyR, ttHistoryR, settingsR, subjectsR, studentDirR] = await Promise.all([
    sb.from('profiles').select('*').order('created_at', { ascending:true }),
    sb.from('courses').select('*').order('created_at', { ascending:true }),
    // Lightweight completion status instead of the full students table —
    // dashboards get { student_count, cie_complete, see_complete } per
    // course without downloading a single mark or name. Full roster/marks
    // are fetched lazily per-course by App.ensureCourseStudentsLoaded()
    // only when someone actually opens that section (mark entry, roster,
    // review/approval pages) — see course_completion_status in the DB.
    sb.from('course_completion_status').select('*'),
    sb.from('assignments').select('*').order('assigned_at', { ascending:true }),
    // Append-only logs: capped, most-recent-first. This is a partial
    // mitigation, not full pagination — see the note this was delivered
    // with for why a proper fix needs server-side aggregation instead.
    sb.from('notifications').select('*').order('ts', { ascending:false }).limit(300),
    sb.from('course_history').select('*').order('ts', { ascending:false }).limit(1000),
    sb.from('term_test_history').select('*').order('ts', { ascending:false }).limit(200),
    sb.from('app_settings').select('*'),
    sb.from('subjects').select('*').order('code', { ascending:true }),
    sb.from('student_directory').select('*').order('roll_no', { ascending:true }),
  ]);

  const named = [
    ['profiles',profilesR],['courses',coursesR],['course_completion_status',completionR],['assignments',assignmentsR],
    ['notifications',notificationsR],['course_history',historyR],['term_test_history',ttHistoryR],['app_settings',settingsR],
    ['subjects',subjectsR],['student_directory',studentDirR],
  ];
  const firstErr = named.find(([,r])=>r.error);
  if(firstErr){
    const [table, r] = firstErr;
    const e = r.error;
    throw new Error(`Supabase query on "${table}" failed: ${e.message || JSON.stringify(e)}${e.hint ? ' — hint: '+e.hint : ''}${e.code ? ' (code '+e.code+')' : ''}`);
  }
  if(!profilesR.data || profilesR.data.length===0) throw new Error('The "profiles" table came back empty for this session.');

  const users = profilesR.data.map(p=>({ id:p.id, name:p.name, email:p.email, systemRole:p.system_role, homeBranch:p.home_branch||undefined, authId:p.auth_id||null }));

  const completionByCourse = {};
  (completionR.data||[]).forEach(row=>{ completionByCourse[row.course_id] = row; });

  const courses = coursesR.data.map(c=>{
    const comp = completionByCourse[c.id];
    return {
      id:c.id, code:c.code, name:c.name, section:c.section, branch:c.branch,
      status:c.status, sentBack:!!c.sent_back, lastRemark:c.last_remark||'', eaRemark:c.ea_remark||'',
      evalType:c.eval_type || null,
      editRequestStatus:c.edit_request_status || null, editRequestRemark:c.edit_request_remark||'', editUnlocked:!!c.edit_unlocked,
      // Roster/marks are NOT fetched here — only a lightweight count +
      // completion flags from the view. Call App.ensureCourseStudentsLoaded
      // (courseId) before any page needs the real per-student data; that
      // flips studentsLoaded to true and populates `students` for real.
      students:[], studentsLoaded:false,
      studentCount: comp ? comp.student_count : 0,
      cieComplete: comp ? !!comp.cie_complete : false,
      seeComplete: comp ? !!comp.see_complete : false,
      history:[]
    };
  });
  const courseById = id => courses.find(c=>c.id===id);

  (historyR.data||[]).forEach(h=>{
    const course = courseById(h.course_id);
    if(course) course.history.push({ id:h.id, ts:new Date(h.ts).getTime(), user:h.user_name, role:h.role, action:h.action, remark:h.remark||'' });
  });

  const assignments = (assignmentsR.data||[]).map(a=>({
    id:a.id, type:a.type, courseId:a.course_id, userId:a.user_id, assignedBy:a.assigned_by,
    assignedAt:new Date(a.assigned_at).getTime(), status:a.status,
    revokedAt:a.revoked_at ? new Date(a.revoked_at).getTime() : undefined,
    revokedBy:a.revoked_by || undefined,
  }));

  const notifications = (notificationsR.data||[]).map(n=>({
    id:n.id, forUserId:n.for_user_id, courseId:n.course_id, title:n.title, body:n.body,
    ts:new Date(n.ts).getTime(), read:!!n.read, notifyEmail:!!n.notify_email, fromEmail:n.from_email||null
  }));

  const termTestHistory = (ttHistoryR.data||[]).map(t=>({ id:t.id, ts:new Date(t.ts).getTime(), by:t.by_name, value:t.value }));

  let currentTermTest = null;
  const ctRow = (settingsR.data||[]).find(r=>r.key==='current_term_test');
  if(ctRow && ctRow.value!==null && ctRow.value!==undefined) currentTermTest = ctRow.value;

  const subjects = (subjectsR.data||[]).map(s=>({ id:s.id, code:s.code, abbr:s.abbr, courseType:s.course_type, name:s.name }));
  const studentDirectory = (studentDirR.data||[]).map(s=>({ id:s.id, rollNo:s.roll_no, name:s.name, email:s.email||'', branch:s.branch, batch:s.batch, semester:s.semester||'' }));

  return { currentUserId:null, users, courses, assignments, notifications, currentTermTest, termTestHistory, subjects, studentDirectory };
}

/* ---------------- granular row sync (replaces the old full-state dump) ---------------- */
const rowOf = {
  profile:(u)=>({ id:u.id, name:u.name, email:u.email, system_role:u.systemRole, home_branch:u.homeBranch||null }),
  course:(c)=>({ id:c.id, code:c.code, name:c.name, section:c.section, branch:c.branch||null, status:c.status, sent_back:!!c.sentBack, last_remark:c.lastRemark||'', ea_remark:c.eaRemark||'', eval_type:c.evalType||null, edit_request_status:c.editRequestStatus||null, edit_request_remark:c.editRequestRemark||'', edit_unlocked:!!c.editUnlocked }),
  student:(courseId,s)=>({ id:s.id, course_id:courseId, name:s.name, marks:s.marks||{}, roll_no:s.rollNo||null, email:s.email||null, dir_id:s.dirId||null }),
  assignment:(a)=>({
    id:a.id, type:a.type, course_id:a.courseId, user_id:a.userId, assigned_by:a.assignedBy||null,
    assigned_at:new Date(a.assignedAt).toISOString(), status:a.status,
    revoked_at:a.revokedAt ? new Date(a.revokedAt).toISOString() : null,
    revoked_by:a.revokedBy || null,
  }),
  notification:(n)=>({ id:n.id, for_user_id:n.forUserId, course_id:n.courseId||null, title:n.title, body:n.body, ts:new Date(n.ts).toISOString(), read:!!n.read, notify_email:!!n.notifyEmail, from_email:n.fromEmail||null }),
  history:(courseId,h)=>({ id:h.id, course_id:courseId, ts:new Date(h.ts).toISOString(), user_name:h.user, role:h.role, action:h.action, remark:h.remark||'' }),
  termTest:(t)=>({ id:t.id, ts:new Date(t.ts).toISOString(), by_name:t.by, value:t.value }),
  studentDirectoryEntry:(s)=>({ id:s.id, roll_no:s.rollNo, name:s.name, email:s.email||null, branch:s.branch, batch:s.batch, semester:s.semester||null }),
};

async function warnOnError(promise, label, opts={}){
  const { error } = await promise;
  if(error){
    console.warn(`Supabase sync failed (${label}):`, error.message || error);
    if(opts.toastOnFail){
      toast(`Save failed (${label}): ${error.message || error}. Other users won't see this change until it's fixed — check your Supabase RLS policies / grants.`, 'err');
    }
  }
  return { error };
}

function syncProfile(u){ return warnOnError(sb.from('profiles').upsert(rowOf.profile(u)), 'profile:'+u.id, {toastOnFail:true}); }
function syncProfiles(users){ return users.length ? warnOnError(sb.from('profiles').upsert(users.map(rowOf.profile)), 'profiles:bulk', {toastOnFail:true}) : Promise.resolve(); }
function syncCourse(c){ return warnOnError(sb.from('courses').upsert(rowOf.course(c)), 'course:'+c.id, {toastOnFail:true}); }
function syncStudent(courseId, s){ return warnOnError(sb.from('students').update({ marks:s.marks||{} }).eq('id', s.id), 'student:'+s.id, {toastOnFail:true}); }
function syncNewStudent(courseId, s){ return warnOnError(sb.from('students').upsert(rowOf.student(courseId, s)), 'student:'+s.id, {toastOnFail:true}); }
function deleteStudent(id){ return warnOnError(sb.from('students').delete().eq('id', id), 'student-delete:'+id, {toastOnFail:true}); }
function syncStudents(courseId, students){ return students.length ? warnOnError(Promise.all(students.map(s=>sb.from('students').update({ marks:s.marks||{} }).eq('id', s.id))).then(results=>({ error: results.find(r=>r.error)?.error })), 'students:'+courseId, {toastOnFail:true}) : Promise.resolve(); }
function syncAssignment(a){ return warnOnError(sb.from('assignments').upsert(rowOf.assignment(a)), 'assignment:'+a.id, {toastOnFail:true}); }
function syncNotification(n){ return warnOnError(sb.from('notifications').insert(rowOf.notification(n)), 'notification:'+n.id); }
function syncNotificationRead(n){ return warnOnError(sb.from('notifications').update({ read:true }).eq('id', n.id), 'notification-read:'+n.id); }
function syncHistory(courseId, h){ return warnOnError(sb.from('course_history').insert(rowOf.history(courseId,h)), 'history:'+h.id); }
function syncAppSetting(key, value){ return warnOnError(sb.from('app_settings').upsert({ key, value: JSON.stringify(value ?? null) }), 'app_settings:'+key); }
function syncTermTest(t){ return warnOnError(sb.from('term_test_history').insert(rowOf.termTest(t)), 'term_test:'+t.id); }
function syncStudentDirectoryEntry(s){ return warnOnError(sb.from('student_directory').upsert(rowOf.studentDirectoryEntry(s)), 'student_directory:'+s.id, {toastOnFail:true}); }
function syncStudentDirectoryEntries(rows){ return rows.length ? warnOnError(sb.from('student_directory').upsert(rows.map(rowOf.studentDirectoryEntry)), 'student_directory:bulk', {toastOnFail:true}) : Promise.resolve(); }
function deleteStudentDirectoryEntry(id){ return warnOnError(sb.from('student_directory').delete().eq('id', id), 'student_directory-delete:'+id, {toastOnFail:true}); }

/* ---------------- real auth: email + password sign-in ----------------
   Accounts and passwords are provisioned entirely by the System Admin
   (see the "Manage System Accounts" screen + the admin-manage-user
   Edge Function). This page only ever calls signInWithPassword — it
   never creates accounts or sets passwords itself. On first sign-in
   for an address we silently link the Supabase Auth user to its
   matching `profiles` row (auth_id), which is what RLS policies key
   off from then on. */

let authBusy = false;

async function attemptPasswordLogin(email, password){
  const errBox = document.getElementById('login-error');
  const btn = document.getElementById('login-submit-btn');
  if(errBox){ errBox.classList.add('hidden'); errBox.textContent = ''; }
  if(!email || !password){
    if(errBox){ errBox.textContent = 'Enter both email and password.'; errBox.classList.remove('hidden'); }
    return;
  }
  if(authBusy) return;
  authBusy = true;
  if(btn){ btn.disabled = true; btn.textContent = 'Signing in…'; }
  try{
    const { error } = await sb.auth.signInWithPassword({ email: email.trim().toLowerCase(), password });
    if(error) throw error;
    // handleSignedIn() runs via onAuthStateChange once the session lands
  }catch(e){
    const msg = (e && e.message) ? e.message : String(e);
    if(errBox){ errBox.textContent = 'Sign-in failed: ' + msg; errBox.classList.remove('hidden'); }
  }finally{
    authBusy = false;
    if(btn){ btn.disabled = false; btn.textContent = 'Sign In'; }
  }
}

async function handleSignedIn(session){
  const email = (session.user.email || '').toLowerCase();
  if(!email) return;
  // first login for this address: claim the matching profiles row
  await warnOnError(
    sb.from('profiles').update({ auth_id: session.user.id }).is('auth_id', null).eq('email', email),
    'self-link:'+email
  );
  try{
    const state = await fetchStateFromSupabase();
    const me = state.users.find(u => u.email.toLowerCase() === email);
    if(!me){
      const errBox = document.getElementById('login-error');
      if(errBox){ errBox.textContent = `Signed in as ${email}, but no matching profile exists in the directory. Ask your Admin to add you.`; errBox.classList.remove('hidden'); }
      await sb.auth.signOut();
      return;
    }
    state.currentUserId = me.id;
    App.state = state;
    App.completeLogin(me.id);
  }catch(e){
    const errBox = document.getElementById('login-error');
    if(errBox){ errBox.textContent = 'Signed in, but could not load your data: ' + (e.message || e); errBox.classList.remove('hidden'); }
  }
}

sb.auth.onAuthStateChange((event, session) => {
  if(session && !App.state.currentUserId && ['SIGNED_IN','INITIAL_SESSION','TOKEN_REFRESHED'].includes(event)){
    handleSignedIn(session);
  }
});

/* ---------------- Admin-only: account & password provisioning ----------------
   These call a Supabase Edge Function (admin-manage-user) using the
   currently signed-in Admin's own access token. The function itself
   re-checks server-side that the caller is really an ADMIN before it
   touches anything — the service-role key never appears in this file. */
async function callAdminManageUser(action, payload){
  const { data: sessionData } = await sb.auth.getSession();
  const token = sessionData && sessionData.session ? sessionData.session.access_token : null;
  if(!token) throw new Error('Not signed in.');
  const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-manage-user`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${token}`,
      'apikey': SUPABASE_ANON_KEY
    },
    body: JSON.stringify({ action, ...payload })
  });
  const body = await res.json().catch(()=>({}));
  if(!res.ok || body.error) throw new Error(body.error || `Request failed (${res.status})`);
  return body;
}

function getCourseCIUser(courseId){ const a=getActiveAssignment(courseId,'CI'); return a ? App.getUserById(a.userId) : null; }

function createFacultyIfNeeded(email, name){
  const existing = App.state.users.find(u=>u.email.toLowerCase()===email.toLowerCase());
  if(existing) return { user:existing, isNew:false };
  const finalName = (name && name.trim()) ? name.trim() : email.split('@')[0].replace(/[._]+/g,' ').replace(/\b\w/g, c=>c.toUpperCase());
  const user = { id:bizId('FAC', [email.split('@')[0]], App.state.users.map(u=>u.id)), name:finalName, email, systemRole:'FACULTY' };
  App.state.users.push(user);
  return { user, isNew:true };
}
function isValidEmail(email){ return /^\S+@\S+\.\S+$/.test(email); }

/* ---------------- app state ---------------- */
const App = {
  state: { currentUserId:null, users:[], courses:[], assignments:[], notifications:[], currentTermTest:null, termTestHistory:[], subjects:[], studentDirectory:[] },
  ui: { view:'', params:{} },
  ready:false,

  currentUser(){ return this.state.users.find(u=>u.id===this.state.currentUserId) || null; },
  getUserById(id){ return this.state.users.find(u=>u.id===id) || null; },
  getCourse(id){ return this.state.courses.find(c=>c.id===id); },
  /* ---------- lazy roster/marks loader ----------
     Full student rows (name/roll/email/marks) are never fetched at login —
     only the lightweight course_completion_status view. This loads the real
     rows for ONE course, on demand, the first time a page actually needs
     them (mark entry, roster management, review/approval pages). Safe to
     call repeatedly — it's a no-op once studentsLoaded is true, so render
     functions can just `await` it every time without worrying about
     re-fetching on every re-render. */
  async ensureCourseStudentsLoaded(courseId){
    const course = this.getCourse(courseId);
    if(!course || course.studentsLoaded) return course;
    const { data, error } = await sb.from('students').select('*').eq('course_id', courseId);
    if(error){ toast('Could not load this section\'s roster: ' + (error.message||error), 'err'); return course; }
    course.students = (data||[]).map(s=>({ id:s.id, name:s.name, marks:s.marks||{}, rollNo:s.roll_no||'', email:s.email||'', dirId:s.dir_id||null }));
    course.studentsLoaded = true;
    return course;
  },

  /* ---------- auth ---------- */
  // Called by the login form's submit handler / button.
  submitLogin(){
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    attemptPasswordLogin(email, password);
  },
  // Called by handleSignedIn() once a real Supabase Auth session exists
  // and has been matched to a profiles row.
  completeLogin(userId){
    this.state.currentUserId = userId;
    document.getElementById('login-view').classList.add('hidden');
    document.getElementById('shell').classList.remove('hidden');
    const u = this.currentUser();
    document.getElementById('user-name').textContent = u.name;
    document.getElementById('user-role').textContent = u.systemRole==='FACULTY' ? (facultyBadgeShort(u) || 'FACULTY') : `${u.systemRole} · ${ROLE_LABELS[u.systemRole]}`;
    const nav = getNavForUser(u);
    this.ui = { view: nav[0] ? nav[0].v : 'faculty-empty', params:{} };
    renderSidebar();
    renderContent();
    renderBell();
  },
  async logout(){
    try{ await sb.auth.signOut(); }catch(e){ console.warn('sign-out failed', e); }
    this.state.currentUserId = null;
    this.state.users = [];
    document.getElementById('shell').classList.add('hidden');
    document.getElementById('login-view').classList.remove('hidden');
    const emailEl = document.getElementById('login-email');
    const pwEl = document.getElementById('login-password');
    if(emailEl) emailEl.value = '';
    if(pwEl) pwEl.value = '';
    closeNotifPanel();
  },
  navigate(view, params={}){
    this.ui = { view, params };
    renderSidebar();
    renderContent();
    window.scrollTo({top:0, behavior:'smooth'});
  },

  /* ---------- audit ---------- */
  logHistory(course, action, remark=''){
    const u = this.currentUser();
    const entry = { id:bizId('HIST', [course.code, course.section, course.history.length+1], course.history.map(h=>h.id)), ts:Date.now(), user:u.name, role:u.systemRole==='FACULTY' ? facultyBadgeShort(u) || 'FACULTY' : u.systemRole, action, remark };
    course.history.unshift(entry);
    syncHistory(course.id, entry);
  },
  notifyUser(userId, course, title, body, notifyEmail=false, fromEmail=null){
    const n = { id:bizId('NOTE', [course ? course.code : 'GENERAL', this.state.notifications.length+1], this.state.notifications.map(x=>x.id)), forUserId:userId, courseId:course.id, title, body, ts:Date.now(), read:false, notifyEmail, fromEmail };
    this.state.notifications.unshift(n);
    syncNotification(n);
    renderBell();
  },

  /* ---------- Admin: create account (with password) + set role + reset password ----------
     CC / CI are NOT handled here — those stay assigned inside the app by
     HOD (→ CC) and CC (→ CI) exactly as before. This panel only covers
     the fixed system roles: ADMIN, HOD, EA, EXAM, and plain FACULTY. */
  async createSystemAccount(rawName, rawEmail, role, rawPassword, rawBranch){
    const name = (rawName||'').trim();
    const email = (rawEmail||'').trim().toLowerCase();
    const password = (rawPassword||'').trim();
    const branch = (rawBranch||'').trim().toUpperCase();
    if(!name || !email){ toast('Name and email are required.', 'err'); return; }
    if(!isValidEmail(email)){ toast('Enter a valid email address.', 'err'); return; }
    if(!password || password.length < 8){ toast('Set a password of at least 8 characters.', 'err'); return; }
    if(this.state.users.find(u=>u.email.toLowerCase()===email)){ toast('A user with this email already exists.', 'err'); return; }
    const id = bizId('USR', [role, email.split('@')[0]], this.state.users.map(u=>u.id)); // generated up front so the Edge Function's profiles insert has an id to use
    try{
      await callAdminManageUser('create_user', { id, name, email, role, password });
      const user = { id, name, email, systemRole:role };
      if(role==='FACULTY' && BRANCH_LABELS[branch]){
        user.homeBranch = branch;
        syncProfile(user); // best-effort follow-up write, home_branch isn't set by the Edge Function itself
      }
      this.state.users.push(user);
      toast(`${name} added as ${ROLE_LABELS[role]}, with sign-in credentials issued.`, 'ok');
      this.navigate('admin-users');
    }catch(e){
      toast('Could not create account: ' + (e.message || e), 'err');
    }
  },
  setUserBranch(userId, branch){
    const u = this.getUserById(userId);
    if(!u) return;
    if(u.systemRole!=='FACULTY'){ toast('Only Faculty accounts have a branch.', 'err'); return; }
    u.homeBranch = branch || undefined;
    syncProfile(u);
    toast(`${u.name}'s branch set to ${branch ? branchLabel(branch) : 'none'}.`, 'ok');
    this.navigate('admin-users');
  },
  async setSystemRole(userId, role){
    const u = this.getUserById(userId);
    if(!u) return;
    const prevRole = u.systemRole;
    u.systemRole = role;
    try{
      await syncProfile(u);
      toast(`${u.name} is now ${ROLE_LABELS[role]}.`, role==='FACULTY' ? 'err' : 'ok');
    }catch(e){
      u.systemRole = prevRole;
      toast('Could not update role: ' + (e.message || e), 'err');
    }
    this.navigate('admin-users');
  },
  async setUserPassword(userId, rawPassword){
    const u = this.getUserById(userId);
    const password = (rawPassword||'').trim();
    if(!u) return;
    if(!password || password.length < 8){ toast('Set a password of at least 8 characters.', 'err'); return; }
    try{
      const res = await callAdminManageUser('set_password', { email: u.email, password });
      toast(res && res.created ? `Sign-in activated for ${u.name} — they can log in now.` : `Password updated for ${u.name}.`, 'ok');
      this.navigate('admin-users');
    }catch(e){
      toast('Could not set password: ' + (e.message || e), 'err');
    }
  },

  /* ---------- HOD/Admin: create a course-section ----------
     Section identity (code, name) comes straight from the live Supabase
     `subjects` table — the real "Courses Applicable" list — so a section can never be created
     against a subject that isn't on the official Evaluation Scheme sheet.
     Note this only creates the section shell (draft, unassigned, no fixed
     Evaluation Type yet) — the Coordinator still separately confirms the
     Subject when assigning the Course Instructor, which is what actually
     fixes the Evaluation Type.

     If rawEmail is provided, the Course Coordinator is assigned in the same
     step (single "Subject + Section + Branch + Faculty email/name" form in
     Manage Coordinators) — no separate "Assign Coordinator" click needed. */
  async createCourseSection(subjectCode, rawEmail, rawName){
    const actor = this.currentUser();
    if(!['HOD','ADMIN'].includes(actor.systemRole)){ toast('Only the HOD or an Administrator can create a course section.', 'err'); return; }
    const subj = masterSubject(subjectCode);
    if(!subj){ toast('Choose a Subject from Courses Applicable.', 'err'); return; }
    const email = (rawEmail||'').trim().toLowerCase();
    if(email && !isValidEmail(email)){ toast('Enter a valid Coordinator email address.', 'err'); return; }
    // A subject only needs one coordination "shell" — the Coordinator
    // splits it into branch/section combos themselves afterwards (see
    // App.ccCreateSectionAndAssignInstructor), so branch/section are no
    // longer collected here at all.
    const dupe = this.state.courses.find(c=>normalizeCode(c.code)===normalizeCode(subj.code) && !c.branch);
    if(dupe){ toast(`${subj.code} already has a coordination shell — open it from Manage Coordinators.`, 'err'); return; }
    const course = {
      id: bizId('CRS', [subj.code, 'shell'], this.state.courses.map(c=>c.id)), code: subj.code, name: subj.name, section: '', branch: '',
      status:'draft', sentBack:false, lastRemark:'', eaRemark:'', evalType:null,
      editRequestStatus:null, editRequestRemark:'', editUnlocked:false,
      // Roster starts empty — the Course Coordinator builds it from the real
      // Student Directory (see App.setCourseRoster) rather than placeholder names.
      students: [], history: []
    };
    this.state.courses.push(course);
    // Awaited: the CC assignment inserted just below references this course's
    // id via a foreign key, so the course row must exist on the server first —
    // otherwise the assignment insert can race ahead of it and fail with
    // "violates foreign key constraint assignments_course_id_fkey". If the
    // course insert itself failed (RLS, constraint, network), stop here
    // instead of racing ahead into that confusing follow-on error.
    const { error: courseErr } = await syncCourse(course);
    if(courseErr){ this.state.courses = this.state.courses.filter(x=>x.id!==course.id); renderContent(); return; }
    (course.students||[]).forEach(s=>syncNewStudent(course.id, s));
    this.logHistory(course, `Course coordination created: ${subj.code} — ${subj.name} (by ${actor.name})`);
    if(email){
      // Assign the Course Coordinator right away, same as the "Assign
      // Coordinator" flow — creates a FACULTY profile if one doesn't
      // already exist for this email, then adds an active CC assignment.
      // CC/CI are never written to profiles.system_role — that column only
      // ever holds ADMIN/HOD/EA/EXAM/FACULTY; the role is derived from the
      // `assignments` table at render time.
      await this.assignRole('CC', course.id, email, rawName, undefined);
    } else {
      toast(`Created ${subj.code} — ${subj.name}.`, 'ok');
    }
    renderSidebar();
    renderContent();
  },

  /* ---------- CC: split a subject coordination into a real branch/section
     and assign its Course Instructor, all in one step. Reuses the subject
     already fixed on the base coordination row — the Coordinator no longer
     re-picks a Subject here, they just pick Branch + Section + Instructor.
     Can be called repeatedly to allocate several instructors across
     different sections under the same coordination. */
  async ccCreateSectionAndAssignInstructor(baseCourseId, branch, section, instructorEmail){
    const actor = this.currentUser();
    const base = this.getCourse(baseCourseId);
    if(!base){ toast('Choose a coordination to add a section to.', 'err'); return; }
    const ccUser = getCourseCCUser(baseCourseId);
    const isOwner = ccUser?.id === actor.id;
    if(!isOwner && actor.systemRole!=='ADMIN'){ toast('Only this subject\'s Course Coordinator can add a section.', 'err'); return; }
    const subj = masterSubject(base.code);
    if(!subj){ toast('Could not find this subject in Courses Applicable.', 'err'); return; }
    if(!BRANCH_LABELS[branch]){ toast('Choose a branch.', 'err'); return; }
    const sec = (section||'').trim().toUpperCase();
    if(!sec){ toast('Enter a section (e.g. A, B, C).', 'err'); return; }
    const email = (instructorEmail||'').trim().toLowerCase();
    if(!email){ toast('Choose an Instructor.', 'err'); return; }
    const dupe = this.state.courses.find(c=>normalizeCode(c.code)===normalizeCode(subj.code) && c.section===sec && c.branch===branch);
    if(dupe){ toast(`${subj.code} · Section ${sec} · ${branchLabel(branch)} already exists.`, 'err'); return; }
    const course = {
      id: bizId('CRS', [subj.code, branch, sec], this.state.courses.map(c=>c.id)), code: subj.code, name: subj.name, section: sec, branch,
      status:'draft', sentBack:false, lastRemark:'', eaRemark:'', evalType:null,
      editRequestStatus:null, editRequestRemark:'', editUnlocked:false,
      students: [], history: []
    };
    this.state.courses.push(course);
    const { error: courseErr } = await syncCourse(course);
    if(courseErr){ this.state.courses = this.state.courses.filter(x=>x.id!==course.id); renderContent(); return; }
    this.logHistory(course, `Section created under ${subj.code} coordination: Section ${sec} · ${branchLabel(branch)} (by ${actor.name})`);
    // Coordinator on the new section is whoever coordinates the base subject
    // (usually the acting user; kept explicit so an Admin can do this on
    // their behalf without silently reassigning coordination).
    if(ccUser){
      const rec = { id:bizId('ASG', ['CC', course.code, course.section], this.state.assignments.map(a=>a.id)), type:'CC', courseId:course.id, userId:ccUser.id, email:ccUser.email, assignedBy:actor.id, assignedAt:Date.now(), status:'active' };
      this.state.assignments.push(rec);
      syncAssignment(rec);
    }
    await this.assignRole('CI', course.id, email, '', subj.code);
    renderSidebar();
    this.navigate('cc-list');
  },

  /* ---------- HOD → CC, CC → CI: assign / revoke ----------
     For CI assignment, `subjectCode` is a real code from the "Courses
     Applicable" master list (the Supabase `subjects` table) — not a hand-picked ET abbr.
     Picking the subject is what fixes the Abbr / Course Type / Evaluation
     Type for the section, and locks the section's code+name to that real
     subject, so a course can never end up mismatched against the sheet. */
  /* ---------- CC: build the real roster for a coordinated section from the
     Student Directory. selectedDirIds = array of student_directory row ids
     the CC checked. Matching is done via a stable id derived from
     (course, directory row), so re-saving after adding/removing a few
     students never touches the marks already entered for people who stay
     on the roster — only additions/removals are written. This is what the
     Course Instructor sees and enters marks against once assigned. */
  setCourseRoster(courseId, selectedDirIds){
    const actor = this.currentUser();
    const course = this.getCourse(courseId);
    if(!course){ toast('Course not found.', 'err'); return; }
    const isOwner = getCourseCCUser(courseId)?.id === actor.id;
    if(!isOwner && actor.systemRole!=='ADMIN'){ toast('Only this section\'s Course Coordinator can edit its roster.', 'err'); return; }
    if(course.status==='approved' && actor.systemRole!=='ADMIN'){ toast('This course is already approved — the roster is locked. Contact an Administrator if this needs to be corrected.', 'err'); return; }
    const wantedIds = new Set((selectedDirIds||[]).filter(Boolean));
    const dirById = {};
    (this.state.studentDirectory||[]).forEach(s=>{ dirById[s.id] = s; });

    const existingByDirId = {};
    (course.students||[]).forEach(s=>{ if(s.dirId) existingByDirId[s.dirId] = s; });

    const nextStudents = [];
    wantedIds.forEach(dirId=>{
      const dir = dirById[dirId];
      if(!dir) return; // stale id, skip
      const already = existingByDirId[dirId];
      if(already){
        // keep the row (and its marks) as-is, just refresh identity fields
        already.name = dir.name; already.rollNo = dir.rollNo; already.email = dir.email;
        nextStudents.push(already);
      } else {
        nextStudents.push({ id: bizId('CST', [course.code, course.section, dir.rollNo], (course.students||[]).map(s=>s.id)), name: dir.name, rollNo: dir.rollNo, email: dir.email, dirId: dir.id, marks:{} });
      }
    });
    nextStudents.sort((a,b)=>(a.rollNo||'').localeCompare(b.rollNo||''));

    const removed = (course.students||[]).filter(s=>!s.dirId || !wantedIds.has(s.dirId));
    course.students = nextStudents;
    syncCourse(course); // no course fields change, but keeps things in sync if called elsewhere
    nextStudents.forEach(s=>syncNewStudent(course.id, s));
    removed.forEach(s=>deleteStudent(s.id));

    toast(`Roster saved for ${course.code} — ${nextStudents.length} student${nextStudents.length===1?'':'s'}.`, 'ok');
    this.navigate('cc-roster', { courseId });
  },

  /* ---------- CC: import a roster directly onto one course from a
     spreadsheet — Roll No, Name, Email, Department, Semester (same
     template as the EA's Student Directory upload). This is additive: it
     never removes existing roster rows, only adds new ones and refreshes
     matching ones by roll no (marks are preserved either way). Rows whose
     Department doesn't match this section's branch are skipped, since a
     roster only ever belongs to one branch. If a roll no already exists in
     the Student Directory for this branch, the new row is linked to it
     (dirId) so it stays consistent with the EA's master list; otherwise
     it's added as a course-only row. */
  importCourseRosterRows(courseId, rows){
    const actor = this.currentUser();
    const course = this.getCourse(courseId);
    if(!course){ toast('Course not found.', 'err'); return; }
    const isOwner = getCourseCCUser(courseId)?.id === actor.id;
    if(!isOwner && actor.systemRole!=='ADMIN'){ toast('Only this section\'s Course Coordinator can edit its roster.', 'err'); return; }
    if(course.status==='approved' && actor.systemRole!=='ADMIN'){ toast('This course is already approved — the roster is locked. Contact an Administrator if this needs to be corrected.', 'err'); return; }
    if(!Array.isArray(rows) || rows.length===0){ toast('That file has no rows to import.', 'err'); return; }

    const existingByRoll = {};
    (course.students||[]).forEach(s=>{ if(s.rollNo) existingByRoll[s.rollNo.toUpperCase()] = s; });

    let added=0, updated=0, skipped=0;
    rows.forEach(row=>{
      const keys = Object.keys(row||{});
      const findKey = (re) => keys.find(k=>re.test(String(k).trim()));
      const rollKey = findKey(/^roll\s*-?no\.?$/i);
      const nameKey = findKey(/^name$/i);
      const emailKey = findKey(/^e-?mail$/i);
      const deptKey = findKey(/^dep(artmen)?t$/i) || findKey(/^branch$/i);
      const rollNo = rollKey ? String(row[rollKey]).trim().toUpperCase() : '';
      const name = nameKey ? String(row[nameKey]).trim() : '';
      const email = emailKey ? String(row[emailKey]).trim().toLowerCase() : '';
      const dept = deptKey ? String(row[deptKey]).trim().toUpperCase() : '';
      if(!rollNo || !name){ skipped++; return; }
      if(dept && dept !== course.branch){ skipped++; return; } // wrong branch for this section
      if(email && !isValidEmail(email)){ skipped++; return; }
      const dirMatch = (this.state.studentDirectory||[]).find(d=>d.rollNo.toUpperCase()===rollNo && d.branch===course.branch);
      const existing = existingByRoll[rollNo];
      if(existing){
        Object.assign(existing, { name, email: email||existing.email, dirId: dirMatch ? dirMatch.id : existing.dirId });
        updated++;
      } else {
        const newRow = { id: bizId('CST', [course.code, course.section, rollNo], (course.students||[]).map(s=>s.id)), name, rollNo, email, dirId: dirMatch ? dirMatch.id : null, marks:{} };
        course.students.push(newRow);
        existingByRoll[rollNo] = newRow;
        added++;
      }
    });
    course.students.sort((a,b)=>(a.rollNo||'').localeCompare(b.rollNo||''));
    course.students.forEach(s=>syncNewStudent(course.id, s));

    if(added+updated===0){
      toast(`Import found nothing usable — check Roll No/Name are filled in and Department matches ${branchLabel(course.branch)}.`, 'err');
    } else {
      toast(`Import complete — ${added} added, ${updated} updated${skipped?`, ${skipped} skipped`:''}.`, 'ok');
    }
    this.navigate('cc-roster', { courseId });
  },

  async assignRole(type, courseId, rawEmail, rawName, subjectCode){
    const course = this.getCourse(courseId);
    if(!course){ toast('Choose a course first.', 'err'); return; }
    const actor = this.currentUser();
    const email = (rawEmail||'').trim().toLowerCase();
    if(!email){ toast('A faculty email is required.', 'err'); return; }
    if(!isValidEmail(email)){ toast('Enter a valid email address.', 'err'); return; }
    if(type==='CC' && !['HOD','ADMIN'].includes(actor.systemRole)){ toast('Only the HOD or an Administrator can assign a Course Coordinator.', 'err'); return; }
    let subj = null;
    if(type==='CI'){
      const ccA = getActiveAssignment(courseId,'CC');
      const isCoordinator = ccA && ccA.userId===actor.id;
      if(!isCoordinator && !['HOD','ADMIN'].includes(actor.systemRole)){ toast('Only the assigned Course Coordinator can assign a Course Instructor.', 'err'); return; }
      if(course.status==='approved' && actor.systemRole!=='ADMIN'){ toast('This course is already approved — the Course Instructor can no longer be changed. Contact an Administrator if this needs to be corrected.', 'err'); return; }
      subj = masterSubject(subjectCode);
      if(!subj){ toast('Choose a Subject from Courses Applicable before assigning the Course Instructor.', 'err'); return; }
    }
    const existing = getActiveAssignment(courseId, type);
    if(existing){ existing.status='revoked'; existing.revokedAt=Date.now(); existing.revokedBy=actor.id; await syncAssignment(existing); }
    const { user, isNew } = createFacultyIfNeeded(email, rawName);
    // Awaited: the assignment inserted just below references this profile's
    // id via a foreign key, so a brand-new profile must exist on the server
    // first — otherwise the assignment insert can race ahead of it and fail
    // with "violates foreign key constraint assignments_user_id_fkey".
    if(isNew){
      const { error: profileErr } = await syncProfile(user);
      if(profileErr){ this.state.users = this.state.users.filter(u2=>u2.id!==user.id); return; }
    }
    const rec = { id:bizId('ASG', [type, course.code, course.section], this.state.assignments.map(a=>a.id)), type, courseId, userId:user.id, email:user.email, assignedBy:actor.id, assignedAt:Date.now(), status:'active' };
    this.state.assignments.push(rec);
    syncAssignment(rec);
    const roleLabel = type==='CC' ? 'Course Coordinator' : 'Course Instructor';
    let etNote = '';
    if(type==='CI'){
      course.evalType = subj.abbr;
      course.code = subj.code;
      course.name = subj.name;
      syncCourse(course);
      etNote = ` · Subject fixed as: ${subj.code} — ${subj.name} (${evalTypeLabel(subj.abbr)})`;
    }
    this.logHistory(course, `${roleLabel} assigned: ${user.name} (${user.email})${etNote}`);
    this.notifyUser(user.id, course, `You're now ${roleLabel}`, `${actor.name} assigned you as ${roleLabel} for ${course.code} — ${course.name}.${type==='CI' ? ` The subject and Evaluation Type for this section are fixed as "${subj.code} — ${subj.name}" (${evalTypeLabel(subj.abbr)}) — enter marks only for the components shown.` : ''} This role is active immediately — no separate approval step is needed.`, true, actor.email);
    toast(`${user.name} is now ${roleLabel} for ${course.code}.${etNote}`, 'ok');
    closeModal();
    renderSidebar();
    renderContent();
  },
  revokeRole(type, courseId){
    const course = this.getCourse(courseId);
    const actor = this.currentUser();
    const existing = getActiveAssignment(courseId, type);
    if(!existing){ toast('No active assignment to revoke.', 'err'); return; }
    if(type==='CC' && !['HOD','ADMIN'].includes(actor.systemRole)){ toast('Only the HOD or an Administrator can revoke a Course Coordinator.', 'err'); return; }
    if(type==='CC'){
      const siblings = this.state.courses.filter(c=>normalizeCode(c.code)===normalizeCode(course.code));
      if(siblings.some(c=>c.status==='approved') && actor.systemRole!=='ADMIN'){ toast('This subject has an approved, locked record — the Course Coordinator can no longer be revoked. Contact an Administrator if this needs to be corrected.', 'err'); return; }
    }
    if(type==='CI'){
      const isCoordinator = getActiveAssignment(courseId,'CC')?.userId===actor.id;
      if(!isCoordinator && !['HOD','ADMIN'].includes(actor.systemRole)){ toast('Only the assigned Course Coordinator can revoke a Course Instructor.', 'err'); return; }
      if(course.status==='approved' && actor.systemRole!=='ADMIN'){ toast('This course is already approved — the Course Instructor can no longer be revoked. Contact an Administrator if this needs to be corrected.', 'err'); return; }
    }
    existing.status='revoked'; existing.revokedAt=Date.now(); existing.revokedBy=actor.id;
    syncAssignment(existing);
    if(type==='CI'){ course.evalType = null; syncCourse(course); }
    const user = this.getUserById(existing.userId);
    const roleLabel = type==='CC' ? 'Course Coordinator' : 'Course Instructor';
    this.logHistory(course, `${roleLabel} capability revoked: ${user ? user.name+' ('+user.email+')' : existing.email}`);
    if(user) this.notifyUser(user.id, course, `${roleLabel} access revoked`, `${actor.name} revoked your ${roleLabel} role for ${course.code} — ${course.name}.`);
    toast(`${roleLabel} capability revoked for ${course.code}.`, 'err');
    // Cascade: a section can't have an active Course Instructor without an
    // active Course Coordinator (the CI's Subject/Evaluation Type was fixed
    // by that Coordinator), so revoking CC also revokes any active CI —
    // on this row AND on every other section the same Coordinator split
    // this subject into (a subject coordination now spans multiple rows).
    if(type==='CC'){
      const siblings = this.state.courses.filter(c=>normalizeCode(c.code)===normalizeCode(course.code) && c.id!==courseId);
      siblings.forEach(sibling=>{
        const sibCC = getActiveAssignment(sibling.id,'CC');
        if(!sibCC || sibCC.userId!==existing.userId) return;
        sibCC.status='revoked'; sibCC.revokedAt=Date.now(); sibCC.revokedBy=actor.id;
        syncAssignment(sibCC);
        this.logHistory(sibling, `Course Coordinator capability also revoked (Coordinator was revoked on the parent subject): ${user ? user.name+' ('+user.email+')' : sibCC.email}`);
        const sibCI = getActiveAssignment(sibling.id, 'CI');
        if(sibCI){
          sibCI.status='revoked'; sibCI.revokedAt=Date.now(); sibCI.revokedBy=actor.id;
          syncAssignment(sibCI);
          sibling.evalType = null;
          syncCourse(sibling);
          const sibCIUser = this.getUserById(sibCI.userId);
          this.logHistory(sibling, `Course Instructor capability also revoked (Coordinator was revoked): ${sibCIUser ? sibCIUser.name+' ('+sibCIUser.email+')' : sibCI.email}`);
          if(sibCIUser) this.notifyUser(sibCIUser.id, sibling, `Course Instructor access revoked`, `${actor.name} revoked the Course Coordinator for ${course.code}, so your Course Instructor role for Section ${sibling.section} · ${branchLabel(sibling.branch)} was revoked too. A new Coordinator will need to reassign it.`);
        }
      });
      const ciA = getActiveAssignment(courseId, 'CI');
      if(ciA){
        ciA.status='revoked'; ciA.revokedAt=Date.now(); ciA.revokedBy=actor.id;
        syncAssignment(ciA);
        course.evalType = null;
        syncCourse(course);
        const ciUser = this.getUserById(ciA.userId);
        this.logHistory(course, `Course Instructor capability also revoked (Coordinator was revoked): ${ciUser ? ciUser.name+' ('+ciUser.email+')' : ciA.email}`);
        if(ciUser) this.notifyUser(ciUser.id, course, `Course Instructor access revoked`, `${actor.name} revoked the Course Coordinator for ${course.code} — ${course.name}, so your Course Instructor role for this section was revoked too. A new Coordinator will need to reassign it.`);
      }
    }
    renderSidebar();
    renderContent();
  },

  /* ---------- marks workflow ---------- */
  saveMarks(courseId){
    const course = this.getCourse(courseId);
    if(!course) return;
    const touched = [];
    document.querySelectorAll(`[data-course="${courseId}"][data-field]`).forEach(input=>{
      const sid = input.dataset.student;
      const field = input.dataset.field;
      const student = course.students.find(s=>s.id===sid);
      if(!student) return;
      const val = input.value === '' ? null : parseFloat(input.value);
      student.marks[field] = (val===null || isNaN(val)) ? null : val;
      if(!touched.includes(student)) touched.push(student);
    });
    // targeted write: only the students whose marks actually changed on screen
    syncStudents(courseId, touched);
    return course;
  },
  validateCIEComplete(course){
    const components = getCourseComponents(course);
    for(const s of course.students){
      for(const comp of components){
        const v = s.marks[comp.key];
        if(v===undefined || v===null || v==='' || isNaN(v)) return { ok:false, msg:`Missing ${comp.label} score for ${s.name}.` };
        if(v < 0 || v > comp.rawMax) return { ok:false, msg:`${comp.label} score for ${s.name} exceeds the maximum of ${comp.rawMax}.` };
      }
    }
    return { ok:true };
  },
  validateSEEComplete(course){
    const components = getCourseSeeComponents(course);
    for(const s of course.students){
      for(const comp of components){
        const v = s.marks[comp.key];
        if(v===undefined || v===null || v==='' || isNaN(v)) return { ok:false, msg:`Missing ${comp.label} score for ${s.name}.` };
        if(v < 0 || v > comp.rawMax) return { ok:false, msg:`${comp.label} score for ${s.name} exceeds the maximum of ${comp.rawMax}.` };
      }
    }
    return { ok:true };
  },
  validateComplete(course){
    if(!course.evalType) return { ok:false, msg:'The Course Coordinator has not yet fixed an Evaluation Type for this section.' };
    // SEE entry is temporarily disabled for Course Instructors — the
    // Examination Branch will handle it later — so only CIE completeness
    // gates submission for now.
    return this.validateCIEComplete(course);
  },
  ciSubmit(courseId){
    this.saveMarks(courseId);
    const course = this.getCourse(courseId);
    const check = this.validateComplete(course);
    if(!check.ok){ toast(check.msg, 'err'); return; }
    course.status = 'submitted';
    course.sentBack = false;
    syncCourse(course);
    this.logHistory(course, 'Submitted to the Course Coordinator for verification');
    const ccUser = getCourseCCUser(courseId);
    if(ccUser){
      this.notifyUser(ccUser.id, course, `${course.code} ready for verification`, `${course.code} — ${course.name} has been submitted and is awaiting your verification.`, true);
      toast(`${course.code} submitted to the Course Coordinator.`, 'ok');
    } else {
      // Safety net: no active Course Coordinator on this section (shouldn't
      // normally happen, since a CC must exist before a CI can be assigned).
      // Fall back to notifying the Executive Assistant directly so the
      // record doesn't silently stall.
      this.state.users.filter(u => u.systemRole === 'EA').forEach(u =>
        this.notifyUser(u.id, course, `${course.code} ready for verification`, `${course.code} — ${course.name} has been submitted and has no active Course Coordinator — please verify directly.`, true)
      );
      toast(`${course.code} submitted, but has no active Course Coordinator — sent to the Executive Assistant instead.`, 'ok');
    }
    this.navigate('ci-sections');
  },
  ciSaveDraft(courseId){ this.saveMarks(courseId); toast('Draft saved.', 'ok'); },

  /* ---------- CC: verify the instructor's submission and forward to the
     Executive Assistant. Sits between the CI's submission and the EA's
     verification in the approval chain. ---------- */
  ccForward(courseId){
    const course = this.getCourse(courseId);
    if(!course) return;
    const actor = this.currentUser();
    const ccUser = getCourseCCUser(courseId);
    if(ccUser?.id !== actor.id && actor.systemRole!=='ADMIN'){ toast('Only this section\'s Course Coordinator can verify and forward this record.', 'err'); return; }
    if(course.status !== 'submitted'){ toast('This record is not awaiting coordinator verification.', 'err'); return; }
    const remarkEl = document.getElementById('cc-remark-input');
    const remark = remarkEl ? remarkEl.value.trim() : '';
    course.status = 'coordinated';
    syncCourse(course);
    this.logHistory(course, 'Verified by the Course Coordinator and forwarded to the Executive Assistant', remark);
    this.state.users.filter(u => u.systemRole === 'EA').forEach(u =>
      this.notifyUser(u.id, course, `${course.code} ready for verification`, `${course.code} — ${course.name} has been verified by the Course Coordinator and is awaiting your verification.`, true)
    );
    toast(`${course.code} forwarded to the Executive Assistant.`, 'ok');
    this.navigate('cc-list');
  },

  eaForward(courseId){
    const course = this.getCourse(courseId);
    if(course.status !== 'coordinated'){ toast('This record is not awaiting your verification yet.', 'err'); return; }
    const remarkEl = document.getElementById('ea-remark-input');
    course.eaRemark = remarkEl ? remarkEl.value.trim() : course.eaRemark;
    course.status = 'verified';
    syncCourse(course);
    this.logHistory(course, 'Verified for completeness and forwarded to HOD', course.eaRemark);
    this.state.users.filter(u => u.systemRole === 'HOD').forEach(u =>
      this.notifyUser(u.id, course, `${course.code} ready for approval`, `${course.code} — ${course.name} has been verified by the Executive Assistant and is awaiting your approval.`, true)
    );
    toast(`${course.code} forwarded to the HOD.`, 'ok');
    this.navigate('ea-list');
  },

  hodApprove(courseId){
    const course = this.getCourse(courseId);
    course.status = 'approved';
    syncCourse(course);
    this.logHistory(course, 'Approved — record locked for result processing');
    const ciUser = getCourseCIUser(courseId);
    const ccUser = getCourseCCUser(courseId);
    [ciUser, ccUser].filter(Boolean).forEach(u =>
      this.notifyUser(u.id, course, `${course.code} approved`, `${course.code} — ${course.name} has been approved and locked by the HOD.`, true)
    );
    toast(`${course.code} approved and locked.`, 'ok');
    closeModal();
    this.navigate('hod-list');
  },
  /* ---------- CI: request permission to correct marks on an already-approved
     record. Does not reopen the whole pipeline — just asks the HOD for a
     one-time edit unlock, so an Instructor is never editing an approved
     record without HOD sign-off. ---------- */
  ciRequestEditApproved(courseId, remark){
    const course = this.getCourse(courseId);
    if(!course){ toast('Course not found.', 'err'); return; }
    const rmk = (remark||'').trim();
    if(!rmk){ toast('Describe what needs correcting.', 'err'); return; }
    if(course.status!=='approved'){ toast('This record is not approved yet — edit it directly.', 'err'); return; }
    if(course.editRequestStatus==='pending'){ toast('A correction request is already pending HOD approval.', 'err'); return; }
    course.editRequestStatus = 'pending';
    course.editRequestRemark = rmk;
    course.editUnlocked = false;
    syncCourse(course);
    this.logHistory(course, 'Requested permission to correct marks after approval', rmk);
    this.state.users.filter(u=>u.systemRole==='HOD').forEach(u=>
      this.notifyUser(u.id, course, `Correction requested for ${course.code}`, `The Course Instructor is requesting permission to correct marks on the approved record ${course.code} — ${course.name}: "${rmk}"`, true)
    );
    toast('Correction request sent to the HOD.', 'ok');
    closeModal();
    this.navigate('ci-entry', { courseId });
  },
  hodApproveEdit(courseId){
    const course = this.getCourse(courseId);
    if(!course) return;
    course.editRequestStatus = 'approved';
    course.editUnlocked = true;
    syncCourse(course);
    this.logHistory(course, 'Approved instructor\'s request to correct marks — record temporarily unlocked for editing');
    const ciUser = getCourseCIUser(courseId);
