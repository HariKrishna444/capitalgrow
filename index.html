// Routes that read full course.students (marks/roster), not just the
// lightweight count/completion flags — these need App.ensureCourseStudentsLoaded
// before they render, since the initial login fetch deliberately skips the
// full students table (see fetchStateFromSupabase).
const ROUTES_NEEDING_STUDENTS = { 'ci-entry':true, 'ci-subject-detail':true, 'ci-termtest-entry':true, 'ci-component-entry':true, 'ci-section-view':true, 'ci-analytics':true, 'cc-roster':true, 'cc-review':true, 'ea-review':true, 'hod-review':true, 'admin-roster-assignment':true };
/* Defers a renderContent() rebuild to the next tick instead of running it
   synchronously inside an onchange handler. onchange fires the instant an
   input loses focus — i.e. mid-click, before the browser has finished
   dispatching the very click that moved focus away from it. Rebuilding the
   whole DOM synchronously at that point (as the Term Test / SIA / other
   marks-entry onchange handlers used to do) can swap out the element the
   pending click was about to land on: e.g. clicking from one marks box to
   another, or to the Evaluated Script upload/view cell in the same row,
   which can appear or change the instant a mark is saved (see
   ttScriptUploadCell / computeTTAutoPicks). The click then ends up hitting
   whatever happens to be under the pointer after the rebuild — often not
   the box the user was actually aiming for — instead of the intended
   target. Deferring with setTimeout(0) lets the current click finish first
   (so the browser focuses whatever the user actually clicked on the STILL
   OLD, not-yet-rebuilt DOM), and only rebuilds afterwards; by then
   document.activeElement genuinely is the box the user clicked, so
   renderContent()'s existing focus-restore logic (see its own comment)
   correctly refocuses that one, not the box that was just edited.
   _renderContentQueued coalesces bursts of onchange calls (e.g. Tab-ing
   fast through several boxes) into a single rebuild. */
let _renderContentQueued = false;
function scheduleRenderContent(){
  if(_renderContentQueued) return;
  _renderContentQueued = true;
  setTimeout(()=>{ _renderContentQueued = false; renderContent(); }, 0);
}
function renderContent(){
  const user = App.currentUser();
  const nav = getNavForUser(user);
  let view = App.ui.view || (nav[0] ? nav[0].v : 'faculty-empty');

  const routes = {
    'admin-users': renderAdminUsers,
    'admin-course-reg': renderAdminCourseRegistrations,
    'admin-roster-assignment': renderAdminRosterAssignment,
    'admin-seating-plan': renderAdminSeatingPlan,
    'hod-list': renderHODList,
    'hod-review': renderHODReview,
    'hod-termtest-overview': renderHODTermTestOverview,
    'hod-labint-overview': renderHODLabInternalOverview,
    'hod-labext-overview': renderHODLabExternalOverview,
    'hod-coordinators': renderHODCoordinators,
    'hod-cc-detail': renderHODCCDetail,
    'hod-termtest': renderHODTermTest,
    'hod-faculty': renderHODFacultyDirectory,
    'hod-audit': renderHODAudit,
    'ea-faculty': renderEAFacultyDirectory,
    'ea-students': renderEAStudents,
    'ea-list': renderEAList,
    'ea-review': renderEAReview,
    'exam-list': renderExamList,
    'verification-status': renderVerificationStatus,
    'ci-sections': renderCISections,
    'ci-subject-detail': renderCISubjectDetail,
    'ci-entry': renderCIEntry,
    'ci-component-entry': renderCIComponentEntry,
    'ci-section-view': renderCISectionView,
    'ci-analytics': renderCIAnalytics,
    'ci-termtest': renderCITermTestSections,
    'ci-termtest-entry': renderCITermTestEntry,
    'ci-labint': renderCILabInternalSections,
    'ci-labext': renderCILabExternalSections,
    'ci-pending': renderCIPending,
    'ci-audit': renderCIAudit,
    'cc-list': renderCCList,
    'cc-roster': renderCCRoster,
    'cc-review': renderCCReview,
    'cc-termtest-setup': renderCCTermTestSetup,
    'faculty-empty': renderFacultyEmpty,
  };
  const fn = routes[view] || renderFacultyEmpty;
  const c = document.getElementById('content');

  // Marks-entry pages (Term Test 1/2 etc.) re-run renderContent() on every
  // single mark saved (onchange), which used to wipe and rebuild the whole
  // page — losing the page's vertical scroll position, the marks table's
  // own horizontal scroll (.table-scroll), and focus on whichever input the
  // faculty member was mid-typing in, every time. That made entering marks
  // for a long roster feel like it kept "jumping" while scrolling. Snapshot
  // all three here and restore them after the rebuild.
  const prevScrollY = window.scrollY;
  const prevScrollX = window.scrollX;
  const prevTableScrollLefts = Array.from(c.querySelectorAll('.table-scroll')).map(elm => elm.scrollLeft);
  // In normal (non-fullscreen) mode the whole page scrolls, so window.scrollY
  // above is enough. In fullscreen mode (see the CSS on .tt-fs-wrap
  // .table-scroll) THIS div is the one that actually scrolls vertically —
  // window.scrollY never changes at all. Without saving/restoring its own
  // scrollTop too, every mark save (onchange -> scheduleRenderContent ->
  // rebuild) snapped the fullscreen table back to row 1, which looked like
  // clicking an empty cell was "jumping" you up to the student names/roll
  // numbers at the top — it was actually the PRECEDING box's onchange
  // rebuilding the table out from under your next click.
  const prevTableScrollTops = Array.from(c.querySelectorAll('.table-scroll')).map(elm => elm.scrollTop);
  const activeEl = document.activeElement;
  const activeMarkKey = activeEl && c.contains(activeEl) ? activeEl.getAttribute('data-markkey') : null;
  const activeSelStart = activeMarkKey && typeof activeEl.selectionStart === 'number' ? activeEl.selectionStart : null;
  // Snapshot exactly where the focused mark box sits on screen (not just the
  // page's scroll offset) so we can keep it pinned there after rebuild, even
  // when content ABOVE it (e.g. the Class Performance stats, which flip from
  // a one-line placeholder to full stat cards the first time any student in
  // this cycle gets a score) changes height. Restoring the raw scrollY alone
  // doesn't account for that shift, which is what made the box a caller was
  // mid-typing in visibly "jump" down the screen the first time they entered
  // a mark for a given cycle.
  const activeElViewportTop = activeMarkKey ? activeEl.getBoundingClientRect().top : null;

  const build = () => {
    c.innerHTML = '';
    if(user.systemRole !== 'ADMIN' && view !== 'ci-termtest-entry'){
      const bannerHtml = termTestBanner();
      if(bannerHtml){
        const bannerWrap = el('<div></div>');
        bannerWrap.innerHTML = bannerHtml;
        c.appendChild(bannerWrap.firstElementChild);
      }
    }
    c.appendChild(fn(App.ui.params));
    // Any multi-row sticky table header (currently just the Term Test 1/2
    // marks table) needs its per-row top offsets computed off ACTUAL
    // rendered row heights, which only exist once `c` is attached to the
    // document — hence this runs here, after appendChild, not inside the
    // page-render function itself. See applyStickyTableHeaders' own note.
    applyStickyTableHeaders(c);

    // Restore scroll (page + any wide marks table) and focus so re-entering
    // marks doesn't keep bouncing the view back to the top/left.
    const newTableScrolls = c.querySelectorAll('.table-scroll');
    prevTableScrollLefts.forEach((left, i) => { if(newTableScrolls[i]) newTableScrolls[i].scrollLeft = left; });
    prevTableScrollTops.forEach((top, i) => { if(newTableScrolls[i]) newTableScrolls[i].scrollTop = top; });
    window.scrollTo(prevScrollX, prevScrollY);
    if(activeMarkKey){
      const toRefocus = c.querySelector(`[data-markkey="${activeMarkKey}"]`);
      if(toRefocus){
        toRefocus.focus({preventScroll:true});
        if(activeSelStart!==null && typeof toRefocus.setSelectionRange==='function'){
          try{ toRefocus.setSelectionRange(activeSelStart, activeSelStart); }catch(e){ /* not applicable to this input type */ }
        }
        // Correct for any layout shift above the box (see note above) by
        // nudging the scroll so the box lands back at the exact viewport
        // position it was at before the rebuild, instead of trusting the
        // page's raw scrollY (which assumes nothing above it moved).
        if(activeElViewportTop!==null){
          const delta = toRefocus.getBoundingClientRect().top - activeElViewportTop;
          if(delta) window.scrollBy(0, delta);
        }
      }
    }
    // NOTE on Full Screen mode (Term Test marks entry): toggleTTFullscreen()
    // deliberately puts document.documentElement into fullscreen, not the
    // marks table div itself. document.documentElement is never touched by
    // c.innerHTML='' above, so the browser's fullscreen state simply isn't
    // affected by this rebuild at all — no exit, no re-request, no flicker,
    // however many marks get saved. See toggleTTFullscreen()'s own comment
    // for why an inner-element approach didn't hold up.
  };

  const courseId = App.ui.params && App.ui.params.courseId;
  if(ROUTES_NEEDING_STUDENTS[view] && courseId){
    const course = App.getCourse(courseId);
    if(course && !course.studentsLoaded){
      c.innerHTML = emptyStateHtml('Loading roster…', 'Fetching this section\'s students and marks.');
      App.ensureCourseStudentsLoaded(courseId).then(build);
      return;
    }
  }
  build();
}

  const label = tt.academicYear && tt.semester ? `${tt.academicYear} · ${tt.semester} · ${cycleLabel}` : cycleLabel;

/* ============================================================
   EVALUATION DEADLINE — "complete evaluation within 4 working days
   from the date of examination" (per portal requirements doc). The
   Course Coordinator/HOD/Admin set course.examDate; the deadline is
   that date + 4 working days (Sat/Sun skipped). Shown as a badge on
   the CI/CC/HOD screens for that section — not enforced as a hard
   block, just surfaced so everyone can see what's overdue.
   ============================================================ */
function addWorkingDays(dateStr, days){
  if(!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  if(isNaN(d.getTime())) return null;
  let added = 0;
  while(added < days){
    d.setDate(d.getDate()+1);
    const dow = d.getDay();
    if(dow!==0 && dow!==6) added++;
  }
  return d;
}
function deadlineBadge(course){
  if(!course.examDate) return '';
  const deadline = addWorkingDays(course.examDate, 4);
  if(!deadline) return '';
  const done = ['submitted','coordinated','verified','approved'].includes(course.status);
  const now = new Date();
  const overdue = !done && now > deadline;
  const dateLabel = deadline.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
  const style = overdue ? 'color:var(--seal-red);font-weight:600;' : 'color:var(--text-soft);';
  return `<p class="section-meta" style="margin-top:6px;${style}">Evaluation deadline (exam date + 4 working days): ${dateLabel}${overdue ? ' — OVERDUE, marks not yet submitted' : ''}</p>`;
}

/* ============================================================
   CHECKPOINT C (part) — attendance/marks consistency, now PER EXAM.
   This replaces the old toggleStudentAbsent(courseId, studentId, checked),
   which set a single course-wide s.absent flag and wiped s.marks = {}
   entirely — so marking a student absent for Term Test 1 was silently
   erasing their SIA, Regular Lab Performance, Skill Certification, Term
   Test 2, every other component's marks too. See setComponentAbsent below
   (App.setComponentAbsent) — it only clears the ONE component's own
   marks/detail, leaving every other exam for that student untouched.
   ============================================================ */

/* ============================================================
   CHECKPOINT A — Evaluation Completion Status, computed per section.
   ============================================================ */
/* Lightweight checkpoint-A summary for LIST pages (hod-list, cc-list),
   which only ever fetch the cheap per-course count + completion flags —
   NOT full student rows (see ROUTES_NEEDING_STUDENTS above) — so this
   uses only fields already present on that lightweight row. The fuller,
   per-student breakdown (completionStatsChipsHtml) is reserved for the
   review pages, where the full roster for THIS course is guaranteed
   loaded already. */
function completionStatsChipsLite(course){
  const chip = (label, val, warn) => `<span style="display:inline-block;margin:3px 8px 3px 0;padding:3px 9px;background:${warn?'#FBEAEA':'#F3EEDD'};border:1px solid var(--rule);border-radius:6px;font-size:11.5px;${warn?'color:var(--seal-red);':''}">${label}: ${val}</span>`;
  const marksUploaded = course.status !== 'draft';
  const verified = ['verified','approved'].includes(course.status);
  return `<div style="margin-top:6px;">
    ${chip('Scripts', course.studentCount||0)}
    ${chip('CIE', course.cieComplete?'Complete':'Incomplete', !course.cieComplete)}
    ${chip('SEE', course.seeComplete?'Complete':'Incomplete', !course.seeComplete)}
    ${chip('Marks uploaded', marksUploaded?'Yes':'No', !marksUploaded)}
    ${chip('Verified', verified?'Yes':'No', !verified)}
  </div>`;
}
/* Fuller, per-student checkpoint-A breakdown — only valid where
   course.students is the REAL loaded roster (review pages). */
function getCourseCompletionStats(course){
  const students = course.students || [];
  const total = students.length;
  const absent = students.filter(s=>isFullyAbsentFromCIE(course, s)).length;
  const evaluated = students.filter(s=>{
    if(isFullyAbsentFromCIE(course, s)) return false;
    const check = App.validateCIEComplete ? App.validateCIEComplete({ ...course, students:[s] }) : { ok:true };
    return check.ok;
  }).length;
  const pending = total - absent - evaluated;
  return {
    total, absent, evaluated, pending,
    marksUploaded: course.status !== 'draft',
    verificationCompleted: ['verified','approved'].includes(course.status),
  };
}
function completionStatsChipsHtml(course){
  const st = getCourseCompletionStats(course);
  const chip = (label, val, warn) => `<span style="display:inline-block;margin:3px 8px 3px 0;padding:3px 9px;background:${warn?'#FBEAEA':'#F3EEDD'};border:1px solid var(--rule);border-radius:6px;font-size:11.5px;${warn?'color:var(--seal-red);':''}">${label}: ${val}</span>`;
  return `<div style="margin-top:6px;">
    ${chip('Scripts', st.total)}
    ${chip('Evaluated', st.evaluated)}
    ${chip('Pending', st.pending, st.pending>0)}
    ${st.absent ? chip('Absent', st.absent) : ''}
    ${chip('Marks uploaded', st.marksUploaded?'Yes':'No', !st.marksUploaded)}
    ${chip('Verified', st.verificationCompleted?'Yes':'No', !st.verificationCompleted)}
  </div>`;
}
/* Cheaper variant for list rows that only have the lightweight course
   record (studentCount, status, scriptUploads metadata) rather than the
   full students array — avoids forcing a roster load just to paint a
   summary chip on every row of a long list. */
function lightweightCompletionChipsHtml(course){
  const marksUploaded = course.status !== 'draft';
  const verificationCompleted = ['verified','approved'].includes(course.status);
  const uploads = course.scriptUploads || {};
  const scriptsCount = Object.keys(SCRIPT_KINDS).filter(k=>uploads[k]).length;
  const chip = (label, val, warn) => `<span style="display:inline-block;margin:3px 8px 3px 0;padding:3px 9px;background:${warn?'#FBEAEA':'#F3EEDD'};border:1px solid var(--rule);border-radius:6px;font-size:11.5px;${warn?'color:var(--seal-red);':''}">${label}: ${val}</span>`;
  return `<div style="margin-top:8px;">
    ${chip('Marks uploaded', marksUploaded?'Yes':'No', !marksUploaded)}
    ${chip('Verification completed', verificationCompleted?'Yes':'No', !verificationCompleted)}
    ${chip('Scripts uploaded', `${scriptsCount}/3`, scriptsCount<3)}
  </div>`;
}

/* ============================================================
   CHECKPOINT B — Evaluation Deviation Report: compares each
   section's average marks-so-far against the mean across all
   sections of the same subject, and flags sections that deviate
   significantly (>=15% of the mean, or >=5 marks, whichever is
   larger — a small floor so tiny means don't trigger on noise).
   "Marks so far" is the sum of every numeric value directly on
   s.marks (ttDetail is a nested breakdown already reflected in the
   computed component keys like tt1/tt2, so it's excluded to avoid
   double-counting) — comparable across sections of the same subject
   since they share the same Evaluation Type template.
   ============================================================ */
function studentEnteredTotal(s){
  let sum = 0;
  Object.entries(s.marks||{}).forEach(([k,v])=>{
    if(k==='ttDetail') return;
    if(typeof v === 'number' && !isNaN(v)) sum += v;
  });
  return sum;
}
function courseSectionAverage(course){
  const active = (course.students||[]).filter(s=>!isFullyAbsentFromCIE(course, s));
  if(!active.length) return null;
  const total = active.reduce((sum,s)=>sum+studentEnteredTotal(s), 0);
  return round1(total/active.length);
}
function getDeviationReportForSubject(code){
  const sections = App.state.courses.filter(c=>normalizeCode(c.code)===normalizeCode(code) && c.branch);
  const rows = sections.map(c=>({ course:c, avg: courseSectionAverage(c), ci: getCourseCIUser(c.id) })).filter(r=>r.avg!==null);
  if(rows.length < 2) return { rows, mean:null, flagged:[] };
  const mean = rows.reduce((s,r)=>s+r.avg,0) / rows.length;
  const threshold = Math.max(5, mean*0.15);
  const flagged = rows.filter(r=>Math.abs(r.avg-mean) >= threshold);
  return { rows, mean: round1(mean), flagged };
}
/* Sections other than the one being reviewed may not have their real
   roster loaded yet (list pages only ever fetch a lightweight count —
   see ROUTES_NEEDING_STUDENTS above), so the deviation report renders a
   placeholder first, then loads every sibling section's roster in the
   background and patches the card in once real averages are available. */
function deviationReportPlaceholderHtml(course){
  if(!course.branch) return '';
  return `<div class="card" id="deviation-card-${course.id}">
    <div class="section-title" style="font-size:14px;">Evaluation Deviation Report — ${escapeHtml(course.code)}</div>
    <p class="section-meta" style="margin-top:4px;">Loading section averages…</p>
  </div>`;
}
async function loadDeviationReport(course){
  if(!course.branch) return;
  const siblings = App.state.courses.filter(c=>normalizeCode(c.code)===normalizeCode(course.code) && c.branch);
  await Promise.all(siblings.filter(c=>!c.studentsLoaded).map(c=>App.ensureCourseStudentsLoaded(c.id)));
  const target = document.getElementById(`deviation-card-${course.id}`);
  if(!target) return; // navigated away before the load finished
  const html = deviationReportHtml(course);
  if(html) target.outerHTML = html; else target.remove();
}
function deviationReportHtml(course){
  if(!course.branch) return '';

/* Stable tie-breaker: when more than one student shares the winning value
   (e.g. two students both scored the class-min, or two are equally close
   to the average), a real coin-flip would pick a different student on
   every re-render while marks are still being typed. Hashing the student
   id lands on one arbitrary — effectively random — member of the tied
   group, but always the SAME one for a given tie, so the enabled Upload
   button doesn't jump between rows as the page redraws. */
function pickOneOf(ids){
  if(ids.length<=1) return ids[0] || null;
  let winner = ids[0], winnerHash = -1;
  ids.forEach(id=>{
    let h = 0;
    for(let i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i)) | 0;
    h = Math.abs(h);
    if(h>winnerHash){ winnerHash = h; winner = id; }
  });
  return winner;
}
/* Computes which student currently qualifies as Best / Average / Lowest
   for this cycle, straight off the entered Term Test totals — this is
   what drives which row's Upload button is enabled (see
   ttScriptUploadCell below). "Average" means whichever student's total
   sits closest to the class mean, not literally the mean itself (that
   number rarely lands exactly on a real student's score). */
function computeTTAutoPicks(scored){
  if(!scored.length) return { bestId:null, avgId:null, lowId:null };
  const max = Math.max(...scored.map(x=>x.total));
  const min = Math.min(...scored.map(x=>x.total));
  const avg = scored.reduce((a,x)=>a+x.total,0)/scored.length;
  const bestIds = scored.filter(x=>x.total===max).map(x=>x.student.id);
  const lowIds = scored.filter(x=>x.total===min).map(x=>x.student.id);
  let minDist = Infinity;
  scored.forEach(x=>{ const d = Math.abs(x.total-avg); if(d<minDist) minDist = d; });
  const avgIds = scored.filter(x=>Math.abs(x.total-avg)===minDist).map(x=>x.student.id);
  return { bestId: pickOneOf(bestIds), avgId: pickOneOf(avgIds), lowId: pickOneOf(lowIds) };
}

/* SIA Tests — unit-wise entry (5, or however many comp.rawMax/10 works out
   to, columns of /10 each), summed into s.marks[comp.key] (the same "raw"
   slot every other component uses) and auto-scaled to comp.scaledMax by the
   existing generic scaling pipeline (see computeCIE / the /rawMax*scaledMax
   formula) — no other code needs to know the entry happened unit-wise. */
function siaEntryHtml(course, comp, editable){
  // SIA is always entered as 5 unit columns of /10 each (Unit 1–Unit 5 =
  // 50 raw total), regardless of the Evaluation Type's configured rawMax
  // for this component — the raw total is then scaled down to
  // comp.scaledMax using 50 as the fixed denominator, so the same 5-column
  // entry works the same way across every Evaluation Type.
  const UNIT_COUNT = 5;
  const UNIT_MAX = 10;
  const RAW_TOTAL_MAX = SIA_RAW_ENTRY_MAX; // 50 — see componentRawScale
  const rows = course.students.map(s=>{
    const absentHere = isAbsentForComponent(s, comp.key);
    const detail = (s.marks.siaDetail)||{};
    const cells = absentHere
      ? `<td colspan="${UNIT_COUNT}" class="mono" style="color:var(--text-soft);font-size:12px;text-align:center;">Absent</td>`
      : Array.from({length:UNIT_COUNT}, (_,i)=>{
      const idx = i+1;
      const val = detail['unit'+idx];
      const overMax = typeof val==='number' && (val>UNIT_MAX || val<0);
      return `<td><input type="number" min="0" max="${UNIT_MAX}" step="0.5" style="width:56px;"
        class="${overMax?'invalid':''}"
        data-markkey="${course.id}|${s.id}|sia${idx}"
        value="${val===undefined||val===null?'':val}" placeholder="/${UNIT_MAX}" ${editable?'':'disabled'}
        onchange="App.setSiaUnitMark('${course.id}','${s.id}','${comp.key}',${idx},this.value)"></td>`;
    }).join('');
    const rawTotal = typeof s.marks[comp.key]==='number' ? s.marks[comp.key] : 0;
    const scaled = round1((Math.min(rawTotal, RAW_TOTAL_MAX)/RAW_TOTAL_MAX) * comp.scaledMax);
    const absentCell = `<td style="text-align:center;"><input type="checkbox" ${absentHere?'checked':''} ${editable?'':'disabled'}
      title="Absent for ${escapeHtml(comp.label)} only — clears just this exam's marks"
      onchange="if(confirm(this.checked ? 'Mark ${escapeHtml(s.name)} absent for ${escapeHtml(comp.label)}? This clears only this exam\\'s marks.' : 'Mark ${escapeHtml(s.name)} present again for ${escapeHtml(comp.label)}?')) App.setComponentAbsent('${course.id}','${s.id}','${comp.key}',this.checked); else this.checked=!this.checked;"></td>`;
    return `<tr${absentHere?' style="opacity:.55;"':''}><td>${studentNameCell(s)}</td>${absentCell}${cells}<td class="total-cell">${absentHere?'—':`${rawTotal}/${RAW_TOTAL_MAX}`}</td><td class="total-cell">${absentHere?'—':`${scaled}/${comp.scaledMax}`}</td></tr>`;
  }).join('');
  const unitHead = Array.from({length:UNIT_COUNT}, (_,i)=>{
    const label = TT_UNIT_OPTIONS[i] || `Unit ${i+1}`;
    const color = unitBandColor(label);
    return `<th style="background:${color};color:var(--ink);">${escapeHtml(label)}<br><span style="text-transform:none;">/${UNIT_MAX}</span></th>`;
  }).join('');
  return `<div class="card">
    <div class="section-title" style="font-size:14px;">${escapeHtml(comp.label)} — unit-wise entry</div>
    <p class="section-meta" style="margin-top:4px;">Enter each unit's score out of ${UNIT_MAX} (${UNIT_COUNT} units = ${RAW_TOTAL_MAX} raw), automatically scaled down to /${comp.scaledMax} for the CIE total.</p>
    <div class="table-scroll" style="margin-top:8px;"><table class="data-table"><thead><tr><th>Student</th><th>Absent</th>${unitHead}<th>Raw Total</th><th>Scaled</th></tr></thead><tbody>${rows}</tbody></table></div>
  </div>`;
}

   box lives inside .tt-fs-wrap, the one card that stays visible (and just

/* Keeps the Term Test marks table's 3-row header (Part A/B group row, Unit
   row, Question row) pinned in view while scrolling down a long roster —
   in BOTH normal and Full Screen mode, since it's the same table element
   either way. A single `position:sticky;top:0` on every header cell (the
   old Full Screen-only CSS) only works for a single-row header: with three
   stacked header rows all pinned to the same top:0, rows 2 and 3 would
   fight row 1 for the same spot and overlap it once scrolled. Instead this
   walks the <thead> rows in order and gives each one `top` equal to the
   cumulative rendered height of the rows above it, so all three stack
   correctly and stay visible together. Re-run after every table rebuild
   (renderContent, on every mark saved) and after toggling Full Screen
   (its font size / cell padding shrink, which changes each row's height,
   so the offsets have to be recalculated, not just set once). */
/* Keeps the Term Test marks table's 3-row header (Part A/B group row, Unit
   row, Question row) pinned in view while scrolling down a long roster —
   in BOTH normal and Full Screen mode, since it's the same table element
   either way. A single `position:sticky;top:0` on every header cell (the
   old Full Screen-only CSS) only works for a single-row header: with three
   stacked header rows all pinned to the same top:0, rows 2 and 3 would
   fight row 1 for the same spot and overlap it once scrolled. Instead this
   walks the <thead> rows in order and gives each one `top` equal to the
   cumulative rendered height of the rows above it, so all three stack
   correctly and stay visible together.

   Computed off REAL rendered row heights (getBoundingClientRect), not a
   fixed guess — which is why this needs to be more than a one-shot call.
   A machine that's slower to finish loading webfonts (IBM Plex Mono /
   Inter), or running at a different OS display-scaling / browser zoom
   level, can end up with a first-paint row height that's different from
   the final settled one; a single calculation done right after the table
   is inserted can bake in the wrong numbers permanently on that machine
   even though the exact same code works fine on a faster/unscaled one —
   this is the "works on my laptop, not on this desktop" symptom. A
   ResizeObserver on each table's <thead> re-runs the calculation any time
   its rendered size actually changes for ANY reason (font swap, zoom,
   window resize, column reflow), so it self-corrects instead of only
   ever being right by timing luck. */
function applyStickyTableHeaders(root){
  (root||document).querySelectorAll('table.sticky-thead').forEach(table=>{
    computeTTHeaderOffsets(table);
    if(!table._ttStickyObserved && window.ResizeObserver){
      const thead = table.querySelector('thead');
      if(thead){
        const ro = new ResizeObserver(()=> computeTTHeaderOffsets(table));
        ro.observe(thead);
        table._ttStickyObserved = true;
      }
    }
  });
}
function computeTTHeaderOffsets(table){
  const rows = Array.from(table.querySelectorAll('thead > tr'));
  let cumulative = 0;
  rows.forEach(tr=>{
    Array.from(tr.children).forEach(cell=>{
      cell.style.position = 'sticky';
      cell.style.top = cumulative + 'px';
      cell.style.zIndex = 6;
    });
    cumulative += tr.getBoundingClientRect().height;
  });
}
window.applyStickyTableHeaders = applyStickyTableHeaders;
// Extra safety net alongside the ResizeObserver above: webfont swap-in
// (IBM Plex Mono / Inter) doesn't always change a header cell's overall
// box size enough to fire a ResizeObserver, but it can still shift text
// baseline/line-height slightly — re-running once fonts are confirmed
// loaded catches that case too, on whichever machine is still loading
// them when the table first renders.
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(()=> applyStickyTableHeaders(document.getElementById('content')));
}
window.addEventListener('resize', ()=> applyStickyTableHeaders(document.getElementById('content')));

/* Marks-entry keyboard flow: pressing Enter OR Tab in a marks number box
   commits the value (same as clicking away — fires the normal onchange
   handler, which saves and re-renders) and moves focus straight to the
   next marks box, in reading order (previous box for Shift+Tab), instead
   of doing nothing or submitting a form. Tab needs its own explicit
   handling here rather than relying on the browser's native tab order:
   onchange's renderContent() call destroys and rebuilds the whole table
   the instant this box loses focus, so by the time the browser would
   normally move focus to "the next element after this one" that original
   next element no longer exists — focus was landing nowhere. Every marks
   input carries a stable data-markkey identifying its cell
   (course|student|field), so the "next"/"previous" box can be re-found
   even though the table underneath us just got rebuilt. */
document.addEventListener('keydown', function(e){
  if(e.key!=='Enter' && e.key!=='Tab') return;
  const t = e.target;
  if(!(t.tagName==='INPUT' && t.type==='number' && t.dataset.markkey)) return;
  e.preventDefault();
  const boxes = Array.from(document.querySelectorAll('input[type="number"][data-markkey]:not([disabled])'));
  const idx = boxes.indexOf(t);
  const goPrev = e.key==='Tab' && e.shiftKey;
  const targetIdx = goPrev ? idx-1 : idx+1;
  const nextKey = (idx>-1 && targetIdx>=0 && targetIdx<boxes.length) ? boxes[targetIdx].dataset.markkey : null;
  t.blur(); // synchronously fires onchange -> save + renderContent, if the value changed
  if(nextKey){
    const next = document.querySelector(`input[data-markkey="${CSS.escape(nextKey)}"]`);
    if(next){ next.focus(); next.select(); }
  }
});

function handleCourseRegImport(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const batchEl = document.getElementById('cr-import-batch');
  const branchEl = document.getElementById('cr-import-branch');
  const batch = batchEl ? batchEl.value : '';
  const branch = branchEl ? branchEl.value : '';
  ensureXLSXLoaded().then(()=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type:'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });
        App.bulkImportCourseRegistrations(rows, batch, branch);
      }catch(err){
        console.warn(err);
        toast('Could not read that file. Please upload a valid .xlsx, .xls, or .csv file.', 'err');
      }
      input.value = '';
    };
    reader.onerror = ()=>{ toast('Could not read that file.', 'err'); input.value=''; };
    reader.readAsArrayBuffer(file);
  }).catch(err=>{
    toast(err.message || 'Could not load the spreadsheet reader. Check your internet connection and try again.', 'err');
    input.value = '';
  });
}

// Group keys are looked up by index rather than inlined into onclick="..."
// as JSON.stringify'd strings — subject/instructor text routinely contains
// characters (quotes, parens, commas) that broke out of the HTML attribute
// and produced "Uncaught SyntaxError: expected expression, got '}'".
let courseRegGroupIndex = [];
function courseRegGroupsHtml(){
  let entries = App.state.courseRegistrations || [];
  const { batch, branch, semester, q } = courseRegFilter;
  if(batch) entries = entries.filter(r=>r.batch===batch);
  if(branch) entries = entries.filter(r=>r.branch===branch);
  if(semester) entries = entries.filter(r=>r.semester===semester);
  if(q && q.trim()){
    const needle = q.trim().toLowerCase();
    entries = entries.filter(r=>
      r.rollNo.toLowerCase().includes(needle) || r.studentName.toLowerCase().includes(needle) ||
      r.subjectName.toLowerCase().includes(needle) || (r.instructorName||'').toLowerCase().includes(needle) ||
      (r.sectionCode||'').toLowerCase().includes(needle));
  }
  if(!entries.length) return emptyStateHtml('No registrations found', 'Import a spreadsheet above, or adjust the filters/search.');

  // Group: Batch -> Branch -> Semester -> Subject -> Section
  const tree = {};
  entries.forEach(r=>{
    const k1=r.batch, k2=r.branch, k3=r.semester||'—', k4=r.subjectName, k5=r.sectionCode||'—';
    tree[k1]=tree[k1]||{}; tree[k1][k2]=tree[k1][k2]||{}; tree[k1][k2][k3]=tree[k1][k2][k3]||{};
    tree[k1][k2][k3][k4]=tree[k1][k2][k3][k4]||{};
    (tree[k1][k2][k3][k4][k5]=tree[k1][k2][k3][k4][k5]||[]).push(r);
  });

  courseRegGroupIndex = []; // rebuilt fresh each render — indices below match this array
  let html = '';
  Object.keys(tree).sort().forEach(batchKey=>{
    html += `<div class="section-title" style="font-size:15px;margin-top:18px;">${escapeHtml(BATCH_LABELS[batchKey]||batchKey)}</div>`;
    Object.keys(tree[batchKey]).sort().forEach(branchKey=>{
      html += `<div class="branch-heading">${branchLabel(branchKey)}</div>`;
      Object.keys(tree[batchKey][branchKey]).sort().forEach(semKey=>{
        html += `<div class="section-meta" style="margin-top:6px;font-weight:600;">Semester ${escapeHtml(semKey)}</div>`;
        Object.keys(tree[batchKey][branchKey][semKey]).sort().forEach(subjectKey=>{
          const sections = tree[batchKey][branchKey][semKey][subjectKey];
          html += `<div class="card" style="margin-top:8px;">
            <div class="section-title" style="font-size:14px;">${escapeHtml(subjectKey)}</div>
            ${Object.keys(sections).sort().map(secKey=>{
              const list = sections[secKey];
              const instructors = [...new Set(list.map(r=>r.instructorName).filter(Boolean))];
              const idx = courseRegGroupIndex.length;
              courseRegGroupIndex.push({ batch:batchKey, branch:branchKey, semester:semKey, subject:subjectKey, section:secKey });
              const norm = s => String(s||'').trim().toLowerCase();
              const matchedSubj = (App.state.subjects||[]).find(s=>norm(s.name)===norm(subjectKey));
              const matchedCode = matchedSubj ? matchedSubj.code : bizId('SUBJ',[subjectKey],[]).replace(/^SUBJ-/,'');
              const matchedSec = secKey==='—' ? '' : secKey;
              const matchedCourse = (App.state.courses||[]).find(c=>normalizeCode(c.code)===normalizeCode(matchedCode) && c.section===matchedSec && c.branch===branchKey);
              return `<div class="card-row" style="border-top:1px solid var(--rule-light);padding-top:8px;margin-top:8px;flex-wrap:wrap;gap:8px;">
                <div>
                  <div class="section-title" style="font-size:13.5px;">${secKey==='—'?'No section code':'Section '+escapeHtml(secKey)}</div>
                  <div class="section-meta">${instructors.length ? escapeHtml(instructors.join(', ')) : 'No instructor on file'} · ${list.length} student${list.length===1?'':'s'}${matchedCourse ? ` · Activated${matchedCourse.evalType?'':' — ET not fixed'}` : ''}</div>
                </div>
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                  <button class="btn btn-outline btn-sm" onclick="openCourseRegRosterModal(${idx})">View Roster</button>
                  ${matchedCourse ? `<button class="btn btn-outline btn-sm" onclick="App.navigate('hod-review',{courseId:'${matchedCourse.id}'})">Manage Course</button>` : ''}
                  <button class="btn btn-sm" onclick="if(confirm('Create/update the live course section for ${escapeHtml(subjectKey).replace(/'/g,"\\'")} · Section ${secKey==='—'?'—':escapeHtml(secKey).replace(/'/g,"\\'")}, assign ${instructors.length?escapeHtml(instructors.join(', ')).replace(/'/g,"\\'"):'the instructor'} as Course Instructor, and load its roster?')) App.activateCourseRegistrationGroup(${idx})">Activate as Course Section</button>
                </div>
              </div>`;
            }).join('')}
          </div>`;
        });
      });
    });
  });
  return html;
}

function openCourseRegRosterModal(idx){
  const key = courseRegGroupIndex[idx];
  if(!key) return;
  const { batch, branch, semester, subject, section } = key;
  const list = (App.state.courseRegistrations||[]).filter(r=>
    r.batch===batch && r.branch===branch && (r.semester||'—')===semester && r.subjectName===subject && (r.sectionCode||'—')===section
  ).sort((a,b)=>a.rollNo.localeCompare(b.rollNo));
  const instructors = [...new Set(list.map(r=>r.instructorName).filter(Boolean))];
  openModal(`
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <h3>${escapeHtml(subject)}</h3>
    <p class="section-meta" style="margin-top:2px;">${section==='—'?'No section code':'Section '+escapeHtml(section)} · ${branchLabel(branch)} · ${escapeHtml(BATCH_LABELS[batch]||batch)}${semester!=='—'?' · Semester '+escapeHtml(semester):''}</p>
    <p class="section-meta" style="margin-top:2px;">Instructor: ${instructors.length ? escapeHtml(instructors.join(', ')) : '—'}</p>
    <div class="table-scroll" style="margin-top:12px;">
      <table class="data-table"><thead><tr><th>Roll No</th><th>Name</th><th></th></tr></thead><tbody>
        ${list.map(r=>`<tr><td>${escapeHtml(r.rollNo)}</td><td>${escapeHtml(r.studentName)}</td><td><button class="btn btn-red btn-sm" onclick="App.removeCourseRegistration('${r.id}'); closeModal();">Remove</button></td></tr>`).join('')}
      </tbody></table>
    </div>
  `);
}

async function spArchiveToFirebase(fileName, blob, meta) {
  if (!_spFbDb || !_spFbStorage || !_spFirebaseApp || !_spFirebaseApp.auth().currentUser) return;
  try {
    const ref = _spFbStorage.ref().child(`seating-plans/${fileName}`);
    await ref.put(blob);
    const url = await ref.getDownloadURL();
    await _spFbDb.collection("generatedSheets").add({
      fileName,
      url,
      ...meta,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
  } catch (e) {
    console.warn("Firebase archive skipped:", e.message);
  }
}

let _spLibsPromise = null;
function ensureSeatingPlanLibsLoaded(){
  if (_spLibsPromise) return _spLibsPromise;
  const loadScript = (src) => new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('Failed to load ' + src));
    document.head.appendChild(s);
  });
  const need = [];
  if (typeof mammoth === 'undefined') need.push(loadScript('https://cdn.jsdelivr.net/npm/mammoth@1.7.2/mammoth.browser.min.js'));
  if (typeof ExcelJS === 'undefined') need.push(loadScript('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js'));
  if (typeof window.jspdf === 'undefined') {
    need.push(loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js').then(() =>
      loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js')));
  }
  const xlsxNeed = (typeof XLSX === 'undefined') ? ensureXLSXLoaded() : Promise.resolve();
  const fbAuthNeed = (typeof firebase !== 'undefined' && firebase.auth) ? Promise.resolve() : loadScript('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js');
  const fbFirestoreNeed = (typeof firebase !== 'undefined' && firebase.firestore) ? Promise.resolve() : loadScript('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js');
  _spLibsPromise = Promise.all([...need, xlsxNeed, fbAuthNeed, fbFirestoreNeed]);
  return _spLibsPromise;
}

/* =================================================================
   SEAT PATTERN — snake / serpentine numbering in column-groups.
   col 0 (even): top -> bottom   1,2,3,4,5,6,7
   col 1 (odd):  bottom -> top   14,13,...,8
   col 2 (even): top -> bottom   15..21
   ================================================================= */
function seatNumberAt(row, col, rows) {
  const base = col * rows;
  return col % 2 === 0 ? base + row + 1 : base + (rows - row);
}

   Supply exams: register numbers are scattered (e.g. 3, 5, 8, 19) —
   every register number is listed out in full, comma-separated, so
   no student is left out of the circular.
   ================================================================= */
/* =================================================================
   BRANCH / SECTION INFERENCE FROM REGISTER NUMBER
   Register format: YY 011 DEPT[SPEC] NNNN — e.g. 25011CSE0001 (core CSE),
   25011CSEAI0245 (CSE-AIML), 25011CSECS0024 (CSE-Cyber Security),
   25011CSEDS0058 (CSE-Data Science), 25011CSERP0001 (CSE-ERP).
   YY is the admission year and doubles as the regulation (25 -> R25,
   24 -> R24, 26 -> R26...). R24 only ever has plain CSE and CSE (AIML).
   Used only for Room Allocation / Consolidated Seating Plan, where a
   room or a circular row can legitimately mix students from several
   sections and the branch shown needs to reflect who's actually seated
   there, not just the single branch typed into the header.
   ================================================================= */
const REGISTER_SPEC_LABELS = { AI: "CSE-AIML", CS: "CYS", DS: "DS", RP: "ERP" };
function branchFromRegister(register) {
  const m = /^(\d{2})011([A-Z]{3,5})(\d{3,4})$/.exec(String(register || "").trim().toUpperCase());
  if (!m) return null;
  const dept = m[2].slice(0, 3); // e.g. "CSE"
  const spec = m[2].slice(3); // "" | "AI" | "CS" | "DS" | "RP" | ...
  const label = spec ? `${dept} (${REGISTER_SPEC_LABELS[spec] || spec})` : dept;
  return { regulation: `R${m[1]}`, dept, spec, label };
}
// Distinct branch/section labels present among a room's students, in a
// stable order — falls back to the header's Branch field for any
// register number that doesn't match the expected format (manual rosters,
// typos, other departments) so the column is never left blank.
function roomBranchLabel(students) {
  const seen = [];
  (students || []).forEach((s) => {
    const info = branchFromRegister(s.register);
    const label = info ? info.label : state.header.branch;
    if (label && !seen.includes(label)) seen.push(label);
  });
  return seen.join(", ") || state.header.branch;
}

// The "Course Code & Title" header field stays a single free-text input
// (e.g. "24CSEJ402 - Automata and Compiler Design") for every other
// tab/export, exactly as before. The official Attendance Sheet layout
// needs Code and Title in separate grid cells, so this just splits it on
// demand instead of adding a second header field to keep in sync.
function splitCourseCode(combined) {
  const s = String(combined || "");
  const idx = s.indexOf(" - ");
  if (idx === -1) return { code: s, title: "" };
  return { code: s.slice(0, idx), title: s.slice(idx + 3) };
}
const MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
// Parses the app's "DD-MM-YYYY" date field into "Month YYYY" for the
// official attendance sheet's title line ("...EXAMINATIONS – August
// 2026"). Falls back to the raw string if it doesn't match that format
// (e.g. an admin typed something else).
function monthYearFromDate(dateStr) {
  const m = /^(\d{1,2})-(\d{1,2})-(\d{4})$/.exec(String(dateStr || "").trim());
  if (!m) return dateStr || "";
  const monthIdx = parseInt(m[2], 10) - 1;
  const monthName = MONTH_NAMES[monthIdx] || m[2];
  return `${monthName} ${m[3]}`;
}

function computeUrNumbers(students) {
  if (!students.length) return "";
  if (students.length === 1) return students[0].register;

  // Pull the trailing numeric run off each register number (the roll
  // number part) so we can check whether it's a clean +1 sequence.
  const parsed = students.map((s) => {
    const m = String(s.register).match(/(\d+)\s*$/);
    return m ? { prefix: s.register.slice(0, m.index), num: parseInt(m[1], 10), width: m[1].length } : null;
  });

  const isSequential =
    parsed.every((p) => p !== null) &&
    parsed.every((p, i) => i === 0 || (p.prefix === parsed[i - 1].prefix && p.num === parsed[i - 1].num + 1));

  if (isSequential) {
    return `${students[0].register} TO ${students[students.length - 1].register}`;
  }

  // Supply / non-sequential exam — list every register number so the
  // circular reflects exactly who is seated, in the order uploaded.
  return students.map((s) => s.register).join(", ");
}

/* =================================================================
   Push the currently uploaded room's data (Room Wise Seating Plan)
   into the Consolidated Seating Plan table — keeps S.No / Room No /
   No. of Students / UR Numbers / Department matched to real input.
   For regular exams this collapses to "FIRST TO LAST"; for supply
   exams (non-sequential register numbers) every UR number is listed.
   ================================================================= */
function syncRoomToConsolidated() {
  if (!state.students.length) return;
  const h = state.header;
  const row = {
    roomNo: h.roomNo,
    students: state.students.length,
    urNumbers: computeUrNumbers(state.students),
    department: roomBranchLabel(state.students),
  };
  const idx = state.consolidated.rows.findIndex((r) => r.roomNo === h.roomNo);
  if (idx >= 0) state.consolidated.rows[idx] = row;
  else state.consolidated.rows.push(row);
  renderConsolidatedRows();
  if (state.tab === "consolidated") renderPreview();
}

/* =================================================================
   AUTOMATIC ROOM ALLOCATION — splits the full roster (in upload order)
   into rooms of `capacity` students each, so a 500-student upload at the
   default 35/room becomes 15 rooms (35 x14 + 10) with zero manual work.
   Room numbers come from ROOM_SEQUENCE (real, pre-assigned rooms, floor
   by floor, starting at 1106) and only fall back to generated numbers if
   a roster needs more rooms than that list has. Every room number stays
   fully editable afterwards in the Room Allocation tab.
   ================================================================= */
function autoAllocateRooms() {
  if (!state.students.length) return;
  const capInput = document.getElementById("roomCapacity");
  const capacity = Math.max(1, parseInt(capInput.value, 10) || 35);
  state.roomAlloc.capacity = capacity;
  const roomCount = Math.max(1, Math.ceil(state.students.length / capacity));
  const rooms = [];
  for (let i = 0; i < roomCount; i++) {
    const slice = state.students.slice(i * capacity, (i + 1) * capacity).map((s, idx) => ({
      slNo: idx + 1,
      register: s.register,
      name: s.name,
    }));
    if (!slice.length) continue;
    const roomNo = i < ROOM_SEQUENCE.length ? ROOM_SEQUENCE[i] : `EXTRA-${i - ROOM_SEQUENCE.length + 1}`;
    rooms.push({ roomNo, students: slice });
  }
  if (roomCount > ROOM_SEQUENCE.length) {
    toast(`Only ${ROOM_SEQUENCE.length} default rooms are configured — the extra room(s) are labelled EXTRA-1, EXTRA-2... Edit their Room No in the Room Allocation tab to match real rooms.`, "err");
  }
  state.roomAlloc.rooms = rooms;
  state.roomAlloc.activeIndex = 0;
  renderRoomAllocList();
  syncAllRoomsToConsolidated();
  if (state.tab === "rooms" || state.tab === "roster" || state.tab === "seating" || state.tab === "seatingPlan") renderPreview();
}
document.getElementById("autoAllocateBtn").addEventListener("click", autoAllocateRooms);

/* =================================================================
   ROOM PAGER — the Attendance Sheet / Room Wise Seating Plan / Seating
   Plan previews each show one room (35 students) at a time instead of
   trying to cram the whole roster into a single room-sized layout.
   currentRoom()/activeRoomStudents() feed that single room's data into
   the existing render/export code; roomPagerHtml()/wireRoomPager() add
   the "Prev / Next Room" controls above the preview.
   ================================================================= */
function currentRoom() {
  const rooms = state.roomAlloc.rooms;
  if (!rooms.length) return null;
  const idx = Math.min(Math.max(0, state.roomAlloc.activeIndex), rooms.length - 1);
  state.roomAlloc.activeIndex = idx;
  return rooms[idx];
}
function activeRoomStudents() {
  const room = currentRoom();
  return room ? room.students : state.students;
}
function roomPagerHtml() {
  const rooms = state.roomAlloc.rooms;
  if (!rooms.length) return "";
  const idx = state.roomAlloc.activeIndex;
  const room = rooms[idx];
  return `
  <div class="room-pager no-print">
    <button type="button" id="roomPagerPrev" class="room-pager-btn" ${idx === 0 ? "disabled" : ""}>&#8249; Prev Room</button>
    <span class="room-pager-label">Room ${idx + 1} of ${rooms.length} &middot; Room No <b>${escapeHtml(room.roomNo)}</b> &middot; ${room.students.length} student(s)</span>
    <button type="button" id="roomPagerNext" class="room-pager-btn" ${idx === rooms.length - 1 ? "disabled" : ""}>Next Room &#8250;</button>
  </div>`;
}
function wireRoomPager() {
  const prev = document.getElementById("roomPagerPrev");
  const next = document.getElementById("roomPagerNext");
  if (prev) prev.addEventListener("click", () => { state.roomAlloc.activeIndex = Math.max(0, state.roomAlloc.activeIndex - 1); renderPreview(); });
  if (next) next.addEventListener("click", () => { state.roomAlloc.activeIndex = Math.min(state.roomAlloc.rooms.length - 1, state.roomAlloc.activeIndex + 1); renderPreview(); });
}

/* Rebuilds the Consolidated Seating Plan's room rows from EVERY
   auto-allocated room (not just the currently-paged one), so uploading
   500 students immediately shows all ~15 rooms in the circular without
   the admin needing to click "Add/Update" once per room. Department is
   inferred per-room from register numbers (roomBranchLabel) so a room
   seating a mix of sections shows "CSE, CSE (AIML)" etc. instead of a
   single fixed branch. */
function syncAllRoomsToConsolidated() {
  state.roomAlloc.rooms.forEach((room) => {
    const row = {
      roomNo: room.roomNo,
      students: room.students.length,
      urNumbers: computeUrNumbers(room.students),
      department: roomBranchLabel(room.students),
    };
    const idx = state.consolidated.rows.findIndex((r) => r.roomNo === room.roomNo);
    if (idx >= 0) state.consolidated.rows[idx] = row;
    else state.consolidated.rows.push(row);
  });
  renderConsolidatedRows();
  if (state.tab === "consolidated") renderPreview();
}

function renderRoomAllocList() {
  const container = document.getElementById("roomAllocRows");
  const rooms = state.roomAlloc.rooms;
  if (!rooms.length) {
    container.innerHTML = `<p class="hint" style="margin:0;">Upload a roster on the Attendance Sheet tab, then click "Auto-Allocate Rooms" above.</p>`;
    document.getElementById("roomAllocTotal").textContent = "";
    document.getElementById("downloadAllAttendanceBtn").disabled = true;
    return;
  }
  container.innerHTML = rooms
    .map(
      (r, i) => `
    <div class="room-row" style="flex-wrap:wrap;">
      <input class="rn" placeholder="Room No" data-room-i="${i}" value="${escapeHtml(r.roomNo)}" />
      <span style="flex:1 1 auto;font-family:sans-serif;font-size:11px;color:var(--muted);">${r.students.length} student(s) &middot; ${escapeHtml(roomBranchLabel(r.students))}</span>
      <button type="button" class="room-remove" data-dl-room="${i}" title="Download this room's Attendance Sheet (.pdf)" style="background:var(--green);">⬇</button>
    </div>`
    )
    .join("");
  const total = rooms.reduce((sum, r) => sum + r.students.length, 0);
  document.getElementById("roomAllocTotal").textContent = `${rooms.length} room(s) · ${total} student(s) total`;
  document.getElementById("downloadAllAttendanceBtn").disabled = false;
}

document.getElementById("roomAllocRows").addEventListener("input", (e) => {
  const i = e.target.dataset.roomI;
  if (i === undefined) return;
  state.roomAlloc.rooms[Number(i)].roomNo = e.target.value;
  if (state.tab === "rooms") renderPreview();
});
document.getElementById("roomAllocRows").addEventListener("click", (e) => {
  const i = e.target.dataset.dlRoom;
  if (i === undefined) return;
  downloadRoomAttendancePdf(Number(i));
});
document.getElementById("downloadAllAttendanceBtn").addEventListener("click", () => {
  // Sequential downloads — jsPDF's doc.save() triggers one browser download
  // per call, so a short stagger keeps the browser from silently dropping
  // some of them the way near-simultaneous downloads sometimes get blocked.
  state.roomAlloc.rooms.forEach((_, i) => setTimeout(() => downloadRoomAttendancePdf(i), i * 400));
});

/* Draws one small bordered "label | value | label | value..." row —
   shared by the info grid and the Present/Absent/Detained/Malpractice
   tally box below the roll table. Thick (1.1pt) solid black borders to
   match the on-screen .info-grid / .totals-grid CSS and the printed
   original (the old thin, near-invisible autoTable default was the bug
   the screenshot showed). */
function drawGridRow(doc, x, y, height, cells) {
  doc.setLineWidth(1.1);
  doc.setDrawColor(0, 0, 0);
  let cx = x;
  cells.forEach((cell) => {
    if (cell.fill) {
      doc.setFillColor(239, 232, 216);
      doc.rect(cx, y, cell.width, height, "FD");
    } else {
      doc.rect(cx, y, cell.width, height);
    }
    doc.setFont("helvetica", cell.bold ? "bold" : "normal");
    doc.setFontSize(8.5);
    doc.setTextColor(0, 0, 0);
    const textY = y + height / 2 + 2.7;
    doc.text(String(cell.text || ""), cx + 6, textY);
    cx += cell.width;
  });
}

/* Draws the full official "Attendance Sheet for Semester End
   Examinations" page for ONE room onto whatever page of `doc` is
   currently active — Sheet Number, logo, title, the Degree/Branch/Hall
   No / Course Code/Title / Semester/Date/Session info grid, the roll
   table padded to a full room's capacity (35 by default), the
   Present/Absent/Detained/Malpractice tally, and the two signature
   lines. Matches the university's real printed sheet (the uploaded
   example) instead of the old simplified letterhead. Called once per
   room by both the single-room download (Room Allocation tab) and the
   bulk all-rooms PDF (Attendance Sheet tab) — see below.

   Every measurement here was verified with a real headless render
   (35 students, longest realistic values) to confirm the whole sheet —
   header, all 35 rows, and the totals/signature footer — fits on ONE
   A4 page with room to spare, since the previous version's row heights
   silently overflowed onto a mostly-blank second page. The info grid
   also reuses the SAME six column widths (colA..colF) for row 1 and
   row 3, with row 2's "Course Title" cell spanning D+E+F, so every
   vertical divider lines up across all three rows instead of drifting
   row to row. */
function drawOfficialAttendancePage(doc, room) {
  const h = state.header;
  const pageWidth = doc.internal.pageSize.getWidth();
  const marginX = 36;
  const contentWidth = pageWidth - marginX * 2;
  const capacity = state.roomAlloc.capacity || 35;
  const { code: courseCode, title: courseTitle } = splitCourseCode(h.courseCode);
  const branch = roomBranchLabel(room.students);

  const logoW = 84, logoH = 30;
  doc.addImage(UNIVERSITY_LOGO_BASE64, "PNG", pageWidth / 2 - logoW / 2, 4, logoW, logoH);

  doc.setFont("helvetica", "bold");
  doc.setFontSize(12);
  doc.setTextColor(0, 0, 0);
  doc.text(h.attendanceTitle, pageWidth / 2, 46, { align: "center" });

  // Shared column widths — row 1 and row 3 both use all six; row 2 merges
  // colD+colE+colF into one wide "Course Title" value cell.
  const colA = 78, colB = 96, colC = 86, colD = 92, colE = 72;
  const colF = contentWidth - (colA + colB + colC + colD + colE);

  let y = 58;
  const rowH = 18;
  drawGridRow(doc, marginX, y, rowH, [
    { text: "Degree", width: colA, bold: true, fill: true },
    { text: h.degree, width: colB },
    { text: "Branch", width: colC, bold: true, fill: true },
    { text: branch, width: colD },
    { text: "Hall No.", width: colE, bold: true, fill: true },
    { text: room.roomNo, width: colF },
  ]);
  y += rowH;
  drawGridRow(doc, marginX, y, rowH, [
    { text: "Course Code", width: colA, bold: true, fill: true },
    { text: courseCode, width: colB },
    { text: "Course Title", width: colC, bold: true, fill: true },
    { text: courseTitle, width: colD + colE + colF },
  ]);
  y += rowH;
  drawGridRow(doc, marginX, y, rowH, [
    { text: "Semester", width: colA, bold: true, fill: true },
    { text: h.semester, width: colB },
    { text: "Date of Exam", width: colC, bold: true, fill: true },
    { text: h.date, width: colD },
    { text: "Session", width: colE, bold: true, fill: true },
    { text: h.session, width: colF },
  ]);
  y += rowH + 6;

  const body = room.students.map((s) => [String(s.slNo), s.register, s.name, "", ""]);
  for (let i = room.students.length; i < capacity; i++) body.push(["", "", "", "", ""]);

  doc.autoTable({
    head: [["Sl.No", "Register Number", "Name of the Student", "Answer Booklet\nSerial Number", "Signature of Student"]],
    body,
    startY: y,
    theme: "grid",
    margin: { left: marginX, right: marginX, bottom: 60 },
    tableLineColor: [0, 0, 0],
    tableLineWidth: 1.1,
    styles: { fontSize: 8.3, halign: "center", valign: "middle", cellPadding: 3, fontStyle: "bold", textColor: [0, 0, 0], lineColor: [0, 0, 0], lineWidth: 0.9 },
    columnStyles: { 1: { halign: "left" }, 2: { halign: "left" } },
    headStyles: { fillColor: [239, 232, 216], textColor: [0, 0, 0], fontStyle: "bold", lineColor: [0, 0, 0], lineWidth: 1 },
  });

  let ty = doc.lastAutoTable.finalY + 3;
  doc.setLineWidth(1.1);
  doc.setDrawColor(0, 0, 0);
  doc.setFillColor(239, 232, 216);
  doc.rect(marginX, ty, contentWidth, 14, "FD");
  doc.setFont("helvetica", "bold");
  doc.setFontSize(9);
  doc.text("Total Number of Candidates", pageWidth / 2, ty + 10, { align: "center" });
  ty += 14;

  const pairW = contentWidth / 4;
  const labelW = pairW * 0.42;
  const valueW = pairW * 0.58;
  drawGridRow(doc, marginX, ty, 22, [
    { text: "Present", width: labelW, bold: true, fill: true },
    { text: "", width: valueW },
    { text: "Absent", width: labelW, bold: true, fill: true },
    { text: "", width: valueW },
    { text: "Detained", width: labelW, bold: true, fill: true },
    { text: "", width: valueW },
    { text: "Malpractice", width: labelW, bold: true, fill: true },
    { text: "", width: contentWidth - (labelW + valueW) * 3 - labelW },
  ]);
  ty += 22;

  // Signature row lives INSIDE the same bordered footer box as the tally
  // row above it (continuous border, no gap) — matching the reference
  // sheet, where "Total Number of Candidates" / the tally / the two
  // signature lines are one continuous bordered block, not a bordered
  // tally with free-floating text underneath. Tall row with the labels
  // sitting near the bottom leaves blank space above for an actual pen
  // signature, split into two halves by a vertical divider.
  const sigRowH = 46;
  doc.setLineWidth(1.1);
  doc.setDrawColor(0, 0, 0);
  doc.rect(marginX, ty, contentWidth, sigRowH);
  doc.line(marginX + contentWidth / 2, ty, marginX + contentWidth / 2, ty + sigRowH);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(9.5);
  doc.text("Name & Signature Hall Superintendent", marginX + contentWidth / 4, ty + sigRowH - 10, { align: "center" });
  doc.text("Signature of Chief Superintendent", marginX + (contentWidth * 3) / 4, ty + sigRowH - 10, { align: "center" });
}

/* Builds one room's Attendance Sheet as a standalone jsPDF document
   (used by the Room Allocation tab's per-room download button). */
function buildRoomAttendancePdfDoc(room) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "portrait", unit: "pt", format: "a4" });
  drawOfficialAttendancePage(doc, room);
  return doc;
}

function downloadRoomAttendancePdf(idx) {
  const room = state.roomAlloc.rooms[idx];
  if (!room) return;
  const doc = buildRoomAttendancePdfDoc(room);
  const fileName = `Attendance_Room${room.roomNo || idx + 1}.pdf`;
  doc.save(fileName);
  spArchiveToFirebase(fileName, doc.output("blob"), { type: "attendance-room-pdf", header: state.header, roomNo: room.roomNo });
}

FIELD_DEFS.forEach((f) => {

/* =================================================================
   FILE UPLOAD + DOCX PARSING (Mammoth)
   ================================================================= */
const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");
document.getElementById("chooseBtn").onclick = () => fileInput.click();

["dragover", "dragleave", "drop"].forEach((evt) =>
  dropzone.addEventListener(evt, (e) => {
    e.preventDefault();
    dropzone.classList.toggle("dragover", evt === "dragover");
  })
);
dropzone.addEventListener("drop", (e) => handleFile(e.dataTransfer.files[0]));
fileInput.addEventListener("change", (e) => handleFile(e.target.files[0]));

async function handleFile(file) {
  if (!file) return;
  const statusEl = document.getElementById("fileStatus");
  statusEl.textContent = "Reading…";
  statusEl.className = "status";
  try {
    const students = await parseRosterDocx(file);
    state.students = students;
    statusEl.textContent = `Imported ${students.length} students from "${file.name}".`;
    statusEl.className = "status ok";
    document.getElementById("studentCount").textContent = students.length;
    ["exportAttendance", "exportAttendancePdf", "exportSeatingXlsx", "exportSeatingPdf", "exportSeatingPlanXlsx", "exportSeatingPlanPdf", "syncConsolidatedBtn", "autoAllocateBtn"].forEach(
      (id) => (document.getElementById(id).disabled = false)
    );
    // autoAllocateRooms() below now also rebuilds the Consolidated
    // Seating Plan (via syncAllRoomsToConsolidated), covering every room
    // at once — no need for the old single-room syncRoomToConsolidated()
    // call here, which only ever synced whatever one roomNo happened to
    // be in the header field.
    autoAllocateRooms();
    renderPreview();
  } catch (e) {
    statusEl.textContent = e.message || "Could not read this .docx file.";
    statusEl.className = "status err";
  }
}

async function parseRosterDocx(file) {
  const arrayBuffer = await file.arrayBuffer();
  const { value: html } = await mammoth.convertToHtml({ arrayBuffer });
  const doc = new DOMParser().parseFromString(html, "text/html");
  const table = doc.querySelector("table");
  if (!table) throw new Error("No table found in this document.");

  const rows = Array.from(table.querySelectorAll("tr")).map((tr) =>
    Array.from(tr.querySelectorAll("td,th")).map((td) => td.textContent.trim())
  );
  if (rows.length < 2) throw new Error("Table has no data rows.");

  const header = rows[0].map((h) => h.toLowerCase());
  const regIdx = header.findIndex((h) => h.includes("regist"));
  const nameIdx = header.findIndex((h) => h.includes("name"));
  if (regIdx === -1 || nameIdx === -1) {
    throw new Error("Couldn't find Register Number / Name columns in the table header.");
  }

  const students = [];
  rows.slice(1).forEach((cells) => {
    const register = (cells[regIdx] || "").trim();
    const name = (cells[nameIdx] || "").trim();
    if (!register && !name) return;
    students.push({ slNo: students.length + 1, register, name });
  });
  if (!students.length) throw new Error("No student rows detected — check the file format.");
  return students;
}

function switchTab(tab) {

function getRowsPerCol() {
  return Math.max(1, Number(document.getElementById("rowsPerCol").value) || 7);
}

/* Fixed number of seat boxes to draw for the room — independent of how
   many students were actually uploaded. Unfilled boxes render as
   numbered-but-empty ("vacant") seats. Defaults to 35. */
function getTotalSeats() {
  const fromField = Number(document.getElementById("totalSeats").value);
  return Math.max(1, fromField || 35);
}

function seatTableHtml(rowsPerCol, cols) {
  const totalSeats = getTotalSeats();
  const roomStudents = activeRoomStudents();
  let html = `<table class="sheet"><thead><tr>`;
  for (let c = 0; c < cols; c++) html += `<th>Seat No</th><th>UR Number</th>`;
  html += `</tr></thead><tbody>`;
  for (let r = 0; r < rowsPerCol; r++) {
    html += "<tr>";
    for (let c = 0; c < cols; c++) {
      const seatNo = seatNumberAt(r, c, rowsPerCol);
      const isBox = seatNo <= totalSeats;
      const st = isBox && seatNo <= roomStudents.length ? roomStudents[seatNo - 1] : null;
      if (!isBox) {
        html += `<td></td><td></td>`;
      } else if (st) {
        html += `<td>${seatNo}</td><td>${escapeHtml(st.register)}</td>`;
      } else {
        html += `<td>${seatNo}</td><td></td>`;
      }
    }
    html += "</tr>";
  }
  html += `</tbody></table>`;
  return html;
}

/* Two items per line, normal "comma + space" spacing (no big column
   gap) — e.g. "25011CSEAI0030, 25011CSEAI0064," then a line break. */
function urNumbersGridHtml(urString) {
  if (!urString) return "";
  const parts = urString.split(",").map((p) => p.trim()).filter(Boolean);
  if (parts.length <= 1) return escapeHtml(urString);
  const lines = [];
  for (let i = 0; i < parts.length; i += 2) {
    const pair = parts.slice(i, i + 2);
    const isLast = i + 2 >= parts.length;
    lines.push(escapeHtml(pair.join(", ")) + (isLast ? "" : ","));
  }
  return lines.join("<br>");
}

function renderConsolidatedPreview(body) {
  const c = state.consolidated;

    return;
  }

  let html = `<div class="doc-header-left">`;
  html += `<div class="doc-date">Date: ${escapeHtml(c.circularDate)}</div>`;
  html += `<img class="doc-logo-sm" src="${UNIVERSITY_LOGO_BASE64}" alt="${escapeHtml(state.header.institution)} logo" />`;
  html += `</div>`;
  html += `<div class="doc-circular-title">CIRCULAR</div>`;
  html += `<div class="doc-center-bold">${escapeHtml(c.examTitle)}</div>`;
  html += `<div class="doc-center-bold">CONSOLIDATED SEATING PLAN</div>`;
  html += `<div class="doc-center-bold">Date of Examinations : ${escapeHtml(c.examDate)}</div>`;
  html += `<div class="doc-center-bold">Timings: ${escapeHtml(c.timings)}</div>`;
  html += `<table class="sheet" style="margin-top:16px;width:100%;table-layout:fixed;"><colgroup><col style="width:6%"><col style="width:10%"><col style="width:14%"><col style="width:36%"><col style="width:34%"></colgroup><thead><tr><th>S.No</th><th>Room. No</th><th>No. of Students</th><th>UR Numbers</th><th>Department</th></tr></thead><tbody>`;
  rows.forEach((r, i) => {
    html += `<tr><td>${i + 1}</td><td>${escapeHtml(r.roomNo)}</td><td>${escapeHtml(String(r.students))}</td><td class="left wrap">${urNumbersGridHtml(r.urNumbers)}</td><td>${escapeHtml(r.department)}</td></tr>`;
  });
  html += `<tr><td class="total-label" colspan="2">Total</td><td class="total-label">${total}</td><td></td><td></td></tr>`;
  html += `<tr><td colspan="5" class="left wrap">Note: All students are instructed to be seated in their respective exam hall 10min. before the commencement of exam.</td></tr>`;
  html += `</tbody></table>`;
  html += `<div class="doc-sig-row" style="justify-content:flex-end;"><span>Chief Superintendent</span></div>`;
  body.innerHTML = html;
}

function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

document.getElementById("exportAttendance").onclick = () => {

  const wb = XLSX.utils.book_new();
  rooms.forEach((room) => {
    const title = [
      [h.institution],
      [h.attendanceTitle],
      [`Degree: ${h.degree}        Branch: ${roomBranchLabel(room.students)}        Hall No: ${room.roomNo}`],
      [`Course Code: ${courseCode}        Course Title: ${courseTitle}`],
      [`Semester: ${h.semester}        Date of Exam: ${h.date}        Session: ${h.session}        Cover No: ${h.coverNo || ""}`],
      [],
      ["Sl.No", "Register Number", "Name of the Student", "Answer Booklet Serial Number", "Signature of Student"],
    ];
    const body = room.students.map((s) => [s.slNo, s.register, s.name, "", ""]);
    const ws = XLSX.utils.aoa_to_sheet([...title, ...body]);
    ws["!merges"] = [0, 1, 2, 3, 4].map((r) => ({ s: { r, c: 0 }, e: { r, c: 4 } }));
    ws["!cols"] = [{ wch: 8 }, { wch: 22 }, { wch: 34 }, { wch: 26 }, { wch: 22 }];
    const sheetName = `Room ${room.roomNo}`.replace(/[\\/?*[\]:]/g, "").slice(0, 31);
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
  });
  const fileName = `Attendance_AllRooms_${rooms.length}rooms.xlsx`;
  XLSX.writeFile(wb, fileName);

  const blob = new Blob([XLSX.write(wb, { bookType: "xlsx", type: "array" })], {
    type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",

  spArchiveToFirebase(fileName, blob, { type: "attendance", header: h });
};

document.getElementById("exportSeatingXlsx").onclick = () => {
  const h = state.header;
  const rowsPerCol = getRowsPerCol();

  const cols = Math.max(1, Math.ceil(totalSeats / rowsPerCol));
  const rooms = state.roomAlloc.rooms.length ? state.roomAlloc.rooms : [{ roomNo: h.roomNo, students: state.students }];

  const headRow = [];
  for (let c = 0; c < cols; c++) headRow.push("Seat No", "UR Number");
  const lastCol = headRow.length - 1;

  const wb = XLSX.utils.book_new();
  rooms.forEach((room) => {
    const title = [
      [h.institution],
      [h.examTitle],
      [`Room No : ${room.roomNo}`],
      [`Date:${h.date}`],
      [`Course Code & Title : ${h.courseCode}`],
      [`Branch: ${roomBranchLabel(room.students)}        Time: ${h.time}`],
      ["SEATING PLAN"],
      [],
      headRow,
    ];
    const titleRowCount = title.length;

    const body = [];
    for (let r = 0; r < rowsPerCol; r++) {
      const line = [];
      for (let c = 0; c < cols; c++) {
        const seatNo = seatNumberAt(r, c, rowsPerCol);
        const isBox = seatNo <= totalSeats;
        const st = isBox && seatNo <= room.students.length ? room.students[seatNo - 1] : null;
        if (!isBox) line.push("", "");
        else line.push(seatNo, st ? st.register : "");
      }
      body.push(line);
    }
    const signatureRowIdx = titleRowCount + rowsPerCol + 1; // blank row, then signature
    const signatureRow = Array(headRow.length).fill("");
    signatureRow[lastCol] = "Signature of Chief Superintendent";

    const ws = XLSX.utils.aoa_to_sheet([...title, ...body, [], signatureRow]);
    ws["!merges"] = [0, 1, 2, 3, 4, 5, 6].map((r) => ({ s: { r, c: 0 }, e: { r, c: lastCol } }));
    ws["!merges"].push({ s: { r: signatureRowIdx, c: Math.max(0, lastCol - 1) }, e: { r: signatureRowIdx, c: lastCol } });
    ws["!cols"] = Array(headRow.length).fill({ wch: 14 });
    const sheetName = `Room ${room.roomNo}`.replace(/[\\/?*[\]:]/g, "").slice(0, 31);
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
  });

  const fileName = `SeatingPlan_AllRooms_${rooms.length}rooms.xlsx`;
  XLSX.writeFile(wb, fileName);

  const blob = new Blob([XLSX.write(wb, { bookType: "xlsx", type: "array" })], {
    type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
  });
  spArchiveToFirebase(fileName, blob, { type: "seating", header: h });
};

   ================================================================= */
/* Trigger a browser download for a Blob (used by ExcelJS-based exports,
   which don't have XLSX.writeFile's built-in save helper). */
function downloadBlob(blob, fileName) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

   EXPORT: Consolidated Seating Plan .xlsx / .pdf
   ================================================================= */
/* Two-column text version of a UR Numbers string, for PDF/Excel exports
   where CSS columns aren't available — breaks the line every 2 register
   numbers so it prints the same way it looks on screen. */
function urNumbersTwoColumnText(urString) {
  if (!urString) return "";
  const parts = urString.split(",").map((p) => p.trim()).filter(Boolean);
  const lines = [];
  for (let i = 0; i < parts.length; i += 2) {
    lines.push(parts.slice(i, i + 2).join(", "));
  }
  return lines.join("\n");
}

// mammoth.js (docx->HTML) is only used here and by the Seating Plan tool,
// loaded on demand the first time it's actually needed — same lazy-load
// pattern as ensureXLSXLoaded elsewhere in this file.
let _mammothLoadPromise = null;
function ensureMammothLoaded(){
  if(typeof mammoth !== 'undefined') return Promise.resolve();
  if(_mammothLoadPromise) return _mammothLoadPromise;
  _mammothLoadPromise = new Promise((resolve, reject)=>{
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/mammoth@1.7.2/mammoth.browser.min.js';
    script.onload = () => resolve();
    script.onerror = () => { _mammothLoadPromise = null; reject(new Error('Failed to load the document reader.')); };
    document.head.appendChild(script);
  });
  return _mammothLoadPromise;
}
/* Flexible Roll No / Student Name column matcher for the xlsx/csv path
   (object-per-row, via SheetJS) — same tolerant header matching as
   App.importCourseRosterRows uses for its own Roll No/Name columns. The
   docx path (table-cell-array, via mammoth) is matched separately inline
   below since it has no header-object to work from. */
function extractRosterRowsFromObjects(objRows){
  if(!objRows.length) return [];
  const keys = Object.keys(objRows[0]||{});
  const findKey = (re) => keys.find(k=>re.test(String(k).trim()));
  const rollKey = findKey(/roll/i);
  const nameKey = findKey(/name/i);
  if(!rollKey) return [];
  return objRows.map(row=>({ rollNo:String(row[rollKey]||'').trim(), name: nameKey ? String(row[nameKey]||'').trim() : '' })).filter(r=>r.rollNo);
}
function handleRosterAssignmentImport(input, courseId, itemKey, selectId){
  const file = input.files && input.files[0];
  if(!file) return;
  const facultyEmail = document.getElementById(selectId)?.value || '';
  if(!facultyEmail){ toast('Pick a faculty to assign these students to first.', 'err'); input.value=''; return; }
  const isDocx = /\.docx$/i.test(file.name);
  const finish = (rows) => {
    if(!rows.length){ toast('Could not find Roll No / Name columns in that file.', 'err'); input.value=''; return; }
    App.setItemRosterOverride(courseId, itemKey, facultyEmail, rows, file.name);
    input.value = '';
  };
  if(isDocx){
    ensureMammothLoaded().then(()=>file.arrayBuffer()).then(arrayBuffer=>mammoth.convertToHtml({arrayBuffer})).then(({value:html})=>{
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const table = doc.querySelector('table');
      if(!table){ toast('No table found in that document.', 'err'); input.value=''; return; }
      const tableRows = Array.from(table.querySelectorAll('tr')).map(tr=>Array.from(tr.querySelectorAll('td,th')).map(td=>td.textContent.trim()));
      if(tableRows.length<2){ toast('That table has no data rows.', 'err'); input.value=''; return; }
      const header = tableRows[0].map(h=>h.toLowerCase());
      const rollIdx = header.findIndex(h=>/roll/.test(h));
      const nameIdx = header.findIndex(h=>/name/.test(h));
      if(rollIdx===-1){ toast('Couldn\'t find a Roll No column in that table.', 'err'); input.value=''; return; }
      const rows = tableRows.slice(1).map(cells=>({ rollNo:(cells[rollIdx]||'').trim(), name: nameIdx>-1 ? (cells[nameIdx]||'').trim() : '' })).filter(r=>r.rollNo);
      finish(rows);
    }).catch(err=>{ toast(err.message || 'Could not read that .docx file.', 'err'); input.value=''; });
  } else {
    ensureXLSXLoaded().then(()=>{
      const reader = new FileReader();
      reader.onload = (e)=>{
        try{
          const data = new Uint8Array(e.target.result);
          const wb = XLSX.read(data, { type:'array' });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const objRows = XLSX.utils.sheet_to_json(sheet, { defval:'' });
          finish(extractRosterRowsFromObjects(objRows));
        }catch(err){
          console.warn(err);
          toast('Could not read that file. Please upload a valid .xlsx, .xls, .csv, or .docx file.', 'err');
          input.value='';
        }
      };
      reader.onerror = ()=>{ toast('Could not read that file.', 'err'); input.value=''; };
      reader.readAsArrayBuffer(file);
    }).catch(err=>{
      toast(err.message || 'Could not load the spreadsheet reader. Check your internet connection and try again.', 'err');
      input.value = '';
    });
  }
}
window.handleRosterAssignmentImport = handleRosterAssignmentImport;
