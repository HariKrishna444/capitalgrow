/* ---------- CI: single-component marks entry. One page per row of the
   Evaluation Type table (SIA, Practical Internal Test, Lab Performance,
   Project Assessment, SEE Practical, etc.) — deliberately NOT mixed
   together, so entering one component never touches another's marks. Term
   Test 1/2 have their own dedicated page (renderCITermTestEntry) and are
   not routed here. ---------- */
function renderCIComponentEntry(params){
  const course = App.getCourse(params.courseId);
  const wrap = el('<div></div>');
  const backBtn = `<button class="ghost-btn no-print" style="color:var(--ink);border-color:var(--rule);margin-bottom:14px;" onclick="App.navigate('ci-subject-detail',{courseId:'${params.courseId}'})">← Back to ${escapeHtml(course ? course.name : 'subject')}</button>`;
  if(!course || !course.evalType){ wrap.innerHTML = `<div class="page-head">${backBtn}</div>${emptyStateHtml('Not available','This section has no Evaluation Type fixed yet.')}`; return wrap; }
  const template = getCourseTemplate(course);
  const section = params.section==='see' ? 'see' : 'cie';
  const list = section==='cie' ? template.cie : seeDisplayComponents(template);
  const comp = list.find(c=>c.key===params.compKey);
  if(!comp){ wrap.innerHTML = `<div class="page-head">${backBtn}</div>${emptyStateHtml('Component not found','')}`; return wrap; }

  // Which HOD-approval group (if any) this component belongs to, per the
  // fixed institutional rule: Term Test 1/2 + Lab Internal submit together
  // ("ttlab"); Lab External submits on its own ("labext"); everything else
  // needs no approval and stays editable straight through.
  const ttlabKeys = new Set(ttLabApprovalComponents(template).map(c=>c.key));
  const labextKeys = new Set(labExternalApprovalComponents(template).map(c=>c.key));
  const group = ttlabKeys.has(comp.key) ? 'ttlab' : labextKeys.has(comp.key) ? 'labext' : null;
  const statusField = group==='ttlab' ? 'ttLabApproval' : group==='labext' ? 'labExternalApproval' : null;
  const groupStatus = statusField ? course[statusField] : null;
  const locked = groupStatus === 'approved';
  const correctionMode = course.status==='approved' && course.editUnlocked;
  const editable = (course.status==='draft' || correctionMode) && !locked;

  const badge = group ? (
    locked ? `<span class="status-pill status-approved">Approved by HOD — locked</span>`
    : groupStatus==='pending' ? `<span class="status-pill status-submitted">Pending HOD approval</span>`
    : `<span class="status-pill status-draft">Not yet submitted</span>`
  ) : '';
  const groupNote = group==='ttlab'
    ? `Part of the "Term Test &amp; Lab Internal" group submitted together to the HOD — Term Test 1/2 are entered on their own pages; this is the Lab Internal piece.`
    : group==='labext'
    ? `Submitted to the HOD on its own, separately from the rest of CIE.`
    : `No HOD approval needed here — scaled straight into the ${section==='cie'?'CIE':'SEE'} total as soon as you enter it.`;
  const submitBtn = (group && editable && groupStatus!=='pending')
    ? `<button class="btn btn-sm" style="margin-top:14px;" onclick="App.submitApprovalGroup('${course.id}','${group}')">Submit ${group==='ttlab'?'Term Test &amp; Lab Internal':'Lab External'} for HOD Approval</button>`
    : '';

  const bodyHtml = comp.key==='sia' ? siaEntryHtml(course, comp, editable) : (()=>{
    const rows = course.students.map(s=>{
      const val = s.marks[comp.key];
      const overMax = typeof val==='number' && (val>comp.rawMax || val<0);
      const scaled = typeof val==='number' ? round1((Math.min(val,comp.rawMax)/comp.rawMax)*comp.scaledMax) : '—';
      return `<tr>
        <td>${escapeHtml(s.name)}</td>
        <td><input type="number" min="0" max="${comp.rawMax}" step="0.5"
          class="${overMax?'invalid':''}"
          data-markkey="${course.id}|${s.id}|${comp.key}"
          value="${val===undefined||val===null?'':val}" placeholder="/${comp.rawMax}"
          ${editable?'':'disabled'}
          onchange="onMarkChange(this)"></td>
        <td class="total-cell">${scaled}<span class="mono" style="font-weight:400;color:var(--text-soft);font-size:11px;">/${comp.scaledMax}</span></td>
      </tr>`;
    }).join('');
    return `<div class="table-scroll"><table class="data-table"><thead><tr><th>Student</th><th>${escapeHtml(comp.label)}<br><span style="text-transform:none;">max ${comp.rawMax}</span></th><th>Scaled<br><span style="text-transform:none;">max ${comp.scaledMax}</span></th></tr></thead><tbody>${rows}</tbody></table></div>`;
  })();

  wrap.innerHTML = `
    <div class="page-head">
      ${backBtn}
      <div class="page-eyebrow">${section==='cie'?'CIE':'SEE'} · ${escapeHtml(comp.label)}</div>
      <h2>${escapeHtml(course.name)}</h2>
      <p>Course Code: <strong>${escapeHtml(course.code)}</strong> · Section ${course.section} ${statusPill(course)} ${etPill(course)}</p>
    </div>
    <div class="card">
      <p class="section-meta" style="margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        ${escapeHtml(comp.label)} — raw /${comp.rawMax} scaled to /${comp.scaledMax}. ${groupNote} ${badge}
      </p>
      ${bodyHtml}
      ${submitBtn}
    </div>
  `;
  return wrap;
}
/* ---------- CI: read-only roll-up of one section (CIE, SEE, or the
   combined Total) — reached via "View CIE Marks" / "View SEE Marks" /
   "View Total Marks". Marks entry itself never happens here; it's split
   across the per-component pages above, this is only for seeing every
   component side by side once they're all in. ---------- */
function renderCISectionView(params){
  const course = App.getCourse(params.courseId);
  const wrap = el('<div></div>');
  const backBtn = `<button class="ghost-btn no-print" style="color:var(--ink);border-color:var(--rule);margin-bottom:14px;" onclick="App.navigate('ci-subject-detail',{courseId:'${params.courseId}'})">← Back to ${escapeHtml(course ? course.name : 'subject')}</button>`;
  if(!course || !course.evalType){ wrap.innerHTML = `<div class="page-head">${backBtn}</div>${emptyStateHtml('Not available','This section has no Evaluation Type fixed yet.')}`; return wrap; }
  const section = params.section==='see' ? 'see' : params.section==='total' ? 'total' : 'cie';
  const pageTitle = section==='cie' ? 'CIE Marks — view only' : section==='see' ? 'SEE Marks — view only' : 'Total Marks — view only';
  const bodyHtml = section==='total' ? marksViewTable(course) : (()=>{
    const template = getCourseTemplate(course);
    const comps = section==='cie' ? template.cie : seeDisplayComponents(template);
    const sectionMax = section==='cie' ? CIE_MAX : round1(comps.reduce((a,c)=>a+c.scaledMax,0));
    const rows = course.students.map(s=>{
      const calc = computeCIE(s, comps);
      const cells = comps.map(comp=>{
        const v = s.marks[comp.key];
        const overMax = typeof v==='number' && (v>comp.rawMax || v<0);
        return `<td>${v===undefined||v===null?'—':`<span style="${overMax?'color:var(--seal-red);font-weight:600;':''}">${v}</span>`} <span class="mono" style="color:var(--text-soft);font-size:11px;">/${comp.rawMax}</span></td>`;
      }).join('');
      return `<tr><td>${escapeHtml(s.name)}</td>${cells}<td class="total-cell">${calc.total}<span class="mono" style="font-weight:400;color:var(--text-soft);font-size:11px;">/${sectionMax}</span></td></tr>`;
    }).join('');
    const head = comps.map(comp=>`<th>${comp.label}<br><span style="text-transform:none;">max ${comp.rawMax}</span></th>`).join('');
    return comps.length ? `<div class="table-scroll"><table class="data-table"><thead><tr><th>Student</th>${head}<th>${section==='cie'?'CIE':'SEE'} Total</th></tr></thead><tbody>${rows}</tbody></table></div>` : `<p class="section-meta">No ${section==='cie'?'CIE':'SEE'} components on this Evaluation Type.</p>`;
  })();
  wrap.innerHTML = `
    <div class="page-head">
      ${backBtn}
      <div class="page-eyebrow">${pageTitle}</div>
      <h2>${escapeHtml(course.name)}</h2>
      <p>Course Code: <strong>${escapeHtml(course.code)}</strong> · Section ${course.section} ${statusPill(course)} ${etPill(course)}</p>
    </div>
    <div class="card">
      <p class="section-meta" style="margin-bottom:10px;">Every component here is entered on its own page — this is a read-only roll-up. Use the buttons on the subject page to enter or change marks.</p>
      ${bodyHtml}
    </div>
  `;
  return wrap;
}

          </div>
          <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--rule-light);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
            <span class="section-meta">Instructor: ${ciUser ? escapeHtml(ciUser.name)+' ('+escapeHtml(ciUser.email)+')' : 'Unassigned'}${c.evalType ? ' · Evaluation Type: '+escapeHtml(evalTypeLabel(c.evalType)) : ''} · Roster: ${c.studentCount} student${c.studentCount===1?'':'s'}</span>
            <div style="display:flex;gap:10px;align-items:center;">
              ${c.status==='approved' ? `
                <span class="section-meta" style="font-weight:600;">Approved · locked — view only</span>
                <button class="btn btn-outline btn-sm" onclick="App.navigate('cc-roster',{courseId:'${c.id}'})">View Roster</button>
              ` : `
                <button class="btn btn-outline btn-sm" onclick="App.navigate('cc-roster',{courseId:'${c.id}'})">Manage Roster</button>
                ${ciUser
                  ? `<button class="btn btn-red btn-sm" onclick="if(confirm('Revoke Course Instructor access for ${escapeHtml(ciUser.name)} on ${c.code}?')) App.revokeRole('CI','${c.id}')">Revoke Instructor</button>`
                  : `<button class="btn btn-sm btn-outline" onclick="openAssignModal('CI','${c.id}')">Assign Instructor</button>`}
              `}
              ${c.evalType && ['TT1','TT2'].some(cycle=>termTestComponentKey(getCourseTemplate(c), cycle)) ? `<button class="btn btn-outline btn-sm" onclick="App.navigate('cc-termtest-setup',{courseId:'${c.id}'})">Question Paper Setup</button>` : ''}
            </div>
          </div>
          ${lightweightCompletionChipsHtml(c)}
        </div>`;
      }).join('')}
    `;
  }).join('');
}
function updateCCBranchGroups(term){
  const user = App.currentUser();
  const { ccCourses } = getFacultyCourses(user.id);
  const target = document.getElementById('cc-branch-groups');
  if(target) target.innerHTML = renderCCBranchGroupsHtml(ccCourses.filter(c=>c.branch), term);
}
window.updateCCBranchGroups = updateCCBranchGroups;

function renderCCRoster(params){
  const user = App.currentUser();
  const course = App.getCourse(params?.courseId);
  const wrap = el('<div></div>');
  if(!course){ wrap.innerHTML = emptyStateHtml('Course not found', 'Go back and pick a section from My Coordination.'); return wrap; }
  const ccUser = getCourseCCUser(course.id);
  if(ccUser?.id !== user.id && user.systemRole!=='ADMIN'){
    wrap.innerHTML = emptyStateHtml('Not your section', 'Only this section\'s Course Coordinator can manage its roster.');
    return wrap;
  }
  const locked = course.status==='approved' && user.systemRole!=='ADMIN';
  const currentDirIds = new Set((course.students||[]).map(s=>s.dirId).filter(Boolean));
  const directoryForBranch = (App.state.studentDirectory||[]).filter(s=>s.branch===course.branch);
  const byBatch = {};
  directoryForBranch.forEach(s=>{ (byBatch[s.batch] = byBatch[s.batch] || []).push(s); });
  const roster = [...(course.students||[])].sort((a,b)=>(a.rollNo||'').localeCompare(b.rollNo||''));

  wrap.innerHTML = `
    <div class="page-head">
      <div class="page-eyebrow">Course Coordinator</div>
      <h2>Roster — ${escapeHtml(course.code)} · Section ${escapeHtml(course.section)} · ${branchLabel(course.branch)}</h2>
      <p>${locked ? 'This course is approved, so the roster is locked — view only.' : 'Import this section\'s students directly from a spreadsheet — whoever\'s on the roster below is who the Course Instructor sees and enters marks for.'}</p>
    </div>
    ${locked ? `<div class="card" style="border-color:var(--warn,#c8850a);"><div class="section-meta" style="font-weight:600;">Approved · locked — roster can no longer be changed. Contact an Administrator if this needs to be corrected.</div></div>` : `
    <div class="card">
      <div class="section-title" style="font-size:15px;">Import roster from Excel / CSV</div>
      <p class="section-meta" style="margin-top:4px;">File needs five columns — <strong>Roll No, Name, Email, Department, Semester</strong> — same template the Executive Assistant uses. Department must be ${branchLabel(course.branch)} (other rows are skipped). Existing roll numbers on this roster are updated; new ones are added — nothing already here gets removed.</p>
      <div class="import-row" style="margin-top:10px;">
        <label class="file-input-label">
          📄 Choose file (.xlsx, .xls, .csv)
          <input type="file" accept=".xlsx,.xls,.csv" style="display:none;" onchange="handleCCRosterExcelImport(this, '${course.id}')">
        </label>
        <button class="btn btn-outline btn-sm" onclick="downloadStudentTemplate()">Download template</button>
      </div>
    </div>
    `}
    <div class="card">
      <div class="section-title" style="font-size:15px;">Current roster <span class="section-meta">(${roster.length} student${roster.length===1?'':'s'})</span></div>
      ${roster.length===0 ? emptyStateHtml('No students on this roster yet', locked ? 'This roster is empty.' : 'Import a spreadsheet above to get started.') : roster.map(s=>`
        <div class="card card-row">
          <div>
            <div class="section-title">${s.rollNo ? escapeHtml(s.rollNo)+' — ' : ''}${escapeHtml(s.name)}</div>
            <div class="section-meta">${s.email ? escapeHtml(s.email) : 'No email on file'}${!s.dirId ? ' · Not linked to Student Directory' : ''}</div>
          </div>
          ${locked ? '' : `<button class="btn btn-red btn-sm" onclick="if(confirm('Remove ${escapeHtml(s.name)} from this roster?')) removeCCRosterStudent('${course.id}','${s.id}')">Remove</button>`}
        </div>
      `).join('')}
    </div>
    ${locked ? '' : `
    <details class="card">
      <summary style="cursor:pointer;font-weight:600;">Or pick from the Student Directory instead</summary>
      <p class="section-meta" style="margin-top:8px;">Check students already in the Executive Assistant's directory for ${branchLabel(course.branch)}, then Save — this <strong>replaces</strong> directory-linked rows on the roster with your selection (rows added manually above are left alone).</p>
      <input id="cc-roster-search" class="search-input" type="text" placeholder="Search by roll no or name..." oninput="filterCCRosterList(this.value)" style="margin-top:8px;">
      <div id="cc-roster-list" style="margin-top:14px;">
        ${directoryForBranch.length===0 ? emptyStateHtml('No directory students for this branch yet', `The Executive Assistant hasn't uploaded any ${branchLabel(course.branch)} students yet.`) :
          Object.keys(byBatch).sort().map(batch=>`
            <div class="branch-heading">${escapeHtml(BATCH_LABELS[batch] || batch)}</div>
            ${byBatch[batch].sort((a,b)=>a.rollNo.localeCompare(b.rollNo)).map(s=>`
              <label class="card card-row cc-roster-row" data-hay="${escapeHtml((s.rollNo+' '+s.name).toLowerCase())}" style="cursor:pointer;">
                <div>
                  <div class="section-title">${escapeHtml(s.rollNo)} — ${escapeHtml(s.name)}</div>
                  <div class="section-meta">${s.email ? escapeHtml(s.email) : 'No email on file'}${s.semester ? ` · Sem ${escapeHtml(s.semester)}` : ''}</div>
                </div>
                <input type="checkbox" class="cc-roster-check" value="${s.id}" ${currentDirIds.has(s.id) ? 'checked' : ''} style="width:18px;height:18px;">
              </label>
            `).join('')}
          `).join('')
        }
      </div>
      ${directoryForBranch.length>0 ? `<button class="btn" style="margin-top:14px;" onclick="saveCCRoster('${course.id}')">Save Roster</button>` : ''}
    </details>
    `}
  `;
  return wrap;
}
function filterCCRosterList(term){
  const q = (term||'').trim().toLowerCase();
  document.querySelectorAll('#cc-roster-list .cc-roster-row').forEach(row=>{
    row.style.display = (!q || row.getAttribute('data-hay').includes(q)) ? '' : 'none';
  });
}
window.filterCCRosterList = filterCCRosterList;
function saveCCRoster(courseId){
  const ids = Array.from(document.querySelectorAll('.cc-roster-check:checked')).map(el=>el.value);
  App.setCourseRoster(courseId, ids);
}
window.saveCCRoster = saveCCRoster;
function removeCCRosterStudent(courseId, studentId){
  const course = App.getCourse(courseId);
  if(!course) return;
  const actor = App.currentUser();
  if(course.status==='approved' && actor.systemRole!=='ADMIN'){ toast('This course is already approved — the roster is locked. Contact an Administrator if this needs to be corrected.', 'err'); return; }
  const remainingDirIds = (course.students||[]).filter(s=>s.id!==studentId).map(s=>s.dirId).filter(Boolean);
  // route through setCourseRoster's directory-linked handling for directory rows,
  // but a manually-imported row (no dirId) needs a direct delete instead.
  const target = (course.students||[]).find(s=>s.id===studentId);
  if(target && !target.dirId){
    course.students = (course.students||[]).filter(s=>s.id!==studentId);
    deleteStudent(studentId);
    toast(`${target.name} removed from the roster.`, 'err');
    App.navigate('cc-roster', { courseId });
  } else {
    App.setCourseRoster(courseId, remainingDirIds);
  }
}
window.removeCCRosterStudent = removeCCRosterStudent;
function handleCCRosterExcelImport(input, courseId){
  const file = input.files && input.files[0];
  if(!file) return;
  ensureXLSXLoaded().then(()=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type:'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });
        App.importCourseRosterRows(courseId, rows);
      }catch(err){
        console.warn(err);
        toast('Could not read that file. Please upload a valid .xlsx, .xls, or .csv file.', 'err');
      }
      input.value = '';
    };
    reader.onerror = ()=>{ toast('Could not read that file.', 'err'); input.value=''; };
    reader.readAsArrayBuffer(file);
  }).catch(err=>{
    toast(err.message || 'Could not load the spreadsheet reader. Check your internet connection and try again.', 'err');
    input.value = '';
  });
}
window.handleCCRosterExcelImport = handleCCRosterExcelImport;

/* ---------- CC: Question Paper Setup page. Set the Unit for every short
   question (Q1-Q5) and the Unit + marks-split for every long-answer choice
   pair (Q6-Q11), for TT1 and/or TT2 (whichever cycles this section's
   Evaluation Type actually has a Term Test slot for) — then forward to the
   Course Instructor, who can only start entering marks once forwarded. ---------- */
function renderCCTermTestSetup(params){
  const course = App.getCourse(params.courseId);
  const wrap = el('<div></div>');
  const backBtn = `<button class="ghost-btn no-print" style="color:var(--ink);border-color:var(--rule);margin-bottom:14px;" onclick="App.navigate('cc-list')">← Back to my coordination</button>`;
  if(!course){ wrap.innerHTML = `<div class="page-head">${backBtn}</div>${emptyStateHtml('Course not found','')}`; return wrap; }
  const template = course.evalType ? getCourseTemplate(course) : null;
  if(!template){
    wrap.innerHTML = `<div class="page-head">${backBtn}<h2>${escapeHtml(course.name)}</h2></div>${emptyStateHtml('Evaluation Type not yet fixed','Fix an Evaluation Type for this section first — Question Paper Setup needs it to know which cycles apply.')}`;
    return wrap;
  }
  const cycles = ['TT1','TT2'].filter(cycle=>termTestComponentKey(template, cycle));
  if(!cycles.length){
    wrap.innerHTML = `<div class="page-head">${backBtn}<h2>${escapeHtml(course.name)}</h2></div>${emptyStateHtml('Not applicable','This section\'s Evaluation Type has no Term Test component.')}`;
    return wrap;
  }
  const recordEditable = course.status==='draft' || (course.status==='approved' && course.editUnlocked);

  const cyclePanelHtml = cycles.map(cycle=>{
    const cycleLabel = TERM_TEST_LABELS[cycle];
    const forwarded = isTTForwarded(course, cycle);
    const complete = ttSetupComplete(course, cycle);
    const setupExpanded = isTTSetupExpanded(course, cycle);
    const editable = recordEditable && !forwarded;

    const shortHtml = TT_SHORT_KEYS.map(qKey=>{
      const cfg = getQuestionConfig(course, cycle, qKey);
      return `
        <div class="config-grid" style="margin-top:10px;">
          <div class="config-field">
            <label>${qKey.toUpperCase()} — Unit</label>
            <select ${editable?'':'disabled'} onchange="App.setTTPaperConfig('${course.id}','${cycle}','${qKey}','unit', this.value)">
              <option value="">— Select Unit —</option>
              ${TT_UNIT_OPTIONS.map(u=>`<option value="${escapeHtml(u)}" ${cfg.unit===u?'selected':''}>${escapeHtml(u)}</option>`).join('')}
            </select>
          </div>
        </div>`;
    }).join('');
    const longHtml = TT_ALL_LONG_QKEYS.map(qKey=>{
      const cfg = getQuestionConfig(course, cycle, qKey);
      return `
        <div class="config-grid" style="margin-top:10px;">
          <div class="config-field">
            <label>${qKey.toUpperCase()} — Unit</label>
            <select ${editable?'':'disabled'} onchange="App.setTTPaperConfig('${course.id}','${cycle}','${qKey}','unit', this.value)">
              <option value="">— Select Unit —</option>
              ${TT_UNIT_OPTIONS.map(u=>`<option value="${escapeHtml(u)}" ${cfg.unit===u?'selected':''}>${escapeHtml(u)}</option>`).join('')}
            </select>
          </div>
          <div class="config-field">
            <label>${qKey.toUpperCase()} — Marks split</label>
            <select ${editable?'':'disabled'} onchange="App.setTTPaperConfig('${course.id}','${cycle}','${qKey}','split', this.value)">
              <option value="${cfg.halfValue}" ${cfg.split===cfg.halfValue?'selected':''}>${cfg.halfValue} (parts a &amp; b)</option>
              <option value="${cfg.fullValue}" ${cfg.split===cfg.fullValue?'selected':''}>${cfg.fullValue} (single answer)</option>
            </select>
          </div>
        </div>`;
    }).join('');
    const shortSummaryHtml = `<div style="margin-top:10px;">${TT_SHORT_KEYS.map(qKey=>{
      const cfg = getQuestionConfig(course, cycle, qKey);
      return `<span style="display:inline-block;margin:4px 10px 4px 0;padding:4px 10px;background:#F3EEDD;border:1px solid var(--rule);border-radius:6px;font-size:12.5px;">
        <strong>${qKey.toUpperCase()}</strong>: ${cfg.unit ? escapeHtml(cfg.unit) : `<span style="color:var(--seal-red);">Unit not set</span>`}
      </span>`;
    }).join('')}</div>`;
    const longSummaryHtml = `<div style="margin-top:10px;">${TT_ALL_LONG_QKEYS.map(qKey=>{
      const cfg = getQuestionConfig(course, cycle, qKey);
      return `<span style="display:inline-block;margin:4px 10px 4px 0;padding:4px 10px;background:#F3EEDD;border:1px solid var(--rule);border-radius:6px;font-size:12.5px;">
        <strong>${qKey.toUpperCase()}</strong>: ${cfg.unit ? escapeHtml(cfg.unit) : `<span style="color:var(--seal-red);">Unit not set</span>`} · ${cfg.split===cfg.fullValue?`${cfg.fullValue} (single)`:cfg.halfValue}
      </span>`;
    }).join('')}</div>`;

    const badge = forwarded
      ? `<span class="status-pill status-approved">Forwarded to Course Instructor</span>`
      : complete ? `<span class="status-pill status-draft">Ready to forward</span>`
      : `<span class="status-pill status-submitted">Setup incomplete</span>`;

    const actionBtn = forwarded
      ? (recordEditable ? `<button class="btn btn-outline btn-sm" onclick="App.unlockTTPaperConfig('${course.id}','${cycle}')">Reopen for Editing</button>` : '')
      : `<button class="btn btn-sm" ${complete?'':'disabled'} onclick="App.forwardTTPaperConfig('${course.id}','${cycle}')">Forward to Course Instructor</button>`;

    return `
      <div class="card">
        <div class="card-row">
          <div class="section-title" style="font-size:15px;">${escapeHtml(cycleLabel)} Question Paper Setup</div>
          <div style="display:flex;align-items:center;gap:10px;">
            ${badge}
            ${!forwarded ? `<button class="btn btn-sm ${setupExpanded?'':'btn-outline'}" onclick="toggleTTSetup('${course.id}','${cycle}')">${setupExpanded ? 'Hide' : 'Edit'}</button>` : ''}
          </div>
        </div>
        <p class="section-meta" style="margin-top:4px;">Set the Unit for EACH short-answer question (Q1–Q5) and the Unit + marks-split for EACH long-answer question (Q6–Q11) — this is decided when the question paper itself is made. Once forwarded, the Course Instructor can enter marks against it, and this setup locks until you reopen it.</p>
        ${(!forwarded && setupExpanded) ? `
          <div class="section-meta" style="margin-top:12px;font-weight:600;">Short answers (Q1–Q5)</div>
          ${shortHtml}
          <div class="section-meta" style="margin-top:16px;font-weight:600;">Long answers (Q6–Q11)</div>
          ${longHtml}
        ` : `
          <div class="section-meta" style="margin-top:12px;font-weight:600;">Short answers</div>
          ${shortSummaryHtml}
          <div class="section-meta" style="margin-top:8px;font-weight:600;">Long answers</div>
          ${longSummaryHtml}
        `}
        <div style="margin-top:14px;">${actionBtn}</div>
      </div>`;
  }).join('');

  wrap.innerHTML = `
    <div class="page-head">
      ${backBtn}
      <div class="page-eyebrow">Course Coordinator</div>
      <h2>${escapeHtml(course.name)}</h2>
      <p>Course Code: <strong>${escapeHtml(course.code)}</strong> · Section ${course.section} ${statusPill(course)} ${etPill(course)}</p>
    </div>
    ${cyclePanelHtml}`;
  return wrap;
}

      <button class="ghost-btn no-print" style="color:var(--ink);border-color:var(--rule);margin-bottom:14px;" onclick="App.navigate('cc-list')">← Back to my coordination</button>
      <div class="page-eyebrow">Stage 2 · Coordinator verification</div>
      <h2>${escapeHtml(course.name)}</h2>
      <p>${courseMeta(course)} ${statusPill(course)} ${etPill(course)}</p>
      <p class="section-meta" style="margin-top:6px;">${assignmentSummary(course.id)}</p>

/* ---------------- boot ----------------
   No profile data is fetched before sign-in anymore — the login
   screen is just an email/password form now. onAuthStateChange
   (registered above) handles both a fresh sign-in and restoring an
   existing session (INITIAL_SESSION) by calling handleSignedIn(). */
document.addEventListener('DOMContentLoaded', ()=>{
  App.ready = true;

  document.getElementById('logout-btn').addEventListener('click', ()=>App.logout());
  document.getElementById('bell-btn').addEventListener('click', (e)=>{ e.stopPropagation(); toggleNotifPanel(); });
  document.addEventListener('click', (e)=>{
    const panel = document.getElementById('notif-panel');
    if(!panel.classList.contains('hidden') && !panel.contains(e.target) && e.target.id!=='bell-btn'){
      closeNotifPanel();
    }
  });

  const loginForm = document.getElementById('login-form');
  const loginBtn = document.getElementById('login-submit-btn');
  if(loginForm) loginForm.addEventListener('submit', (e)=>{ e.preventDefault(); App.submitLogin(); });
  if(loginBtn) loginBtn.addEventListener('click', ()=>App.submitLogin());
});
</script>
