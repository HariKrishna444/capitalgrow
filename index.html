/* Parses one subject cell from a wide-format course-registration sheet.
   Expected shapes:
     "C8 : Dr. MD RIYAZUDDIN"                        -> one entry
     "CVO-C8-B1 : Dr. MD RIYAZUDDIN"                  -> one entry
     "SS3(V)-C6 : Priya Singh, SS3(Q)-C6 : GIS Skill Trainer" -> two entries
       (multi-component subjects, e.g. Verbal/Quantitative Soft Skills)
     "-" or blank                                     -> not registered, skip
   Returns an array of { sectionCode, instructor }. */
function parseRegistrationCell(raw){
  const val = String(raw==null ? '' : raw).trim();
  if(!val || val==='-') return [];
  return val.split(',').map(part=>part.trim()).filter(Boolean).map(part=>{
    const idx = part.indexOf(':');
    if(idx===-1) return { sectionCode:'', instructor: part.trim() };
    return { sectionCode: part.slice(0,idx).trim(), instructor: part.slice(idx+1).trim() };
  }).filter(p=>p.instructor || p.sectionCode);
}

/* ---------------- Practical sub-sections (B1/B2 lab batches) ----------------
   A Practical subject's section (e.g. Section B5) is very often actually
   taught as two lab batches with two different faculty — the imported
   Course Registration sheet already carries this: each student's own
   subject cell names THEIR instructor (see parseRegistrationCell above),
   so when a "single" section really has two distinct instructor names
   across its registered students, that split IS the B1/B2 boundary — no
   separate sheet format or convention is needed. suggestSubSectionsFromRegistrations
   finds that split (if any) for a given course, ordered by each group's
   lowest roll number so B1 always ends up the earlier roll-number half. */
function suggestSubSectionsFromRegistrations(course){
  if(!course) return [];
  const norm = s => String(s||'').trim().toLowerCase();
  const rows = (App.state.courseRegistrations||[]).filter(r=>
    r.branch===course.branch && norm(r.sectionCode)===norm(course.section) && norm(r.subjectName)===norm(course.name));
  if(!rows.length) return [];
  const distinctInstructors = [...new Set(rows.map(r=>r.instructorName).filter(Boolean))];
  if(distinctInstructors.length < 2) return [];
  const groups = distinctInstructors.map(name=>{
    const rollNos = [...new Set(rows.filter(r=>r.instructorName===name).map(r=>r.rollNo))].sort();
    return { instructorName:name, rollNos };
  }).filter(g=>g.rollNos.length);
  groups.sort((a,b)=>(a.rollNos[0]||'').localeCompare(b.rollNos[0]||''));
  return groups.map((g,i)=>({ code:'B'+(i+1), instructorName:g.instructorName, rollNos:g.rollNos }));
}
/* Whenever a Practical section's sub-sections have a faculty member
   assigned, mirror that split into the existing item-roster-override
   mechanism (see getItemRosterOverrides above) for Practical Internal Test
   and SEE Practical — the two item flows a lab batch's own faculty
   actually enters marks for. This is what makes the CC Dashboard's
   sub-section assignment functionally real (each faculty only sees/enters
   their own batch's marks), not just a label. Deliberately a no-op until
   at least one sub-section has a faculty assigned, so a course that has
   never used sub-sections is never touched, and any Admin-set roster
   override on it is left alone. */
function syncSubSectionItemOverrides(course){
  if(!course || !course.subSections || !course.subSections.length) return;
  const template = getCourseTemplate(course);
  ['pracInternal','seePractical'].forEach(itemKey=>{
    if(!itemFlowApplicable(template, itemKey)) return;
    const batches = course.subSections.filter(s=>s.facultyUserId && s.rollNos && s.rollNos.length).map(s=>({
      facultyUserId:s.facultyUserId, facultyEmail:s.facultyEmail, facultyName:s.facultyName,
      rollNos:[...s.rollNos], subSectionCode:s.code, importedAt:Date.now()
    }));
    if(!batches.length) return;
    course.itemRosterOverrides = course.itemRosterOverrides || {};
    course.itemRosterOverrides[itemKey] = batches;
  });
}

/* ---------------- app state ---------------- */
/* ---------------- deep links ----------------
   The app is a single-page client with no server-side routing, but email
   notifications need a real clickable URL that lands the reader on the
   exact page for their role (e.g. a CI's "enter marks" link, a CC's
   "review" link). We encode the current view+params into location.hash on
   every navigate() call, and on sign-in check for a pending hash route
   before falling back to that role's default landing page — so a link
   like https://yourapp/#/ci-termtest-entry?courseId=...&cycle=TT1 opens
   straight into that page once the recipient signs in. */
function buildHashFragment(view, params={}){
  const entries = Object.entries(params||{}).filter(([,v])=>v!==undefined && v!==null && v!=='');
  const query = entries.length ? '?' + new URLSearchParams(entries).toString() : '';
  return `#/${view}${query}`;
}
function buildAppLink(view, params={}){
  const base = window.location.origin + window.location.pathname;
  return `${base}${buildHashFragment(view, params)}`;
}
function parseHashRoute(){
  const h = window.location.hash || '';
  const m = h.match(/^#\/([a-zA-Z0-9_-]+)(?:\?(.*))?$/);
  if(!m) return null;
  const params = {};
  if(m[2]) new URLSearchParams(m[2]).forEach((v,k)=>{ params[k]=v; });
  return { view:m[1], params };
}
/* Exact CI marks-entry page for one of the 4 independently-flowed items
   (tt1, tt2, pracInternal, seePractical) — used so "sent back"/"approved"
   notifications for that item link straight to where the CI fixes/sees it,
   rather than the generic subject page. */
function itemEntryLink(course, itemKey){
  if(itemKey==='tt1' || itemKey==='tt2'){
    return { view:'ci-termtest-entry', params:{ courseId: course.id, cycle: itemKey==='tt1' ? 'TT1' : 'TT2' } };
  }
  if(itemKey==='pracInternal' || itemKey==='seePractical'){
    const template = course.evalType ? getCourseTemplate(course) : null;
    if(template){
      const section = itemKey==='pracInternal' ? 'cie' : 'see';
      const list = section==='cie' ? template.cie : seeDisplayComponents(template);
      const comp = itemKey==='pracInternal' ? list.find(c=>c.key==='pracInternal') : list.find(c=>c.key==='seePractical'||c.key==='seePracticalProject');
      if(comp) return { view:'ci-component-entry', params:{ courseId: course.id, section, compKey: comp.key } };
    }
  }
  return { view:'ci-subject-detail', params:{ courseId: course.id } };
}
/* Same idea for the shared-approval-group notifications (Term Test 1/2 &
   Lab Internal vs. Lab External) — both land on the same "My Subjects"
   entry page for that course, which opens on the matching tab. */
function groupEntryLink(course){
  return { view:'ci-entry', params:{ courseId: course.id } };
}
/* Escapes a notification body, then turns any http(s) URL in it (i.e. the
   deep link notifyUser() appends) into a real clickable in-app link. */
/* Escapes a notification body, then turns the "Login here: <url>" line
   notifyUser() appends into a real styled button — reads as a clear
   call-to-action instead of a raw pasted link. Any other bare URL that
   might appear in a body (there shouldn't normally be one) still gets
   linkified, just without the button treatment. */
function linkifyNotifBody(body){
  const escaped = escapeHtml(body||'');
  const withButton = escaped.replace(/Login here:\s*(https?:\/\/[^\s]+)/g, (_, url) => `<a href="${url}" class="notif-link-btn" onclick="closeNotifPanel()">Login here →</a>`);
  return withButton.replace(/(^|[^"])(https?:\/\/[^\s]+)/g, (m, pre, url) => `${pre}<a href="${url}" style="color:var(--brass);font-weight:600;text-decoration:underline;" onclick="closeNotifPanel()">${url}</a>`);
}
// Clicking a #/view?params deep link (from an email or the bell dropdown)
// while already signed in should navigate in place, not just move the
// address bar — the initial "signed out, pending link" case is handled
// separately by completeLogin() reading the hash once at sign-in time.
window.addEventListener('hashchange', ()=>{
  if(!App.state.currentUserId) return;
  const r = parseHashRoute();
  if(r) App.navigate(r.view, r.params);
});

/* ---------------- access control for deep links ----------------
   Sidebar buttons only ever pass views appropriate to the signed-in
   user's role, so this was never a problem before — but a #/view?params
   link (from an email notification, or just pasted/bookmarked) can name
   ANY view, for ANY role. This whitelist is checked before a deep link is
   honoured, in both App.navigate() and the post-login hash restore, so
   e.g. an Exam Branch account opening a CI's Term Test entry link falls
   back to their own dashboard instead of erroring or landing somewhere
   they have no business being. */
const ROLE_ALLOWED_VIEWS = {
  ADMIN: ['admin-users','admin-course-reg','admin-roster-assignment','hod-coordinators','hod-termtest','hod-cc-detail','admin-seating-plan'],
  HOD: ['hod-list','verification-status','hod-faculty','hod-audit','hod-review','hod-cc-detail','hod-termtest-overview','hod-labint-overview','hod-labext-overview','ci-termtest-entry','ci-component-entry'],
  TTI: ['hod-coordinators','hod-cc-detail','hod-faculty'],
  EA: ['ea-list','ea-faculty','ea-students','ea-review','ci-termtest-entry','ci-component-entry'],
  EXAM: ['exam-list'],
  FACULTY: ['ci-sections','ci-pending','ci-audit','cc-list','verification-status','ci-subject-detail','ci-entry','ci-component-entry','ci-section-view','ci-analytics','ci-termtest','ci-termtest-entry','ci-labint','ci-labext','cc-roster','cc-review','cc-termtest-setup','faculty-empty'],
};
function isViewAllowedForRole(role, view){
  const allowed = ROLE_ALLOWED_VIEWS[role];
  return !!allowed && allowed.includes(view);
}
/* For the CI-only marks-entry pages specifically: being FACULTY isn't
   enough — you must be the actual assigned Course Instructor for THAT
   course. Without this, any faculty account could open another
   instructor's marks-entry link (from a forwarded/leaked email, a
   bookmark, etc.) just by knowing the courseId. */
function isCourseOwnerCI(course){
  if(!course) return false;
  const actor = App.currentUser();
  return !!actor && getCourseCIUser(course.id)?.id === actor.id;
}
function notYourSubjectHtml(){
  return emptyStateHtml("Not your subject", "You're not the Course Instructor assigned to this section, so this page isn't available to you.");
}
/* One flow item (tt1/tt2/tt3/pracInternal/seePractical) is entered by the
   CI but then verified by the CC and HOD in turn (no EA step) — all on
   this SAME marks-entry page (it just switches to read-only once it's not
   the CI's turn, via the "editable" flag computed separately). So the page
   can't be gated to the CI alone, or the CC/HOD would have nowhere to open
   the "Forward"/"Send Back" controls that itemApprovalStatusHtml renders
   for them — which is exactly why a verification notification used to
   lead to a "Not your subject" dead end. Allow: the assigned CI, the
   assigned CC (needs to see it at every stage, not just their own turn),
   the HOD only while it's actually sitting at their stage, and ADMIN
   always. */
function canViewItemEntry(course, itemKey){
  if(!course) return false;
  const actor = App.currentUser();
  if(!actor) return false;
  if(actor.systemRole==='ADMIN') return true;
  if(itemKey ? isItemCIFor(course, itemKey) : isCourseOwnerCI(course)) return true;
  if(getCourseCCUser(course.id)?.id === actor.id) return true;
  const ia = itemKey ? App.itemApproval(course.id, itemKey) : null;
  if(ia && ia.stage==='hod' && actor.systemRole==='HOD') return true;
  return false;
}
/* Per-student CC/EA/HOD remark columns on the Term Test (TT1/TT2) marks
   entry table — a free-text note about one particular student (e.g. "recheck
   Q7", "absent — condoned"), separate from the whole-record verification
   remarks used elsewhere. Each role's box is editable only by that role
   (matching who's allowed to actually open this page at all per
   canViewItemEntry — EA/HOD only while it's sitting at their own stage) or
   by ADMIN; everyone who can view the page can still read all three. */
function canEditTTStudentRemark(course, itemKey, role){
  if(!course) return false;
  const actor = App.currentUser();
  if(!actor) return false;
  if(actor.systemRole==='ADMIN') return true;
  const ia = itemKey ? App.itemApproval(course.id, itemKey) : null;
  if(role==='cc') return getCourseCCUser(course.id)?.id === actor.id;
  if(role==='ea') return actor.systemRole==='EA' && !!ia && ia.stage==='ea';
  if(role==='hod') return actor.systemRole==='HOD' && !!ia && ia.stage==='hod';
  return false;
}
/* Where the "← Back" button on a shared item-entry page (Term Test or a
   single CIE/SEE component) should send the viewer — depends on who's
   looking, since the CI's own "My Subjects" pages aren't in the EA/HOD
   route whitelist and App.navigate() would otherwise bounce them to their
   dashboard with an error toast. ciBack is what a CI (or nobody signed in
   yet) gets, unchanged from before. */
function itemViewerBackBtnHtml(course, ciBackView, ciBackParams, ciBackLabel){
  const actor = App.currentUser();
  let view = ciBackView, params = ciBackParams, label = ciBackLabel;
  if(actor && course && !isCourseOwnerCI(course)){
    if(actor.systemRole==='EA'){ view='ea-list'; params={}; label='← Back to verification queue'; }
    else if(actor.systemRole==='HOD'){ view='hod-list'; params={}; label='← Back to pending approval'; }
    else if(actor.systemRole==='ADMIN'){ view='admin-users'; params={}; label='← Back'; }
    else if(getCourseCCUser(course.id)?.id===actor.id){ view='cc-review'; params={courseId:course.id}; label='← Back to coordinator review'; }
  }
  // NOTE: JSON.stringify() always double-quotes keys/values (e.g.
  // {"courseId":"c1"}), and this whole call sits inside a double-quoted
  // onclick="..." HTML attribute — embedding it as-is closes the attribute
  // early at its first `"`, silently truncating the handler so the button
  // does nothing when clicked. HTML-encoding those quotes as &quot; keeps
  // the attribute intact; the browser decodes them back to `"` before
  // running the handler's JS.
  const paramsJson = Object.keys(params||{}).length ? `,${JSON.stringify(params).replace(/"/g,'&quot;')}` : '';
  return `<button class="ghost-btn no-print" style="color:var(--ink);border-color:var(--rule);margin-bottom:14px;" onclick="App.navigate('${view}'${paramsJson})">${escapeHtml(label)}</button>`;
}

const App = {
  state: { currentUserId:null, users:[], courses:[], assignments:[], notifications:[], currentTermTest:null, practicalInternalWindow:null, seePracticalWindow:null, termTestHistory:[], subjects:[], studentDirectory:[], courseRegistrations:[] },
  ui: { view:'', params:{} },
  ready:false,

  currentUser(){ return this.state.users.find(u=>u.id===this.state.currentUserId) || null; },
  getUserById(id){ return this.state.users.find(u=>u.id===id) || null; },
  getCourse(id){ return this.state.courses.find(c=>c.id===id); },
  /* ---------- lazy roster/marks loader ----------
     Full student rows (name/roll/email/marks) are never fetched at login —
     only the lightweight course_completion_status view. This loads the real
     rows for ONE course, on demand, the first time a page actually needs
     them (mark entry, roster management, review/approval pages). Safe to
     call repeatedly — it's a no-op once studentsLoaded is true, so render
     functions can just `await` it every time without worrying about
     re-fetching on every re-render. */
  async ensureCourseStudentsLoaded(courseId){
    const course = this.getCourse(courseId);
    if(!course || course.studentsLoaded) return course;
    const { data, error } = await sb.from('students').select('*').eq('course_id', courseId);
    if(error){ toast('Could not load this section\'s roster: ' + (error.message||error), 'err'); return course; }
    course.students = (data||[]).map(s=>({ id:s.id, name:s.name, marks:s.marks||{}, rollNo:s.roll_no||'', email:s.email||'', dirId:s.dir_id||null, absent:!!s.absent }));
    // Supabase returns rows in no particular order (insertion order in
    // practice) — every marks table (Term Test 1/2/3, Lab Internal/External,
    // Other CIE, SIA, SEE, the read-only roll-ups, Analytics, etc.) just
    // iterates course.students directly, so without sorting here the list
    // comes out in whatever order the rows happened to be created, not roll
    // number. Sort once, right after loading, so every screen that reads
    // this array is roll-number-wise automatically.
    sortStudentsByRollNo(course.students);
    course.studentsLoaded = true;
    return course;
  },

  /* ---------- auth ---------- */
  // Called by the login form's submit handler / button.
  submitLogin(){
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    attemptPasswordLogin(email, password);
  },
  // Called by handleSignedIn() once a real Supabase Auth session exists
  // and has been matched to a profiles row.
  completeLogin(userId){
    this.state.currentUserId = userId;
    document.getElementById('login-view').classList.add('hidden');
    document.getElementById('shell').classList.remove('hidden');
    const u = this.currentUser();
    document.getElementById('user-name').textContent = u.name;
    document.getElementById('user-role').textContent = u.systemRole==='FACULTY' ? (facultyBadgeShort(u) || 'FACULTY') : `${u.systemRole} · ${ROLE_LABELS[u.systemRole]}`;
    const nav = getNavForUser(u);
    const pending = parseHashRoute();
    const target = pending || { view: nav[0] ? nav[0].v : 'faculty-empty', params:{} };
    this.navigate(target.view, target.params);
    renderBell();
    // Passive catch for the case nobody explicitly closed the cycle: if its
    // own end-time has already quietly passed, run the same delay sweep
    // that an explicit close triggers. sweepTermTestDelays is itself
    // idempotent (delayNotified guards each item), so this is safe to run
    // on every login without re-notifying anyone.
    this.checkTermTestWindowExpiry();
  },
  async logout(){
    try{ await sb.auth.signOut(); }catch(e){ console.warn('sign-out failed', e); }
    this.state.currentUserId = null;
    this.state.users = [];
    document.getElementById('shell').classList.add('hidden');
    document.getElementById('login-view').classList.remove('hidden');
    const emailEl = document.getElementById('login-email');
    const pwEl = document.getElementById('login-password');
    if(emailEl) emailEl.value = '';
    if(pwEl) pwEl.value = '';
    closeNotifPanel();
  },
  navigate(view, params={}){
    const user = this.currentUser();
    if(user && !isViewAllowedForRole(user.systemRole, view)){
      toast("That page isn't available for your role — showing your dashboard instead.", 'err');
      const fallback = getNavForUser(user)[0];
      view = fallback ? fallback.v : 'faculty-empty';
      params = {};
    }
    this.ui = { view, params };
    try{ history.replaceState(null, '', buildHashFragment(view, params)); }catch(e){ /* hash update is best-effort */ }
    renderSidebar();
    renderContent();
    window.scrollTo({top:0, behavior:'smooth'});
  },

  /* ---------- audit ---------- */
  logHistory(course, action, remark=''){
    const u = this.currentUser();
    const entry = { id:bizId('HIST', [course.code, course.section, course.history.length+1], course.history.map(h=>h.id)), ts:Date.now(), user:u.name, role:u.systemRole==='FACULTY' ? facultyBadgeShort(u) || 'FACULTY' : u.systemRole, action, remark };
    course.history.unshift(entry);
    syncHistory(course.id, entry);
  },
  /* Picks a sensible page for the notified user to land on when they click
     the link in the (emailed) notification — mirrors the nav item/action
     button they'd normally reach for this course, per role. Used as the
     default whenever notifyUser() isn't given an explicit link. */
  defaultNotificationLink(userId, course){
    const u = this.getUserById(userId);
    if(!u) return null;
    if(u.systemRole==='FACULTY'){
      if(course){
        if(getCourseCIUser(course.id)?.id===userId) return { view:'ci-subject-detail', params:{ courseId: course.id } };
        if(getCourseCCUser(course.id)?.id===userId) return { view:'cc-review', params:{ courseId: course.id } };
      }
      return { view:'ci-sections', params:{} };
    }
    if(u.systemRole==='EA') return course ? { view:'ea-review', params:{ courseId: course.id } } : { view:'ea-list', params:{} };
    if(u.systemRole==='HOD') return course ? { view:'hod-review', params:{ courseId: course.id } } : { view:'hod-list', params:{} };
    if(u.systemRole==='EXAM') return { view:'exam-list', params:{} };
    if(u.systemRole==='TTI') return { view:'hod-coordinators', params:{} };
    if(u.systemRole==='ADMIN') return { view:'admin-users', params:{} };
    return null;
  },
  notifyUser(userId, course, title, body, notifyEmail=false, fromEmail=null, link=null){
    const resolvedLink = link || this.defaultNotificationLink(userId, course);
    const fullBody = resolvedLink ? `${body}\n\nLogin here: ${buildAppLink(resolvedLink.view, resolvedLink.params)}` : body;
    const n = { id:bizId('NOTE', [course ? course.code : 'GENERAL', this.state.notifications.length+1], this.state.notifications.map(x=>x.id)), forUserId:userId, courseId:course.id, title, body: fullBody, ts:Date.now(), read:false, notifyEmail, fromEmail };
    this.state.notifications.unshift(n);
    syncNotification(n);
    renderBell();
  },

  /* ---------- Admin: create account (with password) + set role + reset password ----------
     CC / CI are NOT handled here — those stay assigned inside the app by
     HOD (→ CC) and CC (→ CI) exactly as before. This panel only covers
     the fixed system roles: ADMIN, HOD, EA, EXAM, and plain FACULTY. */
  async createSystemAccount(rawName, rawEmail, role, rawPassword, rawBranch){
    const name = (rawName||'').trim();
    const email = (rawEmail||'').trim().toLowerCase();
    const password = (rawPassword||'').trim();
    const branch = (rawBranch||'').trim().toUpperCase();
    if(!name || !email){ toast('Name and email are required.', 'err'); return; }
    if(!isValidEmail(email)){ toast('Enter a valid email address.', 'err'); return; }
    if(!password || password.length < 8){ toast('Set a password of at least 8 characters.', 'err'); return; }
    if(this.state.users.find(u=>u.email.toLowerCase()===email)){ toast('A user with this email already exists.', 'err'); return; }
    const id = bizId('USR', [role, email.split('@')[0]], this.state.users.map(u=>u.id)); // generated up front so the Edge Function's profiles insert has an id to use
    try{
      await callAdminManageUser('create_user', { id, name, email, role, password });
      const user = { id, name, email, systemRole:role };
      if(role==='FACULTY' && BRANCH_LABELS[branch]){
        user.homeBranch = branch;
        syncProfile(user); // best-effort follow-up write, home_branch isn't set by the Edge Function itself
      }
      this.state.users.push(user);
      toast(`${name} added as ${ROLE_LABELS[role]}, with sign-in credentials issued.`, 'ok');
      this.navigate('admin-users');
    }catch(e){
      toast('Could not create account: ' + (e.message || e), 'err');
    }
  },
  setUserBranch(userId, branch){
    const u = this.getUserById(userId);
    if(!u) return;
    if(u.systemRole!=='FACULTY'){ toast('Only Faculty accounts have a branch.', 'err'); return; }
    u.homeBranch = branch || undefined;
    syncProfile(u);
    toast(`${u.name}'s branch set to ${branch ? branchLabel(branch) : 'none'}.`, 'ok');
    this.navigate('admin-users');
  },
  async setSystemRole(userId, role){
    const u = this.getUserById(userId);
    if(!u) return;
    const prevRole = u.systemRole;
    u.systemRole = role;
    try{
      await syncProfile(u);
      toast(`${u.name} is now ${ROLE_LABELS[role]}.`, role==='FACULTY' ? 'err' : 'ok');
    }catch(e){
      u.systemRole = prevRole;
      toast('Could not update role: ' + (e.message || e), 'err');
    }
    this.navigate('admin-users');
  },
  async setUserPassword(userId, rawPassword){
    const u = this.getUserById(userId);
    const password = (rawPassword||'').trim();
    if(!u) return;
    if(!password || password.length < 8){ toast('Set a password of at least 8 characters.', 'err'); return; }
    try{
      const res = await callAdminManageUser('set_password', { email: u.email, password });
      toast(res && res.created ? `Sign-in activated for ${u.name} — they can log in now.` : `Password updated for ${u.name}.`, 'ok');
      this.navigate('admin-users');
    }catch(e){
      toast('Could not set password: ' + (e.message || e), 'err');
    }
  },

  /* ---------- Timetable Incharge/Admin: create a course-section ----------
     The Timetable Incharge no longer picks a real Subject here (and so no
     longer fixes an Evaluation Type at this stage) — the Course Coordinator
     is the one who later selects the real Subject from "Courses Applicable"
     when assigning the Course Instructor (see
     App.ccCreateSectionAndAssignInstructor / App.assignRole), and THAT is
     what fixes the Abbr, Course Type & Evaluation Type. Here the Timetable
     Incharge just needs a working title (code/name) to create the
     coordination shell and hand it to a Coordinator.

     If rawEmail is provided, the Course Coordinator is assigned in the same
     step (single "Code + Name + Faculty email/name" form in Manage
     Coordinators) — no separate "Assign Coordinator" click needed. */
  async createCourseSection(rawCode, rawName, rawEmail, rawCcName, rawSemester){
    const actor = this.currentUser();
    if(!['TTI','ADMIN'].includes(actor.systemRole)){ toast('Only the Timetable Incharge or an Administrator can create a course section.', 'err'); return; }
    const code = (rawCode||'').trim().toUpperCase();
    const name = (rawName||'').trim();
    if(!code || !name){ toast('Enter both a working Course Code and Course Name for this coordination.', 'err'); return; }
    const semester = String(rawSemester||'').trim();
    if(!SEMESTER_NUMBERS.includes(semester)){ toast('Choose which Semester this subject belongs to.', 'err'); return; }
    const email = (rawEmail||'').trim().toLowerCase();
    if(email && !isValidEmail(email)){ toast('Enter a valid Coordinator email address.', 'err'); return; }
    // A subject only needs one coordination "shell" — the Coordinator
    // splits it into branch/section combos themselves afterwards (see
    // App.ccCreateSectionAndAssignInstructor), so branch/section are no
    // longer collected here at all.
    const dupe = this.state.courses.find(c=>normalizeCode(c.code)===normalizeCode(code) && !c.branch);
    if(dupe){ toast(`${code} already has a coordination shell — open it from Manage Coordinators.`, 'err'); return; }
    const course = {
      id: bizId('CRS', [code, 'shell'], this.state.courses.map(c=>c.id)), code, name, section: '', branch: '', semester,
      status:'draft', sentBack:false, lastRemark:'', eaRemark:'', evalType:null, examDate:'', pracInternalDeadline:'', pracInternalStart:'', scrutinyRemark:'', frozenAt:null, frozenBy:'', scriptUploads:{},
      editRequestStatus:null, editRequestRemark:'', editUnlocked:false, ttLabApproval:null, labExternalApproval:null, etRequests:[], ttPaperConfig:{},
      // Roster starts empty — the Course Coordinator builds it from the real
      // Student Directory (see App.setCourseRoster) rather than placeholder names.
      students: [], history: []
    };
    this.state.courses.push(course);
    // Awaited: the CC assignment inserted just below references this course's
    // id via a foreign key, so the course row must exist on the server first —
    // otherwise the assignment insert can race ahead of it and fail with
    // "violates foreign key constraint assignments_course_id_fkey". If the
    // course insert itself failed (RLS, constraint, network), stop here
    // instead of racing ahead into that confusing follow-on error.
    const { error: courseErr } = await syncCourse(course);
    if(courseErr){ this.state.courses = this.state.courses.filter(x=>x.id!==course.id); renderContent(); return; }
    (course.students||[]).forEach(s=>syncNewStudent(course.id, s));
    this.logHistory(course, `Course coordination created: ${code} — ${name} (by ${actor.name})`);
    if(email){
      // Assign the Course Coordinator right away, same as the "Assign
      // Coordinator" flow — creates a FACULTY profile if one doesn't
      // already exist for this email, then adds an active CC assignment.
      // CC/CI are never written to profiles.system_role — that column only
      // ever holds ADMIN/HOD/EA/EXAM/FACULTY; the role is derived from the
      // `assignments` table at render time.
      await this.assignRole('CC', course.id, email, rawCcName, undefined);
    } else {
      toast(`Created ${code} — ${name}.`, 'ok');
    }
    renderSidebar();
    renderContent();
  },

  /* ---------- CC: split a subject coordination into a real branch/section
     and assign its Course Instructor, all in one step. The Subject is now
     picked from the Subject Catalog (App.state.subjects, the Supabase
     "Courses Applicable" table) narrowed down by Regulation + Branch +
     Semester — no HOD approval step anymore. The Evaluation Type is fixed
     straight from that subject's row in Supabase (masterSubject/Abbr); if
     the picked subject code isn't in the Supabase Courses Applicable table
     yet, the section is still created (using the Subject Catalog's own
     code/name) but its Evaluation Type is left unfixed until an Admin adds
     it — same graceful fallback as the rest of the app already uses. Can be
     called repeatedly to allocate several instructors/sections under the
     same coordination. */
  /* ---------- CC: split a subject coordination into a real branch/section
     and assign its Course Instructor, all in one step. The Subject, its
     Regulation and Evaluation Type all come straight from the chosen
     Coordination itself (the base course record already carries them) —
     there's no separate Regulation/Subject re-pick here anymore, since
     that was redundant with (and could disagree with) the Coordination
     you already selected. Branch is restricted to whichever branches
     actually share this subject (R25: CSE<->CSC, AIML<->CSD; R24: none
     shared; ERP excluded — its subjects come from the Timetable Incharge,
     not this flow), and Section is restricted to that Regulation/branch's
     fixed numbering range. Can be called repeatedly to allocate several
     instructors/sections under the same coordination. */
  async ccCreateSectionAndAssignInstructor(baseCourseId, branch, section, instructorEmail, semester, instructorName){
    const actor = this.currentUser();
    const base = this.getCourse(baseCourseId);
    if(!base){ toast('Choose a coordination to add a section to.', 'err'); return; }
    const ccUser = getCourseCCUser(baseCourseId);
    const isOwner = ccUser?.id === actor.id;
    if(!isOwner && actor.systemRole!=='ADMIN'){ toast('Only this subject\'s Course Coordinator can add a section.', 'err'); return; }
    const code = (base.code||'').trim().toUpperCase();
    const regulation = regulationFromCode(code);
    if(!regulation){ toast('Could not work out this subject\'s Regulation from its code.', 'err'); return; }
    if(!BRANCH_LABELS[branch]){ toast('Choose a branch.', 'err'); return; }
    const catalogBranch = catalogBranchForCode(code);
    const allowedBranches = ccCreatableBranches(regulation, catalogBranch);
    if(!allowedBranches.includes(branch)){ toast(`${branchLabel(branch)} doesn't offer ${code} — choose ${allowedBranches.map(branchLabel).join(' or ')}.`, 'err'); return; }
    if(!SEMESTER_NUMBERS.includes(semester)){ toast('Choose a Semester.', 'err'); return; }
    const sec = (section||'').trim().toUpperCase();
    const validSections = sectionOptionsFor(regulation, branch);
    if(!sec || (validSections.length && !validSections.includes(sec))){ toast(validSections.length ? `Choose a section from ${validSections[0]}\u2013${validSections[validSections.length-1]}.` : 'Enter a section.', 'err'); return; }
    const email = (instructorEmail||'').trim().toLowerCase();
    if(!email){ toast('Choose an Instructor.', 'err'); return; }
    const dupe = this.state.courses.find(c=>normalizeCode(c.code)===normalizeCode(code) && c.section===sec && c.branch===branch);
    if(dupe){ toast(`${code} · Section ${sec} · ${branchLabel(branch)} already exists.`, 'err'); return; }
    // Evaluation Type comes straight from Supabase's "Courses Applicable"
    // subjects table (App.state.subjects), matched by this same code — not
    // a manual pick, and no HOD approval needed.
    const subj = masterSubject(code);
    const evalType = subj ? subj.abbr : base.evalType;
    const displayName = subj ? subj.name : base.name;
    const course = {
      id: bizId('CRS', [code, branch, sec], this.state.courses.map(c=>c.id)), code, name: displayName, section: sec, branch, semester, regulation,
      status:'draft', sentBack:false, lastRemark:'', eaRemark:'', evalType, examDate:'', pracInternalDeadline:'', pracInternalStart:'', scrutinyRemark:'', frozenAt:null, frozenBy:'', scriptUploads:{},
      editRequestStatus:null, editRequestRemark:'', editUnlocked:false, ttLabApproval:null, labExternalApproval:null, etRequests:[], ttPaperConfig:{},
      students: [], history: []
    };
    this.state.courses.push(course);
    const { error: courseErr } = await syncCourse(course);
    if(courseErr){ this.state.courses = this.state.courses.filter(x=>x.id!==course.id); renderContent(); return; }
    this.logHistory(course, `Section created under ${code} coordination: Section ${sec} · ${branchLabel(branch)} · ${regulation} · Semester ${semester}`
      + (evalType ? ` — Evaluation Type ${evalType} (fixed from Courses Applicable)` : ' — Evaluation Type not yet fixed (subject not found in Courses Applicable)') + ` (by ${actor.name})`);
    // Coordinator on the new section is whoever coordinates the base subject
    // (usually the acting user; kept explicit so an Admin can do this on
    // their behalf without silently reassigning coordination).
    if(ccUser){
      const rec = { id:bizId('ASG', ['CC', course.code, course.section], this.state.assignments.map(a=>a.id)), type:'CC', courseId:course.id, userId:ccUser.id, email:ccUser.email, assignedBy:actor.id, assignedAt:Date.now(), status:'active' };
      this.state.assignments.push(rec);
      syncAssignment(rec);
    }
    const { user: ciUser, isNew } = createFacultyIfNeeded(email, (instructorName||'').trim());
    if(isNew){
      const { error: profileErr } = await syncProfile(ciUser);
      if(profileErr){ this.state.users = this.state.users.filter(u2=>u2.id!==ciUser.id); renderContent(); return; }
    }
    const ciRec = { id:bizId('ASG', ['CI', course.code, course.section], this.state.assignments.map(a=>a.id)), type:'CI', courseId:course.id, userId:ciUser.id, email:ciUser.email, assignedBy:actor.id, assignedAt:Date.now(), status:'active' };
    this.state.assignments.push(ciRec);
    syncAssignment(ciRec);

    // Auto-populate this section's roster straight from the imported Course
    // Registration sheet — mirrors what App.activateCourseRegistrationGroup
    // does for the Admin's "Activate as Course Section" button, but fires
    // automatically the moment the CC assigns a Course Instructor here, so
    // an Admin no longer has to separately find and activate the matching
    // registration group. Matches by Subject Name + Branch + Section only,
    // so it picks up every batch registered under this subject/section/
    // branch at once. If nothing in course_registrations matches yet (e.g.
    // the sheet hasn't been imported for this subject/section), the roster
    // is simply left empty and the CC can still add students manually or
    // via the roster import.
    const normReg = s => String(s||'').trim().toLowerCase();
    const regRows = (this.state.courseRegistrations||[]).filter(r=>
      r.branch===branch && normReg(r.sectionCode)===normReg(sec) && normReg(r.subjectName)===normReg(displayName));
    let loadedCount = 0;
    if(regRows.length){
      const dirByBatchRoll = {};
      (this.state.studentDirectory||[]).forEach(d=>{ dirByBatchRoll[d.batch+'|'+d.rollNo] = d; });
      const nextStudents = [];
      regRows.forEach(r=>{
        const dir = dirByBatchRoll[r.batch+'|'+r.rollNo];
        const idPool = (course.students||[]).map(s=>s.id).concat(nextStudents.map(s=>s.id));
        nextStudents.push({ id: bizId('CST', [course.code, course.section||'nosec', r.rollNo], idPool), name:r.studentName, rollNo:r.rollNo, email: dir?dir.email:'', dirId: dir?dir.id:null, marks:{} });
      });
      sortStudentsByRollNo(nextStudents);
      course.students = nextStudents;
      course.studentsLoaded = true;
      loadedCount = nextStudents.length;
      nextStudents.forEach(s=>syncNewStudent(course.id, s));
    }

    // Auto-apply a default (Unit 1) Question Paper Setup for Term Test 1 &
    // 2 so the new Course Instructor isn't blocked on the Coordinator
    // doing that separately — see applyDefaultTTPaperConfig.
    const defaultedCycles = evalType ? applyDefaultTTPaperConfig(course) : [];
    await syncCourse(course);
    this.logHistory(course, `Course Instructor assigned: ${ciUser.name} (${ciUser.email})`
      + (loadedCount ? ` · ${loadedCount} student${loadedCount===1?'':'s'} auto-loaded from Course Registration import` : ''));
    if(defaultedCycles.length) this.logHistory(course, `Default Question Paper Setup (Unit 1) auto-forwarded to the Course Instructor for ${defaultedCycles.map(c=>TERM_TEST_LABELS[c]||c).join(' & ')}`);
    this.notifyUser(ciUser.id, course, `You're now Course Instructor`, `${actor.name} assigned you as Course Instructor for ${course.code} — ${course.name} (Section ${course.section} · ${branchLabel(course.branch)}).${evalType ? ` The Evaluation Type for this section is fixed as "${evalTypeLabel(evalType)}" — enter marks only for the components shown.` : ' The Evaluation Type for this section is not fixed yet — check with your Coordinator.'} This role is active immediately — no separate approval step is needed.${defaultedCycles.length ? ` A default Question Paper Setup (every question set to Unit 1) has already been forwarded for ${defaultedCycles.map(c=>TERM_TEST_LABELS[c]||c).join(' & ')}, so you can start entering marks right away — your Coordinator may still update the real Units later.` : ''}`, true, actor.email);
    toast(loadedCount
      ? `${ciUser.name} is now Course Instructor for ${course.code} · Section ${course.section} — ${loadedCount} student${loadedCount===1?'':'s'} auto-loaded from Course Registrations.`
      : `${ciUser.name} is now Course Instructor for ${course.code} · Section ${course.section}. No matching Course Registration rows were found, so the roster is empty — add students from the roster page, or import the registration sheet first.`, 'ok');
    renderSidebar();
    this.navigate('cc-list');
  },

  /* ---------- HOD → CC, CC → CI: assign / revoke ----------
     For CI assignment, `subjectCode` is a real code from the "Courses
     Applicable" master list (the Supabase `subjects` table) — not a hand-picked ET abbr.
     Picking the subject is what fixes the Abbr / Course Type / Evaluation
     Type for the section, and locks the section's code+name to that real
     subject, so a course can never end up mismatched against the sheet. */
  /* ---------- CC: build the real roster for a coordinated section from the
     Student Directory. selectedDirIds = array of student_directory row ids
     the CC checked. Matching is done via a stable id derived from
     (course, directory row), so re-saving after adding/removing a few
     students never touches the marks already entered for people who stay
     on the roster — only additions/removals are written. This is what the
     Course Instructor sees and enters marks against once assigned. */
  setCourseRoster(courseId, selectedDirIds){
    const actor = this.currentUser();
    const course = this.getCourse(courseId);
    if(!course){ toast('Course not found.', 'err'); return; }
    const isOwner = getCourseCCUser(courseId)?.id === actor.id;
    if(!isOwner && actor.systemRole!=='ADMIN'){ toast('Only this section\'s Course Coordinator can edit its roster.', 'err'); return; }
    if(course.status==='approved' && actor.systemRole!=='ADMIN'){ toast('This course is already approved — the roster is locked. Contact an Administrator if this needs to be corrected.', 'err'); return; }
    const wantedIds = new Set((selectedDirIds||[]).filter(Boolean));
    const dirById = {};
    (this.state.studentDirectory||[]).forEach(s=>{ dirById[s.id] = s; });

    const existingByDirId = {};
    (course.students||[]).forEach(s=>{ if(s.dirId) existingByDirId[s.dirId] = s; });

    const nextStudents = [];
    wantedIds.forEach(dirId=>{
      const dir = dirById[dirId];
      if(!dir) return; // stale id, skip
      const already = existingByDirId[dirId];
      if(already){
        // keep the row (and its marks) as-is, just refresh identity fields
        already.name = dir.name; already.rollNo = dir.rollNo; already.email = dir.email;
        nextStudents.push(already);
      } else {
        nextStudents.push({ id: bizId('CST', [course.code, course.section, dir.rollNo], (course.students||[]).map(s=>s.id)), name: dir.name, rollNo: dir.rollNo, email: dir.email, dirId: dir.id, marks:{} });
      }
    });
    sortStudentsByRollNo(nextStudents);

    const removed = (course.students||[]).filter(s=>!s.dirId || !wantedIds.has(s.dirId));
    course.students = nextStudents;
    syncCourse(course); // no course fields change, but keeps things in sync if called elsewhere
    nextStudents.forEach(s=>syncNewStudent(course.id, s));
    removed.forEach(s=>deleteStudent(s.id));

    toast(`Roster saved for ${course.code} — ${nextStudents.length} student${nextStudents.length===1?'':'s'}.`, 'ok');
    this.navigate('cc-roster', { courseId });
  },

  /* ---------- CC: Practical sub-sections (B1/B2 lab batches) ----------
     A Practical subject's Course Coordinator can split their section into
     lab batches, each with its own faculty — see renderSubSectionsCard for
     the CC Dashboard UI and syncSubSectionItemOverrides above for how a
     sub-section's faculty ends up actually seeing/entering marks for only
     their own batch (Practical Internal Test + SEE Practical). */
  ccOwnsCourse(course){
    const actor = this.currentUser();
    if(!course || !actor) return false;
    return getCourseCCUser(course.id)?.id === actor.id || actor.systemRole==='ADMIN';
  },
  autoMapSubSections(courseId){
    const course = this.getCourse(courseId);
    if(!course){ toast('Course not found.', 'err'); return; }
    if(!this.ccOwnsCourse(course)){ toast('Only this section\'s Course Coordinator can manage its sub-sections.', 'err'); return; }
    const template = getCourseTemplate(course);
    if(!itemFlowApplicable(template, 'pracInternal')){ toast('Sub-sections are only for Practical subjects.', 'err'); return; }
    const suggestions = suggestSubSectionsFromRegistrations(course);
    if(!suggestions.length){ toast('No two-instructor split found in the Course Registration data for this section — add sub-sections manually below, or import/correct the registration sheet first.', 'err'); return; }
    const norm = s => String(s||'').trim().toLowerCase();
    course.subSections = suggestions.map(s=>{
      const matches = this.state.users.filter(u=>u.systemRole==='FACULTY' && norm(u.name)===norm(s.instructorName));
      const faculty = matches.length===1 ? matches[0] : null;
      return { code:s.code, facultyUserId: faculty ? faculty.id : null, facultyEmail: faculty ? faculty.email : '', facultyName: faculty ? faculty.name : s.instructorName, rollNos:s.rollNos, matchedFromRegistration:true };
    });
    syncSubSectionItemOverrides(course);
    syncCourse(course);
    const unmatched = course.subSections.filter(s=>!s.facultyUserId);
    toast(`Mapped ${course.subSections.length} sub-section${course.subSections.length===1?'':'s'} from Course Registration (${course.subSections.map(s=>`${s.code}: ${s.rollNos.length}`).join(', ')})${unmatched.length ? ` — ${unmatched.map(s=>s.facultyName||'an instructor').join(', ')} couldn't be matched to a faculty account by name; assign manually below.` : '.'}`, unmatched.length ? 'err' : 'ok');
    this.navigate('cc-roster', { courseId });
  },
  autoSplitSubSectionRoster(courseId){
    const course = this.getCourse(courseId);
    if(!course){ toast('Course not found.', 'err'); return; }
    if(!this.ccOwnsCourse(course)){ toast('Only this section\'s Course Coordinator can manage its sub-sections.', 'err'); return; }
    const template = getCourseTemplate(course);
    if(!itemFlowApplicable(template, 'pracInternal')){ toast('Sub-sections are only for Practical subjects.', 'err'); return; }
    if(!course.subSections || !course.subSections.length){
      course.subSections = [{ code:'B1', facultyUserId:null, facultyEmail:'', facultyName:'', rollNos:[] }, { code:'B2', facultyUserId:null, facultyEmail:'', facultyName:'', rollNos:[] }];
    }
    const rolls = [...(course.students||[])].sort((a,b)=>(a.rollNo||'').localeCompare(b.rollNo||'')).map(s=>s.rollNo).filter(Boolean);
    if(!rolls.length){ toast('This section has no roster yet — import or add students first.', 'err'); return; }
    const n = course.subSections.length;
    const per = Math.ceil(rolls.length / n);
    course.subSections.forEach((ss,i)=>{ ss.rollNos = rolls.slice(i*per, (i+1)*per); });
    syncSubSectionItemOverrides(course);
    syncCourse(course);
    toast(`Split ${rolls.length} students evenly across ${n} sub-sections (${course.subSections.map(s=>`${s.code}=${s.rollNos.length}`).join(', ')}).`, 'ok');
    this.navigate('cc-roster', { courseId });
  },
  addSubSection(courseId, rawCode){
    const course = this.getCourse(courseId);
    if(!course){ toast('Course not found.', 'err'); return; }
    if(!this.ccOwnsCourse(course)){ toast('Only this section\'s Course Coordinator can manage its sub-sections.', 'err'); return; }
    const code = String(rawCode||'').trim().toUpperCase();
    if(!code){ toast('Enter a sub-section code, e.g. B1.', 'err'); return; }
    course.subSections = course.subSections || [];
    if(course.subSections.some(s=>s.code===code)){ toast(`Sub-section ${code} already exists.`, 'err'); return; }
    course.subSections.push({ code, facultyUserId:null, facultyEmail:'', facultyName:'', rollNos:[] });
    syncCourse(course);
    toast(`Sub-section ${code} added — assign a faculty member and roster below.`, 'ok');
    this.navigate('cc-roster', { courseId });
  },
  removeSubSection(courseId, code){
    const course = this.getCourse(courseId);
    if(!course || !course.subSections) return;
    if(!this.ccOwnsCourse(course)){ toast('Only this section\'s Course Coordinator can manage its sub-sections.', 'err'); return; }
    course.subSections = course.subSections.filter(s=>s.code!==code);
    syncCourse(course);
    toast(`Sub-section ${code} removed.`, 'err');
    this.navigate('cc-roster', { courseId });
  },
  setSubSectionFaculty(courseId, code, facultyEmail){
    const actor = this.currentUser();
    const course = this.getCourse(courseId);
    if(!course || !course.subSections) return;
    if(!this.ccOwnsCourse(course)){ toast('Only this section\'s Course Coordinator can manage its sub-sections.', 'err'); return; }
    const ss = course.subSections.find(s=>s.code===code);
    if(!ss){ toast('Sub-section not found.', 'err'); return; }
    const email = (facultyEmail||'').trim().toLowerCase();
    if(!email){
      ss.facultyUserId = null; ss.facultyEmail = ''; ss.facultyName = '';
      syncCourse(course);
      toast(`Faculty cleared for ${code}.`, 'err');
      this.navigate('cc-roster', { courseId });
      return;
    }
    const faculty = this.state.users.find(u=>u.systemRole==='FACULTY' && (u.email||'').toLowerCase()===email);
    if(!faculty){ toast('No faculty account found with that email.', 'err'); return; }
    const already = course.subSections.find(s=>s.code!==code && s.facultyUserId===faculty.id);
    if(already){ toast(`${faculty.name} is already assigned to Sub-Section ${already.code} — pick a different faculty member for ${code}.`, 'err'); return; }
    ss.facultyUserId = faculty.id; ss.facultyEmail = faculty.email; ss.facultyName = faculty.name;
    syncSubSectionItemOverrides(course);
    syncCourse(course);
    this.notifyUser(faculty.id, course, `Assigned to ${course.code} · Sub-Section ${code}`, `${actor.name} assigned you as faculty for Sub-Section ${code} (${ss.rollNos.length} student${ss.rollNos.length===1?'':'s'}) under Section ${course.section} — ${course.name}.`, true, actor.email);
    toast(`${faculty.name} assigned to Sub-Section ${code}.`, 'ok');
    this.navigate('cc-roster', { courseId });
  },

  /* ---------- CC: import a roster directly onto one course from a
     spreadsheet — Roll No, Name, Email, Department, Semester (same
     template as the EA's Student Directory upload). This is additive: it
     never removes existing roster rows, only adds new ones and refreshes
     matching ones by roll no (marks are preserved either way). Rows whose
     Department doesn't match this section's branch are skipped, since a
     roster only ever belongs to one branch. If a roll no already exists in
     the Student Directory for this branch, the new row is linked to it
     (dirId) so it stays consistent with the EA's master list; otherwise
     it's added as a course-only row. */
  importCourseRosterRows(courseId, rows){
    const actor = this.currentUser();
    const course = this.getCourse(courseId);
    if(!course){ toast('Course not found.', 'err'); return; }
    const isOwner = getCourseCCUser(courseId)?.id === actor.id;
    if(!isOwner && actor.systemRole!=='ADMIN'){ toast('Only this section\'s Course Coordinator can edit its roster.', 'err'); return; }
    if(course.status==='approved' && actor.systemRole!=='ADMIN'){ toast('This course is already approved — the roster is locked. Contact an Administrator if this needs to be corrected.', 'err'); return; }
    if(!Array.isArray(rows) || rows.length===0){ toast('That file has no rows to import.', 'err'); return; }

    const existingByRoll = {};
    (course.students||[]).forEach(s=>{ if(s.rollNo) existingByRoll[s.rollNo.toUpperCase()] = s; });

    let added=0, updated=0, skipped=0;
    rows.forEach(row=>{
      const keys = Object.keys(row||{});
      const findKey = (re) => keys.find(k=>re.test(String(k).trim()));
      const rollKey = findKey(/^roll\s*-?no\.?$/i);
      const nameKey = findKey(/^name$/i);
      const emailKey = findKey(/^e-?mail$/i);
      const deptKey = findKey(/^dep(artmen)?t$/i) || findKey(/^branch$/i);
      const rollNo = rollKey ? String(row[rollKey]).trim().toUpperCase() : '';
      const name = nameKey ? String(row[nameKey]).trim() : '';
      const email = emailKey ? String(row[emailKey]).trim().toLowerCase() : '';
      const dept = deptKey ? String(row[deptKey]).trim().toUpperCase() : '';
      if(!rollNo || !name){ skipped++; return; }
      if(dept && dept !== course.branch){ skipped++; return; } // wrong branch for this section
      if(email && !isValidEmail(email)){ skipped++; return; }
      const dirMatch = (this.state.studentDirectory||[]).find(d=>d.rollNo.toUpperCase()===rollNo && d.branch===course.branch);
      const existing = existingByRoll[rollNo];
      if(existing){
        Object.assign(existing, { name, email: email||existing.email, dirId: dirMatch ? dirMatch.id : existing.dirId });
        updated++;
      } else {
        const newRow = { id: bizId('CST', [course.code, course.section, rollNo], (course.students||[]).map(s=>s.id)), name, rollNo, email, dirId: dirMatch ? dirMatch.id : null, marks:{} };
        course.students.push(newRow);
        existingByRoll[rollNo] = newRow;
        added++;
      }
    });
    sortStudentsByRollNo(course.students);
    course.students.forEach(s=>syncNewStudent(course.id, s));

    if(added+updated===0){
      toast(`Import found nothing usable — check Roll No/Name are filled in and Department matches ${branchLabel(course.branch)}.`, 'err');
    } else {
      toast(`Import complete — ${added} added, ${updated} updated${skipped?`, ${skipped} skipped`:''}.`, 'ok');
    }
    this.navigate('cc-roster', { courseId });
  },

  async assignRole(type, courseId, rawEmail, rawName, subjectCode, loadType){
    const course = this.getCourse(courseId);
    if(!course){ toast('Choose a course first.', 'err'); return; }
    const actor = this.currentUser();
    const email = (rawEmail||'').trim().toLowerCase();
    if(!email){ toast('A faculty email is required.', 'err'); return; }
    if(!isValidEmail(email)){ toast('Enter a valid email address.', 'err'); return; }
    if(type==='CC' && !['TTI','ADMIN'].includes(actor.systemRole)){ toast('Only the Timetable Incharge or an Administrator can assign a Course Coordinator.', 'err'); return; }
    let subj = null;
    if(type==='CI'){
      const ccA = getActiveAssignment(courseId,'CC');
      const isCoordinator = ccA && ccA.userId===actor.id;
      if(!isCoordinator && !['HOD','ADMIN'].includes(actor.systemRole)){ toast('Only the assigned Course Coordinator can assign a Course Instructor.', 'err'); return; }
      if(course.status==='approved' && actor.systemRole!=='ADMIN'){ toast('This course is already approved — the Course Instructor can no longer be changed. Contact an Administrator if this needs to be corrected.', 'err'); return; }
      subj = masterSubject(subjectCode);
      if(!subj){ toast('Choose a Subject from Courses Applicable before assigning the Course Instructor.', 'err'); return; }
      if(loadType && !LOAD_TYPE_LABELS[loadType]){ toast('Choose Lecture or Practical.', 'err'); return; }
    }
    const existing = getActiveAssignment(courseId, type);
    if(existing){ existing.status='revoked'; existing.revokedAt=Date.now(); existing.revokedBy=actor.id; await syncAssignment(existing); }
    const { user, isNew } = createFacultyIfNeeded(email, rawName);
    // Awaited: the assignment inserted just below references this profile's
    // id via a foreign key, so a brand-new profile must exist on the server
    // first — otherwise the assignment insert can race ahead of it and fail
    // with "violates foreign key constraint assignments_user_id_fkey".
    if(isNew){
      const { error: profileErr } = await syncProfile(user);
      if(profileErr){ this.state.users = this.state.users.filter(u2=>u2.id!==user.id); return; }
    }
    const rec = { id:bizId('ASG', [type, course.code, course.section], this.state.assignments.map(a=>a.id)), type, courseId, userId:user.id, email:user.email, assignedBy:actor.id, assignedAt:Date.now(), status:'active' };
    this.state.assignments.push(rec);
    syncAssignment(rec);
    const roleLabel = type==='CC' ? 'Course Coordinator' : 'Course Instructor';
    let etNote = '';
    let defaultedCycles = [];
    if(type==='CI'){
      course.evalType = subj.abbr;
      course.code = subj.code;
      course.name = subj.name;
      course.ciLoadType = loadType || null;
      // Auto-apply a default (Unit 1) Question Paper Setup for Term Test
      // 1 & 2 so the new Course Instructor isn't blocked on the
      // Coordinator doing that separately — see applyDefaultTTPaperConfig.
      defaultedCycles = applyDefaultTTPaperConfig(course);
      syncCourse(course);
      etNote = ` · Subject fixed as: ${subj.code} — ${subj.name} (${evalTypeLabel(subj.abbr)})${loadType ? ` · ${LOAD_TYPE_LABELS[loadType]}` : ''}`;
    }
    this.logHistory(course, `${roleLabel} assigned: ${user.name} (${user.email})${etNote}`);
    if(defaultedCycles.length) this.logHistory(course, `Default Question Paper Setup (Unit 1) auto-forwarded to the Course Instructor for ${defaultedCycles.map(c=>TERM_TEST_LABELS[c]||c).join(' & ')}`);
    this.notifyUser(user.id, course, `You're now ${roleLabel}`, `${actor.name} assigned you as ${roleLabel} for ${course.code} — ${course.name}.${type==='CI' ? ` The subject and Evaluation Type for this section are fixed as "${subj.code} — ${subj.name}" (${evalTypeLabel(subj.abbr)}) — enter marks only for the components shown.` : ''} This role is active immediately — no separate approval step is needed.${defaultedCycles.length ? ` A default Question Paper Setup (every question set to Unit 1) has already been forwarded for ${defaultedCycles.map(c=>TERM_TEST_LABELS[c]||c).join(' & ')}, so you can start entering marks right away — your Coordinator may still update the real Units later.` : ''}`, true, actor.email);
    toast(`${user.name} is now ${roleLabel} for ${course.code}.${etNote}`, 'ok');
    closeModal();
    renderSidebar();
    renderContent();
  },
  revokeRole(type, courseId){
    const course = this.getCourse(courseId);
    const actor = this.currentUser();
    const existing = getActiveAssignment(courseId, type);
    if(!existing){ toast('No active assignment to revoke.', 'err'); return; }
    if(type==='CC' && !['TTI','ADMIN'].includes(actor.systemRole)){ toast('Only the Timetable Incharge or an Administrator can revoke a Course Coordinator.', 'err'); return; }
    if(type==='CC'){
      const siblings = this.state.courses.filter(c=>normalizeCode(c.code)===normalizeCode(course.code));
      if(siblings.some(c=>c.status==='approved') && actor.systemRole!=='ADMIN'){ toast('This subject has an approved, locked record — the Course Coordinator can no longer be revoked. Contact an Administrator if this needs to be corrected.', 'err'); return; }
    }
    if(type==='CI'){
      const isCoordinator = getActiveAssignment(courseId,'CC')?.userId===actor.id;
      if(!isCoordinator && !['HOD','ADMIN'].includes(actor.systemRole)){ toast('Only the assigned Course Coordinator can revoke a Course Instructor.', 'err'); return; }
      if(course.status==='approved' && actor.systemRole!=='ADMIN'){ toast('This course is already approved — the Course Instructor can no longer be revoked. Contact an Administrator if this needs to be corrected.', 'err'); return; }
    }
    existing.status='revoked'; existing.revokedAt=Date.now(); existing.revokedBy=actor.id;
    syncAssignment(existing);
    if(type==='CI'){ course.evalType = null; syncCourse(course); }
    const user = this.getUserById(existing.userId);
    const roleLabel = type==='CC' ? 'Course Coordinator' : 'Course Instructor';
    this.logHistory(course, `${roleLabel} capability revoked: ${user ? user.name+' ('+user.email+')' : existing.email}`);
    if(user) this.notifyUser(user.id, course, `${roleLabel} access revoked`, `${actor.name} revoked your ${roleLabel} role for ${course.code} — ${course.name}.`);
    toast(`${roleLabel} capability revoked for ${course.code}.`, 'err');
    // Cascade: a section can't have an active Course Instructor without an
    // active Course Coordinator (the CI's Subject/Evaluation Type was fixed
    // by that Coordinator), so revoking CC also revokes any active CI —
    // on this row AND on every other section the same Coordinator split
    // this subject into (a subject coordination now spans multiple rows).
    if(type==='CC'){
      const siblings = this.state.courses.filter(c=>normalizeCode(c.code)===normalizeCode(course.code) && c.id!==courseId);
      siblings.forEach(sibling=>{
        const sibCC = getActiveAssignment(sibling.id,'CC');
        if(!sibCC || sibCC.userId!==existing.userId) return;
        sibCC.status='revoked'; sibCC.revokedAt=Date.now(); sibCC.revokedBy=actor.id;
        syncAssignment(sibCC);
        this.logHistory(sibling, `Course Coordinator capability also revoked (Coordinator was revoked on the parent subject): ${user ? user.name+' ('+user.email+')' : sibCC.email}`);
        const sibCI = getActiveAssignment(sibling.id, 'CI');
        if(sibCI){
          sibCI.status='revoked'; sibCI.revokedAt=Date.now(); sibCI.revokedBy=actor.id;
          syncAssignment(sibCI);
          sibling.evalType = null;
          syncCourse(sibling);
          const sibCIUser = this.getUserById(sibCI.userId);
          this.logHistory(sibling, `Course Instructor capability also revoked (Coordinator was revoked): ${sibCIUser ? sibCIUser.name+' ('+sibCIUser.email+')' : sibCI.email}`);
          if(sibCIUser) this.notifyUser(sibCIUser.id, sibling, `Course Instructor access revoked`, `${actor.name} revoked the Course Coordinator for ${course.code}, so your Course Instructor role for Section ${sibling.section} · ${branchLabel(sibling.branch)} was revoked too. A new Coordinator will need to reassign it.`);
        }
      });
      const ciA = getActiveAssignment(courseId, 'CI');
      if(ciA){
        ciA.status='revoked'; ciA.revokedAt=Date.now(); ciA.revokedBy=actor.id;
        syncAssignment(ciA);
        course.evalType = null;
        syncCourse(course);
        const ciUser = this.getUserById(ciA.userId);
        this.logHistory(course, `Course Instructor capability also revoked (Coordinator was revoked): ${ciUser ? ciUser.name+' ('+ciUser.email+')' : ciA.email}`);
        if(ciUser) this.notifyUser(ciUser.id, course, `Course Instructor access revoked`, `${actor.name} revoked the Course Coordinator for ${course.code} — ${course.name}, so your Course Instructor role for this section was revoked too. A new Coordinator will need to reassign it.`);
      }
    }
    renderSidebar();
    renderContent();
  },

  /* ---------- marks workflow ---------- */
  /* Per-exam absence — replaces the old course-wide toggleStudentAbsent,
     which wiped a student's ENTIRE s.marks the moment they were marked
     absent for even one exam (e.g. missing Term Test 1 used to also erase
     their already-entered SIA, Regular Lab Performance, Skill
     Certification, Term Test 2 marks — everything). Called from a
     per-student "Absent" checkbox right on each exam's own entry page
     (Term Test 1/2, SIA, generic component, Practical Internal, SEE
     Practical) — compKey is that exam's own component key, so only ITS
     marks get cleared here; every other exam for the same student is
     untouched. Unchecking just clears the flag; marks aren't restored
     (there's nothing to restore — they were never kept), the CI re-enters
     them normally. */
  setComponentAbsent(courseId, studentId, compKey, checked){
    const actor = this.currentUser();
    const course = this.getCourse(courseId);
    if(!course){ toast('Course not found.', 'err'); return; }
    const chainItemKey = (compKey==='tt1'||compKey==='tt2') ? compKey : compKey==='pracInternal' ? 'pracInternal' : (compKey==='seePractical'||compKey==='seePracticalProject') ? 'seePractical' : null;
    const permitted = chainItemKey ? isItemCIFor(course, chainItemKey) : isCourseOwnerCI(course);
    if(!permitted && actor.systemRole!=='ADMIN'){ toast('Only the faculty assigned to this exam can mark attendance here.', 'err'); return; }
    if(course.status!=='draft' && !course.editUnlocked){ toast('This record is locked.', 'err'); return; }
    const s = (course.students||[]).find(x=>x.id===studentId);
    if(!s) return;
    s.marks = s.marks || {};
    s.marks.absent = s.marks.absent || {};
    if(checked){
      s.marks.absent[compKey] = true;
      // Clear only THIS exam's own stored marks/detail — every other
      // component's data on this student is left completely alone.
      delete s.marks[compKey];
      if(compKey==='sia') delete s.marks.siaDetail;
      if(compKey==='tt1' && s.marks.ttDetail) delete s.marks.ttDetail.TT1;
      if(compKey==='tt2' && s.marks.ttDetail) delete s.marks.ttDetail.TT2;
      if(compKey==='termTest' && s.marks.ttDetail){ delete s.marks.ttDetail.TT1; delete s.marks.ttDetail.TT2; }
    } else {
      delete s.marks.absent[compKey];
    }
    syncStudent(courseId, s);
    toast(checked ? `${s.name} marked absent for this exam — only this exam's marks were cleared.` : `${s.name} marked present again.`, 'ok');
    scheduleRenderContent();
  },
  saveMarks(courseId){
    const course = this.getCourse(courseId);
    if(!course) return;
    const touched = [];
    document.querySelectorAll(`[data-course="${courseId}"][data-field]`).forEach(input=>{
      const sid = input.dataset.student;
      const field = input.dataset.field;
      const student = course.students.find(s=>s.id===sid);
      if(!student) return;
      const val = input.value === '' ? null : parseFloat(input.value);
      student.marks[field] = (val===null || isNaN(val)) ? null : val;
      if(!touched.includes(student)) touched.push(student);
    });
    // targeted write: only the students whose marks actually changed on screen
    syncStudents(courseId, touched);
    return course;
  },

  /* ---------- HOD: direct marks edit ----------
     The HOD (or Admin) can override any CIE/SEE component straight from
     the HOD Review page — see the "Edit Marks" toggle in renderHODReview,
     which swaps marksViewTable into its editable mode (plain number
     inputs, same data-course/data-student/data-field wiring the Course
     Instructor's own entry pages use). Unlike App.saveMarks (which blindly
     writes every visible input), this builds a before/after diff so the
     audit trail and the Course Instructor's notification/email both say
     exactly what changed, not just "marks were modified" — reused nowhere
     else since only this page needs that level of detail. Only fields
     that actually changed touch the database or trigger a notification. */
  hodSaveMarksEdit(courseId){
    const actor = this.currentUser();
    if(!actor || !['HOD','ADMIN'].includes(actor.systemRole)){ toast('Only the HOD can modify marks here.', 'err'); return; }
    const course = this.getCourse(courseId);
    if(!course){ toast('Course not found.', 'err'); return; }
    const template = getCourseTemplate(course);
    const compLabel = {};
    (template.cie||[]).concat(seeDisplayComponents(template)).forEach(c=>{ compLabel[c.key]=c.label; });
    const changes = [];
    const touched = [];
    document.querySelectorAll(`[data-course="${courseId}"][data-field]`).forEach(input=>{
      const sid = input.dataset.student;
      const field = input.dataset.field;
      const student = course.students.find(s=>s.id===sid);
      if(!student) return;
      const before = (student.marks[field]===undefined) ? null : student.marks[field];
      const val = input.value === '' ? null : parseFloat(input.value);
      const after = (val===null || isNaN(val)) ? null : val;
      if(before === after) return;
      changes.push(`${student.name}: ${compLabel[field]||field} ${before===null?'—':before} → ${after===null?'—':after}`);
      student.marks[field] = after;
      if(!touched.includes(student)) touched.push(student);
    });
    if(!changes.length){ toast('No changes to save.', 'err'); return; }
    syncStudents(courseId, touched);
    const shown = changes.slice(0,8).join('; ') + (changes.length>8 ? ` · +${changes.length-8} more` : '');
    this.logHistory(course, `Marks modified directly by the HOD: ${shown}`);
    const ciUser = getCourseCIUser(courseId);
    if(ciUser){
      this.notifyUser(ciUser.id, course, `${course.code} — marks modified by HOD`,
        `${actor.name} (HOD) modified marks for ${course.code} — ${course.name}:\n${shown}\n\nPlease review the updated marks.`,
        true, actor.email);
    }
    hodMarksEditMap[courseId] = false;
    toast(`Marks updated${ciUser ? ' — the Course Instructor has been notified in-app and by email.' : '.'}`, 'ok');
    renderSidebar();
    renderContent();
  },
  validateCIEComplete(course){
    const components = getCourseComponents(course);
    for(const s of course.students){
      for(const comp of components){
        // Absence is per-exam now (s.marks.absent[compKey], set on that
        // exam's own entry page) — skip only THIS component for THIS
        // student, not every component, the way the old global s.absent
        // flag used to.
        if(isAbsentForComponent(s, comp.key)) continue;
        const v = s.marks[comp.key];
        if(v===undefined || v===null || v==='' || isNaN(v)) return { ok:false, msg:`Missing ${comp.label} score for ${s.name}.` };
        const rawScale = componentRawScale(comp);
        if(v < 0 || v > rawScale) return { ok:false, msg:`${comp.label} score for ${s.name} exceeds the maximum of ${rawScale}.` };
      }
    }
    return { ok:true };
  },
  validateSEEComplete(course){
    const components = getCourseSeeComponents(course);
    for(const s of course.students){
      for(const comp of components){
        if(isAbsentForComponent(s, comp.key)) continue;
        const v = s.marks[comp.key];
        if(v===undefined || v===null || v==='' || isNaN(v)) return { ok:false, msg:`Missing ${comp.label} score for ${s.name}.` };
        const rawScale = componentRawScale(comp);
        if(v < 0 || v > rawScale) return { ok:false, msg:`${comp.label} score for ${s.name} exceeds the maximum of ${rawScale}.` };
      }
    }
    return { ok:true };
  },
  validateComplete(course){
    if(!course.evalType) return { ok:false, msg:'The Course Coordinator has not yet fixed an Evaluation Type for this section.' };
    // SEE entry is temporarily disabled for Course Instructors — the
    // Examination Branch will handle it later — so only CIE completeness
    // gates submission for now.
    const cieCheck = this.validateCIEComplete(course);
    if(!cieCheck.ok) return cieCheck;
    const template = getCourseTemplate(course);
    for(const key of ITEM_FLOW_KEYS){
      if(!itemFlowApplicable(template, key)) continue;
      const ia = this.itemApproval(course.id, key);
      if(!ia || ia.stage!=='done') return { ok:false, msg:`${ITEM_FLOW_LABELS[key]} still needs to finish its own CI → CC → HOD verification before this record can be submitted.` };
    }
    return { ok:true };
  },
  ciSubmit(courseId){
    this.saveMarks(courseId);
    const course = this.getCourse(courseId);
    const check = this.validateComplete(course);
    if(!check.ok){ toast(check.msg, 'err'); return; }
    course.status = 'submitted';
    course.sentBack = false;
    syncCourse(course);
    this.logHistory(course, 'Submitted to the Course Coordinator for verification');
    const ccUser = getCourseCCUser(courseId);
    if(ccUser){
      this.notifyUser(ccUser.id, course, `${course.code} ready for verification`, `${course.code} — ${course.name} has been submitted and is awaiting your verification.`, true);
      toast(`${course.code} submitted to the Course Coordinator.`, 'ok');
    } else {
      // Safety net: no active Course Coordinator on this section (shouldn't
      // normally happen, since a CC must exist before a CI can be assigned).
      // Fall back to notifying the Executive Assistant directly so the
      // record doesn't silently stall.
      this.state.users.filter(u => u.systemRole === 'EA').forEach(u =>
        this.notifyUser(u.id, course, `${course.code} ready for verification`, `${course.code} — ${course.name} has been submitted and has no active Course Coordinator — please verify directly.`, true)
      );
      toast(`${course.code} submitted, but has no active Course Coordinator — sent to the Executive Assistant instead.`, 'ok');
    }
    this.navigate('ci-sections');
  },
  ciSaveDraft(courseId){ this.saveMarks(courseId); toast('InProgress saved.', 'ok'); },

  /* ---------- No-approval component submit/lock (SIA, Regular Lab/Skill
     Performance Assessment, Skill Certification, etc. — anything with no
     CI -> CC -> HOD chain) — see componentFullyEntered/noApprovalLockedFor.
     Marks are already saved live as they're typed (saveMarks/onMarkChange);
     this only flips the lock + status flag once every student has a mark. ---------- */
  submitNoApprovalComponent(courseId, compKey){
    const actor = this.currentUser();
    const course = this.getCourse(courseId);
    if(!course){ toast('Course not found.', 'err'); return; }
    if(!isCourseOwnerCI(course) && actor.systemRole!=='ADMIN'){ toast('Only this section\'s Course Instructor can submit this.', 'err'); return; }
    if(course.status!=='draft' && !course.editUnlocked){ toast('This record is locked.', 'err'); return; }
    const template = getCourseTemplate(course);
    const comp = (template.cie||[]).concat(seeDisplayComponents(template)).find(c=>c.key===compKey);
    if(!comp){ toast('Component not found.', 'err'); return; }
    if(!componentFullyEntered(course, comp)){ toast('Enter marks for every student before submitting.', 'err'); return; }
    this.saveMarks(courseId);
    course.noApprovalSubmitted = course.noApprovalSubmitted || {};
    course.noApprovalSubmitted[compKey] = true;
    syncCourse(course);
    this.logHistory(course, `${comp.label} marks submitted by the Course Instructor and locked for editing`);
    toast(`${comp.label} submitted — marks are now locked.`, 'ok');
    scheduleRenderContent();
  },
  /* Admin-only escape hatch — reopens a single no-approval component for
     correction without reopening the whole record (unlike editUnlocked,
     which is HOD-only and reopens everything). */
  reopenNoApprovalComponent(courseId, compKey){
    const actor = this.currentUser();
    if(actor.systemRole!=='ADMIN'){ toast('Only an Administrator can reopen a submitted component.', 'err'); return; }
    const course = this.getCourse(courseId);
    if(!course || !course.noApprovalSubmitted) return;
    delete course.noApprovalSubmitted[compKey];
    syncCourse(course);
    this.logHistory(course, `A submitted component was reopened for editing by the Administrator (${compKey})`);
    toast('Reopened for editing.', 'ok');
    scheduleRenderContent();
  },

  /* ---------- exam date, used to compute the 4-working-day evaluation
     deadline. Editable by whoever can currently edit this record. ---------- */
  setExamDate(courseId, dateStr){

     Course Coordinator (or HOD/Admin). Every other CIE/SEE component keeps
     its normal, deadline-free gating; only Practical Internal Test locks
     to the Course Instructor once this date passes (see
     pracInternalDeadlinePassed). Leaving it blank/clearing it removes the
     deadline and re-opens entry immediately. ---------- */
  setPracInternalDeadline(courseId, dateStr){
    const actor = this.currentUser();
    const course = this.getCourse(courseId);
    if(!course){ toast('Course not found.', 'err'); return; }
    const ccUser = getCourseCCUser(courseId);
    const allowed = actor.systemRole==='ADMIN' || actor.systemRole==='HOD' || ccUser?.id===actor.id;

    if(!allowed){ toast('Only this section\'s Course Coordinator or the HOD can set the Practical Internal Test starting time.', 'err'); return; }
    if(dateStr && course.pracInternalDeadline && new Date(dateStr) >= new Date(course.pracInternalDeadline)){ toast('The starting time must be before the ending time.', 'err'); return; }
    course.pracInternalStart = dateStr || '';

  /* ---------- CC: verify the instructor's submission and forward to the
     Executive Assistant. Sits between the CI's submission and the EA's
     verification in the approval chain. ---------- */
  ccForward(courseId){
    const course = this.getCourse(courseId);
    if(!course) return;
    const actor = this.currentUser();
    const ccUser = getCourseCCUser(courseId);
    if(ccUser?.id !== actor.id && actor.systemRole!=='ADMIN'){ toast('Only this section\'s Course Coordinator can verify and forward this record.', 'err'); return; }
    if(course.status !== 'submitted'){ toast('This record is not awaiting coordinator verification.', 'err'); return; }

    course.status = 'coordinated';
    syncCourse(course);
    this.logHistory(course, 'Verified by the Course Coordinator and forwarded to the Executive Assistant', remark);
    this.state.users.filter(u => u.systemRole === 'EA').forEach(u =>
      this.notifyUser(u.id, course, `${course.code} ready for verification`, `${course.code} — ${course.name} has been verified by the Course Coordinator and is awaiting your verification.`, true)
    );
    toast(`${course.code} forwarded to the Executive Assistant.`, 'ok');
    this.navigate('cc-list');
  },

  eaForward(courseId){

    const remarkEl = document.getElementById('ea-remark-input');
    course.eaRemark = remarkEl ? remarkEl.value.trim() : course.eaRemark;

    this.logHistory(course, 'Verified for completeness and forwarded to HOD', course.eaRemark);
    this.state.users.filter(u => u.systemRole === 'HOD').forEach(u =>
      this.notifyUser(u.id, course, `${course.code} ready for approval`, `${course.code} — ${course.name} has been verified by the Executive Assistant and is awaiting your approval.`, true)

  saveItemProgress(courseId){

  hodApprove(courseId){
    const course = this.getCourse(courseId);
    const actor = this.currentUser();
    course.status = 'approved';
    course.frozenAt = Date.now();
    course.frozenBy = actor.name;
    syncCourse(course);
    this.logHistory(course, `Approved and frozen by the HOD — record locked for result processing`);
    const ciUser = getCourseCIUser(courseId);
    const ccUser = getCourseCCUser(courseId);
    [ciUser, ccUser].filter(Boolean).forEach(u =>
      this.notifyUser(u.id, course, `${course.code} approved`, `${course.code} — ${course.name} has been approved and frozen by the HOD.`, true)
    );
