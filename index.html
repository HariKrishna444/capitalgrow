  },
  /* ---------- Examination Branch: final confirmation, layered ON TOP of an
     already HOD-approved (frozen) record — the flow is
     CI -> CC -> EA -> HOD -> EB for the Overall CIE/SEE/Grand Total. This
     is deliberately a separate boolean rather than a new course.status
     value, so it doesn't disturb the many existing "approved = locked"
     checks elsewhere; it's a checkpoint layered after freezing, not a
     replacement for it. */
  ebPublish(courseId){
    const course = this.getCourse(courseId);
    const actor = this.currentUser();
    if(actor.systemRole!=='EXAM' && actor.systemRole!=='ADMIN'){ toast('Only the Examination Branch can confirm this.', 'err'); return; }
    if(course.status!=='approved'){ toast('This record must be HOD-approved first.', 'err'); return; }
    course.ebPublished = true;
    course.ebPublishedAt = Date.now();
    course.ebPublishedBy = actor.name;
    syncCourse(course);
    this.logHistory(course, `Confirmed and published by the Examination Branch`);
    toast(`${course.code} confirmed by the Examination Branch.`, 'ok');
    this.navigate('exam-list');
  },

  /* ================= Per-item approval chain =================
     TT1, TT2, TT3, Practical Internal Test and SEE Practical each carry
     their OWN independent CI -> CC -> HOD chain (no EA step — separate
     from the Overall record's own CI -> CC -> EA -> HOD -> EB submission,
     which does include EA). A component sits
     at whichever stage currently owns it; that role forwards it on, or
     sends it back to the CI with a remark, which restarts the chain for
     that one component only — every other component and the Overall
     record are unaffected. SEE Theory never enters this at all; it's the
     Examination Branch's own record, outside this app's marks flow. */
  itemApproval(courseId, itemKey){
    const course = this.getCourse(courseId);
    if(!course) return null;
    course.itemApprovals = course.itemApprovals || {};
    return course.itemApprovals[itemKey] || (course.itemApprovals[itemKey] = { stage:'ci', remark:'', history:[] });
  },
  forwardItem(courseId, itemKey){
    const course = this.getCourse(courseId);
    if(!course) return;
    const actor = this.currentUser();
    const ia = this.itemApproval(courseId, itemKey);
    const label = ITEM_FLOW_LABELS[itemKey] || itemKey;
    if(ia.stage==='done'){ toast(`${label} is already approved.`, 'err'); return; }
    if(ia.stage==='ci'){
      if(actor.systemRole!=='ADMIN' && !isItemCIFor(course, itemKey)){ toast('Only the faculty assigned to this item can forward it.', 'err'); return; }
      ia.stage = 'cc';
      const ccAssignee = getActiveAssignment(courseId,'CC');
      if(ccAssignee) this.notifyUser(ccAssignee.userId, course, `${label} ready for verification`, `${course.code} — ${label} has been forwarded by the Course Instructor.`, true, null, itemEntryLink(course, itemKey));
      // Also let the HOD know right away that the CI has submitted — not
      // just once it actually reaches their own stage — so it shows up on
      // their notification bell as soon as it happens, giving them early
      // visibility into the department's marks-entry progress. No EA step
      // in this chain, so the EA isn't notified here.
      this.state.users.filter(u=>u.systemRole==='HOD').forEach(u=>this.notifyUser(u.id, course, `${label} submitted by Course Instructor`, `${course.code} — ${label} marks have been submitted by the Course Instructor and forwarded to the Course Coordinator for verification.`, true, null, itemEntryLink(course, itemKey)));
    } else if(ia.stage==='cc'){
      const ccUser = getCourseCCUser(courseId);
      if(ccUser?.id!==actor.id && actor.systemRole!=='ADMIN'){ toast('Only this section\'s Course Coordinator can forward this.', 'err'); return; }
      ia.stage = 'hod';
      this.state.users.filter(u=>u.systemRole==='HOD').forEach(u=>this.notifyUser(u.id, course, `${label} ready for approval`, `${course.code} — ${label} has been forwarded by the Course Coordinator.`, true, null, itemEntryLink(course, itemKey)));
    } else if(ia.stage==='hod'){
      if(actor.systemRole!=='HOD' && actor.systemRole!=='ADMIN'){ toast('Only the HOD can approve this.', 'err'); return; }
      ia.stage = 'done';
      const ciUser = getCourseCIUser(courseId);
      if(ciUser) this.notifyUser(ciUser.id, course, `${label} approved`, `${course.code} — ${label} has been approved by the HOD.`, true, null, itemEntryLink(course, itemKey));
    }
    ia.remark = '';
    ia.history.push({ by:actor.name, role:actor.systemRole, action: ia.stage==='done' ? 'approved' : `forwarded to ${ITEM_STAGE_LABELS[ia.stage]}`, ts:Date.now() });
    syncCourse(course);
    toast(ia.stage==='done' ? `${label} approved.` : `${label} forwarded to ${ITEM_STAGE_LABELS[ia.stage]}.`, 'ok');
    renderContent();
  },
  sendBackItem(courseId, itemKey, remark){
    const course = this.getCourse(courseId);
    if(!course) return;
    const actor = this.currentUser();
    const ia = this.itemApproval(courseId, itemKey);
    const label = ITEM_FLOW_LABELS[itemKey] || itemKey;
    if(ia.stage==='ci' || ia.stage==='done'){ toast('Nothing to send back from here.', 'err'); return; }
    // Course Coordinators don't send items back to the CI — that's a HOD
    // call (or an Admin override). A CC flags a problem with a particular
    // student via that student's CC Remark box instead, then forwards on
    // as normal. There's no EA step in this chain at all.
    if(ia.stage==='cc'){
      if(actor.systemRole!=='ADMIN'){ toast('Course Coordinators don\'t send items back — add a CC Remark for the student instead and forward it on; the HOD can send it back to the Course Instructor.', 'err'); return; }
    } else if(ia.stage==='hod' && actor.systemRole!=='HOD' && actor.systemRole!=='ADMIN'){ toast('Only the HOD can send this back.', 'err'); return; }
    if(!remark || !remark.trim()){ toast('A remark is required so the Course Instructor knows what to fix.', 'err'); return; }
    ia.stage = 'ci';
    ia.remark = remark.trim();
    ia.history.push({ by:actor.name, role:actor.systemRole, action:`sent back to CI: ${remark.trim()}`, ts:Date.now() });
    syncCourse(course);
    // Notify whoever now owns the ci stage for this item — the uploaded
    // roster-assignment faculty if this item has an override, otherwise the
    // section's ordinary registered CI.
    const overrides = getItemRosterOverrides(course, itemKey);
    if(overrides.length) overrides.forEach(o=>this.notifyUser(o.facultyUserId, course, `${label} sent back`, `${course.code} — ${label} was sent back: ${remark.trim()}`, true, null, itemEntryLink(course, itemKey)));
    else { const ciUser = getCourseCIUser(courseId); if(ciUser) this.notifyUser(ciUser.id, course, `${label} sent back`, `${course.code} — ${label} was sent back: ${remark.trim()}`, true, null, itemEntryLink(course, itemKey)); }
    toast(`${label} sent back to the Course Instructor.`, 'err');
    renderContent();
  },
  /* ---------- ADMIN: Roster Assignment — upload a roll-number list
     assigning a specific slice of students, for ONE item on ONE course, to
     a named faculty member — see getItemRosterOverrides/isItemCIFor above
     for how this plugs into the rest of the item-flow chain. Re-uploading
     for the SAME faculty+item replaces their previous slice outright
     (mirrors how re-importing a Course Registration sheet for the same
     Batch+Branch+Semester replaces its old rows) — a fresh file is assumed
     to be the corrected, complete list for that faculty, not an addition. A
     roll number only ever belongs to one faculty per item, so it's pulled
     out of any other faculty's slice on this same item first. */
  setItemRosterOverride(courseId, itemKey, facultyEmail, parsedRows, fileName){
    const actor = this.currentUser();
    if(actor.systemRole!=='ADMIN'){ toast('Only an Administrator can assign this.', 'err'); return; }
    const course = this.getCourse(courseId);
    if(!course){ toast('Course not found.', 'err'); return; }
    if(!ITEM_FLOW_KEYS.includes(itemKey)){ toast('Not a valid item.', 'err'); return; }
    const template = getCourseTemplate(course);
    if(!itemFlowApplicable(template, itemKey)){ toast('This item doesn\'t apply to this section\'s Evaluation Type.', 'err'); return; }
    const email = (facultyEmail||'').trim().toLowerCase();
    const faculty = this.state.users.find(u=>u.systemRole==='FACULTY' && (u.email||'').toLowerCase()===email);
    if(!faculty){ toast('No faculty account found with that email.', 'err'); return; }
    if(!Array.isArray(parsedRows) || !parsedRows.length){ toast('That file has no usable Roll No / Name rows.', 'err'); return; }

    const rollNos = [];
    const nameByRoll = {};
    const seen = new Set();
    parsedRows.forEach(r=>{
      const rollNo = String(r.rollNo||'').trim().toUpperCase();
      if(!rollNo || seen.has(rollNo)) return;
      seen.add(rollNo);
      rollNos.push(rollNo);
      nameByRoll[rollNo] = String(r.name||'').trim();
    });
    if(!rollNos.length){ toast('No usable roll numbers found in that file.', 'err'); return; }

    course.itemRosterOverrides = course.itemRosterOverrides || {};
    let list = course.itemRosterOverrides[itemKey] || [];
    list.forEach(batch=>{ if(batch.facultyUserId!==faculty.id) batch.rollNos = batch.rollNos.filter(r=>!seen.has(r)); });
    list = list.filter(batch=>batch.facultyUserId===faculty.id || batch.rollNos.length);
    const existing = list.find(b=>b.facultyUserId===faculty.id);
    const batchFields = { facultyUserId:faculty.id, facultyEmail:faculty.email, facultyName:faculty.name, rollNos, fileName:fileName||'', importedAt:Date.now(), importedBy:actor.name };
    if(existing) Object.assign(existing, batchFields); else list.push(batchFields);
    course.itemRosterOverrides[itemKey] = list;

    // Bring any brand-new roll numbers onto the course roster itself so the
    // normal marks-storage machinery (course.students[].marks) has
    // somewhere to hold what gets entered for them — matched against the
    // Student Directory when possible, added as course-only rows otherwise.
    const existingByRoll = {};
    (course.students||[]).forEach(s=>{ if(s.rollNo) existingByRoll[s.rollNo.toUpperCase()] = s; });
    const newlyAdded = [];
    rollNos.forEach(rollNo=>{
      if(existingByRoll[rollNo]) return;
      const dirMatch = (this.state.studentDirectory||[]).find(d=>d.rollNo.toUpperCase()===rollNo && d.branch===course.branch);
      const newRow = { id: bizId('CST', [course.code, course.section, rollNo], (course.students||[]).map(s=>s.id)), name: dirMatch ? dirMatch.name : (nameByRoll[rollNo]||rollNo), rollNo, email: dirMatch ? dirMatch.email : '', dirId: dirMatch ? dirMatch.id : null, marks:{} };
      course.students.push(newRow);
      existingByRoll[rollNo] = newRow;
      newlyAdded.push(newRow);
    });
    sortStudentsByRollNo(course.students);
    newlyAdded.forEach(s=>syncNewStudent(course.id, s));

    syncCourse(course);
    this.notifyUser(faculty.id, course, `${ITEM_FLOW_LABELS[itemKey]} roster assigned to you`, `${course.code} — you've been assigned ${rollNos.length} student${rollNos.length===1?'':'s'} for ${ITEM_FLOW_LABELS[itemKey]}, independent of the section's regular Course Instructor.`, true, null, itemEntryLink(course, itemKey));
    toast(`${ITEM_FLOW_LABELS[itemKey]} — assigned ${rollNos.length} student${rollNos.length===1?'':'s'} to ${faculty.name}${newlyAdded.length ? ` (${newlyAdded.length} new to the roster)` : ''}.`, 'ok');
    this.navigate('admin-roster-assignment', { courseId, itemKey });
  },
  removeItemRosterOverride(courseId, itemKey, facultyUserId){
    const actor = this.currentUser();
    if(actor.systemRole!=='ADMIN'){ toast('Only an Administrator can remove this.', 'err'); return; }
    const course = this.getCourse(courseId);
    if(!course || !course.itemRosterOverrides || !course.itemRosterOverrides[itemKey]) return;
    course.itemRosterOverrides[itemKey] = course.itemRosterOverrides[itemKey].filter(b=>b.facultyUserId!==facultyUserId);
    syncCourse(course);
    toast('Removed — this item falls back to the section\'s ordinary Course Instructor once every faculty slice is cleared.', 'ok');
    this.navigate('admin-roster-assignment', { courseId, itemKey });
  },
  /* ---------- CI: acknowledge a frozen (approved) record — completes the
     audit trail's "faculty acknowledgement" checkpoint. Purely a log entry;

     doesn't change status or unlock anything. ---------- */
  ciAcknowledge(courseId){
    const actor = this.currentUser();
    const course = this.getCourse(courseId);
    if(!course){ toast('Course not found.', 'err'); return; }
    const ciUser = getCourseCIUser(courseId);
    if(ciUser?.id !== actor.id && actor.systemRole!=='ADMIN'){ toast('Only this section\'s Course Instructor can acknowledge this record.', 'err'); return; }
    if(course.status !== 'approved'){ toast('This record isn\'t approved yet.', 'err'); return; }
    if(course.ciAcknowledgedAt){ toast('Already acknowledged.', 'ok'); return; }
    course.ciAcknowledgedAt = Date.now();
    syncCourse(course);
    this.logHistory(course, `Acknowledged by the Course Instructor (${actor.name})`);
    toast('Acknowledged.', 'ok');
    renderContent();
  },
  /* ---------- CI: request permission to correct marks on an already-approved
     record. Does not reopen the whole pipeline — just asks the HOD for a
     one-time edit unlock, so an Instructor is never editing an approved
     record without HOD sign-off. ---------- */
  ciRequestEditApproved(courseId, remark){
    const course = this.getCourse(courseId);
    if(!course){ toast('Course not found.', 'err'); return; }
    const rmk = (remark||'').trim();
    if(!rmk){ toast('Describe what needs correcting.', 'err'); return; }
    if(course.status!=='approved'){ toast('This record is not approved yet — edit it directly.', 'err'); return; }
    if(course.editRequestStatus==='pending'){ toast('A correction request is already pending HOD approval.', 'err'); return; }
    course.editRequestStatus = 'pending';
    course.editRequestRemark = rmk;
    course.editUnlocked = false;
    syncCourse(course);
    this.logHistory(course, 'Requested permission to correct marks after approval', rmk);
    this.state.users.filter(u=>u.systemRole==='HOD').forEach(u=>
      this.notifyUser(u.id, course, `Correction requested for ${course.code}`, `The Course Instructor is requesting permission to correct marks on the approved record ${course.code} — ${course.name}: "${rmk}"`, true)
    );
    toast('Correction request sent to the HOD.', 'ok');
    closeModal();
    this.navigate('ci-entry', { courseId });
  },
  hodApproveEdit(courseId){
    const course = this.getCourse(courseId);
    if(!course) return;
    course.editRequestStatus = 'approved';
    course.editUnlocked = true;
    syncCourse(course);
    this.logHistory(course, 'Approved instructor\'s request to correct marks — record temporarily unlocked for editing');
    const ciUser = getCourseCIUser(courseId);
    if(ciUser) this.notifyUser(ciUser.id, course, `Correction approved for ${course.code}`, `Your request to correct marks for ${course.code} — ${course.name} was approved. The record is unlocked for editing until you finish and re-lock it.`, true);
    toast('Correction approved — the instructor can now edit marks.', 'ok');
    this.navigate('hod-review', { courseId });
  },
  hodDenyEdit(courseId){
    const course = this.getCourse(courseId);
    if(!course) return;
    course.editRequestStatus = 'denied';
    course.editUnlocked = false;
    syncCourse(course);
    this.logHistory(course, 'Denied instructor\'s request to correct marks');
    const ciUser = getCourseCIUser(courseId);
    if(ciUser) this.notifyUser(ciUser.id, course, `Correction request denied for ${course.code}`, `Your request to correct marks for ${course.code} — ${course.name} was not approved.`, true);
    toast('Correction request denied.', 'err');
    this.navigate('hod-review', { courseId });
  },
  ciFinishEdit(courseId){
    this.saveMarks(courseId);
    const course = this.getCourse(courseId);
    if(!course) return;
    course.editUnlocked = false;
    course.editRequestStatus = null;
    course.editRequestRemark = '';
    syncCourse(course);
    this.logHistory(course, 'Finished correcting marks — record re-locked');
    this.state.users.filter(u=>u.systemRole==='HOD').forEach(u=>
      this.notifyUser(u.id, course, `${course.code} correction complete`, `The Course Instructor finished correcting marks for ${course.code} — ${course.name} and re-locked the record.`, true)
    );
    toast('Marks updated and re-locked.', 'ok');
    this.navigate('ci-sections');
  },

  /* ---------- CI: submit the Term Test 1/2 + Lab Internal group, or the
     Lab External group, for HOD approval. These two groups are entered by
     the Course Instructor exactly like any other CIE/SEE component, but
     can't be locked in until the HOD explicitly signs off — unlike the
     rest of CIE (SIA, Assignments, Seminars, etc.) which needs no such
     approval and stays freely editable until the whole record is
     submitted in the normal Stage 1→2→3 flow. */
  submitApprovalGroup(courseId, group){
    const actor = this.currentUser();
    const course = this.getCourse(courseId);
    if(!course){ toast('Course not found.', 'err'); return; }
    const ciUser = getCourseCIUser(courseId);
    if(ciUser?.id !== actor.id && actor.systemRole!=='ADMIN'){ toast('Only this section\'s Course Instructor can submit this for HOD approval.', 'err'); return; }
    if(!course.evalType){ toast('The Course Coordinator hasn\'t fixed an Evaluation Type for this section yet.', 'err'); return; }
    const template = getCourseTemplate(course);
    const comps = group==='ttlab' ? ttLabApprovalComponents(template) : labExternalApprovalComponents(template);
    if(!comps.length){ toast('This section\'s Evaluation Type has no components in this group.', 'err'); return; }
    if(!course.students.length){ toast('Add students to the roster before submitting.', 'err'); return; }
    const incomplete = course.students.some(s=>comps.some(c=>typeof s.marks[c.key] !== 'number'));
    if(incomplete){ toast('Enter marks for every student in this group before submitting for HOD approval.', 'err'); return; }
    const field = group==='ttlab' ? 'ttLabApproval' : 'labExternalApproval';
    if(course[field]==='approved'){ toast('This group is already approved and locked.', 'err'); return; }
    course[field] = 'pending';
    syncCourse(course);
    const groupLabel = group==='ttlab' ? 'Term Test 1/2 & Lab Internal' : 'Lab External';
    this.logHistory(course, `Submitted "${groupLabel}" marks for HOD approval`);
    this.state.users.filter(u=>u.systemRole==='HOD').forEach(u=>
      this.notifyUser(u.id, course, `${course.code} — ${groupLabel} awaiting approval`, `${actor.name} submitted the "${groupLabel}" marks for ${course.code} — ${course.name} and is awaiting your approval.`, true)
    );
    toast(`"${groupLabel}" submitted to the HOD for approval.`, 'ok');
    renderContent();
  },
  /* ---------- HOD: approve one of the two groups above. Approving locks
     that group's inputs on the Course Instructor's entry screen — it can
     only be reopened by an Administrator revoking the approval by hand
     (mirrors how an approved whole-record needs an Admin/HOD correction
     request to reopen). */
  hodApproveGroup(courseId, group){
    const actor = this.currentUser();
    if(!['HOD','ADMIN'].includes(actor.systemRole)){ toast('Only the HOD or an Administrator can approve this.', 'err'); return; }
    const course = this.getCourse(courseId);
    if(!course) return;
    const field = group==='ttlab' ? 'ttLabApproval' : 'labExternalApproval';
    course[field] = 'approved';
    syncCourse(course);
    const groupLabel = group==='ttlab' ? 'Term Test 1/2 & Lab Internal' : 'Lab External';
    this.logHistory(course, `Approved "${groupLabel}" marks`);
    const ciUser = getCourseCIUser(courseId);
    if(ciUser) this.notifyUser(ciUser.id, course, `${course.code} — ${groupLabel} approved`, `${actor.name} approved the "${groupLabel}" marks for ${course.code} — ${course.name}. This group is now locked.`, true, null, groupEntryLink(course));
    toast(`"${groupLabel}" approved for ${course.code}.`, 'ok');
    renderContent();
  },
  /* ---------- HOD: send a group back for correction instead of approving it. ---------- */
  hodRejectGroup(courseId, group, remark){
    const actor = this.currentUser();
    if(!['HOD','ADMIN'].includes(actor.systemRole)){ toast('Only the HOD or an Administrator can do this.', 'err'); return; }
    const course = this.getCourse(courseId);
    if(!course) return;
    const field = group==='ttlab' ? 'ttLabApproval' : 'labExternalApproval';
    course[field] = null;
    syncCourse(course);
    const groupLabel = group==='ttlab' ? 'Term Test 1/2 & Lab Internal' : 'Lab External';
    const rmk = (remark||'').trim();
    this.logHistory(course, `Sent back "${groupLabel}" marks for correction`, rmk);
    const ciUser = getCourseCIUser(courseId);
    if(ciUser) this.notifyUser(ciUser.id, course, `${course.code} — ${groupLabel} sent back`, `${actor.name} sent the "${groupLabel}" marks for ${course.code} — ${course.name} back for correction.${rmk?` Remark: "${rmk}"`:''}`, true, null, groupEntryLink(course));
    toast(`"${groupLabel}" sent back for correction.`, 'err');
    renderContent();
  },
  hodSendBack(courseId){
    const course = this.getCourse(courseId);
    const remarkEl = document.getElementById('sendback-remark');
    const remark = remarkEl ? remarkEl.value.trim() : '';
    if(!remark){ toast('A correction remark is required to send a record back.', 'err'); return; }
    course.status = 'draft';
    course.sentBack = true;
    course.lastRemark = remark;
    course.eaRemark = '';
    course.scrutinyRemark = '';
    syncCourse(course);
    this.logHistory(course, 'Sent back for correction', remark);
    const ciUser = getCourseCIUser(courseId);
    const ccUser = getCourseCCUser(courseId);
    [ciUser, ccUser].filter(Boolean).forEach(u => this.notifyUser(u.id, course, `${course.code} sent back for correction`, remark, true));
    toast(`${course.code} sent back to the instructor.`, 'err');
    closeModal();
    this.navigate('hod-list');
  },

  /* ---------- Admin only: fix the active Academic Year +
     Semester + examination cycle (Term Test 1/2/3), visible to every role.
     Fixing this cycle is an Administrator-only action — the Timetable
     Incharge and Course Coordinator no longer have any say over it. 
     Only one cycle can be active at a time — fixing a new one automatically
     supersedes whatever was active before, so e.g. enabling TT2 disables
     TT1 (its marks-entry table drops to read-only everywhere it's open).
     startDate/endDate (both optional) fence the cycle to a time window —
     once "now" is past endDate, entry locks automatically even if nobody
     explicitly closes the cycle. ---------- */
  setTermTest(academicYear, semester, cycle, startDate=null, endDate=null){
    const actor = this.currentUser();
    if(actor.systemRole!=='ADMIN'){ toast('Only an Administrator can fix the examination cycle.', 'err'); return; }
    if(!ACADEMIC_YEARS.includes(academicYear)){ toast('Choose an Academic Year.', 'err'); return; }
    if(!SEMESTER_LABELS.includes(semester)){ toast('Choose a Semester.', 'err'); return; }
    if(!TERM_TEST_LABELS[cycle]){ toast('Choose a valid term test.', 'err'); return; }
    if(startDate && endDate && new Date(startDate).getTime() > new Date(endDate).getTime()){ toast('The end date/time must be after the start date/time.', 'err'); return; }
    const value = { academicYear, semester, cycle, startDate: startDate||null, endDate: endDate||null };
    this.state.currentTermTest = value;
    syncAppSetting('current_term_test', value);
    this.state.termTestHistory = this.state.termTestHistory || [];
    const ttEntry = { id:bizId('TT', [cycle, this.state.termTestHistory.length+1], this.state.termTestHistory.map(t=>t.id)), ts:Date.now(), by:actor.name, value:cycle, academicYear, semester, cycle, startDate: startDate||null, endDate: endDate||null };
    this.state.termTestHistory.unshift(ttEntry);
    syncTermTest(ttEntry);
    const windowLabel = startDate || endDate ? ` Open ${startDate?fmtDate(new Date(startDate).getTime()):'now'} through ${endDate?fmtDate(new Date(endDate).getTime()):'further notice'}.` : '';
    const fullLabel = `${academicYear} · ${semester} · ${TERM_TEST_LABELS[cycle]}`;
    const ccUserIds = new Set(this.state.assignments.filter(a=>a.type==='CC' && a.status==='active').map(a=>a.userId));
    ccUserIds.forEach(uidTarget=>{
      const n = {
        id:bizId('NOTE', ['GENERAL', this.state.notifications.length+1], this.state.notifications.map(x=>x.id)), forUserId:uidTarget, courseId:null,
        title:`${fullLabel} is now the active cycle`,
        body:`${actor.name} (${ROLE_LABELS[actor.systemRole]||actor.systemRole}) fixed ${fullLabel} as the current examination cycle — any other cycle (e.g. ${cycle==='TT1'?'TT2':'TT1'}) is now locked for marks entry.${windowLabel} This is now visible to Course Coordinators, Course Instructors, the Executive Assistant, the Examination Branch, and the HOD.\n\nOpen it in DVS: ${buildAppLink('cc-list',{})}`,
        ts:Date.now(), read:false
      };
      this.state.notifications.unshift(n);
      syncNotification(n);
    });
    toast(`${fullLabel} set as the active cycle and sent to all Course Coordinators.`, 'ok');
    renderContent();
    renderBell();
  },
  /* Manually shuts off the active cycle (sets it back to "not set") so
     nobody can enter marks against any Term Test until the Administrator
     fixes the next one — the explicit "we're done, lock it"
     action, separate from letting the time window simply expire. */
  closeTermTestCycle(){
    const actor = this.currentUser();
    if(actor.systemRole!=='ADMIN'){ toast('Only an Administrator can close the examination cycle.', 'err'); return; }
    const cur = this.state.currentTermTest;
    if(!cur){ toast('No cycle is currently active.', 'err'); return; }
    const label = `${cur.academicYear} · ${cur.semester} · ${TERM_TEST_LABELS[cur.cycle]}`;
    // Before wiping it out, sweep every section for one whose CI never
    // forwarded this cycle's marks in time — those get a delay notification
    // of their own (see sweepTermTestDelays) so the gap doesn't just
    // disappear along with the closed cycle.
    this.sweepTermTestDelays(cur);
    this.state.currentTermTest = null;
    syncAppSetting('current_term_test', null);
    this.state.termTestHistory = this.state.termTestHistory || [];
    const ttEntry = { id:bizId('TT', ['CLOSE', this.state.termTestHistory.length+1], this.state.termTestHistory.map(t=>t.id)), ts:Date.now(), by:actor.name, value:'CLOSED', academicYear:cur.academicYear, semester:cur.semester, cycle:null, closedCycle:cur.cycle };
    this.state.termTestHistory.unshift(ttEntry);
    syncTermTest(ttEntry);
    const ccUserIds = new Set(this.state.assignments.filter(a=>a.type==='CC' && a.status==='active').map(a=>a.userId));
    ccUserIds.forEach(uidTarget=>{
      const n = { id:bizId('NOTE', ['GENERAL', this.state.notifications.length+1], this.state.notifications.map(x=>x.id)), forUserId:uidTarget, courseId:null,
        title:`${label} closed`, body:`${actor.name} (${ROLE_LABELS[actor.systemRole]||actor.systemRole}) closed ${label} — marks entry for it is now locked everywhere until the next cycle is fixed.\n\nOpen it in DVS: ${buildAppLink('cc-list',{})}`, ts:Date.now(), read:false };
      this.state.notifications.unshift(n);
      syncNotification(n);
    });
    toast(`${label} closed — marks entry is locked.`, 'ok');
    renderContent();
    renderBell();
  },

  /* ---------- Admin-fixed marks-entry windows for Practical Internal Test
     and SEE Practical — set from the same Term Test Cycle admin page as
     setTermTest above, but independent of it: these two don't supersede
     one another or the active TT cycle, they're just their own optional
     start/end fences. Layered ON TOP of the legacy per-course CC/HOD
     deadline (course.pracInternalStart/pracInternalDeadline for
     Practical Internal) rather than replacing it — entry needs to pass
     BOTH gates, so nothing already relying on the CC/HOD fields breaks;
     this just gives the Administrator an equal (or stricter) say. ---------- */
  setPracticalWindow(kind, startDate=null, endDate=null){

    if(actor.systemRole!=='ADMIN'){ toast('Only an Administrator can fix this window.', 'err'); return; }
    if(kind!=='pracInternal' && kind!=='seePractical'){ return; }
    if(startDate && endDate && new Date(startDate).getTime() > new Date(endDate).getTime()){ toast('The end date/time must be after the start date/time.', 'err'); return; }
    const value = { startDate: startDate||null, endDate: endDate||null };
    const settingKey = kind==='pracInternal' ? 'practical_internal_window' : 'see_practical_window';
    const label = kind==='pracInternal' ? 'Practical Internal Test' : 'SEE Practical';
    if(kind==='pracInternal') this.state.practicalInternalWindow = value;
    else this.state.seePracticalWindow = value;
    syncAppSetting(settingKey, value);
    const windowLabel = startDate || endDate ? ` Open ${startDate?fmtDate(new Date(startDate).getTime()):'now'} through ${endDate?fmtDate(new Date(endDate).getTime()):'further notice'}.` : ' No time restriction.';
    toast(`${label} marks-entry window set.${windowLabel}`, 'ok');

  },
  clearPracticalWindow(kind){

    if(actor.systemRole!=='ADMIN'){ toast('Only an Administrator can clear this window.', 'err'); return; }
    if(kind!=='pracInternal' && kind!=='seePractical'){ return; }

    else this.state.seePracticalWindow = null;

  /* ---------- Delay sweep: flags every course-section whose CI never
     forwarded TT1/TT2 marks before that cycle's entry window ended, and
     sends one notification each to that section's Course Coordinator, every
     HOD, and every Administrator, so a forgotten submission surfaces on
     their dashboard notification bell instead of silently sitting there.
     Guarded by itemApprovals[itemKey].delayNotified so each item only ever
     fires this once, however many times the sweep itself runs. Called (a)
     the moment the Administrator explicitly closes the cycle, and (b)
     passively on login if the window's own end time has already quietly
     passed without anyone closing it (see checkTermTestWindowExpiry). ---------- */
  sweepTermTestDelays(cycleInfo){
    if(!cycleInfo || !cycleInfo.cycle) return;
    const itemKey = cycleInfo.cycle==='TT1' ? 'tt1' : cycleInfo.cycle==='TT2' ? 'tt2' : null;
    if(!itemKey) return;
    const cycleLabel = TERM_TEST_LABELS[cycleInfo.cycle] || cycleInfo.cycle;
    const hodUsers = this.state.users.filter(u=>u.systemRole==='HOD');
    const adminUsers = this.state.users.filter(u=>u.systemRole==='ADMIN');
    let flaggedAny = false;
    this.state.courses.forEach(course=>{
      if(!course.evalType) return;
      const template = getCourseTemplate(course);
      const compKey = template ? termTestComponentKey(template, cycleInfo.cycle) : null;
      if(!compKey) return; // this cycle isn't part of the section's Evaluation Type
      if(!isTTForwarded(course, cycleInfo.cycle)) return; // CC never even forwarded the paper setup, so there was nothing for the CI to act on
      course.itemApprovals = course.itemApprovals || {};
      const ia = course.itemApprovals[itemKey];
      if(!ia || ia.stage!=='ci' || ia.delayNotified) return; // already forwarded on, or already flagged once
      ia.delayNotified = true;
      flaggedAny = true;
      const ciUser = getCourseCIUser(course.id);
      const ccUser = getCourseCCUser(course.id);
      const title = `${cycleLabel} marks not submitted — ${course.code}`;
      const body = `${course.code} — ${course.name}: ${cycleLabel} marks were not forwarded${ciUser ? ` by ${ciUser.name} (Course Instructor)` : ''} before the entry period ended.\n\nOpen it in DVS: ${buildAppLink('cc-list',{})}`;
      const targetIds = new Set();
      if(ccUser) targetIds.add(ccUser.id);
      hodUsers.forEach(u=>targetIds.add(u.id));
      adminUsers.forEach(u=>targetIds.add(u.id));
      targetIds.forEach(uid=>{
        const n = { id:bizId('NOTE', ['DELAY', this.state.notifications.length+1], this.state.notifications.map(x=>x.id)), forUserId:uid, courseId:course.id, title, body, ts:Date.now(), read:false };
        this.state.notifications.unshift(n);
        syncNotification(n);
      });
      syncCourse(course);
    });
    if(flaggedAny) renderBell();
  },
  /* Passive companion to sweepTermTestDelays — if the active cycle's own
     end-time has already gone by (nobody explicitly closed it), run the
     sweep anyway so a forgotten CI submission still gets caught. Does NOT
     touch currentTermTest itself — the window's expiry already makes entry
     read-only everywhere on its own; this only fires the notifications. */
  checkTermTestWindowExpiry(){
    const cur = this.state.currentTermTest;
    if(!cur || !cur.cycle || !cur.endDate) return;
    if(Date.now() > new Date(cur.endDate).getTime()) this.sweepTermTestDelays(cur);
  },



  /* ---------- CI: save one answer-cell of the structured Term Test entry
     form (short Q1-5, or long Q6-11 part a/b) and re-derive the raw /50
     score, which is written straight into the course's fixed tt1/tt2/
     termTest CIE component — the existing CIE scaling pipeline (scaledMax
     per template) takes it from there, exactly like any other CIE mark. */
  /* ---------- CI: set the Unit + marks-split ("8+8" or single "16") for
     each individual long-answer question (Q6-Q11) before entering marks —
     e.g. Q6 can be 8+8 from Unit 1 while Q7 is a single 16 from Unit 2, even
     though they're the same choice pair. Applies to the whole class for
     that cycle — the CI picks the Unit because units are decided when the
     question paper is made, not fixed by the app. ---------- */
  /* ---------- CC: set the Unit + marks-split ("8+8" or single "16") for
     each individual long-answer question (Q6-Q11) — and the Unit alone for
     each short question (Q1-Q5) — before the Course Instructor can enter
     marks against it. e.g. Q6 can be 8+8 from Unit 1 while Q7 is a single
     16 from Unit 2, even though they're the same choice pair. Applies to
     the whole class for that cycle — the CC (not the CI) picks the Unit,
     because the CC sets up the question paper and forwards it on; the CI
     only enters marks once it's forwarded. ---------- */
  setTTPaperConfig(courseId, cycle, qKey, field, value){
    const actor = this.currentUser();
    const course = this.getCourse(courseId);
    if(!course){ toast('Course not found.', 'err'); return; }
    const ccUser = getCourseCCUser(courseId);
    if(ccUser?.id !== actor.id && actor.systemRole!=='ADMIN'){ toast('Only this section\'s Course Coordinator can set up the question paper.', 'err'); return; }
    if(course.status!=='draft' && !course.editUnlocked){ toast('This record is locked.', 'err'); return; }
    if(isTTForwarded(course, cycle)){ toast('This setup was already forwarded to the Course Instructor — unlock it first to make changes.', 'err'); return; }
    course.ttPaperConfig = course.ttPaperConfig || {};
    course.ttPaperConfig[cycle] = course.ttPaperConfig[cycle] || {};
    course.ttPaperConfig[cycle][qKey] = course.ttPaperConfig[cycle][qKey] || {};
    course.ttPaperConfig[cycle][qKey][field] = value;
    syncCourse(course);
    renderContent();
  },

  /* ---------- CC: forward the finished Question Paper Setup to the Course
     Instructor. Locks the setup (CI cannot edit it, CC cannot either until
     unlocked again) and opens up marks entry for that cycle on the CI's
     side. Requires every question to have a Unit set first. ---------- */
  forwardTTPaperConfig(courseId, cycle){
    const actor = this.currentUser();
    const course = this.getCourse(courseId);
    if(!course){ toast('Course not found.', 'err'); return; }
    const ccUser = getCourseCCUser(courseId);
    if(ccUser?.id !== actor.id && actor.systemRole!=='ADMIN'){ toast('Only this section\'s Course Coordinator can forward the question paper setup.', 'err'); return; }
    if(!ttSetupComplete(course, cycle)){ toast('Set a Unit for every question (Q1–Q11) before forwarding.', 'err'); return; }
    course.ttPaperConfig = course.ttPaperConfig || {};
    course.ttPaperConfig[cycle] = course.ttPaperConfig[cycle] || {};
    course.ttPaperConfig[cycle].__forwarded = true;
    syncCourse(course);
    this.logHistory(course, `Question Paper Setup for ${TERM_TEST_LABELS[cycle]||cycle} forwarded to the Course Instructor`);
    const ciUser = getCourseCIUser(courseId);
    if(ciUser) this.notifyUser(ciUser.id, course, `Question paper set up for ${TERM_TEST_LABELS[cycle]||cycle}`, `${actor.name} finished the Question Paper Setup for ${course.code} — ${course.name} (${TERM_TEST_LABELS[cycle]||cycle}). You can now enter marks against it.`, true, null, { view:'ci-termtest-entry', params:{ courseId: course.id, cycle } });
    toast('Forwarded to the Course Instructor — marks entry is now open for this cycle.', 'ok');

  },

  /* ---------- CC: reopen a previously-forwarded setup for editing (e.g. a
     mistake was found). Locks the CI back out of marks entry for this cycle
     until it's forwarded again. ---------- */
  unlockTTPaperConfig(courseId, cycle){

  setTermTestMark(courseId, studentId, cycle, qKey, subpart, rawValue){
    const actor = this.currentUser();
    const course = this.getCourse(courseId);
    if(!course){ toast('Course not found.', 'err'); return; }
    // Uses isItemCIFor (not a plain "is this the registered CI" check) so
    // that once an Administrator has assigned a roll-number roster for
    // this Term Test cycle to a specific faculty member, marks-entry
    // permission follows THAT roster assignment rather than always
    // falling back to Course Registration's own CI — see itemEntryStudents.
    const ttItemKey = cycle==='TT1' ? 'tt1' : 'tt2';
    if(!isItemCIFor(course, ttItemKey) && actor.systemRole!=='ADMIN'){ toast('Only the faculty assigned to this Term Test can enter marks.', 'err'); return; }
    if(course.status!=='draft' && !course.editUnlocked){ toast('This record is locked — Term Test marks can no longer be edited.', 'err'); return; }
    if(!isTTForwarded(course, cycle)){ toast('Your Course Coordinator hasn\'t forwarded the Question Paper Setup for this cycle yet.', 'err'); return; }
    const s = (course.students||[]).find(x=>x.id===studentId);
    if(!s) return;
    s.marks = s.marks || {};
    s.marks.ttDetail = s.marks.ttDetail || {};
    s.marks.ttDetail[cycle] = s.marks.ttDetail[cycle] || {};
    // Note: no longer clamped to the question's max here — an out-of-range
    // entry is kept as typed and flagged red (see the `invalid` class in
    // renderCITermTestEntry) so the faculty member notices and fixes it
    // themselves, instead of it silently being rewritten to the maximum.
    let val = (rawValue===''||rawValue===null||rawValue===undefined) ? undefined : parseFloat(rawValue);
    if(typeof val==='number' && isNaN(val)) val = undefined;
    if(subpart){
      s.marks.ttDetail[cycle][qKey] = s.marks.ttDetail[cycle][qKey] || {};
      if(val===undefined) delete s.marks.ttDetail[cycle][qKey][subpart]; else s.marks.ttDetail[cycle][qKey][subpart] = val;
    } else {
      if(val===undefined) delete s.marks.ttDetail[cycle][qKey]; else s.marks.ttDetail[cycle][qKey] = val;
    }
    const template = getCourseTemplate(course);
    const compKey = termTestComponentKey(template, cycle);
    const calc = computeTermTestRaw(s.marks.ttDetail[cycle]);
    if(compKey) s.marks[compKey] = calc.total;
    syncStudent(courseId, s);
    // Deferred (not an immediate renderContent()) — see scheduleRenderContent's
    // comment: this onchange fires mid-click when moving to another box, and
    // an immediate rebuild here was hijacking that click (see user-reported
    // "clicking to the next box jumps to Evaluated Script" bug).
    scheduleRenderContent();
  },

  /* ---------- CC/EA/HOD: per-student remark on the Term Test entry table
     (one free-text note per role per student, e.g. flagging a particular
     answer script for a recheck) — kept in s.marks.ttRemarks[cycle][role]
     alongside the marks themselves so it rides along on the same student
     sync. Distinct from the whole-record verification remarks (eaRemark,
     lastRemark, etc); this one is about one student, not the whole class. */
  setTermTestStudentRemark(courseId, studentId, cycle, itemKey, role, value){
    const course = this.getCourse(courseId);
    if(!course){ toast('Course not found.', 'err'); return; }
    if(!['cc','ea','hod'].includes(role)) return;
    if(!canEditTTStudentRemark(course, itemKey, role)){ toast('You\'re not allowed to enter this remark right now.', 'err'); return; }
    const s = (course.students||[]).find(x=>x.id===studentId);
    if(!s) return;
    s.marks = s.marks || {};
    s.marks.ttRemarks = s.marks.ttRemarks || {};
    s.marks.ttRemarks[cycle] = s.marks.ttRemarks[cycle] || {};
    s.marks.ttRemarks[cycle][role] = (value||'').trim();
    syncStudent(courseId, s);
  },

  /* ---------- CI: SIA unit-wise entry — sums the per-unit /10 scores into
     s.marks[compKey] (the same "raw" slot every other CIE component uses),
     which the existing generic (raw/rawMax)*scaledMax pipeline then scales
     down automatically. Mirrors setTermTestMark's ttDetail pattern. ---------- */
  setSiaUnitMark(courseId, studentId, compKey, unitIdx, rawValue){
    const actor = this.currentUser();
    const course = this.getCourse(courseId);
    if(!course){ toast('Course not found.', 'err'); return; }
    const ciUser = getCourseCIUser(courseId);
    if(ciUser?.id !== actor.id && actor.systemRole!=='ADMIN'){ toast('Only this section\'s Course Instructor can enter SIA marks.', 'err'); return; }
    if(course.status!=='draft' && !course.editUnlocked){ toast('This record is locked — SIA marks can no longer be edited.', 'err'); return; }
    const s = (course.students||[]).find(x=>x.id===studentId);
    if(!s) return;
    s.marks = s.marks || {};
    s.marks.siaDetail = s.marks.siaDetail || {};
    // Each unit is out of 10 — clamp here so a mistyped value (e.g. "40"
    // instead of "4") can never push the Raw Total past the unit's own
    // max, let alone the component's overall rawMax. Previously this was
    // left unclamped and only flagged red, which let the Raw Total display
    // read something like "40/10" — confusing since the /10 there is the
    // component's max, not that one cell's.
    let val = (rawValue===''||rawValue===null||rawValue===undefined) ? undefined : parseFloat(rawValue);
    if(typeof val==='number' && isNaN(val)) val = undefined;
    if(typeof val==='number') val = Math.min(Math.max(val, 0), 10);
    if(val===undefined) delete s.marks.siaDetail['unit'+unitIdx]; else s.marks.siaDetail['unit'+unitIdx] = val;
    const sum = Object.values(s.marks.siaDetail).reduce((a,b)=>a+(typeof b==='number'?b:0), 0);
    s.marks[compKey] = Math.round(sum*2)/2;
    syncStudent(courseId, s);
    // Deferred — same click-hijacking issue as setTermTestMark above.
    scheduleRenderContent();
  },

  bulkImportFaculty(rows){

    if(!Array.isArray(rows) || rows.length===0){ toast('That file has no rows to import.', 'err'); return; }
    let added=0, updated=0, skipped=0;
    const touched = [];
    rows.forEach(row=>{
      const keys = Object.keys(row||{});
      const findKey = (re) => keys.find(k=>re.test(String(k).trim()));
      const nameKey = findKey(/^name$/i);
      const emailKey = findKey(/^e-?mail$/i);
      const branchKey = findKey(/^branch$/i);
      const name = nameKey ? String(row[nameKey]).trim() : '';
      const email = emailKey ? String(row[emailKey]).trim().toLowerCase() : '';
      const branch = branchKey ? String(row[branchKey]).trim().toUpperCase() : '';
      if(!name || !email || !isValidEmail(email) || !BRANCH_LABELS[branch]){ skipped++; return; }
      const existing = this.state.users.find(u=>u.email.toLowerCase()===email);
      if(existing && existing.systemRole!=='FACULTY'){ skipped++; return; }
      if(existing){ existing.name=name; existing.homeBranch=branch; updated++; touched.push(existing); }
      else { const u2={ id:bizId('FAC', [email.split('@')[0]], this.state.users.map(u=>u.id)), name, email, systemRole:'FACULTY', homeBranch:branch }; this.state.users.push(u2); added++; touched.push(u2); }
    });
    syncProfiles(touched);

    }

  /* ---------- EA: student directory, uploaded batch- and branch-wise ----------
     Roster is keyed by (roll_no, batch) — same roll number can recur across
     different batches but not twice within one. Branch/Department is
     per-row, so one file can freely mix CSE/AIML/SAP/etc rows together and
     each is filed under its own branch automatically — no need to split
     the file per department first. */
  addStudentToDirectory(rawRollNo, rawName, rawEmail, batch, branch, rawSemester){
    const actor = this.currentUser();
    if(!['EA','ADMIN'].includes(actor.systemRole)){ toast('Only the Executive Assistant can update the student directory.', 'err'); return; }
    const rollNo = (rawRollNo||'').trim().toUpperCase();
    const name = (rawName||'').trim();
    const email = (rawEmail||'').trim().toLowerCase();
    const semester = (rawSemester||'').trim();
    if(!rollNo || !name){ toast('Roll No and Name are required.', 'err'); return; }
    if(email && !isValidEmail(email)){ toast('Enter a valid email address, or leave it blank.', 'err'); return; }
    if(!BATCH_BRANCHES[batch]){ toast('Choose a Batch.', 'err'); return; }
    if(!BATCH_BRANCHES[batch].includes(branch)){ toast(`${branch || 'That branch'} isn't offered for ${batch} — valid branches are ${BATCH_BRANCHES[batch].join(', ')}.`, 'err'); return; }
    const existing = this.state.studentDirectory.find(s=>s.rollNo===rollNo && s.batch===batch);
    let row;
    if(existing){
      Object.assign(existing, { name, email, branch, semester });
      row = existing;
    } else {
      row = { id:bizId('STU', [rollNo, batch], this.state.studentDirectory.map(s=>s.id)), rollNo, name, email, branch, batch, semester };
      this.state.studentDirectory.push(row);
    }

    this.navigate('ea-students');

  removeStudentFromDirectory(id){

    const idx = this.state.studentDirectory.findIndex(s=>s.id===id);
    if(idx===-1) return;

  },
  // rows: parsed spreadsheet rows with Roll No / Name / Email / Department / Semester
  // columns (Department may be a mix of any branch valid for `batch` — each
  // row is sorted into its own branch automatically from that column).
  bulkImportStudents(rows, batch){
    const actor = this.currentUser();
    if(!['EA','ADMIN'].includes(actor.systemRole)){ toast('Only the Executive Assistant can import the student directory.', 'err'); return; }
    if(!BATCH_BRANCHES[batch]){ toast('Choose a Batch before importing.', 'err'); return; }
    if(!Array.isArray(rows) || rows.length===0){ toast('That file has no rows to import.', 'err'); return; }
    let added=0, updated=0, skipped=0;
    const bySort = {}; // branch -> count, just for the summary toast
    rows.forEach(row=>{
      const keys = Object.keys(row||{});
      const findKey = (re) => keys.find(k=>re.test(String(k).trim()));
      const rollKey = findKey(/^roll\s*-?no\.?$/i);
      const nameKey = findKey(/^name$/i);
      const emailKey = findKey(/^e-?mail$/i);
      const deptKey = findKey(/^dep(artmen)?t$/i) || findKey(/^branch$/i);
      const semKey = findKey(/^sem(ester)?$/i);
      const rollNo = rollKey ? String(row[rollKey]).trim().toUpperCase() : '';
      const name = nameKey ? String(row[nameKey]).trim() : '';
      const email = emailKey ? String(row[emailKey]).trim().toLowerCase() : '';
      const branch = deptKey ? String(row[deptKey]).trim().toUpperCase() : '';
      const semester = semKey ? String(row[semKey]).trim() : '';
      if(!rollNo || !name || !BATCH_BRANCHES[batch].includes(branch)){ skipped++; return; }
      if(email && !isValidEmail(email)){ skipped++; return; }
      const existing = this.state.studentDirectory.find(s=>s.rollNo===rollNo && s.batch===batch);
      if(existing){ Object.assign(existing, { name, email, branch, semester }); updated++; }
      else { this.state.studentDirectory.push({ id:bizId('STU', [rollNo, batch], this.state.studentDirectory.map(s=>s.id)), rollNo, name, email, branch, batch, semester }); added++; }
      bySort[branch] = (bySort[branch]||0) + 1;
    });
    const touched = this.state.studentDirectory.filter(s=>s.batch===batch);
    syncStudentDirectoryEntries(touched);
    if(added+updated===0){
      toast(`Import found nothing usable. Check the file has Roll No, Name, Department (${BATCH_BRANCHES[batch].join('/')} for ${batch}) columns.`, 'err');
    } else {
      const sortSummary = Object.keys(bySort).sort().map(b=>`${b}: ${bySort[b]}`).join(', ');
      toast(`Import complete — ${added} added, ${updated} updated${skipped?`, ${skipped} skipped`:''}. Sorted by department — ${sortSummary}.`, 'ok');
    }
    this.navigate('ea-students');
  },

  /* ---------- ADMIN: course registration import ----------
     Wide-format sheet: Regulation, Semester, StudentRollNumber, StudentName,
     then one column per subject (the subject set differs per branch/batch/
     semester file, which is fine — every column after the first four is
     treated as a subject). Each cell is "SECTION : Instructor" (possibly
     several, comma-separated, for multi-component subjects) or "-" for "not
     registered". `batch` and `branch` are picked by the Admin before import
     (the sheet's own Regulation text doesn't map cleanly onto the app's
     batch/branch keys), Semester is read per-row from the sheet itself.
     Re-importing the same batch+branch+semester replaces its prior rows
     wholesale, so a corrected re-upload never leaves stale duplicates. */
  bulkImportCourseRegistrations(rows, batch, branch){
    const actor = this.currentUser();
    if(actor.systemRole!=='ADMIN'){ toast('Only an Administrator can import course registrations.', 'err'); return; }
    if(!BATCH_BRANCHES[batch]){ toast('Choose a Batch before importing.', 'err'); return; }
    if(!BATCH_BRANCHES[batch].includes(branch)){ toast(`${branch || 'That branch'} isn't offered for ${batch} — valid branches are ${BATCH_BRANCHES[batch].join(', ')}.`, 'err'); return; }
    if(!Array.isArray(rows) || rows.length===0){ toast('That file has no rows to import.', 'err'); return; }

    const headerKeys = Object.keys(rows[0]||{});
    const findKey = (names) => headerKeys.find(h=>names.includes(String(h).trim().toLowerCase()));
    const kReg = findKey(['regulation']);
    const kSem = findKey(['semester']);
    const kRoll = findKey(['studentrollnumber','roll no','rollno','roll number']);
    const kName = findKey(['studentname','name']);
    if(!kRoll || !kName){ toast('Could not find StudentRollNumber / StudentName columns in this file.', 'err'); return; }
    const subjectKeys = headerKeys.filter(h=>![kReg,kSem,kRoll,kName].includes(h) && String(h).trim() && !/^__EMPTY/.test(String(h)));
    if(!subjectKeys.length){ toast('No subject columns found after Regulation/Semester/StudentRollNumber/StudentName.', 'err'); return; }

    const newRegs = [];
    const dirTouched = [];
    let studentsSeen = 0, cellsSkipped = 0;
    rows.forEach(row=>{
      const rollNo = String(row[kRoll]||'').trim().toUpperCase();
      const name = String(row[kName]||'').trim();
      if(!rollNo || !name) return;
      studentsSeen++;
      const regulation = kReg ? String(row[kReg]||'').trim() : '';
      const semester = kSem ? String(row[kSem]||'').trim() : '';

      // Keep the Student Directory in sync too, so this roll number is
      // recognized everywhere else in the app (roster imports, etc.).
      const existingDir = this.state.studentDirectory.find(s=>s.rollNo===rollNo && s.batch===batch);
      if(existingDir){ existingDir.name=name; existingDir.branch=branch; if(semester) existingDir.semester=semester; dirTouched.push(existingDir); }
      else {
        const d = { id:bizId('STU',[rollNo,batch], this.state.studentDirectory.map(s=>s.id)), rollNo, name, email:'', branch, batch, semester };
        this.state.studentDirectory.push(d); dirTouched.push(d);
      }

      subjectKeys.forEach(subjectKey=>{
        const subjectName = String(subjectKey).trim();
        const entries = parseRegistrationCell(row[subjectKey]);
        entries.forEach(en=>{
          if(!en.instructor && !en.sectionCode){ cellsSkipped++; return; }
          const idPool = this.state.courseRegistrations.map(r=>r.id).concat(newRegs.map(r=>r.id));
          newRegs.push({
            id: bizId('REG', [batch, branch, semester, rollNo, subjectName, en.sectionCode], idPool),
            batch, branch, regulation, semester, rollNo, studentName:name,
            subjectName, sectionCode:en.sectionCode, instructorName:en.instructor
          });
        });
      });
    });

    if(!newRegs.length){ toast('No registrations found to import — check the file headings match the expected format (Regulation, Semester, StudentRollNumber, StudentName, then one column per subject).', 'err'); return; }

    const semestersTouched = [...new Set(newRegs.map(r=>r.semester))];
    this.state.courseRegistrations = this.state.courseRegistrations.filter(r=>!(r.batch===batch && r.branch===branch && semestersTouched.includes(r.semester)));
    this.state.courseRegistrations.push(...newRegs);

    deleteCourseRegistrationsFor(batch, branch, semestersTouched).then(()=>syncCourseRegistrations(newRegs));
    syncStudentDirectoryEntries(dirTouched);

    const subjectCount = new Set(newRegs.map(r=>r.subjectName)).size;
    toast(`Imported ${newRegs.length} registrations for ${studentsSeen} students across ${subjectCount} subjects (${BATCH_LABELS[batch]} · ${branchLabel(branch)}).${cellsSkipped?` ${cellsSkipped} cells skipped.`:''}`, 'ok');
    this.navigate('admin-course-reg');
  },
  removeCourseRegistration(id){
    const actor = this.currentUser();
    if(actor.systemRole!=='ADMIN'){ toast('Only an Administrator can edit course registrations.', 'err'); return; }
    const idx = this.state.courseRegistrations.findIndex(r=>r.id===id);
    if(idx===-1) return;
    this.state.courseRegistrations.splice(idx,1);
    warnOnError(sb.from('course_registrations').delete().eq('id', id), 'course_registrations-delete:'+id, {toastOnFail:true});
    this.navigate('admin-course-reg');
  },

  /* ---------- ADMIN: turn one imported (subject, section) group into a real
     course section — creates/reuses the course row, assigns the matched
     faculty account as Course Instructor (active immediately, same as every
     other Admin override in this app), and loads the roster from the
     Student Directory so the CI sees these students under "My Subjects"
     right away. Deliberately does NOT invent a faculty login from a bare
     name — the instructor must already exist as a FACULTY account (added
     via Manage System Accounts or the Faculty Directory) with a name that
     matches the sheet exactly, otherwise this can't safely resolve who to
     assign. If the subject isn't found by name in "Courses Applicable", the
     section is still created and the CI assigned, but the Evaluation Type
     is left unfixed — marks entry stays blocked until a Coordinator (or
     Admin) fixes one, same as any freshly created section. */
  async activateCourseRegistrationGroup(idx){
    const actor = this.currentUser();
    if(actor.systemRole!=='ADMIN'){ toast('Only an Administrator can activate a course section from registration data.', 'err'); return; }
    const key = courseRegGroupIndex[idx];
    if(!key){ toast('Could not find that group — refresh the page and try again.', 'err'); return; }
    const { batch, branch, semester, subject, section } = key;
    const list = this.state.courseRegistrations.filter(r=>
      r.batch===batch && r.branch===branch && (r.semester||'—')===semester && r.subjectName===subject && (r.sectionCode||'—')===section);
    if(!list.length){ toast('No registrations found for this group.', 'err'); return; }

    const norm = s => String(s||'').trim().toLowerCase();
    const instructorNames = [...new Set(list.map(r=>r.instructorName).filter(Boolean))];
    if(instructorNames.length===0){ toast('No instructor is listed for this section in the imported sheet.', 'err'); return; }
    if(instructorNames.length>1){ toast(`This section lists more than one instructor (${instructorNames.join(', ')}) — fix the sheet or split the section before activating.`, 'err'); return; }
    const instructorName = instructorNames[0];

    const matches = this.state.users.filter(u=>u.systemRole==='FACULTY' && norm(u.name)===norm(instructorName));
    if(matches.length===0){ toast(`No faculty account named "${instructorName}" was found. Add them first — Manage System Accounts or the Faculty Directory — with the name spelled exactly as in the sheet, then activate again.`, 'err'); return; }
    if(matches.length>1){ toast(`More than one faculty account is named "${instructorName}" (${matches.map(m=>m.email).join(', ')}) — rename one to disambiguate, or assign the Course Instructor manually from Manage Coordinators.`, 'err'); return; }
    const ciUser = matches[0];

    const subj = (this.state.subjects||[]).find(s=>norm(s.name)===norm(subject));
    const code = subj ? subj.code : bizId('SUBJ', [subject], []).replace(/^SUBJ-/,'');
    const name = subj ? subj.name : subject;
    const evalType = subj ? subj.abbr : null;
    const sec = section==='—' ? '' : section;

    let course = this.state.courses.find(c=>normalizeCode(c.code)===normalizeCode(code) && c.section===sec && c.branch===branch);
    const isNewCourse = !course;
    if(!course){
      course = {
        id: bizId('CRS', [code, branch, sec||'nosec'], this.state.courses.map(c=>c.id)), code, name, section:sec, branch,
        status:'draft', sentBack:false, lastRemark:'', eaRemark:'', evalType, examDate:'', pracInternalDeadline:'', pracInternalStart:'', scrutinyRemark:'', frozenAt:null, frozenBy:'', scriptUploads:{},
        editRequestStatus:null, editRequestRemark:'', editUnlocked:false, ttLabApproval:null, labExternalApproval:null, etRequests:[], ttPaperConfig:{},
        students:[], studentsLoaded:true, history:[]
      };
      this.state.courses.push(course);
    } else if(!course.evalType && evalType){
      course.evalType = evalType;
    }
    const { error: courseErr } = await syncCourse(course);
    if(courseErr){ if(isNewCourse) this.state.courses = this.state.courses.filter(c=>c.id!==course.id); return; }

    // Build/refresh the roster from the Student Directory so names/emails
    // stay linked; rows that already exist (matched by dirId) keep their
    // marks — only additions show up as new.
    const dirByRoll = {};
    (this.state.studentDirectory||[]).forEach(d=>{ if(d.batch===batch) dirByRoll[d.rollNo] = d; });
    const existingByDirId = {};
    (course.students||[]).forEach(s=>{ if(s.dirId) existingByDirId[s.dirId] = s; });
    const nextStudents = [];
    list.forEach(r=>{
      const dir = dirByRoll[r.rollNo];
      const already = dir ? existingByDirId[dir.id] : (course.students||[]).find(s=>!s.dirId && s.rollNo===r.rollNo);
      if(already){ already.name=r.studentName; already.rollNo=r.rollNo; nextStudents.push(already); }
      else {
        const idPool = (course.students||[]).map(s=>s.id).concat(nextStudents.map(s=>s.id));
        nextStudents.push({ id: bizId('CST', [course.code, course.section||'nosec', r.rollNo], idPool), name:r.studentName, rollNo:r.rollNo, email: dir?dir.email:'', dirId: dir?dir.id:null, marks:{} });
      }
    });
    sortStudentsByRollNo(nextStudents);
    course.students = nextStudents;
    nextStudents.forEach(s=>syncNewStudent(course.id, s));

    // Assign the Course Instructor — active immediately, mirroring every
    // other Admin-initiated assignment in this app.
    const existingCI = getCourseCIUser(course.id);
    if(!existingCI || existingCI.id !== ciUser.id){
      (this.state.assignments||[]).filter(a=>a.courseId===course.id && a.type==='CI' && a.status==='active').forEach(a=>{
        a.status='revoked'; a.revokedAt=Date.now(); a.revokedBy=actor.id; syncAssignment(a);
      });
      const ciRec = { id:bizId('ASG', ['CI', course.code, course.section||'nosec', String(Date.now())], this.state.assignments.map(a=>a.id)), type:'CI', courseId:course.id, userId:ciUser.id, email:ciUser.email, assignedBy:actor.id, assignedAt:Date.now(), status:'active' };
      this.state.assignments.push(ciRec);
      syncAssignment(ciRec);
      this.notifyUser(ciUser.id, course, `You're now Course Instructor`, `${actor.name} assigned you as Course Instructor for ${course.code} — ${course.name} (Section ${course.section||'—'} · ${branchLabel(course.branch)}), imported from the course registration sheet.`, true, actor.email);
    }
    this.logHistory(course, `Course section activated from Course Registration import: ${code} — ${name} (Section ${sec||'—'} · ${branchLabel(branch)}) · Instructor ${ciUser.name} (${ciUser.email}) (by ${actor.name})`);

    if(!evalType){
      toast(`${ciUser.name} is now Course Instructor for ${code} · Section ${sec||'—'} — ${nextStudents.length} student${nextStudents.length===1?'':'s'} loaded. No matching subject was found in "Courses Applicable", so the Evaluation Type isn't fixed yet — a Coordinator (or you, as Admin) will need to set one before marks can be entered.`, 'ok');
    } else {
      toast(`${ciUser.name} is now Course Instructor for ${code} · Section ${sec||'—'} — ${nextStudents.length} student${nextStudents.length===1?'':'s'} loaded, Evaluation Type ${evalType} auto-matched.`, 'ok');
    }
    renderSidebar();
    this.navigate('admin-course-reg');
  },
  /* ---------- ADMIN: set a course's Evaluation Type directly, bypassing
     the CC-request / HOD-approval chain — for sections that have a Course
     Instructor but no Course Coordinator to request one (e.g. sections
     activated straight from a Course Registration import), or any other
     case where you don't want to wait on that workflow. */
  async adminSetEvalType(courseId, abbr){
    const actor = this.currentUser();
    if(actor.systemRole!=='ADMIN'){ toast('Only an Administrator can set an Evaluation Type directly.', 'err'); return; }
    const course = this.getCourse(courseId);
    if(!course){ toast('Could not find that course.', 'err'); return; }
    const t = getTemplate(abbr);
    if(!t){ toast('Choose a valid Evaluation Type.', 'err'); return; }
    course.evalType = abbr;
    const { error } = await syncCourse(course);
    if(error) return;
    this.logHistory(course, `Evaluation Type set directly to ${abbr} — ${t.label} (by ${actor.name}, Admin override)`);
    const ciUser = getCourseCIUser(courseId);
    if(ciUser) this.notifyUser(ciUser.id, course, `Evaluation Type fixed`, `${actor.name} set the Evaluation Type for ${course.code} — ${course.name} (Section ${course.section||'—'} · ${branchLabel(course.branch)}) to "${t.label}". You can now enter marks.`, true, actor.email);
    toast(`Evaluation Type set to ${t.label} for ${course.code} · Section ${course.section||'—'}.`, 'ok');
    this.navigate('hod-review', { courseId });
  },
};
window.App = App;

/* ---------------- small helpers ---------------- */
// SIA is always entered as 5 unit columns of /10 each (50 raw total) via
// siaEntryHtml's unit-wise widget, regardless of what rawMax a given
// Evaluation Type template happens to declare for the 'sia' key — several
// templates (ET1/ET2/ET3/ETP1/ETP2/ETS) declare 10, not 50, since that
// number was only ever meant to pair with scaledMax for the maths, never to
// be the actual entry ceiling. Every place that reads a component's raw
// value against its "max" — to scale it, to validate/flag it, or to display
// "raw/max" — must go through this instead of comp.rawMax directly, or a
// SIA raw total (up to 50) gets compared against a far smaller denominator:
// the scaled/CIE total silently caps out as soon as raw crosses 10, and
// validateCIEComplete() wrongly rejects a perfectly normal SIA total as
// "exceeding the maximum" and blocks the CI from submitting.
const SIA_RAW_ENTRY_MAX = 50;
const SIA_UNIT_COUNT = 5;
function componentRawScale(comp){ return (comp && comp.key==='sia') ? SIA_RAW_ENTRY_MAX : (comp ? comp.rawMax : 0); }
/* ---------- Per-exam absence ----------
   Attendance used to be a single "Absent" checkbox for the WHOLE student
   (App.toggleStudentAbsent, on the Review Full Record page) — checking it
   wiped s.marks entirely, clearing every exam's marks even if the student
   only missed, say, Term Test 1. That's the bug this replaces: absence is
   now tracked separately per component/exam in s.marks.absent[compKey],
   set via App.setComponentAbsent right on that exam's own entry page.
   Marking a student absent for one exam only clears THAT exam's marks (and
   its own detail — ttDetail[cycle], siaDetail) and leaves every other
   exam's marks for that student completely untouched. */
function isAbsentForComponent(student, compKey){
  return !!(student && student.marks && student.marks.absent && student.marks.absent[compKey]);
}
/* Derived "fully absent" — true only once a student is marked absent on
   EVERY CIE component of this course, not just one. Used purely for
   summary stats/averages that used to read the old global s.absent flag;
   actual completion checks (validateCIEComplete etc.) always go through
   isAbsentForComponent per-component instead. */
function isFullyAbsentFromCIE(course, s){
  const comps = course.evalType ? getCourseComponents(course) : [];
  if(!comps.length) return false;
  return comps.every(comp=>isAbsentForComponent(s, comp.key));
}
/* ---------- No-approval component completion / submit-lock ----------
   SIA, Regular Lab/Skill Performance Assessment, Skill Certification, and
   every other CIE/SEE component with no CI -> CC -> HOD chain (see
   ITEM_FLOW_KEYS — these are NOT in that list) don't need anyone's
   sign-off. Once the Course Instructor has entered a mark for every
   non-absent student, they can Submit the component: it locks (goes
   non-editable, same as an approved item) and its status flips from
   InProgress to Completed — see App.submitNoApprovalComponent and
   noApprovalLockedFor below. Storage: course.noApprovalSubmitted[compKey]. */
function componentFullyEntered(course, comp){
  const students = (course.students||[]).filter(s=>!isAbsentForComponent(s, comp.key));
  if(!students.length) return false;
  if(comp.key==='sia'){
    return students.every(s=>{
      const detail = (s.marks && s.marks.siaDetail) || {};
      return Object.keys(detail).length>=SIA_UNIT_COUNT && Array.from({length:SIA_UNIT_COUNT},(_,i)=>detail['unit'+(i+1)]).every(v=>typeof v==='number');
    });
  }
  return students.every(s=>typeof (s.marks||{})[comp.key]==='number');
}
/* True once the CI has submitted this no-approval component AND the record
   isn't currently reopened for correction (correctionMode always wins —
   same as every other lock in this app, so a HOD-reopened record can have
   even a previously-submitted component corrected and resubmitted). */
function noApprovalLockedFor(course, comp){
  const correctionMode = course.status==='approved' && course.editUnlocked;
  return !!(course.noApprovalSubmitted && course.noApprovalSubmitted[comp.key]) && !correctionMode;
}
function computeCIE(student, components){
  components = components || [];
  let total = 0, complete = true;
  components.forEach(comp=>{
    const raw = student.marks[comp.key];
    if(typeof raw !== 'number'){ complete = false; return; }
    const rawScale = componentRawScale(comp);
    total += (Math.min(raw, rawScale)/rawScale) * comp.scaledMax;
  });
  return { total: round1(total), complete };
}
function computeSEE(student, components){
  return computeCIE(student, components || []);
}
function computeGrandTotal(student, course){
  const template = getCourseTemplate(course);
  const cie = computeCIE(student, template.cie);
  const see = computeSEE(student, seeDisplayComponents(template));
  return { cieTotal:cie.total, seeTotal:see.total, total: round1(cie.total + see.total), complete: cie.complete && see.complete };
}
function courseCIEComplete(course){
  if(!course.studentsLoaded) return !!course.cieComplete; // from course_completion_status, computed server-side
  const components = getCourseComponents(course);
  return course.students.length>0 && course.students.every(s=>computeCIE(s, components).complete);
}
function courseSEEComplete(course){
  if(!course.studentsLoaded) return !!course.seeComplete; // from course_completion_status, computed server-side
  const components = getCourseSeeComponents(course);
  return course.students.length>0 && course.students.every(s=>computeSEE(s, components).complete);
}
function round1(n){ return Math.round(n*10)/10; }
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'}) + ' · ' + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
}
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function toast(msg, kind=''){
  const c = document.getElementById('toast-container');
  const t = el(`<div class="toast ${kind}">${escapeHtml(msg)}</div>`);
  c.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 3600);
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function emptyStateHtml(title, body){ return `<div class="empty-state"><div class="em-title">${escapeHtml(title)}</div>${escapeHtml(body)}</div>`; }
function openModal(html){
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this) closeModal()"><div class="modal-box">${html}</div></div>`;
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }
window.closeModal = closeModal;

function renderBell(){
  const user = App.currentUser();
  if(!user) return;
  const items = App.state.notifications.filter(n=>n.forUserId===user.id);
  const unread = items.filter(n=>!n.read).length;
  const countEl = document.getElementById('bell-count');
  countEl.textContent = unread;
  countEl.classList.toggle('hidden', unread===0);
}
function toggleNotifPanel(){
  const panel = document.getElementById('notif-panel');
  const isHidden = panel.classList.contains('hidden');
  if(isHidden){
    const user = App.currentUser();
    const items = App.state.notifications.filter(n=>n.forUserId===user.id).slice(0,20);
    panel.innerHTML = items.length ? items.map(n=>`
      <div class="notif-item">
        <div class="n-title">${escapeHtml(n.title)}</div>
        <div class="n-body">${linkifyNotifBody(n.body)}</div>
        <div class="n-time">${fmtDate(n.ts)}</div>
      </div>`).join('') : `<div class="notif-empty">No notifications yet.</div>`;
