<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Continuous Internal Evaluation (CIE)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Firebase Storage (compat build — plain globals, matches this app's
     non-module script style) used only for the Best/Average/Lowest
     scanned answer-script uploads. Fill in FIREBASE_CONFIG further down
     in this file with your own project's keys. -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<script>
/* Apply saved theme/font-scale immediately, before first paint, to avoid a flash of the default theme. */
(function(){
  try{
    var t = localStorage.getItem('dvs-theme') || 'indigo';
    var z = parseFloat(localStorage.getItem('dvs-font-scale')) || 1;
    document.documentElement.setAttribute('data-theme', t);
    document.documentElement.style.setProperty('--app-zoom', z);
  }catch(e){}
})();
</script>
<style>
:root{
  --ink:#0F172A;
  --ink-2:#1E293B;
  --parchment:#F8FAFC;
  --parchment-2:#F1F5F9;
  --card:#FFFFFF;
  --brass:#4F46E5;
  --brass-light:#6366F1;
  --seal-green:#059669;
  --seal-red:#DC2626;
  --text:#1E293B;
  --text-soft:#475569;
  --rule:#E2E8F0;
  --rule-light:#EEF2F7;
  --radius:12px;
  --radius-sm:8px;
  --radius-lg:16px;
  --shadow-sm:0 1px 2px rgba(15,23,42,0.05), 0 1px 1px rgba(15,23,42,0.03);
  --shadow-md:0 8px 24px rgba(15,23,42,0.08), 0 2px 6px rgba(15,23,42,0.05);
  --shadow-lg:0 24px 60px rgba(15,23,42,0.18);
  --warn:#C8850A;
  --app-zoom:1;
}

/* ================= THEME PRESETS ================= */
html[data-theme="indigo"]{
  --ink:#0F172A;--ink-2:#1E293B;--parchment:#F8FAFC;--parchment-2:#F1F5F9;--card:#FFFFFF;
  --brass:#4F46E5;--brass-light:#6366F1;--seal-green:#059669;--seal-red:#DC2626;
  --text:#1E293B;--text-soft:#475569;--rule:#E2E8F0;--rule-light:#EEF2F7;--warn:#C8850A;
}
html[data-theme="midnight"]{
  --ink:#F1F5F9;--ink-2:#E2E8F0;--parchment:#0B1120;--parchment-2:#111827;--card:#161F2E;
  --brass:#818CF8;--brass-light:#A5B4FC;--seal-green:#34D399;--seal-red:#F87171;
  --text:#E2E8F0;--text-soft:#C3CDDB;--rule:#243044;--rule-light:#1B2536;--warn:#FBBF24;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.45), 0 1px 1px rgba(0,0,0,0.3);
  --shadow-md:0 8px 24px rgba(0,0,0,0.5), 0 2px 6px rgba(0,0,0,0.35);
  --shadow-lg:0 24px 60px rgba(0,0,0,0.6);
}
html[data-theme="ocean"]{
  --ink:#0B2545;--ink-2:#134074;--parchment:#F4F9FF;--parchment-2:#E8F2FC;--card:#FFFFFF;
  --brass:#0EA5E9;--brass-light:#38BDF8;--seal-green:#0D9488;--seal-red:#E11D48;
  --text:#0F2942;--text-soft:#2E5570;--rule:#D6E7F5;--rule-light:#EAF4FC;--warn:#D97706;
}
html[data-theme="forest"]{
  --ink:#0B3B2E;--ink-2:#115740;--parchment:#F3FBF7;--parchment-2:#E6F6EE;--card:#FFFFFF;
  --brass:#10B981;--brass-light:#34D399;--seal-green:#059669;--seal-red:#DC2626;
  --text:#0F3D2E;--text-soft:#2D6650;--rule:#D3EDE0;--rule-light:#E9F6EF;--warn:#B45309;
}
html[data-theme="sunset"]{
  --ink:#431407;--ink-2:#7C2D12;--parchment:#FFFBF5;--parchment-2:#FFF3E4;--card:#FFFFFF;
  --brass:#F97316;--brass-light:#FB923C;--seal-green:#16A34A;--seal-red:#DC2626;
  --text:#431407;--text-soft:#6B3A22;--rule:#FBDCC0;--rule-light:#FFEEDD;--warn:#CA8A04;
}
html[data-theme="royal"]{
  --ink:#2E1065;--ink-2:#4C1D95;--parchment:#FAF5FF;--parchment-2:#F3E8FF;--card:#FFFFFF;
  --brass:#9333EA;--brass-light:#A855F7;--seal-green:#059669;--seal-red:#DB2777;
  --text:#3B0764;--text-soft:#63298F;--rule:#E9D5FF;--rule-light:#F5EBFF;--warn:#C2410C;
}
html[data-theme="rose"]{
  --ink:#4C0519;--ink-2:#831843;--parchment:#FFF5F7;--parchment-2:#FFE4EC;--card:#FFFFFF;
  --brass:#E11D48;--brass-light:#FB7185;--seal-green:#059669;--seal-red:#BE123C;
  --text:#4C0519;--text-soft:#8F3C57;--rule:#FBD1DD;--rule-light:#FFE7ED;--warn:#B45309;
}
html[data-theme="slate"]{
  --ink:#F8FAFC;--ink-2:#E2E8F0;--parchment:#101418;--parchment-2:#171C22;--card:#1C2127;
  --brass:#94A3B8;--brass-light:#CBD5E1;--seal-green:#4ADE80;--seal-red:#F87171;
  --text:#E5E9EE;--text-soft:#B8C1CC;--rule:#2A313B;--rule-light:#232931;--warn:#FACC15;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.45), 0 1px 1px rgba(0,0,0,0.3);
  --shadow-md:0 8px 24px rgba(0,0,0,0.5), 0 2px 6px rgba(0,0,0,0.35);
  --shadow-lg:0 24px 60px rgba(0,0,0,0.6);
}
html[data-theme="crimson"]{
  --ink:#1C0A0A;--ink-2:#3D1414;--parchment:#FDF8F3;--parchment-2:#F7EDE1;--card:#FFFFFF;
  --brass:#991B1B;--brass-light:#B91C1C;--seal-green:#166534;--seal-red:#7F1D1D;
  --text:#2B1210;--text-soft:#6B4A3D;--rule:#E9D9C6;--rule-light:#F3E7D8;--warn:#92400E;
}
html[data-theme="nordic"]{
  --ink:#1E293B;--ink-2:#334155;--parchment:#F7FAFC;--parchment-2:#EDF2F7;--card:#FFFFFF;
  --brass:#0891B2;--brass-light:#22D3EE;--seal-green:#10B981;--seal-red:#F43F5E;
  --text:#22303F;--text-soft:#3F5A70;--rule:#DCE6EE;--rule-light:#EEF3F8;--warn:#D97706;
}

html{ zoom:var(--app-zoom,1); }

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--parchment);
  color:var(--text);
  font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  transition:background 0.35s ease, color 0.35s ease;
}
body, .card, .topbar, .sidebar, .btn, .btn-outline, table.data-table, input, select, textarea,
.status-pill, .notif-panel, .login-card, .nav-item, .ghost-btn{
  transition:background 0.3s ease, background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
}
h1,h2,h3,h4{
  font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color:var(--ink);
  margin:0;
  letter-spacing:-0.02em;
  font-weight:700;
}
.mono{font-family:'IBM Plex Mono', monospace;}
.hidden{display:none !important;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:rgba(79,70,229,0.18);}

/* ---------------- LOGIN ---------------- */
.login-view{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px;
  background:var(--ink);
}
.login-card{
  max-width:480px;
  width:100%;
  color:#E8ECF3;
  background:transparent;
  border:none;
  border-radius:0;
  padding:8px 4px;
  box-shadow:none;
}
.eyebrow{
  display:inline-flex;
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:#E0A94E;
  background:rgba(224,169,78,0.08);
  border:1px solid rgba(224,169,78,0.45);
  padding:5px 12px;
  border-radius:20px;
}
.login-card h1{
  color:#F7F9FC;
  font-family:Georgia, 'Times New Roman', serif;
  font-weight:700;
  font-size:clamp(28px,4vw,34px);
  margin-top:18px;
  line-height:1.18;
  letter-spacing:0;
}
.login-sub{
  margin-top:12px;
  color:#C6D0E2;
  font-family:Georgia, 'Times New Roman', serif;
  font-size:15px;
  line-height:1.5;
  max-width:46ch;
}
.login-card .config-field label{color:#E0A94E !important;}
.login-card .config-field input{
  background:#FFFFFF;color:#1E293B;border:1px solid rgba(255,255,255,0.15);
}
.login-card .config-field input::placeholder{color:#8A94A6;}
.login-card .config-field input:focus{outline:none;border-color:#E0A94E;box-shadow:0 0 0 3px rgba(224,169,78,0.22);}
.login-card #login-submit-btn{
  width:100%;background:#131D33;border:1px solid #232F4B;color:#fff;
  padding:13px 18px;font-size:14.5px;
}
.login-card #login-submit-btn:hover{background:#1B2A47;}
.login-card .section-meta{
  color:#9FADC4 !important;font-family:'IBM Plex Mono',monospace;font-size:11.5px;line-height:1.6;
}
.login-card #login-error.section-meta{color:#FF8A80 !important;}
.persona-list{
  margin-top:26px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.persona-group-label{
  margin-top:14px;
  font-size:10.5px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--text-soft);
  font-weight:600;
}
.persona-group-label:first-child{margin-top:0;}
.persona-btn{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  background:var(--parchment);
  border:1px solid var(--rule);
  color:var(--text);
  padding:14px 16px;
  text-align:left;
  border-radius:var(--radius-sm);
  transition:background 0.2s ease, border-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
}
.persona-btn:hover{
  background:#EEF0FE;
  border-color:var(--brass-light);
  transform:translateX(2px);
  box-shadow:var(--shadow-sm);
}
.persona-btn .p-name{
  font-family:'Inter', sans-serif;
  font-weight:600;
  font-size:15px;
  color:var(--ink);
  display:block;
}
.persona-btn .p-desc{
  font-size:12.5px;
  color:var(--text-soft);
  margin-top:3px;
  display:block;
}
.persona-btn .p-code{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  letter-spacing:0.06em;
  color:var(--brass);
  border:1px solid rgba(79,70,229,0.3);
  background:rgba(79,70,229,0.06);
  padding:3px 9px;
  border-radius:20px;
  flex-shrink:0;
}

/* ---------------- SHELL ---------------- */
.shell{min-height:100vh;display:flex;flex-direction:column;}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  height:62px;
  background:#fff;
  color:var(--text);
  border-bottom:1px solid var(--rule);
  position:relative;
  z-index:20;
  box-shadow:var(--shadow-sm);
}
.brand{display:flex;align-items:baseline;gap:10px;}
.brand-mark{
  font-family:'Inter', sans-serif;
  font-weight:800;
  font-size:19px;
  letter-spacing:-0.02em;
  color:var(--ink);
}
.brand-sub{font-size:11px;font-weight:600;color:var(--text-soft);letter-spacing:0.03em;}
.topbar-right{display:flex;align-items:center;gap:14px;position:relative;}
.bell-btn{
  background:none;border:none;color:var(--text-soft);
  position:relative;padding:6px;display:flex;border-radius:8px;
  transition:color 0.15s ease, background 0.15s ease;
}
.bell-btn:hover{color:var(--brass);background:rgba(79,70,229,0.06);}
.bell-count{
  position:absolute;top:0;right:0;
  background:var(--seal-red);color:#fff;
  font-family:'IBM Plex Mono', monospace;
  font-size:9px;line-height:1;
  padding:2px 4px;border-radius:8px;
}
.notif-panel{
  position:absolute;top:50px;right:60px;
  width:320px;max-height:380px;overflow-y:auto;
  background:var(--card);color:var(--text);
  border:1px solid var(--rule);border-radius:var(--radius);
  box-shadow:var(--shadow-lg);
  z-index:30;
}
.notif-item{
  padding:12px 14px;border-bottom:1px solid var(--rule-light);
  font-size:13px;
}
.notif-item:last-child{border-bottom:none;}
.notif-item .n-title{font-weight:600;color:var(--seal-red);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.04em;text-transform:uppercase;}
.notif-item .n-body{margin-top:4px;color:var(--text-soft);white-space:pre-line;}
.notif-link-btn{display:inline-block;margin-top:8px;padding:7px 16px;background:var(--brass);color:#fff !important;font-weight:600;font-size:12px;border-radius:7px;text-decoration:none !important;letter-spacing:0.01em;transition:background 0.15s ease;}
.notif-link-btn:hover{background:var(--brass-light);}
.notif-item .n-time{margin-top:6px;font-size:10.5px;color:#94A3B8;font-family:'IBM Plex Mono',monospace;}
.notif-empty{padding:20px;text-align:center;color:var(--text-soft);font-size:13px;}

/* ---------------- THEME PICKER ---------------- */
.theme-btn{
  background:transparent;border:1px solid var(--rule);color:var(--text-soft);
  padding:6px 12px;font-size:12px;font-weight:600;border-radius:8px;
  display:flex;align-items:center;gap:7px;
  transition:all 0.15s ease;
}
.theme-btn:hover{border-color:var(--brass-light);color:var(--brass);background:rgba(79,70,229,0.06);}
.theme-btn .swatch-dot{
  width:14px;height:14px;border-radius:50%;flex-shrink:0;
  background:conic-gradient(var(--brass), var(--brass-light), var(--seal-green), var(--brass));
  box-shadow:0 0 0 2px var(--card), 0 0 0 3px var(--rule);
}
.theme-panel{
  position:absolute;top:50px;right:0;
  width:360px;max-height:min(560px, 80vh);overflow-y:auto;
  background:var(--card);color:var(--text);
  border:1px solid var(--rule);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);
  z-index:40;padding:18px;
  animation:themePanelIn 0.18s ease;
}
@keyframes themePanelIn{from{opacity:0;transform:translateY(-6px) scale(0.98);}to{opacity:1;transform:translateY(0) scale(1);}}
.theme-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.theme-panel-title{font-family:'Inter',sans-serif;font-weight:700;font-size:14px;color:var(--ink);}
.theme-panel-sub{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--text-soft);letter-spacing:0.04em;text-transform:uppercase;margin-top:2px;margin-bottom:12px;}
.theme-grid{display:grid;grid-template-columns:repeat(2, 1fr);gap:10px;margin-bottom:18px;}
.theme-card{
  position:relative;cursor:pointer;
  border:1.5px solid var(--rule);border-radius:12px;
  padding:10px 10px 9px;background:var(--parchment-2);
  display:flex;align-items:center;gap:9px;
  transition:transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
}
.theme-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm);}
.theme-card.selected{border-color:var(--brass);box-shadow:0 0 0 3px rgba(99,102,241,0.15);}
.theme-card .t-preview{
  width:34px;height:34px;border-radius:9px;flex-shrink:0;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,0.08);
}
.theme-card .t-info{display:flex;flex-direction:column;gap:2px;overflow:hidden;}
.theme-card .t-name{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.theme-card .t-dots{display:flex;gap:3px;}
.theme-card .t-dots span{width:7px;height:7px;border-radius:50%;display:inline-block;}
.theme-card .t-check{
  position:absolute;top:6px;right:6px;width:16px;height:16px;border-radius:50%;
  background:var(--brass);color:#fff;display:none;align-items:center;justify-content:center;font-size:10px;
}
.theme-card.selected .t-check{display:flex;}

.font-size-row{display:flex;gap:8px;margin-bottom:18px;}
.font-pill{
  flex:1;text-align:center;cursor:pointer;
  border:1.5px solid var(--rule);border-radius:9px;padding:8px 4px;
  font-family:'Inter',sans-serif;color:var(--text-soft);
  transition:all 0.15s ease;
}
.font-pill .fp-label{font-weight:700;}
.font-pill .fp-sub{display:block;font-size:9.5px;margin-top:2px;font-family:'IBM Plex Mono',monospace;letter-spacing:0.03em;}
.font-pill:hover{border-color:var(--brass-light);}
.font-pill.selected{border-color:var(--brass);background:rgba(79,70,229,0.08);color:var(--brass);}
.theme-panel-actions{display:flex;gap:10px;justify-content:flex-end;}
.user-chip{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;}
.user-name{font-size:13px;color:var(--ink);font-weight:600;}
.role-tag{font-size:10px;color:var(--brass);letter-spacing:0.05em;}
.ghost-btn{
  background:transparent;border:1px solid var(--rule);
  color:var(--text-soft);padding:7px 14px;font-size:12px;border-radius:7px;
  transition:all 0.15s ease;
}
.ghost-btn:hover{border-color:var(--brass-light);color:var(--brass);background:rgba(79,70,229,0.06);}

.body-shell{flex:1;display:flex;}
.sidebar{
  width:224px;flex-shrink:0;
  background:var(--parchment-2);
  border-right:1px solid var(--rule);
  padding:20px 10px;
}
.nav-item{
  display:block;width:100%;text-align:left;
  background:none;border:none;
  padding:10px 16px;margin-bottom:2px;
  font-family:'Inter', sans-serif;
  font-size:13.5px;font-weight:600;letter-spacing:-0.005em;
  color:var(--text-soft);
  border-left:3px solid transparent;border-radius:0 8px 8px 0;
  transition:color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
}
.nav-item:hover{color:var(--ink);background:rgba(79,70,229,0.08);}
.nav-item.active{
  color:var(--ink);font-weight:600;
  border-left-color:var(--brass);
  background:rgba(79,70,229,0.12);
}
.content{flex:1;padding:36px 40px 64px;max-width:1120px;}

/* ---------------- SHARED COMPONENTS ---------------- */
.page-head{margin-bottom:26px;}
.page-eyebrow{
  font-family:'IBM Plex Mono', monospace;font-size:11px;
  letter-spacing:0.14em;text-transform:uppercase;color:var(--brass);
}
.page-head h2{font-size:27px;margin-top:7px;}
.page-head p{color:var(--text-soft);margin-top:9px;max-width:90ch;font-size:15px;white-space:normal;overflow-wrap:break-word;word-break:break-word;}

.card{
  position:relative;
  background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);
  padding:22px 24px;margin-bottom:16px;box-shadow:var(--shadow-sm);
  transition:box-shadow 0.25s ease, transform 0.25s ease, border-color 0.25s ease, background 0.3s ease;
  overflow:hidden;
}
.card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg, var(--brass), var(--brass-light));
  opacity:0;transition:opacity 0.25s ease;
}
.card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:var(--brass-light);}
.card:hover::before{opacity:1;}
.card-row{
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;flex-wrap:wrap;
}
.section-title{font-size:17px;font-family:'Inter', sans-serif;font-weight:600;color:var(--ink);}
.section-meta{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;color:var(--text-soft);margin-top:4px;white-space:normal;overflow-wrap:break-word;word-break:break-word;}

.status-pill{
  font-family:'IBM Plex Mono', monospace;font-size:10.5px;
  letter-spacing:0.05em;text-transform:uppercase;
  padding:4px 11px;border-radius:20px;display:inline-block;border:1px solid transparent;
}
.status-draft{background:#F1F5F9;color:var(--text-soft);border-color:var(--rule);}
.status-submitted{background:#E0E7FF;color:#4338CA;border-color:#C7D2FE;}
.status-coordinated{background:#D1FAE5;color:#047857;border-color:#A7F3D0;}
.status-verified{background:#FEF3C7;color:#B45309;border-color:#FDE68A;}
.status-approved{background:#D1FAE5;color:var(--seal-green);border-color:#A7F3D0;}
.status-sentback{background:#FEE2E2;color:var(--seal-red);border-color:#FECACA;}
.status-rejected{background:#FEE2E2;color:var(--seal-red);border-color:#FECACA;}

.btn{
  border:1px solid var(--ink);background:var(--ink);color:#fff;
  padding:10px 18px;font-size:13.5px;border-radius:var(--radius-sm);
  font-family:'Inter', sans-serif; font-weight:600;letter-spacing:0.01em;
  box-shadow:var(--shadow-sm);
  transition:transform 0.12s ease, box-shadow 0.15s ease, background 0.15s ease, opacity 0.15s ease, border-color 0.15s ease;
}
.btn:hover{background:var(--ink-2);box-shadow:var(--shadow-md);transform:translateY(-1px);}
.btn:active{transform:translateY(0);box-shadow:var(--shadow-sm);}
.btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none;}
.btn-outline{
  background:transparent;color:var(--ink);border:1.5px solid var(--ink);box-shadow:none;
}
.btn-outline:hover{background:rgba(15,23,42,0.05);box-shadow:none;}
.btn-brass{background:var(--brass);border-color:var(--brass);color:#fff;}
.btn-brass:hover{background:#4338CA;}
.btn-green{background:var(--seal-green);border-color:var(--seal-green);color:#fff;}
.btn-green:hover{background:#047857;}
.btn-red{background:transparent;border-color:var(--seal-red);color:var(--seal-red);box-shadow:none;}
.btn-red:hover{background:var(--seal-red);color:#fff;box-shadow:var(--shadow-sm);}
.btn-sm{padding:7px 13px;font-size:12px;border-radius:6px;}

table.data-table{
  width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px;margin-top:6px;
  border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow-sm);
}
/* Sticky-header tables (currently just the Term Test 1/2 marks table)
   can't have overflow:hidden here like every other .data-table does: an
   element with overflow!=visible becomes the nearest "scrolling ancestor"
   position:sticky measures against, and since a <table> never scrolls
   itself, that silently breaks the sticky header (it just scrolls away
   with the page instead of pinning). The rounded corners this would have
   provided move to the actual scrolling wrapper (.table-scroll) around it
   instead — see the markup comment where that table is built. */
table.data-table.sticky-thead{
  overflow:visible;border-radius:0;box-shadow:none;border:none;
}
.data-table thead th{
  font-family:'IBM Plex Mono', monospace;font-size:10.5px;
  letter-spacing:0.06em;text-transform:uppercase;color:#fff;
  text-align:center;padding:12px 14px;background:var(--brass);
  border:2px solid var(--ink);white-space:nowrap;
}
.data-table thead th:first-child{text-align:left;}
/* Every data cell gets a thick, solid border on all four sides (matching
   the Excel-mimic grid look shared by every marks-entry table — TT1, TT2,
   SIA, Practical Internal, SEE Practical, and so on) instead of the old
   hairline bottom/right-only rules. Cell content is centered by default,
   like the numeric Q6-Q11 cells always were, so Part A's Q1-Q5 boxes (and
   every other plain value column) line up the same way instead of
   trailing right. The student-name column stays left-aligned since it's
   text, not a mark. */
.data-table tbody td{padding:10px 14px;border:2px solid var(--rule);vertical-align:middle;text-align:center;}
.data-table tbody td:first-child{text-align:left;}
.data-table tbody tr:nth-child(even){background:var(--parchment-2);}
.data-table tbody tr:hover{background:#EEF2FF;}
/* Group-header row (e.g. UNIT 1 / UNIT 2 spans on Term Test & SIA tables)
   gets its own slightly darker rule beneath it so the two header rows read
   as a clear, bordered block rather than blending together. */
.data-table thead tr:first-child th{border-bottom:2px solid rgba(255,255,255,0.5);}
.data-table thead tr:last-child th{border-bottom:2px solid var(--ink);}
/* Student-name column stays put while scrolling horizontally through a wide
   marks table (many question/unit columns) — the same trick as a frozen
   Excel pane, so you always know whose row you're editing. */
.data-table thead th:first-child, .data-table tbody td:first-child{
  position:sticky;left:0;z-index:1;font-weight:600;
  box-shadow:2px 0 4px rgba(15,23,42,0.05);
}
.data-table thead th:first-child{ background:var(--brass); z-index:2; }
.data-table tbody tr:nth-child(even) td:first-child{ background:var(--parchment-2); }
.data-table tbody tr:nth-child(odd) td:first-child{ background:var(--card); }
.data-table tbody tr:hover td:first-child{ background:#EEF2FF; }
.data-table input[type=number]{
  width:66px;padding:5px 8px;border:2px solid var(--ink);text-align:center;
  background:#fff;font-size:13px;border-radius:6px;transition:border-color 0.15s ease, box-shadow 0.15s ease;
}
.data-table input[type=number]:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px rgba(99,102,241,0.18);}
.data-table input.invalid{border-color:var(--seal-red);background:#FEF2F2;}
.total-cell{font-family:'IBM Plex Mono', monospace;font-weight:600;color:var(--ink);}
/* Strong border highlight for the Part A / Part B / overall Total Marks
   columns on the Term Test entry table, so those totals stand out visually
   from the individual question-score columns around them. */
.data-table th.hl-total{border-left:3px solid var(--warn) !important;border-right:3px solid var(--warn) !important;}
.data-table td.hl-total{border-left:3px solid var(--warn) !important;border-right:3px solid var(--warn) !important;background:rgba(200,133,10,0.08);}
.data-table tbody tr:last-child td.hl-total{border-bottom:3px solid var(--warn) !important;}
.data-table thead tr:first-child th.hl-total{border-top:3px solid var(--warn) !important;}

.empty-state{
  padding:44px 22px;text-align:center;color:var(--text-soft);
  border:1.5px dashed var(--rule);background:var(--card);border-radius:var(--radius);
}
.empty-state .em-title{font-family:'Inter', sans-serif;color:var(--ink);font-size:17px;margin-bottom:6px;}

/* modal */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(20,26,40,0.55);backdrop-filter:blur(1.5px);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
}
.modal-box{
  background:var(--parchment);border:1px solid var(--rule);border-radius:var(--radius-lg);
  max-width:760px;width:100%;max-height:86vh;overflow-y:auto;
  padding:28px 30px 28px;box-shadow:var(--shadow-lg);
}
.modal-box h3{font-size:20px;}
.modal-close{
  float:right;background:none;border:none;font-size:20px;color:var(--text-soft);line-height:1;
  border-radius:6px;padding:2px 6px;transition:color 0.15s ease, background 0.15s ease;
}
.modal-close:hover{color:var(--seal-red);background:rgba(139,46,46,0.08);}
.remark-box{
  width:100%;min-height:80px;border:1px solid var(--rule);border-radius:var(--radius-sm);padding:11px 12px;
  font-family:'Inter', sans-serif;font-size:14px;margin-top:10px;background:#fff;
  transition:border-color 0.15s ease, box-shadow 0.15s ease;
}
.remark-box:focus{outline:none;border-color:var(--brass-light);box-shadow:0 0 0 3px rgba(99,102,241,0.18);}
.audit-item{
  border-left:2px solid var(--rule);padding:8px 0 8px 14px;margin-bottom:4px;font-size:13px;
}
.audit-item .a-head{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--brass);letter-spacing:0.04em;text-transform:uppercase;}
.audit-item .a-body{margin-top:3px;color:var(--text);}
.audit-item .a-time{font-size:10.5px;color:var(--text-soft);margin-top:3px;font-family:'IBM Plex Mono',monospace;}

/* toast */
.toast-container{
  position:fixed;bottom:20px;right:20px;z-index:200;
  display:flex;flex-direction:column;gap:8px;
}
.toast{
  background:var(--ink);color:#fff;padding:13px 20px;border-radius:var(--radius-sm);
  border-left:3px solid var(--brass);font-size:13.5px;
  box-shadow:var(--shadow-lg);min-width:240px;
  animation:toast-in 0.25s ease;
}
.toast.err{border-left-color:var(--seal-red);}
.toast.ok{border-left-color:var(--seal-green);}
@keyframes toast-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* weight bar reuse */
.weight-inline{display:flex;align-items:center;gap:10px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-soft);margin-top:4px;}
.weight-track{width:120px;height:7px;background:#DCD3B9;display:flex;overflow:hidden;border-radius:20px;}
.weight-cie{background:var(--ink);width:50%;}
.weight-see{background:var(--brass);width:50%;}

.config-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:18px;}
.config-field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-soft);margin-bottom:6px;}
.config-field input,.config-field select{
  width:100%;padding:9px 12px;border:1px solid var(--rule);background:#fff;font-size:13.5px;
  border-radius:var(--radius-sm);transition:border-color 0.15s ease, box-shadow 0.15s ease;
}
.config-field input:focus,.config-field select:focus{outline:none;border-color:var(--brass-light);box-shadow:0 0 0 3px rgba(99,102,241,0.18);}

/* Table-style form — same field set as .config-grid, laid out as a
   labelled-row table instead of a wrapping card grid. Used where a form
   has several related fields (e.g. "Add Section & Assign Instructor")
   and a compact, scannable table reads better than a loose grid. */
.form-table{
  width:100%;border-collapse:separate;border-spacing:0;margin-top:16px;
  border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow-sm);
}
.form-table tr:not(:last-child) td{border-bottom:1px solid var(--rule-light);}
.form-table tr:nth-child(even){background:var(--parchment-2);}
.form-table tr:hover{background:#EEF2FF;}
.form-table td{padding:13px 16px;vertical-align:middle;}
.form-table td.ft-label{
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:0.05em;color:var(--text-soft);width:230px;white-space:nowrap;cursor:default;
}
.form-table td.ft-input{width:100%;}
.form-table td.ft-input input,.form-table td.ft-input select{
  width:100%;padding:9px 12px;border:1px solid var(--rule);background:#fff;font-size:13.5px;
  border-radius:var(--radius-sm);transition:border-color 0.15s ease, box-shadow 0.15s ease;
}
.form-table td.ft-input input:focus,.form-table td.ft-input select:focus{outline:none;border-color:var(--brass-light);box-shadow:0 0 0 3px rgba(99,102,241,0.18);}
@media (max-width:640px){
  .form-table, .form-table tbody, .form-table tr, .form-table td{display:block;width:auto;}
  .form-table tr{padding:10px 16px;}
  .form-table td.ft-label{width:auto;padding:0 0 6px;}
  .form-table td.ft-input{padding:0;}
}

.branch-heading{
  margin-top:22px;margin-bottom:8px;
  font-family:'IBM Plex Mono', monospace;font-size:11px;
  letter-spacing:0.14em;text-transform:uppercase;color:var(--brass);
  border-bottom:1px solid var(--rule-light);padding-bottom:6px;
}
.branch-heading:first-child{margin-top:0;}
.search-input{
  width:100%;padding:10px 13px;border:1px solid var(--rule);
  background:#fff;font-size:13.5px;border-radius:var(--radius-sm);
  transition:border-color 0.15s ease, box-shadow 0.15s ease;
}
.search-input:focus{outline:none;border-color:var(--brass-light);box-shadow:0 0 0 3px rgba(99,102,241,0.18);}

.table-scroll{overflow-x:auto;}

/* Full-screen marks-entry mode (Term Test 1/2) — toggleTTFullscreen()
   fullscreens document.documentElement (the whole page) rather than this
   div, specifically so that renderContent()'s rebuild-on-every-save never
   has to touch real browser fullscreen state (see toggleTTFullscreen()'s
   comment for why). The look-and-feel is driven entirely by the
   `tt-fs-active` class on <body>, kept in sync with real fullscreen state
   by a fullscreenchange listener: everything marked .tt-fs-hide (page
   header, verification card, analytics, class stats, and the app shell's
   own topbar/sidebar) disappears, and .tt-fs-wrap — the "Enter Marks" card
   — expands to fill the freed-up space, with a shrunk, sticky-header table
   so Part A and Part B fit side by side without the horizontal scrollbar
   that shows up at normal page width. Not a hard guarantee against ever
   scrolling vertically on a very large roster — but the header stays
   pinned either way. */
body.tt-fs-active .tt-fs-hide,
body.tt-fs-active .topbar,
body.tt-fs-active #sidebar{
  display:none !important;
}
body.tt-fs-active .content{
  padding:12px 18px;
  max-width:none;
  width:100%;
  margin:0;
}
body.tt-fs-active .tt-fs-wrap{
  display:flex;flex-direction:column;height:calc(100vh - 24px);
  width:100%;
  max-width:none;
}
body.tt-fs-active .tt-fs-wrap .table-scroll{
  overflow:auto;flex:1;
}
body.tt-fs-active .tt-fs-wrap table.data-table{
  /* Deliberately NOT width:100% here (that used to be the rule) — forcing
     the table to fill the screen when its natural (content-based) width is
     narrower than the viewport made table-layout:auto stretch whichever
     cells had the least content (mainly the single-answer Q6-Q11 cells,
     the Scaled and Evaluated Script columns) to soak up the leftover
     space, showing up as ugly dead-space boxes next to a tiny 56px input.
     Letting the table size itself naturally (it still has the inline
     min-width:1400px, and .table-scroll below stays horizontally
     scrollable) keeps every column snug around its actual content
     instead. */
  font-size:12px;
}
body.tt-fs-active .tt-fs-wrap table.data-table th,
body.tt-fs-active .tt-fs-wrap table.data-table td{
  padding:4px 5px;
}
/* Sticky header top-offsets (per-row, so a 3-row header like the Term
   Test table's stacks correctly instead of every row fighting for top:0)
   are computed and applied in JS — see applyStickyTableHeaders(). This
   rule just needs `position:sticky` as a baseline for any header cell
   that JS hasn't reached yet (e.g. a stray reflow before the first call);
   the JS-set inline `top`/`z-index` always win once it runs. */
body.tt-fs-active .tt-fs-wrap thead th{
  position:sticky;
}
.tt-fs-exit-label{display:none;}
body.tt-fs-active .tt-fs-exit-label{display:inline-flex;}
body.tt-fs-active .tt-fs-enter-label{display:none;}

.tab-bar{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--rule);}
.tab-btn{
  background:none;border:none;padding:10px 16px;
  font-family:'IBM Plex Mono', monospace;font-size:11.5px;letter-spacing:0.04em;text-transform:uppercase;
  color:var(--text-soft);border-bottom:2px solid transparent;margin-bottom:-1px;
  transition:color 0.15s ease, border-color 0.15s ease;
}
.tab-btn:hover{color:var(--ink);}
.tab-btn.active{color:var(--ink);font-weight:600;border-bottom-color:var(--brass);}
.tab-btn.locked{color:#a89f86;}
.tab-panel.hidden{display:none;}
.import-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px;}
.file-input-label{
  display:inline-flex;align-items:center;gap:8px;
  border:1.5px dashed var(--rule);padding:9px 15px;font-size:13px;color:var(--text-soft);
  border-radius:var(--radius-sm);cursor:pointer;background:#fff;transition:border-color 0.15s ease, color 0.15s ease;
}
.file-input-label:hover{border-color:var(--brass);color:var(--ink);}

@media (max-width:820px){
  .body-shell{flex-direction:column;}
  .sidebar{width:100%;display:flex;overflow-x:auto;padding:10px 0;border-right:none;border-bottom:1px solid var(--rule);}
  .nav-item{white-space:nowrap;border-left:none;border-bottom:3px solid transparent;border-radius:7px 7px 0 0;}
  .nav-item.active{border-left-color:transparent;border-bottom-color:var(--brass);}
  .content{padding:22px 16px 50px;}
  .notif-panel{right:16px;width:280px;}
  .theme-panel{right:16px;width:calc(100vw - 32px);}
  .theme-grid{grid-template-columns:1fr;}
}
/* Marks-entry number inputs: no spin buttons, just a plain typing box —
   faculty type a value and press Enter to jump to the next box. */
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button{
  -webkit-appearance:none;
  margin:0;
}
input[type="number"]{
  -moz-appearance:textfield;
  appearance:textfield;
}
#print-area{display:none;}
@media print{
  #app{display:none !important;}
  #print-area{display:block !important;}
  .topbar,.sidebar,.toast-container,#modal-root .modal-close, .no-print{display:none !important;}
  body{background:#fff;}
  .content{padding:0;max-width:none;}
}

/* =========================================================
   Seating Plan tool (merged from the standalone Exam Seating &
   Attendance Automation app). Every selector below is scoped under
   #sp-view so it cannot affect any other part of DVS, and its own
   CSS variables (--bg, --ink, --maroon, etc.) are defined on #sp-view

   Vanilla JS, backed by a live Supabase Postgres database
   (see the schema/seed SQL — profiles, courses, students,
   assignments, notifications, course_history, app_settings,
   term_test_history).

   Role model:
   - Fixed system roles: ADMIN, HOD, EA, EXAM
   - FACULTY is the only "person" role — whether a faculty
     member currently behaves as a Course Coordinator (CC) or
     Course Instructor (CI) is derived at runtime from the
     `assignments` table, never stored on the user record.
   ========================================================= */

/* ---------------- Supabase connection ---------------- */
const SUPABASE_URL = 'https://dhmidutrazdhhiqsstxv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRobWlkdXRyYXpkaGhpcXNzdHh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzOTMwOTIsImV4cCI6MjA5OTk2OTA5Mn0.jXlLh7b737FzsKpavzr5lHzSn04mjcb1XhWZaPFn9ko';

// (CSE, CSE-SAP, CSE-CYS, CSE-AIML, CSE-DSC) keep all of the existing
// section-numbering / regulation / subject-catalog machinery below, just
// renamed from their old codes (AIML->CSE-AIML, SAP->CSE-SAP, CSD->CSE-DSC,
// CSC->CSE-CYS). The other 7 (PHYSICS, EECE, ENGLISH, MATHEMATICS,
// CHEMISTRY, EXAMINATION, SOE) are general/service departments — they're
// selectable for faculty home branch, HOD assignment, etc., but deliberately
// left out of REGULATION_BRANCHES/SECTION_RANGES/BATCH_BRANCHES below since
// they don't have their own admitted student batches or section numbering.
// ERP is kept only for backward compatibility with sections already tagged
// 'ERP' in existing data — it has no equivalent in the new 12 and isn't
// offered as a choice anywhere new (see ccCreatableBranches).
const BRANCH_LABELS = {

};
/* Which branches each Regulation is actually offered to. R24 predates the
   3 newer CSE specializations, so it's CSE/AIML only. R25 added Cyber
   Security, Data Science and ERP alongside CSE/AIML — 5 branches total.
   A Regulation not listed here (e.g. R26, until this is confirmed) has no
   restriction — every branch stays selectable. */
const REGULATION_BRANCHES = {
  R24: ['CSE','CSE-AIML'],
  R25: ['CSE','CSE-AIML','CSE-CYS','CSE-DSC','ERP'],

// below so newer regulations (e.g. R26, not yet in REGULATION_BRANCHES)
// still only offer these, not the general/service departments (Physics,
// English, etc. — see BRANCH_LABELS) which never create sections this way.
const CSE_FAMILY_BRANCHES = ['CSE','CSE-AIML','CSE-SAP','CSE-CYS','CSE-DSC'];
function branchesForRegulation(regulation){
  return REGULATION_BRANCHES[regulation] || CSE_FAMILY_BRANCHES;
}
/* Section numbering is fixed per Regulation and branch-group — not free
   text. R24 (CSE or AIML, taught separately): sections C1-C8. R25's 5
   branches split into 3 groups that each get their own section range:
   CSE & CSC (Cyber Security) share the same subjects, sections B1-B3;
   AIML & CSD (Data Science) share the same subjects, sections B5-B11;
   ERP is its own thing — different subjects entirely, assigned directly by
   the Administrator rather than through the Course Coordinator's
   Subject Catalog flow, and only ever has one section, B4. */
function rangeOf(prefix, start, end){ const out=[]; for(let i=start;i<=end;i++) out.push(prefix+i); return out; }
const SECTION_RANGES = {
  R24: { CSE: rangeOf('C',1,8), 'CSE-AIML': rangeOf('C',1,8) },

};
function sectionOptionsFor(regulation, branch){
  return (SECTION_RANGES[regulation] && SECTION_RANGES[regulation][branch]) || [];
}
/* Which branches share a Subject Catalog entry with each other under R25 —
   a Course Coordinator whose subject is catalogued under CSE can also open
   sections of it for CSC (same subjects), and likewise AIML <-> CSD. ERP
   is deliberately excluded here: its subjects come from the Timetable
   Incharge directly, not from this Coordinator flow. */
const R25_SHARED_BRANCH_GROUPS = { CSE:['CSE','CSE-CYS'], 'CSE-CYS':['CSE','CSE-CYS'], 'CSE-AIML':['CSE-AIML','CSE-DSC'], 'CSE-DSC':['CSE-AIML','CSE-DSC'] };

   (CSE or AIML) — never under CSC/CSD/ERP — so this looks up that original
   branch for a given subject code, regardless of which branch's section
   record happens to be passed around the app. */
function catalogBranchForCode(code){
  const entry = SUBJECT_CATALOG.find(r=>normalizeCode(r.code)===normalizeCode(code));
  return entry ? entry.branch : null;
}
/* Which branches a Course Coordinator can open a NEW section of THIS
   subject for. */
function ccCreatableBranches(regulation, catalogBranch){
  if(regulation==='R25' && catalogBranch && R25_SHARED_BRANCH_GROUPS[catalogBranch]) return R25_SHARED_BRANCH_GROUPS[catalogBranch];
  if(catalogBranch) return [catalogBranch];
  return branchesForRegulation(regulation).filter(b=>b!=='ERP');
}

const LOAD_TYPE_LABELS = { L:'Lecture (L)', P:'Practical (P)' };

const BATCH_LABELS = { R24:'R24 (2024 admits)', R25:'R25 (2025 admits)', R26:'R26 (2026 admits)' };

function normalizeCode(code){ return (code||'').toString().trim().toUpperCase().replace(/\s+/g,''); }

// MASTER SUBJECTS — the "Courses Applicable" master list now lives in the
// live Supabase `subjects` table (id, code, abbr, course_type, name), not
// hardcoded in this file. App.state.subjects is populated on login/refresh
// by fetchStateFromSupabase(). This is the single source of truth for any
// subject-picker in the app — no hand-typed or invented course codes. Any
// dropdown built from this list is automatically, correctly mapped to its
// Evaluation Type, so a Coordinator can never fix a subject to the wrong ET.
// ============================================================================
function masterSubject(code){ return (App.state.subjects||[]).find(s=>normalizeCode(s.code)===normalizeCode(code)) || null; }
// Powers the auto-detect flow: Select Subject -> Lookup Subject Table ->
// Get Abbreviation -> Fetch Template — now backed by App.state.subjects.
function lookupAbbrForCode(code){ const s = masterSubject(code); return s ? s.abbr : null; }
function subjectNameForCode(code){ const s = masterSubject(code); return s ? s.name : null; }

/* Grouped <select> of every real subject (Courses Applicable), grouped by
   "Abbr — Course Type" so whoever is picking a subject can see exactly which
   Evaluation Type it fixes. Used by the CC's Course Instructor assignment flow. */
function subjectDropdownOptionsHtml(selectedCode){
  const groups = {};
  const order = [];
  (App.state.subjects||[]).forEach(s=>{
    const key = `${s.abbr} — ${s.courseType}`;
    if(!groups[key]){ groups[key] = []; order.push(key); }
    groups[key].push(s);
  });
  let html = `<option value="">— Select Subject (Courses Applicable) —</option>`;
  order.forEach(key=>{
    html += `<optgroup label="${escapeHtml(key)}">`;
    groups[key].forEach(s=>{
      html += `<option value="${escapeHtml(s.code)}" ${normalizeCode(selectedCode)===normalizeCode(s.code)?'selected':''}>${escapeHtml(s.code)} — ${escapeHtml(s.name)}</option>`;
    });
    html += `</optgroup>`;
  });
  return html;
}

function seeDisplayComponents(template){

/* Canonical roll-number ordering — every marks table (Term Test 1/2/3, Lab
   Internal/External, Other CIE, SIA, SEE, the read-only roll-ups, PDF/CSV
   exports, Analytics, etc.) just iterates course.students directly, so
   sorting here once is what keeps all of them roll-number-wise. Uses
   {numeric:true} so embedded numbers compare naturally (…09 before …10)
   instead of as plain text. */
function sortStudentsByRollNo(students){
  (students||[]).sort((a,b)=>(a.rollNo||'').localeCompare(b.rollNo||'', undefined, {numeric:true, sensitivity:'base'}));
  return students;
}

// ============================================================================
// APPROVAL GROUPING — per the fixed institutional rule:
//   • Term Test 1 + Term Test 2 + Lab Internal (Practical Internal Test) are
//     entered together and need explicit HOD approval before they're locked.
//   • Lab External (SEE Practical) is entered separately and also needs
//     explicit HOD approval before it's locked.
//   • Everything else (SIA, MOOCs/Assignments, Tutorials, Seminars, Skill
//     components, Regular Lab/Skill Performance, Project Assessment, etc.)
//     is scaled per the Evaluation Type as usual and needs NO HOD approval —
//     it stays editable by the Course Instructor like before.
// A given template only shows the groups it actually has components for
// (e.g. a pure-theory ET1/2/3 template has Term Tests but no Lab Internal/
// External at all, so only the Term Test approval group appears).
// ============================================================================
function labInternalComponent(template){ return (template.cie||[]).find(c=>c.key==='pracInternal') || null; }
function labExternalComponent(template){ return (template.see||[]).find(c=>c.key==='seePractical'||c.key==='seePracticalProject') || null; }
function termTestComponentsInTemplate(template){ return (template.cie||[]).filter(c=>c.key==='tt1'||c.key==='tt2'||c.key==='termTest'); }
/* The "Term Test & Lab Internal" HOD-approval group's CIE components. */
function ttLabApprovalComponents(template){
  const comps = termTestComponentsInTemplate(template).slice();
  const lab = labInternalComponent(template);
  if(lab) comps.push(lab);
  return comps;
}
/* The "Lab External" HOD-approval group's SEE component(s) (usually one). */
function labExternalApprovalComponents(template){
  const c = labExternalComponent(template);
  return c ? [c] : [];
}
/* Remaining CIE components — no HOD approval required. */
function otherCieComponents(template){
  const approvalKeys = new Set(ttLabApprovalComponents(template).map(c=>c.key));
  return (template.cie||[]).filter(c=>!approvalKeys.has(c.key));
}
/* Remaining SEE components (after SEE Theory is already excluded and Lab
   External is pulled into its own approval tab) — no HOD approval required. */
function otherSeeComponents(template){
  const labKey = labExternalComponent(template)?.key;
  return seeDisplayComponents(template).filter(c=>c.key!==labKey);
}
/* ---------- Term Test vs SEE sequencing ----------
   Term Test 1 and Term Test 2 are already mutually exclusive on the
   structured Term Test entry page (only whichever cycle the Timetable
   Incharge currently has fixed as active is editable — see cycleIsActive /
   periodFinished in renderCITermTestEntry). On top of that: for as long as
   ANY Term Test cycle (TT1 or TT2) is fixed as active, Sem-End Exam entry
   (SEE Practical, and any SEE Theory shown here) is also locked — SEE
   assessment only opens once the Administrator closes the Term Test
   cycle out entirely (currentTermTest goes back to null). This does not
   touch CIE components (Term Test itself, Practical Internal Test, SIA,
   etc.), which keep their own independent gating. */
function seeEntryLocked(){
  return !!(App.state.currentTermTest && App.state.currentTermTest.cycle);
}
/* ---------- Practical Internal Test — Course Coordinator marks-entry
   window (start + end) ----------
   Unlike every other CIE/SEE component (which stays open to the CI for as
   long as the Overall record itself is InProgress), Practical Internal Test
   has its own optional marks-entry window — a start date/time and an end
   date/time — that the Course Coordinator (or HOD/Admin) can fix, see
   App.setPracInternalStart / App.setPracInternalDeadline. Before the start
   time (if one is set) and after the end time (if one is set), entry locks
   for the Course Instructor even though the record is still InProgress.
   Both are stored as full <input type="datetime-local"> strings (date +
   time-of-day), not just a date, so the window can open/close at a precise
   time of day rather than only at midnight. Leaving both unset (the
   default) means Practical Internal Test behaves exactly like before — no
   window, always open.

   ON TOP of this per-course CC/HOD window, the Administrator can ALSO fix
   one global window that applies to every section at once (App.state.
   practicalInternalWindow / App.setPracticalWindow('pracInternal', ...) —
   set from the Term Test Cycle admin page). Entry needs to be inside BOTH
   windows wherever both are set — whichever is stricter wins — so nothing
   already relying on the CC/HOD fields breaks; the Administrator's window
   is just an additional, equally-enforced fence. The same pair of
   functions is reused for SEE Practical (which has no per-course CC/HOD
   fields at all — only the Administrator's global window applies there),
   selected via the `windowState` param. */
function adminWindowFor(kind){
  return kind==='pracInternal' ? App.state.practicalInternalWindow : App.state.seePracticalWindow;
}
function pracInternalDeadlinePassed(course){
  if(!course) return false;
  const adminWin = adminWindowFor('pracInternal');
  if(adminWin && adminWin.endDate){
    const end = new Date(adminWin.endDate);
    if(!isNaN(end.getTime()) && Date.now() > end.getTime()) return true;
  }
  if(!course.pracInternalDeadline) return false;
  const end = new Date(course.pracInternalDeadline);
  return !isNaN(end.getTime()) && Date.now() > end.getTime();
}
function pracInternalNotYetStarted(course){
  if(!course) return false;
  const adminWin = adminWindowFor('pracInternal');
  if(adminWin && adminWin.startDate){
    const start = new Date(adminWin.startDate);
    if(!isNaN(start.getTime()) && Date.now() < start.getTime()) return true;
  }
  if(!course.pracInternalStart) return false;
  const start = new Date(course.pracInternalStart);
  return !isNaN(start.getTime()) && Date.now() < start.getTime();
}
/* SEE Practical has no per-course CC/HOD fields (unlike Practical Internal
   above) — only the Administrator's global window (if any) gates it. No
   window set at all means no restriction, same default as everything else. */
function seePracticalDeadlinePassed(){
  const adminWin = adminWindowFor('seePractical');
  if(!adminWin || !adminWin.endDate) return false;
  const end = new Date(adminWin.endDate);
  return !isNaN(end.getTime()) && Date.now() > end.getTime();
}
function seePracticalNotYetStarted(){
  const adminWin = adminWindowFor('seePractical');
  if(!adminWin || !adminWin.startDate) return false;
  const start = new Date(adminWin.startDate);
  return !isNaN(start.getTime()) && Date.now() < start.getTime();
}

const STATUS_LABEL = { draft:'InProgress', submitted:'Submitted', coordinated:'Coordinated', verified:'Verified', approved:'Approved' };
// STATUS_LABEL is the pill wording (e.g. "InProgress"); this is the same
// status spelled out for mid-sentence use ("This record is in progress...")
// so those sentences don't read as one run-together word.
function statusSentenceLabel(status){ return status==='draft' ? 'in progress' : (STATUS_LABEL[status]||'').toLowerCase(); }
const STATUS_CLASS = { draft:'status-draft', submitted:'status-submitted', coordinated:'status-coordinated', verified:'status-verified', approved:'status-approved' };
/* The components with their own independent CI -> CC -> HOD approval chain
   (see App.forwardItem / App.sendBackItem), separate from the Overall
   record's own submission pipeline. SEE Theory is deliberately excluded —
   it's the Examination Branch's own record. There is deliberately NO EA
   step in this chain — the Executive Assistant only sits in the Overall
   record's flow (see OVERALL_STAGE_LABELS below). tt3 is listed here so
   the same CI -> CC -> HOD chain applies to it, but note it has no
   template component wired up yet (see termTestComponentKey) — until one
   is added, itemFlowApplicable('tt3') is always false and this chain
   never actually starts for it. */
const ITEM_FLOW_KEYS = ['tt1','tt2','tt3','pracInternal','seePractical'];
const ITEM_FLOW_LABELS = { tt1:'Term Test 1', tt2:'Term Test 2', tt3:'Term Test 3', pracInternal:'Practical Internal Test', seePractical:'SEE Practical' };
const ITEM_STAGE_LABELS = { ci:'Course Instructor', cc:'Course Coordinator', hod:'HOD', done:'Approved' };
const ITEM_NEXT_STAGE = { ci:'cc', cc:'hod', hod:'done' };
/* ---------- Admin Roster Assignment override ----------
   Normally "who is responsible for entering/forwarding one of the 5 item
   flows above" is simply this section's registered Course Instructor
   (isCourseOwnerCI), derived from Course Registration / the normal CI
   assignment. An Administrator can instead upload a roll-number list (see
   renderAdminRosterAssignment / App.setItemRosterOverride) assigning a
   SPECIFIC set of students, for ONE item on ONE course, to a named faculty
   member — independent of who the course's actual registered CI is.
   Several faculty can each own a different roll-number slice of the same
   item (e.g. a large section split across multiple internal examiners for
   a Term Test). Everything else about the course — every other CIE/SEE
   component, the Overall record, who the "real" CI is — is completely
   unaffected and still comes from Course Registration as always; this
   override only ever touches the 5 ITEM_FLOW_KEYS items. */
function getItemRosterOverrides(course, itemKey){
  return (course && course.itemRosterOverrides && course.itemRosterOverrides[itemKey]) || [];
}
/* Whoever is looking at an item that HAS overrides is only treated as "the
   CI" for permission purposes (view/edit/forward at the ci stage) if
   they're one of the uploaded faculty for THIS item — the section's
   ordinary registered CI is bypassed entirely once an override exists for
   that item, per the Admin's roster-assignment upload. Falls back to the
   ordinary registered CI whenever no override has been set for this item
   at all — this is the "rest is taken from Course Registration" case. */
function isItemCIFor(course, itemKey){
  if(!course) return false;
  const actor = App.currentUser();
  if(!actor) return false;
  const overrides = getItemRosterOverrides(course, itemKey);
  if(overrides.length) return overrides.some(o=>o.facultyUserId===actor.id);
  return isCourseOwnerCI(course);
}
/* Which of course.students belong on THIS item's entry/verification page
   for the CURRENT viewer. No overrides -> the whole roster, exactly as
   before. With overrides -> a faculty member who owns one of the uploaded
   slices sees only THEIR OWN roll numbers (so two examiners splitting one
   Term Test never see or touch each other's rows); anyone else looking at
   the page (Admin, the assigned CC, HOD at their own stage, or even the
   section's own ordinary CI if the item was fully handed off to others)
   sees the combined pool across every uploaded slice, for verification. */
function itemEntryStudents(course, itemKey){
  const all = course.students || [];
  const overrides = getItemRosterOverrides(course, itemKey);
  if(!overrides.length){
    // Term Test 1/2 rosters are Admin-assigned only: unlike the other
    // ITEM_FLOW_KEYS (Practical Internal, SEE Practical), Course
    // Registration's full class list must NEVER show up here by default —
    // student names/roll numbers stay hidden on the TT1/TT2 entry, review
    // and remark pages until an Administrator has uploaded a roll-number
    // list for this specific cycle via Roster Assignment. Everything else
    // about the course is unaffected; this only narrows what tt1/tt2 shows.
    if(itemKey==='tt1' || itemKey==='tt2') return [];
    return all;
  }
  const actor = App.currentUser();
  const mine = actor && overrides.find(o=>o.facultyUserId===actor.id);
  const rollSet = new Set((mine ? [mine] : overrides).flatMap(o=>o.rollNos));
  return all.filter(s=>s.rollNo && rollSet.has(s.rollNo.toUpperCase()));
}
/* Overall record (CIE Total/SEE Total/Grand Total) mapped onto the same
   5-stage shape as the item flows, for the Verification Status tab —
   course.status + ebPublished collapsed into one "whose turn is it" value. */
const OVERALL_STAGE_LABELS = { ci:'CI', cc:'CC', ea:'EA', hod:'HOD', eb:'EB' };
function overallStageFor(course){
  if(course.status==='draft') return 'ci';
  if(course.status==='submitted') return 'cc';
  if(course.status==='coordinated') return 'ea';
  if(course.status==='verified') return 'hod';
  if(course.status==='approved') return course.ebPublished ? 'done' : 'eb';
  return 'ci';
}
/* Compact icon+label row for the Verification Status table — a denser
   sibling of itemStageDotsHtml, meant to fit several per row. */
function compactStageDots(stage, order, labelMap){
  const idx = order.indexOf(stage);
  return order.map((s,i)=>{
    const state = stage==='done' ? 'done' : i<idx ? 'done' : stage===s ? 'current' : 'pending';
    const icon = state==='done' ? '✓' : state==='current' ? '…' : '✗';
    const color = state==='done' ? '#2f7a3f' : state==='current' ? 'var(--brass)' : 'var(--seal-red)';
    return `<span style="display:inline-block;margin-right:7px;font-size:11.5px;white-space:nowrap;"><b style="color:${color};">${icon}</b> ${escapeHtml(labelMap[s]||s)}</span>`;
  }).join('');
}
/* ---------- Verification Status tab — visible to Course Instructor,
   Course Coordinator and HOD. One row per section, showing exactly where
   each of the 4 independent item chains and the Overall record currently
   sit, at a glance. ---------- */
function renderVerificationStatus(){
  const user = App.currentUser();

    courses = App.state.courses.slice();

    const map = new Map();
    [...ccCourses, ...ciCourses].forEach(c=>map.set(c.id, c));
    courses = Array.from(map.values());
  }
  courses = courses.filter(c=>c.evalType);
  const rows = courses.map(c=>{
    const template = getCourseTemplate(c);
    const itemCell = key => {
      if(!itemFlowApplicable(template, key)) return `<td class="section-meta">— n/a —</td>`;
      const ia = App.itemApproval(c.id, key) || { stage:'ci' };
      let onclick;
      if(key==='tt1' || key==='tt2') onclick = `App.navigate('ci-termtest-entry',{courseId:'${c.id}', cycle:'${key==='tt1'?'TT1':'TT2'}'})`;
      else {
        const section = key==='pracInternal' ? 'cie' : 'see';
        const list = section==='cie' ? template.cie : seeDisplayComponents(template);
        const comp = key==='pracInternal' ? list.find(x=>x.key==='pracInternal') : list.find(x=>x.key==='seePractical'||x.key==='seePracticalProject');

      ${itemCell('tt2')}
      ${itemCell('pracInternal')}
      ${itemCell('seePractical')}
      <td>${compactStageDots(overallStageFor(c), ['ci','cc','ea','hod','eb'], OVERALL_STAGE_LABELS)}</td>
    </tr>`;  }).join('');
  wrap.innerHTML = `
    <div class="page-head">
      <div class="page-eyebrow">Verification Status</div>
      <h2>Marks Verification — at a glance</h2>
      <p class="section-meta">✓ = done at that stage · … = sitting there right now · ✗ = not reached yet. Term Test 1/2/3, Practical Internal Test and SEE Practical each move independently through CI → CC → HOD (no EA step). Overall (CIE Total/SEE Total/Grand Total) moves through CI → CC → EA → HOD → EB (Examination Branch). SEE Theory isn't shown — it's the Examination Branch's own record, outside this flow.</p>

          <tbody>${rows}</tbody>

}

   one of the flow items and (with EA + a 5th EB dot) for the Overall

function itemStageDotsHtml(stage, stageOrder){

  };
  return order.map((s,i)=>dot(ITEM_STAGE_LABELS[s]||s, stage==='done'||i<idx ? 'done' : stage===s ? 'current' : 'pending')).join('')

/* ---------- Lightweight inline charts (no external chart library) ----------
   A handful of small, dependency-free SVG chart builders used to give the
   Course Instructor's marks-entry pages (Term Test, and anywhere else that
   wants it) an at-a-glance visual on top of the plain stats cards. Colors
   are drawn from the existing brass/parchment/seal palette so charts feel
   native to the rest of the document rather than bolted on. ---------- */
function polarToCartesian(cx, cy, r, angleDeg){
  const rad = (angleDeg-90) * Math.PI/180;
  return { x: cx + r*Math.cos(rad), y: cy + r*Math.sin(rad) };
}
function pieSlicePath(cx, cy, r, startAngle, endAngle){
  const start = polarToCartesian(cx, cy, r, startAngle);
  const end = polarToCartesian(cx, cy, r, endAngle);
  const largeArcFlag = (endAngle-startAngle) <= 180 ? '0' : '1';
  return `M ${cx} ${cy} L ${start.x.toFixed(2)} ${start.y.toFixed(2)} A ${r} ${r} 0 ${largeArcFlag} 1 ${end.x.toFixed(2)} ${end.y.toFixed(2)} Z`;
}
/* Bar chart / histogram — buckets: [{label, count, color}] */
function svgBarChart(buckets, opts={}){
  const w = opts.width || 380, h = opts.height || 190;
  const padL = 30, padR = 10, padT = 22, padB = 30;
  const chartW = w-padL-padR, chartH = h-padT-padB;
  const maxCount = Math.max(1, ...buckets.map(b=>b.count));
  const gap = 10;
  const barW = Math.max(8, (chartW - gap*(buckets.length-1)) / buckets.length);
  let bars = '', labels = '';
  buckets.forEach((b,i)=>{
    const bh = maxCount ? (b.count/maxCount)*chartH : 0;
    const x = padL + i*(barW+gap);
    const y = padT + (chartH-bh);
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" style="fill:${b.color||'var(--brass)'};"><title>${escapeHtml(b.label)}: ${b.count} student${b.count===1?'':'s'}</title></rect>`;
    if(b.count>0) bars += `<text x="${(x+barW/2).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle" style="font-size:10.5px;font-family:'IBM Plex Mono',monospace;fill:var(--ink);">${b.count}</text>`;
    labels += `<text x="${(x+barW/2).toFixed(1)}" y="${h-10}" text-anchor="middle" style="font-size:9.5px;font-family:'IBM Plex Mono',monospace;fill:var(--text-soft);">${escapeHtml(b.label)}</text>`;
  });
  const axis = `<line x1="${padL}" y1="${padT+chartH}" x2="${padL+chartW}" y2="${padT+chartH}" style="stroke:var(--rule);stroke-width:1;"/>`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="max-width:100%;height:auto;">${axis}${bars}${labels}</svg>`;
}
/* Pie / donut chart with a side legend — segments: [{label, count, color}] */
function svgPieChart(segments, opts={}){
  const size = opts.size || 160;
  const r = size/2 - 6, cx = size/2, cy = size/2;
  const total = segments.reduce((a,s)=>a+s.count,0);
  let angle = 0, paths = '';
  if(total===0){
    paths = `<circle cx="${cx}" cy="${cy}" r="${r}" style="fill:var(--rule-light);stroke:var(--rule);stroke-width:1;"/>`;
  } else {
    segments.filter(s=>s.count>0).forEach(s=>{
      const sweep = (s.count/total)*360;
      const d = sweep>=359.99
        ? `M ${cx-r} ${cy} A ${r} ${r} 0 1 1 ${cx+r} ${cy} A ${r} ${r} 0 1 1 ${cx-r} ${cy} Z`
        : pieSlicePath(cx, cy, r, angle, angle+sweep);
      paths += `<path d="${d}" style="fill:${s.color};" stroke="var(--card)" stroke-width="1.5"><title>${escapeHtml(s.label)}: ${s.count} student${s.count===1?'':'s'}</title></path>`;
      angle += sweep;
    });
  }
  const legend = segments.map(s=>`<div style="display:flex;align-items:center;gap:7px;font-size:11.5px;margin:4px 0;">
    <span style="width:10px;height:10px;border-radius:2px;background:${s.color};display:inline-block;flex-shrink:0;"></span>
    <span>${escapeHtml(s.label)} — <strong>${s.count}</strong>${total?` (${round1(s.count/total*100)}%)`:''}</span>
  </div>`).join('');
  return `<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0;">${paths}</svg>
    <div>${legend}</div>
  </div>`;
}
/* Builds the histogram + performance-band pie for a set of {student,total}
   scores against a fixed maxScore. Used on the Term Test entry page (and
   reusable anywhere a raw-mark distribution needs a quick visual). */
function buildScoreAnalyticsCharts(scored, maxScore){
  if(!scored.length){
    return `<p class="section-meta">No marks entered yet — charts will appear once at least one student has a score.</p>`;
  }
  const bucketCount = 5;
  const bucketSize = maxScore/bucketCount;
  const rangeColors = ['var(--seal-red)','var(--brass-light)','var(--brass)','var(--brass)','var(--seal-green)'];
  const buckets = Array.from({length:bucketCount}, (_,i)=>{
    const lo = round1(i*bucketSize), hi = round1((i+1)*bucketSize);
    return { label:`${lo}–${hi}`, count:0, color: rangeColors[i] };
  });
  scored.forEach(x=>{
    let idx = Math.floor(x.total/bucketSize);
    if(idx>=bucketCount) idx = bucketCount-1;
    if(idx<0) idx = 0;
    buckets[idx].count++;
  });
  const bands = [
    { label:'Excellent (≥80%)', min:0.8, color:'var(--seal-green)', count:0 },
    { label:'Good (60–79%)', min:0.6, color:'var(--brass)', count:0 },
    { label:'Average (40–59%)', min:0.4, color:'var(--brass-light)', count:0 },
    { label:'Below Average (<40%)', min:0, color:'var(--seal-red)', count:0 },
  ];
  scored.forEach(x=>{
    const pct = maxScore>0 ? x.total/maxScore : 0;
    (bands.find(b=>pct>=b.min) || bands[bands.length-1]).count++;
  });
  return `<div style="display:flex;gap:28px;flex-wrap:wrap;margin-top:10px;">
    <div style="flex:1;min-width:300px;">
      <div class="section-meta" style="font-weight:600;margin-bottom:2px;">Score Distribution</div>
      ${svgBarChart(buckets, {width:380, height:190})}
    </div>
    <div style="flex:1;min-width:260px;">
      <div class="section-meta" style="font-weight:600;margin-bottom:2px;">Performance Bands</div>
      ${svgPieChart(bands, {size:150})}
    </div>
  </div>`;
}

const TERM_TEST_LABELS = { TT1:'Term Test 1', TT2:'Term Test 2', TT3:'Term Test 3' };

/* Shared "Term Test time period" banner — dropped at the top of every
   role's landing dashboard (CI's "My Subjects", CC's "My Coordination",
   EA's "Verification Queue", HOD's "Pending Approval", and the
   Examination Branch's "Approved Records") so nobody has to click into a
   Term Test entry page just to see when TT1/TT2 opens or closes.
   Three states, in priority order:
     1. The Administrator's currently-fixed cycle, while its window is
        either still open OR hasn't started yet ("Active"/"Upcoming").
     2. Once that window closes (or no cycle is fixed at all), the most
        recent past cycle's window from termTestHistory — labelled
        "Previous" — so the dashboard still shows a concrete date range
        instead of just going blank the moment a deadline passes.
     3. Nothing, only if there's genuinely no dated cycle on record yet. */
function termTestPeriodBannerHtml(){
  const fmtWindow = (startTs, endTs) => {
    const dOnly = ts => new Date(ts).toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'});
    if(startTs && endTs) return `${dOnly(startTs)} – ${dOnly(endTs)}`;
    if(startTs) return `Opens ${dOnly(startTs)}`;
    if(endTs) return `Closes ${dOnly(endTs)}`;
    return 'No window set';
  };
  const fullLabelFor = (cycle, academicYear, semester) => {
    const label = TERM_TEST_LABELS[cycle] || cycle;
    return (academicYear && semester) ? `${academicYear} · ${semester} · ${label}` : label;
  };
  const bannerRow = (kind, fullLabel, windowText) => {
    const pillClass = kind==='Active' ? 'status-approved' : kind==='Upcoming' ? 'status-submitted' : 'status-draft';
    const borderColor = kind==='Previous' ? 'var(--text-soft)' : 'var(--brass)';
    return `<div class="card" style="padding:12px 16px;margin-bottom:14px;border-left:3px solid ${borderColor};display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <span class="status-pill ${pillClass}" style="flex-shrink:0;">${kind} examination cycle</span>
      <span class="section-meta" style="font-weight:600;color:var(--ink);">${escapeHtml(fullLabel)}</span>
      <span class="section-meta">${escapeHtml(windowText)}</span>
    </div>`;
  };

  const tt = App.state.currentTermTest;
  const nowTs = Date.now();
  if(tt && tt.cycle){
    const startTs = tt.startDate ? new Date(tt.startDate).getTime() : null;
    const endTs = tt.endDate ? new Date(tt.endDate).getTime() : null;
    const ended = endTs && nowTs > endTs;
    if(!ended){
      const notStarted = startTs && nowTs < startTs;
      return bannerRow(notStarted ? 'Upcoming' : 'Active', fullLabelFor(tt.cycle, tt.academicYear, tt.semester), fmtWindow(startTs, endTs));
    }
    // Window's closed but the Admin hasn't fixed the next cycle yet — fall
    // through and show THIS cycle's own (now past) window as "Previous",
    // same as the termTestHistory lookup below would for an older one.
    return bannerRow('Previous', fullLabelFor(tt.cycle, tt.academicYear, tt.semester), fmtWindow(startTs, endTs));
  }
  // No cycle fixed right now — look back through history (newest first)
  // for the most recent cycle that actually carried a dated window.
  const history = App.state.termTestHistory || [];
  const past = history.find(h=>h.cycle && (h.startDate || h.endDate));
  if(!past) return '';
  const startTs = past.startDate ? new Date(past.startDate).getTime() : null;
  const endTs = past.endDate ? new Date(past.endDate).getTime() : null;
  return bannerRow('Previous', fullLabelFor(past.cycle, past.academicYear, past.semester), fmtWindow(startTs, endTs));
}

// ============================================================================
// TERM TEST QUESTION TEMPLATE — fixed for every student, every course,
// regardless of Evaluation Type. Structure (per the official Term Test
// paper pattern):
//   Short answers: Q1–Q5, 2 marks each = 10 marks, all compulsory.
//   Long answers:  Q6–Q11, arranged as 3 "either/or" choice pairs —
//                  (Q6 or Q7) from Unit 1, (Q8 or Q9) from Unit 2,
//                  (Q10 or Q11) from Unit 3. The student attempts exactly
//                  ONE question per pair (3 attempted out of 6 offered), so
//                  only one side of each pair may carry marks — the app
//                  enforces this. Each long question is further split into
//                  parts (a) and (b) that together make up its total.
//   Q6/Q7 and Q8/Q9 are 16 marks each (full units); Q10/Q11 is 8 marks
//   (half a unit) — the syllabus's 5 units split half for TT1, half for
//   TT2 (TT3 is used only rarely, covering whichever half is needed then).
//   Raw long-answer total (16 + 16 + 8 = 40) needs no further scaling.
//   Term Test total = 10 (short, unscaled) + 40 (long) = 50 marks,
//   matching the raw/50 the existing CIE templates already expect for
//   tt1 / tt2 / termTest.
// ============================================================================
const TT_SHORT_KEYS = ['q1','q2','q3','q4','q5'];
const TT_SHORT_EACH_MAX = 2;
const TT_SHORT_TOTAL_MAX = 10;
const TT_LONG_PAIRS = [
  { a:'q6',  b:'q7',  max:16 },
  { a:'q8',  b:'q9',  max:16 },
  // Q10/Q11 only spans half a unit (5 units total, split across the two
  // half-syllabus Term Tests), so its pair caps at 8 marks instead of 16.
  { a:'q10', b:'q11', max:8  },
];
// Raw long-answer max = sum of each pair's max (16 + 16 + 8 = 40), which now
// equals TT_LONG_SCALED_MAX exactly — so scaling is a straight passthrough
// unless the per-pair maxes above are changed again later.
const TT_LONG_RAW_MAX = TT_LONG_PAIRS.reduce((sum,p)=>sum+p.max, 0);
const TT_LONG_SCALED_MAX = 40;
const TT_TOTAL_MAX = 50;      // 10 short + 40 scaled-long

/* Academic Year (rolling window, "year by year") + Semester — the Admin
   picks both alongside the Term Test cycle, so what's fixed is always
   labelled e.g. "2025-2026 · Semester 1 · Term Test 1". */
function generateAcademicYears(){
  const startY = new Date().getFullYear() - 2;
  const years = [];
  for(let y=startY; y<=startY+6; y++) years.push(`${y}-${y+1}`);
  return years;
}
