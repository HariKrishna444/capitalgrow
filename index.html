  },

  setTermTestMark(courseId, studentId, cycle, qKey, subpart, rawValue){
    const actor = this.currentUser();
    const course = this.getCourse(courseId);
    if(!course){ toast('Course not found.', 'err'); return; }
    const ciUser = getCourseCIUser(courseId);
    if(ciUser?.id !== actor.id && actor.systemRole!=='ADMIN'){ toast('Only this section\'s Course Instructor can enter Term Test marks.', 'err'); return; }
    if(course.status!=='draft' && !course.editUnlocked){ toast('This record is locked — Term Test marks can no longer be edited.', 'err'); return; }
    if(!isTTForwarded(course, cycle)){ toast('Your Course Coordinator hasn\'t forwarded the Question Paper Setup for this cycle yet.', 'err'); return; }
    const s = (course.students||[]).find(x=>x.id===studentId);
    if(!s) return;
    s.marks = s.marks || {};
    s.marks.ttDetail = s.marks.ttDetail || {};
    s.marks.ttDetail[cycle] = s.marks.ttDetail[cycle] || {};
    // Note: no longer clamped to the question's max here — an out-of-range
    // entry is kept as typed and flagged red (see the `invalid` class in
    // renderCITermTestEntry) so the faculty member notices and fixes it
    // themselves, instead of it silently being rewritten to the maximum.
    let val = (rawValue===''||rawValue===null||rawValue===undefined) ? undefined : parseFloat(rawValue);
    if(typeof val==='number' && isNaN(val)) val = undefined;
    if(subpart){
      s.marks.ttDetail[cycle][qKey] = s.marks.ttDetail[cycle][qKey] || {};
      if(val===undefined) delete s.marks.ttDetail[cycle][qKey][subpart]; else s.marks.ttDetail[cycle][qKey][subpart] = val;
    } else {
      if(val===undefined) delete s.marks.ttDetail[cycle][qKey]; else s.marks.ttDetail[cycle][qKey] = val;
    }
    const template = getCourseTemplate(course);
    const compKey = termTestComponentKey(template, cycle);
    const calc = computeTermTestRaw(s.marks.ttDetail[cycle]);
    if(compKey) s.marks[compKey] = calc.total;
    syncStudent(courseId, s);
    renderContent();
  },

  /* ---------- CI: SIA unit-wise entry — sums the per-unit /10 scores into
     s.marks[compKey] (the same "raw" slot every other CIE component uses),
     which the existing generic (raw/rawMax)*scaledMax pipeline then scales
     down automatically. Mirrors setTermTestMark's ttDetail pattern. ---------- */
  setSiaUnitMark(courseId, studentId, compKey, unitIdx, rawValue){
    const actor = this.currentUser();
    const course = this.getCourse(courseId);
    if(!course){ toast('Course not found.', 'err'); return; }
    const ciUser = getCourseCIUser(courseId);
    if(ciUser?.id !== actor.id && actor.systemRole!=='ADMIN'){ toast('Only this section\'s Course Instructor can enter SIA marks.', 'err'); return; }
    if(course.status!=='draft' && !course.editUnlocked){ toast('This record is locked — SIA marks can no longer be edited.', 'err'); return; }
    const s = (course.students||[]).find(x=>x.id===studentId);
    if(!s) return;
    s.marks = s.marks || {};
    s.marks.siaDetail = s.marks.siaDetail || {};
    // Note: no longer clamped to 10 here — an out-of-range entry is kept as
    // typed and flagged red (see the `invalid` class in siaEntryHtml) so the
    // faculty member notices and fixes it, instead of it silently being
    // rewritten to the maximum.
    let val = (rawValue===''||rawValue===null||rawValue===undefined) ? undefined : parseFloat(rawValue);
    if(typeof val==='number' && isNaN(val)) val = undefined;
    if(val===undefined) delete s.marks.siaDetail['unit'+unitIdx]; else s.marks.siaDetail['unit'+unitIdx] = val;
    const sum = Object.values(s.marks.siaDetail).reduce((a,b)=>a+(typeof b==='number'?b:0), 0);
    s.marks[compKey] = Math.round(sum*2)/2;
    syncStudent(courseId, s);
    renderContent();
  },

  /* ---------- EA: faculty directory, uploaded branch-wise ---------- */
  addFacultyToDirectory(rawName, rawEmail, branch){
    const actor = this.currentUser();
    if(!['EA','ADMIN'].includes(actor.systemRole)){ toast('Only the Executive Assistant can upload the faculty directory.', 'err'); return; }
    const name = (rawName||'').trim();
    const email = (rawEmail||'').trim().toLowerCase();
    if(!name || !email){ toast('Name and email are required.', 'err'); return; }
    if(!isValidEmail(email)){ toast('Enter a valid email address.', 'err'); return; }
    if(!BRANCH_LABELS[branch]){ toast('Choose a branch.', 'err'); return; }
    const existing = this.state.users.find(u=>u.email.toLowerCase()===email);
    if(existing && existing.systemRole!=='FACULTY'){ toast('This email already belongs to a non-faculty account.', 'err'); return; }
    let row;
    if(existing){
      existing.name = name;
      existing.homeBranch = branch;
      row = existing;
    } else {
      row = { id:bizId('FAC', [email.split('@')[0]], this.state.users.map(u=>u.id)), name, email, systemRole:'FACULTY', homeBranch:branch };
      this.state.users.push(row);
    }
    syncProfile(row);
    toast(`${name} added to the ${branchLabel(branch)} faculty directory.`, 'ok');
    this.navigate('ea-faculty');
  },
  removeFacultyFromDirectory(userId){
    const actor = this.currentUser();
    if(!['EA','ADMIN'].includes(actor.systemRole)){ toast('Only the Executive Assistant can edit the faculty directory.', 'err'); return; }
    const u = this.getUserById(userId);
    if(!u) return;
    delete u.homeBranch;
    syncProfile(u);
    toast(`${u.name} removed from the faculty directory.`, 'err');
    this.navigate('ea-faculty');
  },
  bulkImportFaculty(rows){
    const actor = this.currentUser();
    if(!['EA','ADMIN'].includes(actor.systemRole)){ toast('Only the Executive Assistant can import the faculty directory.', 'err'); return; }
    if(!Array.isArray(rows) || rows.length===0){ toast('That file has no rows to import.', 'err'); return; }
    let added=0, updated=0, skipped=0;
    const touched = [];
    rows.forEach(row=>{
      const keys = Object.keys(row||{});
      const findKey = (re) => keys.find(k=>re.test(String(k).trim()));
      const nameKey = findKey(/^name$/i);
      const emailKey = findKey(/^e-?mail$/i);
      const branchKey = findKey(/^branch$/i);
      const name = nameKey ? String(row[nameKey]).trim() : '';
      const email = emailKey ? String(row[emailKey]).trim().toLowerCase() : '';
      const branch = branchKey ? String(row[branchKey]).trim().toUpperCase() : '';
      if(!name || !email || !isValidEmail(email) || !BRANCH_LABELS[branch]){ skipped++; return; }
      const existing = this.state.users.find(u=>u.email.toLowerCase()===email);
      if(existing && existing.systemRole!=='FACULTY'){ skipped++; return; }
      if(existing){ existing.name=name; existing.homeBranch=branch; updated++; touched.push(existing); }
      else { const u2={ id:bizId('FAC', [email.split('@')[0]], this.state.users.map(u=>u.id)), name, email, systemRole:'FACULTY', homeBranch:branch }; this.state.users.push(u2); added++; touched.push(u2); }
    });
    syncProfiles(touched);
    if(added+updated===0){
      toast(`Import found nothing usable. Check the file has Name, Email, and Branch columns (Branch must be ${Object.keys(BRANCH_LABELS).join('/')}).`, 'err');
    } else {
      toast(`Import complete — ${added} added, ${updated} updated${skipped?`, ${skipped} skipped`:''}.`, 'ok');
    }
    this.navigate('ea-faculty');
  },

  /* ---------- EA: student directory, uploaded batch- and branch-wise ----------
     Roster is keyed by (roll_no, batch) — same roll number can recur across
     different batches but not twice within one. Branch/Department is
     per-row, so one file can freely mix CSE/AIML/SAP/etc rows together and
     each is filed under its own branch automatically — no need to split
     the file per department first. */
  addStudentToDirectory(rawRollNo, rawName, rawEmail, batch, branch, rawSemester){
    const actor = this.currentUser();
    if(!['EA','ADMIN'].includes(actor.systemRole)){ toast('Only the Executive Assistant can update the student directory.', 'err'); return; }
    const rollNo = (rawRollNo||'').trim().toUpperCase();
    const name = (rawName||'').trim();
    const email = (rawEmail||'').trim().toLowerCase();
    const semester = (rawSemester||'').trim();
    if(!rollNo || !name){ toast('Roll No and Name are required.', 'err'); return; }
    if(email && !isValidEmail(email)){ toast('Enter a valid email address, or leave it blank.', 'err'); return; }
    if(!BATCH_BRANCHES[batch]){ toast('Choose a Batch.', 'err'); return; }
    if(!BATCH_BRANCHES[batch].includes(branch)){ toast(`${branch || 'That branch'} isn't offered for ${batch} — valid branches are ${BATCH_BRANCHES[batch].join(', ')}.`, 'err'); return; }
    const existing = this.state.studentDirectory.find(s=>s.rollNo===rollNo && s.batch===batch);
    let row;
    if(existing){
      Object.assign(existing, { name, email, branch, semester });
      row = existing;
    } else {
      row = { id:bizId('STU', [rollNo, batch], this.state.studentDirectory.map(s=>s.id)), rollNo, name, email, branch, batch, semester };
      this.state.studentDirectory.push(row);
    }
    syncStudentDirectoryEntry(row);
    toast(`${name} (${rollNo}) added to ${batch} · ${branchLabel(branch)}.`, 'ok');
    this.navigate('ea-students');
  },
  removeStudentFromDirectory(id){
    const actor = this.currentUser();
    if(!['EA','ADMIN'].includes(actor.systemRole)){ toast('Only the Executive Assistant can edit the student directory.', 'err'); return; }
    const idx = this.state.studentDirectory.findIndex(s=>s.id===id);
    if(idx===-1) return;
    const [removed] = this.state.studentDirectory.splice(idx,1);
    deleteStudentDirectoryEntry(id);
    toast(`${removed.name} removed from the student directory.`, 'err');
    this.navigate('ea-students');
  },
  // rows: parsed spreadsheet rows with Roll No / Name / Email / Department / Semester
  // columns (Department may be a mix of any branch valid for `batch` — each
  // row is sorted into its own branch automatically from that column).
  bulkImportStudents(rows, batch){
    const actor = this.currentUser();
    if(!['EA','ADMIN'].includes(actor.systemRole)){ toast('Only the Executive Assistant can import the student directory.', 'err'); return; }
    if(!BATCH_BRANCHES[batch]){ toast('Choose a Batch before importing.', 'err'); return; }
    if(!Array.isArray(rows) || rows.length===0){ toast('That file has no rows to import.', 'err'); return; }
    let added=0, updated=0, skipped=0;
    const bySort = {}; // branch -> count, just for the summary toast
    rows.forEach(row=>{
      const keys = Object.keys(row||{});
      const findKey = (re) => keys.find(k=>re.test(String(k).trim()));
      const rollKey = findKey(/^roll\s*-?no\.?$/i);
      const nameKey = findKey(/^name$/i);
      const emailKey = findKey(/^e-?mail$/i);
      const deptKey = findKey(/^dep(artmen)?t$/i) || findKey(/^branch$/i);
      const semKey = findKey(/^sem(ester)?$/i);
      const rollNo = rollKey ? String(row[rollKey]).trim().toUpperCase() : '';
      const name = nameKey ? String(row[nameKey]).trim() : '';
      const email = emailKey ? String(row[emailKey]).trim().toLowerCase() : '';
      const branch = deptKey ? String(row[deptKey]).trim().toUpperCase() : '';
      const semester = semKey ? String(row[semKey]).trim() : '';
      if(!rollNo || !name || !BATCH_BRANCHES[batch].includes(branch)){ skipped++; return; }
      if(email && !isValidEmail(email)){ skipped++; return; }
      const existing = this.state.studentDirectory.find(s=>s.rollNo===rollNo && s.batch===batch);
      if(existing){ Object.assign(existing, { name, email, branch, semester }); updated++; }
      else { this.state.studentDirectory.push({ id:bizId('STU', [rollNo, batch], this.state.studentDirectory.map(s=>s.id)), rollNo, name, email, branch, batch, semester }); added++; }
      bySort[branch] = (bySort[branch]||0) + 1;
    });
    const touched = this.state.studentDirectory.filter(s=>s.batch===batch);
    syncStudentDirectoryEntries(touched);
    if(added+updated===0){
      toast(`Import found nothing usable. Check the file has Roll No, Name, Department (${BATCH_BRANCHES[batch].join('/')} for ${batch}) columns.`, 'err');
    } else {
      const sortSummary = Object.keys(bySort).sort().map(b=>`${b}: ${bySort[b]}`).join(', ');
      toast(`Import complete — ${added} added, ${updated} updated${skipped?`, ${skipped} skipped`:''}. Sorted by department — ${sortSummary}.`, 'ok');
    }
    this.navigate('ea-students');
  },

  /* ---------- ADMIN: course registration import ----------
     Wide-format sheet: Regulation, Semester, StudentRollNumber, StudentName,
     then one column per subject (the subject set differs per branch/batch/
     semester file, which is fine — every column after the first four is
     treated as a subject). Each cell is "SECTION : Instructor" (possibly
     several, comma-separated, for multi-component subjects) or "-" for "not
     registered". `batch` and `branch` are picked by the Admin before import
     (the sheet's own Regulation text doesn't map cleanly onto the app's
     batch/branch keys), Semester is read per-row from the sheet itself.
     Re-importing the same batch+branch+semester replaces its prior rows
     wholesale, so a corrected re-upload never leaves stale duplicates. */
  bulkImportCourseRegistrations(rows, batch, branch){
    const actor = this.currentUser();
    if(actor.systemRole!=='ADMIN'){ toast('Only an Administrator can import course registrations.', 'err'); return; }
    if(!BATCH_BRANCHES[batch]){ toast('Choose a Batch before importing.', 'err'); return; }
    if(!BATCH_BRANCHES[batch].includes(branch)){ toast(`${branch || 'That branch'} isn't offered for ${batch} — valid branches are ${BATCH_BRANCHES[batch].join(', ')}.`, 'err'); return; }
    if(!Array.isArray(rows) || rows.length===0){ toast('That file has no rows to import.', 'err'); return; }

    const headerKeys = Object.keys(rows[0]||{});
    const findKey = (names) => headerKeys.find(h=>names.includes(String(h).trim().toLowerCase()));
    const kReg = findKey(['regulation']);
    const kSem = findKey(['semester']);
    const kRoll = findKey(['studentrollnumber','roll no','rollno','roll number']);
    const kName = findKey(['studentname','name']);
    if(!kRoll || !kName){ toast('Could not find StudentRollNumber / StudentName columns in this file.', 'err'); return; }
    const subjectKeys = headerKeys.filter(h=>![kReg,kSem,kRoll,kName].includes(h) && String(h).trim() && !/^__EMPTY/.test(String(h)));
    if(!subjectKeys.length){ toast('No subject columns found after Regulation/Semester/StudentRollNumber/StudentName.', 'err'); return; }

    const newRegs = [];
    const dirTouched = [];
    let studentsSeen = 0, cellsSkipped = 0;
    rows.forEach(row=>{
      const rollNo = String(row[kRoll]||'').trim().toUpperCase();
      const name = String(row[kName]||'').trim();
      if(!rollNo || !name) return;
      studentsSeen++;
      const regulation = kReg ? String(row[kReg]||'').trim() : '';
      const semester = kSem ? String(row[kSem]||'').trim() : '';

      // Keep the Student Directory in sync too, so this roll number is
      // recognized everywhere else in the app (roster imports, etc.).
      const existingDir = this.state.studentDirectory.find(s=>s.rollNo===rollNo && s.batch===batch);
      if(existingDir){ existingDir.name=name; existingDir.branch=branch; if(semester) existingDir.semester=semester; dirTouched.push(existingDir); }
      else {
        const d = { id:bizId('STU',[rollNo,batch], this.state.studentDirectory.map(s=>s.id)), rollNo, name, email:'', branch, batch, semester };
        this.state.studentDirectory.push(d); dirTouched.push(d);
      }

      subjectKeys.forEach(subjectKey=>{
        const subjectName = String(subjectKey).trim();
        const entries = parseRegistrationCell(row[subjectKey]);
        entries.forEach(en=>{
          if(!en.instructor && !en.sectionCode){ cellsSkipped++; return; }
          const idPool = this.state.courseRegistrations.map(r=>r.id).concat(newRegs.map(r=>r.id));
          newRegs.push({
            id: bizId('REG', [batch, branch, semester, rollNo, subjectName, en.sectionCode], idPool),
            batch, branch, regulation, semester, rollNo, studentName:name,
            subjectName, sectionCode:en.sectionCode, instructorName:en.instructor
          });
        });
      });
    });

    if(!newRegs.length){ toast('No registrations found to import — check the file headings match the expected format (Regulation, Semester, StudentRollNumber, StudentName, then one column per subject).', 'err'); return; }

    const semestersTouched = [...new Set(newRegs.map(r=>r.semester))];
    this.state.courseRegistrations = this.state.courseRegistrations.filter(r=>!(r.batch===batch && r.branch===branch && semestersTouched.includes(r.semester)));
    this.state.courseRegistrations.push(...newRegs);

    deleteCourseRegistrationsFor(batch, branch, semestersTouched).then(()=>syncCourseRegistrations(newRegs));
    syncStudentDirectoryEntries(dirTouched);

    const subjectCount = new Set(newRegs.map(r=>r.subjectName)).size;
    toast(`Imported ${newRegs.length} registrations for ${studentsSeen} students across ${subjectCount} subjects (${BATCH_LABELS[batch]} · ${branchLabel(branch)}).${cellsSkipped?` ${cellsSkipped} cells skipped.`:''}`, 'ok');
    this.navigate('admin-course-reg');
  },
  removeCourseRegistration(id){
    const actor = this.currentUser();
    if(actor.systemRole!=='ADMIN'){ toast('Only an Administrator can edit course registrations.', 'err'); return; }
    const idx = this.state.courseRegistrations.findIndex(r=>r.id===id);
    if(idx===-1) return;
    this.state.courseRegistrations.splice(idx,1);
    warnOnError(sb.from('course_registrations').delete().eq('id', id), 'course_registrations-delete:'+id, {toastOnFail:true});
    this.navigate('admin-course-reg');
  },

  /* ---------- ADMIN: turn one imported (subject, section) group into a real
     course section — creates/reuses the course row, assigns the matched
     faculty account as Course Instructor (active immediately, same as every
     other Admin override in this app), and loads the roster from the
     Student Directory so the CI sees these students under "My Subjects"
     right away. Deliberately does NOT invent a faculty login from a bare
     name — the instructor must already exist as a FACULTY account (added
     via Manage System Accounts or the Faculty Directory) with a name that
     matches the sheet exactly, otherwise this can't safely resolve who to
     assign. If the subject isn't found by name in "Courses Applicable", the
     section is still created and the CI assigned, but the Evaluation Type
     is left unfixed — marks entry stays blocked until a Coordinator (or
     Admin) fixes one, same as any freshly created section. */
  async activateCourseRegistrationGroup(idx){
    const actor = this.currentUser();
    if(actor.systemRole!=='ADMIN'){ toast('Only an Administrator can activate a course section from registration data.', 'err'); return; }
    const key = courseRegGroupIndex[idx];
    if(!key){ toast('Could not find that group — refresh the page and try again.', 'err'); return; }
    const { batch, branch, semester, subject, section } = key;
    const list = this.state.courseRegistrations.filter(r=>
      r.batch===batch && r.branch===branch && (r.semester||'—')===semester && r.subjectName===subject && (r.sectionCode||'—')===section);
    if(!list.length){ toast('No registrations found for this group.', 'err'); return; }

    const norm = s => String(s||'').trim().toLowerCase();
    const instructorNames = [...new Set(list.map(r=>r.instructorName).filter(Boolean))];
    if(instructorNames.length===0){ toast('No instructor is listed for this section in the imported sheet.', 'err'); return; }
    if(instructorNames.length>1){ toast(`This section lists more than one instructor (${instructorNames.join(', ')}) — fix the sheet or split the section before activating.`, 'err'); return; }
    const instructorName = instructorNames[0];

    const matches = this.state.users.filter(u=>u.systemRole==='FACULTY' && norm(u.name)===norm(instructorName));
    if(matches.length===0){ toast(`No faculty account named "${instructorName}" was found. Add them first — Manage System Accounts or the Faculty Directory — with the name spelled exactly as in the sheet, then activate again.`, 'err'); return; }
    if(matches.length>1){ toast(`More than one faculty account is named "${instructorName}" (${matches.map(m=>m.email).join(', ')}) — rename one to disambiguate, or assign the Course Instructor manually from Manage Coordinators.`, 'err'); return; }
    const ciUser = matches[0];

    const subj = (this.state.subjects||[]).find(s=>norm(s.name)===norm(subject));
    const code = subj ? subj.code : bizId('SUBJ', [subject], []).replace(/^SUBJ-/,'');
    const name = subj ? subj.name : subject;
    const evalType = subj ? subj.abbr : null;
    const sec = section==='—' ? '' : section;

    let course = this.state.courses.find(c=>normalizeCode(c.code)===normalizeCode(code) && c.section===sec && c.branch===branch);
    const isNewCourse = !course;
    if(!course){
      course = {
        id: bizId('CRS', [code, branch, sec||'nosec'], this.state.courses.map(c=>c.id)), code, name, section:sec, branch,
        status:'draft', sentBack:false, lastRemark:'', eaRemark:'', evalType, examDate:'', scrutinyRemark:'', frozenAt:null, frozenBy:'', scriptUploads:{},
        editRequestStatus:null, editRequestRemark:'', editUnlocked:false, ttLabApproval:null, labExternalApproval:null, etRequests:[], ttPaperConfig:{},
        students:[], studentsLoaded:true, history:[]
      };
      this.state.courses.push(course);
    } else if(!course.evalType && evalType){
      course.evalType = evalType;
    }
    const { error: courseErr } = await syncCourse(course);
    if(courseErr){ if(isNewCourse) this.state.courses = this.state.courses.filter(c=>c.id!==course.id); return; }

    // Build/refresh the roster from the Student Directory so names/emails
    // stay linked; rows that already exist (matched by dirId) keep their
    // marks — only additions show up as new.
    const dirByRoll = {};
    (this.state.studentDirectory||[]).forEach(d=>{ if(d.batch===batch) dirByRoll[d.rollNo] = d; });
    const existingByDirId = {};
    (course.students||[]).forEach(s=>{ if(s.dirId) existingByDirId[s.dirId] = s; });
    const nextStudents = [];
    list.forEach(r=>{
      const dir = dirByRoll[r.rollNo];
      const already = dir ? existingByDirId[dir.id] : (course.students||[]).find(s=>!s.dirId && s.rollNo===r.rollNo);
      if(already){ already.name=r.studentName; already.rollNo=r.rollNo; nextStudents.push(already); }
      else {
        const idPool = (course.students||[]).map(s=>s.id).concat(nextStudents.map(s=>s.id));
        nextStudents.push({ id: bizId('CST', [course.code, course.section||'nosec', r.rollNo], idPool), name:r.studentName, rollNo:r.rollNo, email: dir?dir.email:'', dirId: dir?dir.id:null, marks:{} });
      }
    });
    nextStudents.sort((a,b)=>(a.rollNo||'').localeCompare(b.rollNo||''));
    course.students = nextStudents;
    nextStudents.forEach(s=>syncNewStudent(course.id, s));

    // Assign the Course Instructor — active immediately, mirroring every
    // other Admin-initiated assignment in this app.
    const existingCI = getCourseCIUser(course.id);
    if(!existingCI || existingCI.id !== ciUser.id){
      (this.state.assignments||[]).filter(a=>a.courseId===course.id && a.type==='CI' && a.status==='active').forEach(a=>{
        a.status='revoked'; a.revokedAt=Date.now(); a.revokedBy=actor.id; syncAssignment(a);
      });
      const ciRec = { id:bizId('ASG', ['CI', course.code, course.section||'nosec', String(Date.now())], this.state.assignments.map(a=>a.id)), type:'CI', courseId:course.id, userId:ciUser.id, email:ciUser.email, assignedBy:actor.id, assignedAt:Date.now(), status:'active' };
      this.state.assignments.push(ciRec);
      syncAssignment(ciRec);
      this.notifyUser(ciUser.id, course, `You're now Course Instructor`, `${actor.name} assigned you as Course Instructor for ${course.code} — ${course.name} (Section ${course.section||'—'} · ${branchLabel(course.branch)}), imported from the course registration sheet.`, true, actor.email);
    }
    this.logHistory(course, `Course section activated from Course Registration import: ${code} — ${name} (Section ${sec||'—'} · ${branchLabel(branch)}) · Instructor ${ciUser.name} (${ciUser.email}) (by ${actor.name})`);

    if(!evalType){
      toast(`${ciUser.name} is now Course Instructor for ${code} · Section ${sec||'—'} — ${nextStudents.length} student${nextStudents.length===1?'':'s'} loaded. No matching subject was found in "Courses Applicable", so the Evaluation Type isn't fixed yet — a Coordinator (or you, as Admin) will need to set one before marks can be entered.`, 'ok');
    } else {
      toast(`${ciUser.name} is now Course Instructor for ${code} · Section ${sec||'—'} — ${nextStudents.length} student${nextStudents.length===1?'':'s'} loaded, Evaluation Type ${evalType} auto-matched.`, 'ok');
    }
    renderSidebar();
    this.navigate('admin-course-reg');
  },
  /* ---------- ADMIN: set a course's Evaluation Type directly, bypassing
     the CC-request / HOD-approval chain — for sections that have a Course
     Instructor but no Course Coordinator to request one (e.g. sections
     activated straight from a Course Registration import), or any other
     case where you don't want to wait on that workflow. */
  async adminSetEvalType(courseId, abbr){
    const actor = this.currentUser();
    if(actor.systemRole!=='ADMIN'){ toast('Only an Administrator can set an Evaluation Type directly.', 'err'); return; }
    const course = this.getCourse(courseId);
    if(!course){ toast('Could not find that course.', 'err'); return; }
    const t = getTemplate(abbr);
    if(!t){ toast('Choose a valid Evaluation Type.', 'err'); return; }
    course.evalType = abbr;
    const { error } = await syncCourse(course);
    if(error) return;
    this.logHistory(course, `Evaluation Type set directly to ${abbr} — ${t.label} (by ${actor.name}, Admin override)`);
    const ciUser = getCourseCIUser(courseId);
    if(ciUser) this.notifyUser(ciUser.id, course, `Evaluation Type fixed`, `${actor.name} set the Evaluation Type for ${course.code} — ${course.name} (Section ${course.section||'—'} · ${branchLabel(course.branch)}) to "${t.label}". You can now enter marks.`, true, actor.email);
    toast(`Evaluation Type set to ${t.label} for ${course.code} · Section ${course.section||'—'}.`, 'ok');
    this.navigate('hod-review', { courseId });
  },
};
window.App = App;

/* ---------------- small helpers ---------------- */
function computeCIE(student, components){
  components = components || [];
  let total = 0, complete = true;
  components.forEach(comp=>{
    const raw = student.marks[comp.key];
    if(typeof raw !== 'number'){ complete = false; return; }
    total += (Math.min(raw, comp.rawMax)/comp.rawMax) * comp.scaledMax;
  });
  return { total: round1(total), complete };
}
function computeSEE(student, components){
  return computeCIE(student, components || []);
}
function computeGrandTotal(student, course){
  const template = getCourseTemplate(course);
  const cie = computeCIE(student, template.cie);
  const see = computeSEE(student, seeDisplayComponents(template));
  return { cieTotal:cie.total, seeTotal:see.total, total: round1(cie.total + see.total), complete: cie.complete && see.complete };
}
function courseCIEComplete(course){
  if(!course.studentsLoaded) return !!course.cieComplete; // from course_completion_status, computed server-side
  const components = getCourseComponents(course);
  return course.students.length>0 && course.students.every(s=>computeCIE(s, components).complete);
}
function courseSEEComplete(course){
  if(!course.studentsLoaded) return !!course.seeComplete; // from course_completion_status, computed server-side
  const components = getCourseSeeComponents(course);
  return course.students.length>0 && course.students.every(s=>computeSEE(s, components).complete);
}
function round1(n){ return Math.round(n*10)/10; }
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'}) + ' · ' + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
}
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function toast(msg, kind=''){
  const c = document.getElementById('toast-container');
  const t = el(`<div class="toast ${kind}">${escapeHtml(msg)}</div>`);
  c.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 3600);
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function emptyStateHtml(title, body){ return `<div class="empty-state"><div class="em-title">${escapeHtml(title)}</div>${escapeHtml(body)}</div>`; }
function openModal(html){
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this) closeModal()"><div class="modal-box">${html}</div></div>`;
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }
window.closeModal = closeModal;

function renderBell(){
  const user = App.currentUser();
  if(!user) return;
  const items = App.state.notifications.filter(n=>n.forUserId===user.id);
  const unread = items.filter(n=>!n.read).length;

  countEl.textContent = unread;
  countEl.classList.toggle('hidden', unread===0);
}
function toggleNotifPanel(){
  const panel = document.getElementById('notif-panel');
  const isHidden = panel.classList.contains('hidden');
  if(isHidden){
    const user = App.currentUser();
    const items = App.state.notifications.filter(n=>n.forUserId===user.id).slice(0,20);
    panel.innerHTML = items.length ? items.map(n=>`
      <div class="notif-item">
        <div class="n-title">${escapeHtml(n.title)}</div>
        <div class="n-body">${escapeHtml(n.body)}</div>
        <div class="n-time">${fmtDate(n.ts)}</div>

// lightweight count/completion flags — these need App.ensureCourseStudentsLoaded

const ROUTES_NEEDING_STUDENTS = { 'ci-entry':true, 'ci-termtest-entry':true, 'ci-component-entry':true, 'ci-section-view':true, 'cc-roster':true, 'cc-review':true, 'ea-review':true, 'hod-review':true };
function renderContent(){
  const user = App.currentUser();
  const nav = getNavForUser(user);
  let view = App.ui.view || (nav[0] ? nav[0].v : 'faculty-empty');

  const routes = {
    'admin-users': renderAdminUsers,

    'hod-termtest-overview': renderHODTermTestOverview,

/* ============================================================
   EVALUATION DEADLINE — "complete evaluation within 4 working days
   from the date of examination" (per portal requirements doc). The
   Course Coordinator/HOD/Admin set course.examDate; the deadline is
   that date + 4 working days (Sat/Sun skipped). Shown as a badge on
   the CI/CC/HOD screens for that section — not enforced as a hard
   block, just surfaced so everyone can see what's overdue.
   ============================================================ */
function addWorkingDays(dateStr, days){
  if(!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  if(isNaN(d.getTime())) return null;
  let added = 0;
  while(added < days){
    d.setDate(d.getDate()+1);
    const dow = d.getDay();
    if(dow!==0 && dow!==6) added++;
  }
  return d;
}
function deadlineBadge(course){
  if(!course.examDate) return '';
  const deadline = addWorkingDays(course.examDate, 4);
  if(!deadline) return '';
  const done = ['submitted','coordinated','verified','approved'].includes(course.status);
  const now = new Date();
  const overdue = !done && now > deadline;
  const dateLabel = deadline.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
  const style = overdue ? 'color:var(--seal-red);font-weight:600;' : 'color:var(--text-soft);';
  return `<p class="section-meta" style="margin-top:6px;${style}">Evaluation deadline (exam date + 4 working days): ${dateLabel}${overdue ? ' — OVERDUE, marks not yet submitted' : ''}</p>`;
}

function completionStatsChipsLite(course){

/* Fuller, per-student checkpoint-A breakdown — only valid where
   course.students is the REAL loaded roster (review pages). */
function getCourseCompletionStats(course){
  const students = course.students || [];
  const total = students.length;
  const absent = students.filter(s=>s.absent).length;
  const evaluated = students.filter(s=>{
    if(s.absent) return false;
    const check = App.validateCIEComplete ? App.validateCIEComplete({ ...course, students:[s] }) : { ok:true };
    return check.ok;
  }).length;
  const pending = total - absent - evaluated;
  return {
    total, absent, evaluated, pending,
    marksUploaded: course.status !== 'draft',
    verificationCompleted: ['verified','approved'].includes(course.status),
  };
}

/* ============================================================
   CHECKPOINT B — Evaluation Deviation Report: compares each
   section's average marks-so-far against the mean across all
   sections of the same subject, and flags sections that deviate
   significantly (>=15% of the mean, or >=5 marks, whichever is
   larger — a small floor so tiny means don't trigger on noise).
   "Marks so far" is the sum of every numeric value directly on
   s.marks (ttDetail is a nested breakdown already reflected in the
   computed component keys like tt1/tt2, so it's excluded to avoid
   double-counting) — comparable across sections of the same subject
   since they share the same Evaluation Type template.
   ============================================================ */
function studentEnteredTotal(s){
  let sum = 0;
  Object.entries(s.marks||{}).forEach(([k,v])=>{
    if(k==='ttDetail') return;
    if(typeof v === 'number' && !isNaN(v)) sum += v;
  });
  return sum;
}
function courseSectionAverage(course){
  const active = (course.students||[]).filter(s=>!s.absent);
  if(!active.length) return null;
  const total = active.reduce((sum,s)=>sum+studentEnteredTotal(s), 0);
  return round1(total/active.length);
}
function getDeviationReportForSubject(code){
  const sections = App.state.courses.filter(c=>normalizeCode(c.code)===normalizeCode(code) && c.branch);
  const rows = sections.map(c=>({ course:c, avg: courseSectionAverage(c), ci: getCourseCIUser(c.id) })).filter(r=>r.avg!==null);
  if(rows.length < 2) return { rows, mean:null, flagged:[] };
  const mean = rows.reduce((s,r)=>s+r.avg,0) / rows.length;
  const threshold = Math.max(5, mean*0.15);
  const flagged = rows.filter(r=>Math.abs(r.avg-mean) >= threshold);
  return { rows, mean: round1(mean), flagged };
}
/* Sections other than the one being reviewed may not have their real
   roster loaded yet (list pages only ever fetch a lightweight count —
   see ROUTES_NEEDING_STUDENTS above), so the deviation report renders a
   placeholder first, then loads every sibling section's roster in the
   background and patches the card in once real averages are available. */

}
async function loadDeviationReport(course){
  if(!course.branch) return;
  const siblings = App.state.courses.filter(c=>normalizeCode(c.code)===normalizeCode(course.code) && c.branch);
  await Promise.all(siblings.filter(c=>!c.studentsLoaded).map(c=>App.ensureCourseStudentsLoaded(c.id)));
  const target = document.getElementById(`deviation-card-${course.id}`);
  if(!target) return; // navigated away before the load finished
  const html = deviationReportHtml(course);
  if(html) target.outerHTML = html; else target.remove();
}
function deviationReportHtml(course){
  if(!course.branch) return '';
  const { rows, mean, flagged } = getDeviationReportForSubject(course.code);
  if(rows.length < 2) return '';
  return `<div class="card">

    <p class="section-meta" style="margin-top:4px;">Average marks entered so far, by section (class mean: ${mean}).</p>
    <div style="margin-top:8px;">

/* SIA Tests — unit-wise entry (5, or however many comp.rawMax/10 works out
   to, columns of /10 each), summed into s.marks[comp.key] (the same "raw"
   slot every other component uses) and auto-scaled to comp.scaledMax by the
   existing generic scaling pipeline (see computeCIE / the /rawMax*scaledMax
   formula) — no other code needs to know the entry happened unit-wise. */
function siaEntryHtml(course, comp, editable){
  const unitCount = Math.max(1, Math.round(comp.rawMax/10));
  const rows = course.students.map(s=>{
    const detail = (s.marks.siaDetail)||{};
    const cells = Array.from({length:unitCount}, (_,i)=>{
      const idx = i+1;
      const val = detail['unit'+idx];
      const overMax = typeof val==='number' && (val>10 || val<0);
      return `<td><input type="number" min="0" max="10" step="0.5" style="width:56px;"
        class="${overMax?'invalid':''}"
        data-markkey="${course.id}|${s.id}|sia${idx}"
        value="${val===undefined||val===null?'':val}" placeholder="/10" ${editable?'':'disabled'}
        onchange="App.setSiaUnitMark('${course.id}','${s.id}','${comp.key}',${idx},this.value)"></td>`;
    }).join('');
    const rawTotal = typeof s.marks[comp.key]==='number' ? s.marks[comp.key] : 0;
    const scaled = round1((Math.min(rawTotal, comp.rawMax)/comp.rawMax) * comp.scaledMax);
    return `<tr><td>${escapeHtml(s.name)}</td>${cells}<td class="total-cell">${rawTotal}/${comp.rawMax}</td><td class="total-cell">${scaled}/${comp.scaledMax}</td></tr>`;
  }).join('');
  const unitHead = Array.from({length:unitCount}, (_,i)=>{
    const label = TT_UNIT_OPTIONS[i] || `Unit ${i+1}`;
    const color = unitBandColor(label);
    return `<th style="background:${color};color:var(--ink);">${escapeHtml(label)}<br><span style="text-transform:none;">/10</span></th>`;
  }).join('');
  return `<div class="card">
    <div class="section-title" style="font-size:14px;">${escapeHtml(comp.label)} — unit-wise entry</div>
    <p class="section-meta" style="margin-top:4px;">Enter each unit's score out of 10 (${unitCount} unit${unitCount===1?'':'s'} = ${comp.rawMax} raw), automatically scaled down to /${comp.scaledMax} for the CIE total.</p>
    <div class="table-scroll" style="margin-top:8px;"><table class="data-table"><thead><tr><th>Student</th>${unitHead}<th>Raw Total</th><th>Scaled</th></tr></thead><tbody>${rows}</tbody></table></div>
  </div>`;
}

function onMarkChange(input){

/* Marks-entry keyboard flow: pressing Enter in a marks number box commits
   the value (same as tabbing/clicking away — fires the normal onchange
   handler, which saves and re-renders) and moves focus straight to the
   next marks box, in reading order, instead of doing nothing or submitting
   a form. Every marks input carries a stable data-markkey identifying its
   cell (course|student|field), so the "next" box can be re-found even
   though onchange's renderContent() call rebuilds the table underneath us. */
document.addEventListener('keydown', function(e){
  if(e.key!=='Enter') return;
  const t = e.target;
  if(!(t.tagName==='INPUT' && t.type==='number' && t.dataset.markkey)) return;
  e.preventDefault();
  const boxes = Array.from(document.querySelectorAll('input[type="number"][data-markkey]:not([disabled])'));
  const idx = boxes.indexOf(t);
  const nextKey = (idx>-1 && idx<boxes.length-1) ? boxes[idx+1].dataset.markkey : null;
  t.blur(); // synchronously fires onchange -> save + renderContent, if the value changed
  if(nextKey){
    const next = document.querySelector(`input[data-markkey="${CSS.escape(nextKey)}"]`);
    if(next){ next.focus(); next.select(); }
  }
});

function handleCourseRegImport(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const batchEl = document.getElementById('cr-import-batch');
  const branchEl = document.getElementById('cr-import-branch');
  const batch = batchEl ? batchEl.value : '';
  const branch = branchEl ? branchEl.value : '';
  ensureXLSXLoaded().then(()=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type:'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });
        App.bulkImportCourseRegistrations(rows, batch, branch);
      }catch(err){
        console.warn(err);
        toast('Could not read that file. Please upload a valid .xlsx, .xls, or .csv file.', 'err');
      }
      input.value = '';
    };
    reader.onerror = ()=>{ toast('Could not read that file.', 'err'); input.value=''; };

  }).catch(err=>{
    toast(err.message || 'Could not load the spreadsheet reader. Check your internet connection and try again.', 'err');

// Group keys are looked up by index rather than inlined into onclick="..."
// as JSON.stringify'd strings — subject/instructor text routinely contains
// characters (quotes, parens, commas) that broke out of the HTML attribute
// and produced "Uncaught SyntaxError: expected expression, got '}'".
let courseRegGroupIndex = [];
function courseRegGroupsHtml(){
  let entries = App.state.courseRegistrations || [];
  const { batch, branch, semester, q } = courseRegFilter;
  if(batch) entries = entries.filter(r=>r.batch===batch);
  if(branch) entries = entries.filter(r=>r.branch===branch);
  if(semester) entries = entries.filter(r=>r.semester===semester);
  if(q && q.trim()){
    const needle = q.trim().toLowerCase();
    entries = entries.filter(r=>
      r.rollNo.toLowerCase().includes(needle) || r.studentName.toLowerCase().includes(needle) ||
      r.subjectName.toLowerCase().includes(needle) || (r.instructorName||'').toLowerCase().includes(needle) ||
      (r.sectionCode||'').toLowerCase().includes(needle));
  }
  if(!entries.length) return emptyStateHtml('No registrations found', 'Import a spreadsheet above, or adjust the filters/search.');

  // Group: Batch -> Branch -> Semester -> Subject -> Section
  const tree = {};
  entries.forEach(r=>{
    const k1=r.batch, k2=r.branch, k3=r.semester||'—', k4=r.subjectName, k5=r.sectionCode||'—';
    tree[k1]=tree[k1]||{}; tree[k1][k2]=tree[k1][k2]||{}; tree[k1][k2][k3]=tree[k1][k2][k3]||{};
    tree[k1][k2][k3][k4]=tree[k1][k2][k3][k4]||{};
    (tree[k1][k2][k3][k4][k5]=tree[k1][k2][k3][k4][k5]||[]).push(r);
  });

  courseRegGroupIndex = []; // rebuilt fresh each render — indices below match this array
  let html = '';
  Object.keys(tree).sort().forEach(batchKey=>{
    html += `<div class="section-title" style="font-size:15px;margin-top:18px;">${escapeHtml(BATCH_LABELS[batchKey]||batchKey)}</div>`;
    Object.keys(tree[batchKey]).sort().forEach(branchKey=>{
      html += `<div class="branch-heading">${branchLabel(branchKey)}</div>`;
      Object.keys(tree[batchKey][branchKey]).sort().forEach(semKey=>{
        html += `<div class="section-meta" style="margin-top:6px;font-weight:600;">Semester ${escapeHtml(semKey)}</div>`;
        Object.keys(tree[batchKey][branchKey][semKey]).sort().forEach(subjectKey=>{
          const sections = tree[batchKey][branchKey][semKey][subjectKey];
          html += `<div class="card" style="margin-top:8px;">
            <div class="section-title" style="font-size:14px;">${escapeHtml(subjectKey)}</div>
            ${Object.keys(sections).sort().map(secKey=>{
              const list = sections[secKey];
              const instructors = [...new Set(list.map(r=>r.instructorName).filter(Boolean))];
              const idx = courseRegGroupIndex.length;
              courseRegGroupIndex.push({ batch:batchKey, branch:branchKey, semester:semKey, subject:subjectKey, section:secKey });
              const norm = s => String(s||'').trim().toLowerCase();
              const matchedSubj = (App.state.subjects||[]).find(s=>norm(s.name)===norm(subjectKey));
              const matchedCode = matchedSubj ? matchedSubj.code : bizId('SUBJ',[subjectKey],[]).replace(/^SUBJ-/,'');
              const matchedSec = secKey==='—' ? '' : secKey;
              const matchedCourse = (App.state.courses||[]).find(c=>normalizeCode(c.code)===normalizeCode(matchedCode) && c.section===matchedSec && c.branch===branchKey);

function hodDashboardSummaryHtml(all){
  const counts = {
    pendingEvaluation: all.filter(c=>c.status==='draft').length,
    pendingModeration: all.filter(c=>c.status==='submitted').length,
    pendingVerification: all.filter(c=>c.status==='coordinated').length,
    pendingApproval: all.filter(c=>c.status==='verified').length,
    frozen: all.filter(c=>c.status==='approved').length,
  };
  const stat = (label, val) => `<div style="flex:1;min-width:120px;padding:10px 14px;background:#F3EEDD;border:1px solid var(--rule);border-radius:8px;">
    <div style="font-family:'IBM Plex Mono',monospace;font-size:22px;color:var(--ink);">${val}</div>
    <div class="section-meta" style="margin-top:2px;">${label}</div>
  </div>`;
  const byCI = {};
  all.forEach(c=>{
    const ci = getCourseCIUser(c.id);
    if(!ci) return;
    byCI[ci.id] = byCI[ci.id] || { name:ci.name, total:0, submitted:0 };
    byCI[ci.id].total++;
    if(c.status!=='draft') byCI[ci.id].submitted++;
  });
  const facultyRows = Object.values(byCI).sort((a,b)=>a.name.localeCompare(b.name));
  return `

        ${stat('Pending approval', counts.pendingApproval)}
        ${stat('Marks frozen', counts.frozen)}
      </div>
    </div>
    <div class="card">
      <div class="section-title" style="font-size:15px;">Faculty-wise Completion Status</div>
      ${facultyRows.length===0 ? `<p class="section-meta" style="margin-top:8px;">No Course Instructors assigned yet.</p>` : `

        <table class="data-table"><thead><tr><th>Course Instructor</th><th>Sections assigned</th><th>Sections submitted+</th></tr></thead><tbody>
          ${facultyRows.map(r=>`<tr><td>${escapeHtml(r.name)}</td><td>${r.total}</td><td>${r.submitted}</td></tr>`).join('')}
        </tbody></table>
      </div>`}

  return status==='approved' ? `<span class="status-pill status-approved">Approved by HOD — locked</span>`
    : status==='pending' ? `<span class="status-pill status-submitted">Pending HOD approval</span>`

/* How many students have at least one of the given components filled in,
   out of the section's total roster — a quick "how far along is the CI"
   signal for the HOD without opening the full marks table. */
function enteredCount(course, comps){
  if(!comps.length) return { entered:0, total:course.students.length };
  const entered = course.students.filter(s=>comps.some(c=>typeof s.marks[c.key]==='number')).length;
  return { entered, total:course.students.length };
}

   CI has gotten on the specific component group being reviewed. */

  const status = course[statusField];

  return `

          ${!course.evalType ? `<span class="status-pill status-draft">Evaluation Type not fixed</span>` :
            !comps.length ? `<span class="status-pill status-draft">${noCompMsg}</span>` :
            `<span class="section-meta">${entered}/${total} students entered</span> ${approvalGroupStatusPill(status)}`}
          <button class="btn btn-outline btn-sm" onclick="App.navigate('hod-review',{courseId:'${course.id}'})">View</button>
        </div>
      </div>

}

/* Grouped <select> of every faculty member already in the directory
   (uploaded by EA / created anywhere in the system), grouped by home
   branch — lets HOD pick a known faculty member to assign as Coordinator
   instead of retyping their email every time. Selecting an option fills
   the email/name fields via fillCoordinatorFromDirectory() below. */
function facultyDropdownOptionsHtml(){
  const entries = App.state.users.filter(u=>u.systemRole==='FACULTY');
  if(entries.length===0) return `<option value="">— No faculty in the directory yet —</option>`;
  const branches = {};
  const noBranch = [];
  entries.forEach(u=>{ if(u.homeBranch){ (branches[u.homeBranch] = branches[u.homeBranch] || []).push(u); } else { noBranch.push(u); } });
  let html = `<option value="">— Pick an existing faculty member (optional) —</option>`;
  Object.keys(branches).sort().forEach(bk=>{
    html += `<optgroup label="${escapeHtml(branchLabel(bk))}">`;
    branches[bk].sort((a,b)=>a.name.localeCompare(b.name)).forEach(u=>{
      html += `<option value="${u.id}">${escapeHtml(u.name)} — ${escapeHtml(u.email)}</option>`;
    });
    html += `</optgroup>`;
  });
  if(noBranch.length){
    html += `<optgroup label="No branch set">`;
    noBranch.sort((a,b)=>a.name.localeCompare(b.name)).forEach(u=>{
      html += `<option value="${u.id}">${escapeHtml(u.name)} — ${escapeHtml(u.email)}</option>`;
    });
    html += `</optgroup>`;
  }
  return html;
}
function fillCoordinatorFromDirectory(userId){

  if(!emailEl || !nameEl) return;

/* Looks the typed Course Code up in SUBJECT_CATALOG and, when it resolves
   to exactly one semester, auto-selects it in the Semester dropdown (still
   freely overridable) and fills the Course Name if that field is still
   empty. When the same code maps to more than one semester (shouldn't
   normally happen — see resolveSemesterForCode) it lists the options
   instead of guessing. Unrecognized codes just get a quiet note; the
   Timetable Incharge can still fill Semester manually as before. */
function onNewCourseCodeChange(rawCode){
  const noteEl = document.getElementById('hod-newcourse-code-note');
  const semEl = document.getElementById('hod-newcourse-semester');
  const nameEl = document.getElementById('hod-newcourse-name');
  if(!noteEl || !semEl) return;
  const code = (rawCode||'').trim();
  if(!code){ noteEl.textContent = ''; return; }
  const result = resolveSemesterForCode(code);
  if(!result){
    noteEl.innerHTML = `Not in the Subject Catalog yet — set Semester manually.`;
    return;
  }
  if(result.semester){
    semEl.value = result.semester;
    const entry = result.entries[0];
    if(nameEl && !nameEl.value.trim()) nameEl.value = entry.name;
    const regsBranches = [...new Set(result.entries.map(e=>`${regulationFromCode(e.code)} ${e.branch}`))].join(', ');
    noteEl.innerHTML = `Matched in Subject Catalog (${escapeHtml(regsBranches)}) — Semester ${result.semester} filled in automatically.`;
  } else if(result.options){
    noteEl.innerHTML = `This code maps to different semesters depending on regulation/branch — pick the right one: `
      + result.options.map(o=>`<button type="button" class="btn btn-outline btn-sm" style="margin:2px 4px 0 0;" onclick="document.getElementById('hod-newcourse-semester').value='${o.sem}';${nameEl?`document.getElementById('hod-newcourse-name').value='${o.name.replace(/'/g,"\\'")}';`:''}">${escapeHtml(regulationFromCode(o.code))} ${escapeHtml(o.branch)} — Sem ${o.sem}</button>`).join('');
  }
}
window.onNewCourseCodeChange = onNewCourseCodeChange;

function getAuditEntries(){

function getAuditEntriesForCourses(courses){
  const entries = [];
  courses.forEach(c=>{ (c.history||[]).forEach(h=> entries.push({...h, code:c.code, name:c.name})); });
  entries.sort((a,b)=>b.ts-a.ts);
  return entries;
}

  const d = new Date(ts);

  const container = document.getElementById(`exam-marks-${courseId}`);
  const btn = document.getElementById(`exam-toggle-${courseId}`);

  if(container.dataset.open === '1'){

// XLSX.js (~1MB minified) is only used by EA/CC import features — loaded on
// demand the first time any of them is actually used, instead of blocking
// every page load (including Admin/Exam Branch/CI sessions that never touch
// it) with the full library. Cached after first load.
let _xlsxLoadPromise = null;
function ensureXLSXLoaded(){
  if(typeof XLSX !== 'undefined') return Promise.resolve();
  if(_xlsxLoadPromise) return _xlsxLoadPromise;
  _xlsxLoadPromise = new Promise((resolve, reject)=>{
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    script.onload = () => resolve();
    script.onerror = () => { _xlsxLoadPromise = null; reject(new Error('Failed to load the spreadsheet reader.')); };
    document.head.appendChild(script);
  });
  return _xlsxLoadPromise;
}

function handleFacultyExcelImport(input){
  const file = input.files && input.files[0];
  if(!file) return;
  ensureXLSXLoaded().then(()=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type:'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });
        App.bulkImportFaculty(rows);
      }catch(err){
        console.warn(err);
        toast('Could not read that file. Please upload a valid .xlsx, .xls, or .csv file.', 'err');
      }
      input.value = '';
    };
    reader.onerror = ()=>{ toast('Could not read that file.', 'err'); input.value=''; };
    reader.readAsArrayBuffer(file);
  }).catch(err=>{
    toast(err.message || 'Could not load the spreadsheet reader. Check your internet connection and try again.', 'err');
    input.value = '';
  });
}
window.handleFacultyExcelImport = handleFacultyExcelImport;

function evalTypeTableHtml(course, actions){
  const tpl = getCourseTemplate(course);
  if(!course.evalType || !tpl){
    return `<div class="card"><p style="color:var(--text-soft);margin:0;">Evaluation Type not fixed yet for this section — ask your Course Coordinator.</p></div>`;
  }
  const cie = tpl.cie||[], see = tpl.see||[];
  const cieTotal = cie.reduce((a,c)=>a+c.scaledMax,0);
  const seeTotal = see.reduce((a,c)=>a+c.scaledMax,0);
  const grand = cieTotal + seeTotal;
  const cs = 'border:1px solid #999;padding:6px 10px;';
  const actionCell = (html) => actions ? `<td style="${cs}text-align:center;padding:4px 8px;">${html||''}</td>` : '';
  const compCells = (c, section) => `<td style="${cs}text-align:left;">${escapeHtml(c.label)}</td><td style="${cs}text-align:center;">${c.rawMax||''}</td><td style="${cs}text-align:center;">${c.scaledMax}</td>${actionCell(actions ? actions.component(c, section) : '')}`;
  const totalRowSpan = cie.length + see.length + 2; // + CIE Total row + SEE Total row
  let rows = '';
  cie.forEach((c,i)=>{
    rows += `<tr>`;
    if(i===0){
      rows += `<td rowspan="${totalRowSpan}" style="${cs}text-align:center;font-weight:600;">${escapeHtml(tpl.abbr)}</td>`;
      rows += `<td rowspan="${totalRowSpan}" style="${cs}text-align:center;">${escapeHtml(tpl.courseType)}</td>`;
      rows += `<td rowspan="${cie.length+1}" style="${cs}text-align:center;font-weight:600;">CIE</td>`;
    }
    rows += compCells(c, 'cie');
    rows += `</tr>`;
  });
  rows += `<tr style="background:#92D050;"><td colspan="2" style="${cs}text-align:center;font-weight:700;">CIE Total</td><td style="${cs}text-align:center;font-weight:700;">${cieTotal}</td>${actionCell(actions ? actions.cieTotal() : '')}</tr>`;
  see.forEach((c,i)=>{
    rows += `<tr>`;
    if(i===0) rows += `<td rowspan="${see.length+1}" style="${cs}text-align:center;font-weight:600;">SEE</td>`;
    rows += compCells(c, 'see');
    rows += `</tr>`;
  });
  rows += `<tr style="background:#92D050;"><td colspan="2" style="${cs}text-align:center;font-weight:700;">SEE Total</td><td style="${cs}text-align:center;font-weight:700;">${seeTotal}</td>${actionCell(actions ? actions.seeTotal() : '')}</tr>`;
  return `<div class="card" style="overflow-x:auto;">
    <table style="border-collapse:collapse;width:100%;font-size:12.5px;">
      <thead><tr style="background:#FFFF00;">
        <th style="${cs}">Abbr</th><th style="${cs}">Course Type</th><th style="${cs}">Eval Type</th>
        <th style="${cs}">Components</th><th style="${cs}">Exam Marks</th><th style="${cs}">Marks - Weights</th>${actions ? `<th style="${cs}">Marks Entry</th>` : ''}
      </tr></thead>
      <tbody>
        ${rows}
        <tr style="background:#00B0F0;"><td colspan="4" style="${cs}text-align:center;font-weight:700;">Total Marks</td><td style="${cs}"></td><td style="${cs}text-align:center;font-weight:700;">${grand}</td>${actionCell(actions ? actions.grandTotal() : '')}</tr>
      </tbody>
    </table>
  </div>`;
}

      <div class="card" style="cursor:pointer;" onclick="App.navigate('ci-subject-detail',{courseId:'${c.id}'})" role="button" tabindex="0" onkeydown="if(event.key==='Enter') App.navigate('ci-subject-detail',{courseId:'${c.id}'})">

  `;
  return wrap;
}

  if(!course){ wrap.innerHTML = `<div class="page-head">${backBtn}</div>${emptyStateHtml('Subject not found','')}`; return wrap; }
  const enterMode = course.status==='draft' || course.editUnlocked;
  const template = course.evalType ? getCourseTemplate(course) : null;
  let actions = null;
  if(template){
    const tt1Key = termTestComponentKey(template, 'TT1');
    const tt2Key = termTestComponentKey(template, 'TT2');
    const enterBtn = (label, onclick) => `<button class="btn ${enterMode?'':'btn-outline'} btn-sm" style="white-space:nowrap;" onclick="${onclick}">${label}</button>`;

    actions = {
      component(comp, section){
        if(comp.key===tt1Key) return enterBtn('Enter Term Test 1', `App.navigate('ci-termtest-entry',{courseId:'${course.id}', cycle:'TT1'})`);
        if(comp.key===tt2Key) return enterBtn('Enter Term Test 2', `App.navigate('ci-termtest-entry',{courseId:'${course.id}', cycle:'TT2'})`);
        return enterBtn(`Enter ${escapeHtml(comp.label)}`, `App.navigate('ci-component-entry',{courseId:'${course.id}', section:'${section}', compKey:'${comp.key}'})`);
      },
      cieTotal(){ return viewBtn('View CIE Marks', `App.navigate('ci-section-view',{courseId:'${course.id}', section:'cie'})`); },
      seeTotal(){ return viewBtn('View SEE Marks', `App.navigate('ci-section-view',{courseId:'${course.id}', section:'see'})`); },

  wrap.innerHTML = `
    <div class="page-head">

        ${etPill(course)}
        ${course.status==='approved' && course.editRequestStatus==='pending' ? `<span class="status-pill status-submitted">Correction pending HOD</span>` : ''}
        ${course.status==='approved' && course.editUnlocked ? `<span class="status-pill status-draft">Unlocked for correction</span>` : ''}
      </div>
      ${deadlineBadge(course)}
    </div>
    ${sentBackBanner(course)}
    ${evalTypeTableHtml(course, actions)}
  `;
  return wrap;
}

/* Separate "Term Test" sidebar landing page — lists the Instructor's
   sections and the currently active TT cycle, linking into the structured
   entry screen for each. Kept apart from "My Subjects" / ci-entry (CIE/SEE)
   per the fixed Term Test paper pattern. */
function renderCITermTestSections(params={}){
  const user = App.currentUser();
  const { ciCourses } = getFacultyCourses(user.id);
  const tt = App.state.currentTermTest;
  const activeCycle = tt?.cycle || null;
  // The Admin fixes one cycle "active" institution-wide (for the exam-cycle
  // banner below), but the CI can freely pick any cycle here to view/enter —
  // marks for every cycle are stored independently per student, so there's
  // no reason to lock the instructor to only whichever one is "current".
  const cycle = params.cycle || activeCycle || 'TT1';
  const cycleLabel = TERM_TEST_LABELS[cycle];
  const activeCycleLabel = activeCycle && TERM_TEST_LABELS[activeCycle];
  const fullLabel = activeCycleLabel && tt.academicYear && tt.semester ? `${tt.academicYear} · ${tt.semester} · ${activeCycleLabel}` : activeCycleLabel;
  const wrap = el('<div></div>');
  wrap.innerHTML = `
    <div class="page-head">
      <div class="page-eyebrow">Course Instructor</div>
      <h2>Term Test</h2>
      <p>Pick which Term Test cycle to view or enter below. Short answers (Q1–Q5, 2 marks each = 10) and long answers (Q6–Q11, set up by you as Unit + marks-split before entering marks, scaled to 40) combine into a raw ${TT_TOTAL_MAX}-mark score that's fed straight into that section's fixed Evaluation Type template.</p>
    </div>
    ${!tt ? emptyStateHtml('No Term Test cycle active', 'The Administrator hasn\'t fixed a Term Test cycle yet — this page opens automatically as soon as they do.') : `
      <div class="card" style="border-left:3px solid var(--brass);margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;">
          <div>
            <div class="page-eyebrow">Active cycle (fixed by Administrator)</div>
            <div class="section-title" style="margin-top:4px;">${escapeHtml(fullLabel)}</div>
          </div>
          <div class="config-field" style="max-width:220px;">
            <label>Viewing / entering</label>
            <select onchange="App.navigate('ci-termtest',{cycle:this.value})">
              ${Object.keys(TERM_TEST_LABELS).map(c=>`<option value="${c}" ${c===cycle?'selected':''}>${escapeHtml(TERM_TEST_LABELS[c])}</option>`).join('')}
            </select>
          </div>
        </div>
      </div>
      ${ciCourses.length===0 ? emptyStateHtml('No sections assigned','No course-sections are currently assigned to you as instructor.') : ciCourses.map(c=>{
        const template = c.evalType ? getCourseTemplate(c) : null;
        const key = template ? termTestComponentKey(template, cycle) : null;
        return `
        <div class="card">
          <div class="card-row">
            <div>
              <div class="section-title">${escapeHtml(c.name)}</div>
              ${courseMetaBlock(c)}
            </div>
            <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
              ${statusPill(c)}
              ${etPill(c)}
              ${!c.evalType ? `<span class="status-pill status-draft">Evaluation Type not fixed</span>` :
                !key ? `<span class="status-pill status-draft">${escapeHtml(cycleLabel)} not applicable to this Evaluation Type</span>` : ''}
              <button class="btn ${key?'':'btn-outline'} btn-sm" ${key?'':'disabled'} onclick="App.navigate('ci-termtest-entry',{courseId:'${c.id}', cycle:'${cycle}'})">Open Answer Sheet</button>
            </div>
          </div>
        </div>`;
      }).join('')}
    `}
  `;
  return wrap;
}
function ttNum(v){ return (v===undefined||v===null||isNaN(v)) ? '' : v; }
/* Structured Term Test entry — Q1-Q5 short answers (2 marks each) then
   Q6-Q11 long answers in 3 unit-paired choice questions, each split into
   parts (a)/(b). Both sides of a pair stay editable — the CI can enter
   marks for either or both while deciding — and whichever side totals
   higher is the one that counts toward that pair's score; that cell is
   highlighted so it's clear which one won. */
function renderCITermTestEntry(params){
  const course = App.getCourse(params.courseId);
  if(!course) return el('<div></div>');
  const tt = App.state.currentTermTest;
  const cycle = params.cycle || tt?.cycle || 'TT1';
  const cycleLabel = TERM_TEST_LABELS[cycle];
  const activeCycleLabel = tt?.cycle && TERM_TEST_LABELS[tt.cycle];
  const fullLabel = activeCycleLabel && tt.academicYear && tt.semester ? `${tt.academicYear} · ${tt.semester} · ${activeCycleLabel}` : activeCycleLabel;
  const wrap = el('<div></div>');
  const backBtn = `<button class="ghost-btn no-print" style="color:var(--ink);border-color:var(--rule);margin-bottom:14px;" onclick="App.navigate('ci-termtest',{cycle:'${cycle}'})">← Back to Term Test</button>`;
  if(!tt){
    wrap.innerHTML = `<div class="page-head">${backBtn}<h2>Term Test</h2></div>${emptyStateHtml('No Term Test cycle active','The Administrator hasn\'t fixed a Term Test cycle yet.')}`;
    return wrap;
  }
  const template = course.evalType ? getCourseTemplate(course) : null;
  const compKey = template ? termTestComponentKey(template, cycle) : null;
  if(!compKey){
    wrap.innerHTML = `<div class="page-head">${backBtn}<h2>Term Test</h2></div>${emptyStateHtml('Not applicable', !course.evalType ? 'The Course Coordinator hasn\'t fixed an Evaluation Type for this section yet.' : `${cycleLabel} has no matching component on this section's Evaluation Type template.`)}`;
    return wrap;
  }
  const correctionMode = course.status==='approved' && course.editUnlocked;
  const forwarded = isTTForwarded(course, cycle);
  const editable = (course.status==='draft' || correctionMode) && forwarded;
  const comp = template.cie.find(c=>c.key===compKey);

  // Unit/split are the Course Coordinator's call now — this page only shows
  // a read-only summary of what the CC has set, plus the forward status.
  // Marks entry itself stays locked until the CC forwards the setup.
  const shortQuestionSetupSummaryHtml = `<div style="margin-top:10px;">${TT_SHORT_KEYS.map(qKey=>{
    const cfg = getQuestionConfig(course, cycle, qKey);
    return `<span style="display:inline-block;margin:4px 10px 4px 0;padding:4px 10px;background:#F3EEDD;border:1px solid var(--rule);border-radius:6px;font-size:12.5px;">
      <strong>${qKey.toUpperCase()}</strong>: ${cfg.unit ? escapeHtml(cfg.unit) : `<span style="color:var(--seal-red);">Unit not set</span>`}
    </span>`;
  }).join('')}</div>`;
  const questionSetupSummaryHtml = `<div style="margin-top:10px;">${TT_ALL_LONG_QKEYS.map(qKey=>{
    const cfg = getQuestionConfig(course, cycle, qKey);
    return `<span style="display:inline-block;margin:4px 10px 4px 0;padding:4px 10px;background:#F3EEDD;border:1px solid var(--rule);border-radius:6px;font-size:12.5px;">
      <strong>${qKey.toUpperCase()}</strong>: ${cfg.unit ? escapeHtml(cfg.unit) : `<span style="color:var(--seal-red);">Unit not set</span>`} · ${cfg.split===cfg.fullValue?`${cfg.fullValue} (single)`:cfg.halfValue}
    </span>`;
  }).join('')}</div>`;

  const rows = (course.students||[]).map(s=>{
    const detail = (s.marks && s.marks.ttDetail && s.marks.ttDetail[cycle]) || {};
    const calc = computeTermTestRaw(detail);
    const shortCells = TT_SHORT_KEYS.map(k=>{
      const v = detail[k];
      const overMax = typeof v==='number' && (v>TT_SHORT_EACH_MAX || v<0);
      return `<td><input type="number" min="0" max="${TT_SHORT_EACH_MAX}" step="0.5" style="width:56px;"
        class="${overMax?'invalid':''}"
        data-markkey="${course.id}|${s.id}|${cycle}_${k}"
        value="${ttNum(v)}" ${editable?'':'disabled'}
        onchange="App.setTermTestMark('${course.id}','${s.id}','${cycle}','${k}',null,this.value)"></td>`;
    }).join('');
    const longCells = TT_LONG_PAIRS.map(({a,b,max})=>{
      const da = detail[a]||{}, db = detail[b]||{};
      const totalA = (typeof da.a==='number'?da.a:0)+(typeof da.b==='number'?da.b:0);
      const totalB = (typeof db.a==='number'?db.a:0)+(typeof db.b==='number'?db.b:0);
      const aWinning = totalA>0 && totalA>=totalB, bWinning = totalB>0 && totalB>totalA;
      const half = max/2;
      const cellFor = (qKey, winning) => {
        const cfg = getQuestionConfig(course, cycle, qKey);
        const winMark = winning ? ` style="background:#EAF3EA;"` : '';
        const av = (detail[qKey]||{}).a, bv = (detail[qKey]||{}).b;
        const fullCap = cfg.split===cfg.fullValue ? max : half;
        const aOverMax = typeof av==='number' && (av>fullCap || av<0);
        const bOverMax = typeof bv==='number' && (bv>half || bv<0);
        return cfg.split===cfg.fullValue
          ? `<td class="mono"${winMark} style="white-space:nowrap;">
              <span style="font-size:10px;color:var(--text-soft);">${qKey.toUpperCase()}</span>
              <input type="number" min="0" max="${max}" step="0.5" style="width:56px;" placeholder="/${max}"
                class="${aOverMax?'invalid':''}"
                data-markkey="${course.id}|${s.id}|${cycle}_${qKey}_a"
                value="${ttNum(av)}" ${editable ? '' : 'disabled'}
                onchange="App.setTermTestMark('${course.id}','${s.id}','${cycle}','${qKey}','a',this.value)">
            </td>`
          : `<td class="mono"${winMark} style="white-space:nowrap;">
              <span style="font-size:10px;color:var(--text-soft);">${qKey.toUpperCase()}</span>
              <input type="number" min="0" max="${half}" step="0.5" style="width:44px;" placeholder="a/${half}"
                class="${aOverMax?'invalid':''}"
                data-markkey="${course.id}|${s.id}|${cycle}_${qKey}_a"
                value="${ttNum(av)}" ${editable ? '' : 'disabled'}
                onchange="App.setTermTestMark('${course.id}','${s.id}','${cycle}','${qKey}','a',this.value)">
              <input type="number" min="0" max="${half}" step="0.5" style="width:44px;" placeholder="b/${half}"
                class="${bOverMax?'invalid':''}"
                data-markkey="${course.id}|${s.id}|${cycle}_${qKey}_b"
                value="${ttNum(bv)}" ${editable ? '' : 'disabled'}
                onchange="App.setTermTestMark('${course.id}','${s.id}','${cycle}','${qKey}','b',this.value)">
            </td>`;
      };
      return cellFor(a, aWinning) + cellFor(b, bWinning);
    }).join('');
    const cieScaled = round1((Math.min(calc.total, comp.rawMax)/comp.rawMax) * comp.scaledMax);
    return `<tr>
      <td>${escapeHtml(s.name)}</td>
      ${shortCells}
      <td class="total-cell">${calc.shortTotal}<span class="mono" style="font-weight:400;color:var(--text-soft);font-size:11px;">/${TT_SHORT_TOTAL_MAX}</span></td>
      ${longCells}
      <td class="total-cell">${calc.longRaw}<span class="mono" style="font-weight:400;color:var(--text-soft);font-size:11px;">/${TT_LONG_RAW_MAX}</span></td>
      <td class="total-cell">${calc.total}<span class="mono" style="font-weight:400;color:var(--text-soft);font-size:11px;">/${TT_TOTAL_MAX}</span></td>
      <td class="total-cell" style="font-weight:700;">${cieScaled}<span class="mono" style="font-weight:400;color:var(--text-soft);font-size:11px;">/${comp.scaledMax}</span></td>
    </tr>`;
  }).join('');

  const shortItems = TT_SHORT_KEYS.map(k=>{
    const cfg = getQuestionConfig(course, cycle, k);
    return { unit: cfg.unit, sub: `${k.toUpperCase()} — /${TT_SHORT_EACH_MAX}` };
  });
  const longItems = TT_LONG_PAIRS.flatMap(({a,b,max})=>[a,b].map(qKey=>{
    const cfg = getQuestionConfig(course, cycle, qKey);
    return { unit: cfg.unit, sub: `${qKey.toUpperCase()} — /${max} (${cfg.split===cfg.fullValue?'single':cfg.halfValue})` };
  }));
  const shortHeadGrp = groupedHeaderRows(shortItems);
  const longHeadGrp = groupedHeaderRows(longItems);

  wrap.innerHTML = `
    <div class="page-head">
      ${backBtn}
      <div class="page-eyebrow">${escapeHtml(cycleLabel)}${fullLabel && fullLabel!==cycleLabel ? ` (Active cycle: ${escapeHtml(fullLabel)})` : ''} · feeds into "${escapeHtml(comp.label)}"</div>
      <h2>${escapeHtml(course.name)}</h2>
      <p>Course Code: <strong>${escapeHtml(course.code)}</strong> · Section ${course.section} · ${branchLabel(course.branch)} ${statusPill(course)} ${etPill(course)}</p>
    </div>
    <div class="card">
      <div class="card-row">
        <div class="section-title" style="font-size:15px;">Question Paper Setup</div>
        ${forwarded
          ? `<span class="status-pill status-approved">Set by your Course Coordinator</span>`
          : `<span class="status-pill status-submitted">Not yet forwarded by your Course Coordinator</span>`}
      </div>
      <p class="section-meta" style="margin-top:4px;">${forwarded
        ? `Your Course Coordinator set the Unit for every question and forwarded it — you can enter marks below.`
        : `Your Course Coordinator sets the Unit (and marks-split for Q6–Q11) when they make the question paper, then forwards it here. Marks entry for ${escapeHtml(cycleLabel)} stays locked until they do.`}</p>
      <div class="section-meta" style="margin-top:12px;font-weight:600;">Short answers</div>
      ${shortQuestionSetupSummaryHtml}
      <div class="section-meta" style="margin-top:8px;font-weight:600;">Long answers</div>
      ${questionSetupSummaryHtml}
    </div>
    ${!forwarded ? emptyStateHtml('Marks entry locked', `Waiting on your Course Coordinator to finish and forward the ${escapeHtml(cycleLabel)} Question Paper Setup.`) : `
    <div class="card">
      <p class="section-meta" style="margin-bottom:8px;">Q1–Q5: short answers, 2 marks each (10 total, compulsory). Q6–Q11: long answers, in 3 choice pairs (Q6/Q7, Q8/Q9, Q10/Q11) — you can enter marks for both sides of a pair while deciding; whichever is higher counts, and that cell is highlighted. Q6/Q7 and Q8/Q9 are 16 marks each (full units); Q10/Q11 is 8 marks (half a unit — the 5-unit syllabus splits half for TT1, half for TT2). The 3 pairs total 40 raw with no further scaling needed. Term Test total = 10 + 40 = ${TT_TOTAL_MAX}, written automatically into "${escapeHtml(comp.label)}" (raw /${comp.rawMax} → scaled /${comp.scaledMax}).</p>
      <div class="table-scroll">

        <table class="data-table" style="min-width:1400px;border-radius:6px;overflow:hidden;">
          <thead>
            <tr>
              <th rowspan="2" style="vertical-align:middle;">Student</th>
              ${shortHeadGrp.top}
              <th rowspan="2" style="vertical-align:middle;">Short<br>Total</th>
              ${longHeadGrp.top}
              <th rowspan="2" style="vertical-align:middle;">Long<br>Raw</th>
              <th rowspan="2" style="vertical-align:middle;">Term Test<br>Total</th>
              <th rowspan="2" style="vertical-align:middle;">${escapeHtml(cycleLabel)}<br>Scaled (/${comp.scaledMax})</th>
            </tr>
            <tr>${shortHeadGrp.sub}${longHeadGrp.sub}</tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`}
  `;
  return wrap;
}
/* Sets which tab is active on the "My Subjects" marks-entry screen (ci-entry)

function renderCILabExternalSections(){

    const template = c.evalType ? getCourseTemplate(c) : null;

      <h2>Lab Externals</h2>
      <p>Enter Lab External (SEE Practical) marks for your sections — its own HOD-approval group, separate from Term Test &amp; Lab Internal.</p>
    </div>
    ${rows.length===0 ? emptyStateHtml('No sections assigned','No course-sections are currently assigned to you as instructor.') : rows.map(({c,comp})=>`
      <div class="card">

            <button class="btn ${comp?'':'btn-outline'} btn-sm" ${comp?'':'disabled'} onclick="openMarksTab('${c.id}','labext')">Enter Lab External Marks</button>
