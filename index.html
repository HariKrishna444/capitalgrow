  /* ---------- EA: faculty directory, uploaded branch-wise ---------- */
  addFacultyToDirectory(rawName, rawEmail, branch){
    const actor = this.currentUser();
    if(!['EA','ADMIN'].includes(actor.systemRole)){ toast('Only the Executive Assistant can upload the faculty directory.', 'err'); return; }
    const name = (rawName||'').trim();
    const email = (rawEmail||'').trim().toLowerCase();
    if(!name || !email){ toast('Name and email are required.', 'err'); return; }
    if(!isValidEmail(email)){ toast('Enter a valid email address.', 'err'); return; }
    if(!BRANCH_LABELS[branch]){ toast('Choose a branch.', 'err'); return; }
    const existing = this.state.users.find(u=>u.email.toLowerCase()===email);
    if(existing && existing.systemRole!=='FACULTY'){ toast('This email already belongs to a non-faculty account.', 'err'); return; }
    let row;
    if(existing){
      existing.name = name;
      existing.homeBranch = branch;
      row = existing;
    } else {
      row = { id:bizId('FAC', [email.split('@')[0]], this.state.users.map(u=>u.id)), name, email, systemRole:'FACULTY', homeBranch:branch };
      this.state.users.push(row);
    }
    syncProfile(row);
    toast(`${name} added to the ${branchLabel(branch)} faculty directory.`, 'ok');
    this.navigate('ea-faculty');
  },
  removeFacultyFromDirectory(userId){
    const actor = this.currentUser();
    if(!['EA','ADMIN'].includes(actor.systemRole)){ toast('Only the Executive Assistant can edit the faculty directory.', 'err'); return; }
    const u = this.getUserById(userId);
    if(!u) return;
    delete u.homeBranch;
    syncProfile(u);
    toast(`${u.name} removed from the faculty directory.`, 'err');
    this.navigate('ea-faculty');
  },
  bulkImportFaculty(rows){
    const actor = this.currentUser();
    if(!['EA','ADMIN'].includes(actor.systemRole)){ toast('Only the Executive Assistant can import the faculty directory.', 'err'); return; }
    if(!Array.isArray(rows) || rows.length===0){ toast('That file has no rows to import.', 'err'); return; }
    let added=0, updated=0, skipped=0;
    const touched = [];
    rows.forEach(row=>{
      const keys = Object.keys(row||{});
      const findKey = (re) => keys.find(k=>re.test(String(k).trim()));
      const nameKey = findKey(/^name$/i);
      const emailKey = findKey(/^e-?mail$/i);
      const branchKey = findKey(/^branch$/i);
      const name = nameKey ? String(row[nameKey]).trim() : '';
      const email = emailKey ? String(row[emailKey]).trim().toLowerCase() : '';
      const branch = branchKey ? String(row[branchKey]).trim().toUpperCase() : '';
      if(!name || !email || !isValidEmail(email) || !BRANCH_LABELS[branch]){ skipped++; return; }
      const existing = this.state.users.find(u=>u.email.toLowerCase()===email);
      if(existing && existing.systemRole!=='FACULTY'){ skipped++; return; }
      if(existing){ existing.name=name; existing.homeBranch=branch; updated++; touched.push(existing); }
      else { const u2={ id:bizId('FAC', [email.split('@')[0]], this.state.users.map(u=>u.id)), name, email, systemRole:'FACULTY', homeBranch:branch }; this.state.users.push(u2); added++; touched.push(u2); }
    });
    syncProfiles(touched);
    if(added+updated===0){
      toast(`Import found nothing usable. Check the file has Name, Email, and Branch columns (Branch must be ${Object.keys(BRANCH_LABELS).join('/')}).`, 'err');
    } else {
      toast(`Import complete — ${added} added, ${updated} updated${skipped?`, ${skipped} skipped`:''}.`, 'ok');
    }
    this.navigate('ea-faculty');
  },

  /* ---------- EA: student directory, uploaded batch- and branch-wise ----------
     Roster is keyed by (roll_no, batch) — same roll number can recur across
     different batches but not twice within one. Branch/Department is
     per-row, so one file can freely mix CSE/AIML/SAP/etc rows together and
     each is filed under its own branch automatically — no need to split
     the file per department first. */
  addStudentToDirectory(rawRollNo, rawName, rawEmail, batch, branch, rawSemester){
    const actor = this.currentUser();
    if(!['EA','ADMIN'].includes(actor.systemRole)){ toast('Only the Executive Assistant can update the student directory.', 'err'); return; }
    const rollNo = (rawRollNo||'').trim().toUpperCase();
    const name = (rawName||'').trim();
    const email = (rawEmail||'').trim().toLowerCase();
    const semester = (rawSemester||'').trim();
    if(!rollNo || !name){ toast('Roll No and Name are required.', 'err'); return; }
    if(email && !isValidEmail(email)){ toast('Enter a valid email address, or leave it blank.', 'err'); return; }
    if(!BATCH_BRANCHES[batch]){ toast('Choose a Batch.', 'err'); return; }
    if(!BATCH_BRANCHES[batch].includes(branch)){ toast(`${branch || 'That branch'} isn't offered for ${batch} — valid branches are ${BATCH_BRANCHES[batch].join(', ')}.`, 'err'); return; }
    const existing = this.state.studentDirectory.find(s=>s.rollNo===rollNo && s.batch===batch);
    let row;
    if(existing){
      Object.assign(existing, { name, email, branch, semester });
      row = existing;
    } else {
      row = { id:bizId('STU', [rollNo, batch], this.state.studentDirectory.map(s=>s.id)), rollNo, name, email, branch, batch, semester };
      this.state.studentDirectory.push(row);
    }
    syncStudentDirectoryEntry(row);
    toast(`${name} (${rollNo}) added to ${batch} · ${branchLabel(branch)}.`, 'ok');
    this.navigate('ea-students');
  },
  removeStudentFromDirectory(id){
    const actor = this.currentUser();
    if(!['EA','ADMIN'].includes(actor.systemRole)){ toast('Only the Executive Assistant can edit the student directory.', 'err'); return; }
    const idx = this.state.studentDirectory.findIndex(s=>s.id===id);
    if(idx===-1) return;
    const [removed] = this.state.studentDirectory.splice(idx,1);
    deleteStudentDirectoryEntry(id);
    toast(`${removed.name} removed from the student directory.`, 'err');
    this.navigate('ea-students');
  },
  // rows: parsed spreadsheet rows with Roll No / Name / Email / Department / Semester
  // columns (Department may be a mix of any branch valid for `batch` — each
  // row is sorted into its own branch automatically from that column).
  bulkImportStudents(rows, batch){
    const actor = this.currentUser();
    if(!['EA','ADMIN'].includes(actor.systemRole)){ toast('Only the Executive Assistant can import the student directory.', 'err'); return; }
    if(!BATCH_BRANCHES[batch]){ toast('Choose a Batch before importing.', 'err'); return; }
    if(!Array.isArray(rows) || rows.length===0){ toast('That file has no rows to import.', 'err'); return; }
    let added=0, updated=0, skipped=0;
    const bySort = {}; // branch -> count, just for the summary toast
    rows.forEach(row=>{
      const keys = Object.keys(row||{});
      const findKey = (re) => keys.find(k=>re.test(String(k).trim()));
      const rollKey = findKey(/^roll\s*-?no\.?$/i);
      const nameKey = findKey(/^name$/i);
      const emailKey = findKey(/^e-?mail$/i);
      const deptKey = findKey(/^dep(artmen)?t$/i) || findKey(/^branch$/i);
      const semKey = findKey(/^sem(ester)?$/i);
      const rollNo = rollKey ? String(row[rollKey]).trim().toUpperCase() : '';
      const name = nameKey ? String(row[nameKey]).trim() : '';
      const email = emailKey ? String(row[emailKey]).trim().toLowerCase() : '';
      const branch = deptKey ? String(row[deptKey]).trim().toUpperCase() : '';
      const semester = semKey ? String(row[semKey]).trim() : '';
      if(!rollNo || !name || !BATCH_BRANCHES[batch].includes(branch)){ skipped++; return; }
      if(email && !isValidEmail(email)){ skipped++; return; }
      const existing = this.state.studentDirectory.find(s=>s.rollNo===rollNo && s.batch===batch);
      if(existing){ Object.assign(existing, { name, email, branch, semester }); updated++; }
      else { this.state.studentDirectory.push({ id:bizId('STU', [rollNo, batch], this.state.studentDirectory.map(s=>s.id)), rollNo, name, email, branch, batch, semester }); added++; }
      bySort[branch] = (bySort[branch]||0) + 1;
    });
    const touched = this.state.studentDirectory.filter(s=>s.batch===batch);
    syncStudentDirectoryEntries(touched);
    if(added+updated===0){
      toast(`Import found nothing usable. Check the file has Roll No, Name, Department (${BATCH_BRANCHES[batch].join('/')} for ${batch}) columns.`, 'err');
    } else {
      const sortSummary = Object.keys(bySort).sort().map(b=>`${b}: ${bySort[b]}`).join(', ');
      toast(`Import complete — ${added} added, ${updated} updated${skipped?`, ${skipped} skipped`:''}. Sorted by department — ${sortSummary}.`, 'ok');
    }
    this.navigate('ea-students');
  },
};

/* ---------------- small helpers ---------------- */
function computeCIE(student, components){
  components = components || [];
  let total = 0, complete = true;
  components.forEach(comp=>{
    const raw = student.marks[comp.key];
    if(typeof raw !== 'number'){ complete = false; return; }
    total += (Math.min(raw, comp.rawMax)/comp.rawMax) * comp.scaledMax;
  });
  return { total: round1(total), complete };
}
function computeSEE(student, components){
  return computeCIE(student, components || []);
}
function computeGrandTotal(student, course){
  const template = getCourseTemplate(course);
  const cie = computeCIE(student, template.cie);
  const see = computeSEE(student, seeDisplayComponents(template));
  return { cieTotal:cie.total, seeTotal:see.total, total: round1(cie.total + see.total), complete: cie.complete && see.complete };
}
function courseCIEComplete(course){
  if(!course.studentsLoaded) return !!course.cieComplete; // from course_completion_status, computed server-side
  const components = getCourseComponents(course);
  return course.students.length>0 && course.students.every(s=>computeCIE(s, components).complete);
}
function courseSEEComplete(course){
  if(!course.studentsLoaded) return !!course.seeComplete; // from course_completion_status, computed server-side
  const components = getCourseSeeComponents(course);
  return course.students.length>0 && course.students.every(s=>computeSEE(s, components).complete);
}
function round1(n){ return Math.round(n*10)/10; }
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'}) + ' · ' + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
}
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function toast(msg, kind=''){
  const c = document.getElementById('toast-container');
  const t = el(`<div class="toast ${kind}">${escapeHtml(msg)}</div>`);
  c.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 3600);
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function emptyStateHtml(title, body){ return `<div class="empty-state"><div class="em-title">${escapeHtml(title)}</div>${escapeHtml(body)}</div>`; }
function openModal(html){
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this) closeModal()"><div class="modal-box">${html}</div></div>`;
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }
window.closeModal = closeModal;

function renderBell(){
  const user = App.currentUser();

  const items = App.state.notifications.filter(n=>n.forUserId===user.id);
  const unread = items.filter(n=>!n.read).length;

function toggleNotifPanel(){
  const panel = document.getElementById('notif-panel');

  if(isHidden){
    const user = App.currentUser();
    const items = App.state.notifications.filter(n=>n.forUserId===user.id).slice(0,20);

// Routes that read full course.students (marks/roster), not just the
// lightweight count/completion flags — these need App.ensureCourseStudentsLoaded
// before they render, since the initial login fetch deliberately skips the
// full students table (see fetchStateFromSupabase).
const ROUTES_NEEDING_STUDENTS = { 'ci-entry':true, 'cc-roster':true, 'cc-review':true, 'ea-review':true, 'hod-review':true };
function renderContent(){
  const user = App.currentUser();
  const nav = getNavForUser(user);
  let view = App.ui.view || (nav[0] ? nav[0].v : 'faculty-empty');

  const routes = {
    'admin-users': renderAdminUsers,
    'hod-list': renderHODList,
    'hod-review': renderHODReview,
    'hod-coordinators': renderHODCoordinators,
    'hod-cc-detail': renderHODCCDetail,
    'hod-termtest': renderHODTermTest,
    'hod-faculty': renderHODFacultyDirectory,
    'hod-audit': renderHODAudit,
    'ea-list': renderEAList,
    'ea-faculty': renderEAFacultyDirectory,
    'ea-students': renderEAStudents,
    'ea-review': renderEAReview,
    'exam-list': renderExamList,
    'ci-sections': renderCISections,
    'ci-entry': renderCIEntry,
    'cc-list': renderCCList,
    'cc-roster': renderCCRoster,
    'cc-review': renderCCReview,
    'faculty-empty': renderFacultyEmpty,
  };
  const fn = routes[view] || renderFacultyEmpty;
  const c = document.getElementById('content');

  const build = () => {
    c.innerHTML = '';
    if(user.systemRole !== 'ADMIN'){
      const bannerHtml = termTestBanner();
      if(bannerHtml){
        const bannerWrap = el('<div></div>');
        bannerWrap.innerHTML = bannerHtml;
        c.appendChild(bannerWrap.firstElementChild);
      }
    }
    c.appendChild(fn(App.ui.params));
  };

  const courseId = App.ui.params && App.ui.params.courseId;
  if(ROUTES_NEEDING_STUDENTS[view] && courseId){
    const course = App.getCourse(courseId);
    if(course && !course.studentsLoaded){
      c.innerHTML = emptyStateHtml('Loading roster…', 'Fetching this section\'s students and marks.');
      App.ensureCourseStudentsLoaded(courseId).then(build);
      return;
    }
  }
  build();
}
function termTestBanner(){
  const label = TERM_TEST_LABELS[App.state.currentTermTest];
  if(!label) return ''; // covers null/empty AND any value that doesn't match a known term test key
  return `<div class="card" style="border-left:3px solid var(--brass);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
    <div>
      <div class="page-eyebrow">Active Examination Cycle</div>
      <div class="section-title" style="margin-top:4px;">${label}</div>
    </div>
    <span class="status-pill status-verified">Fixed by HOD · visible to CC, CI, EA, Exam Branch &amp; HOD</span>
  </div>`;
}

/* ---------------- shared bits ---------------- */
function statusPill(course){ return `<span class="status-pill ${STATUS_CLASS[course.status]}">${STATUS_LABEL[course.status]}</span>`; }
function etPill(course){
  if(!course || !course.evalType) return `<span class="status-pill status-draft">ET: Not fixed yet</span>`;
  return `<span class="status-pill" style="background:var(--brass);color:#FBF7EC;border-color:var(--brass);">ET: ${escapeHtml(evalTypeLabel(course.evalType))}</span>`;
}
// Same pill, but for HOD-level views where the subject (and therefore its
// Evaluation Type) is already fixed from Courses Applicable at shell-creation
// time — regardless of whether a Course Instructor is currently assigned to
// actually enter marks. Falls back to the course's own evalType first (covers
// any edge case where the subject isn't in the master list) then to the
// master subject record, so revoking a Coordinator/Instructor no longer makes
// an already-known Evaluation Type look "not fixed yet".
function etPillFixed(course){
  const abbr = (course && course.evalType) || masterSubject(course && course.code)?.abbr;
  if(!abbr) return `<span class="status-pill status-draft">ET: Not fixed yet</span>`;
  return `<span class="status-pill" style="background:var(--brass);color:#FBF7EC;border-color:var(--brass);">ET: ${escapeHtml(evalTypeLabel(abbr))}</span>`;
}
function courseMeta(course){ return `${escapeHtml(course.code)} · Section ${escapeHtml(course.section)} · ${branchLabel(course.branch)}`; }
function assignmentSummary(courseId){
  const course = App.getCourse(courseId);
  const ccUser = getCourseCCUser(courseId);
  const ciUser = getCourseCIUser(courseId);
  const etPart = course && course.evalType ? ` · Evaluation Type: ${escapeHtml(evalTypeLabel(course.evalType))}` : '';
  return `Coordinator: ${ccUser ? escapeHtml(ccUser.name) : 'Unassigned'} · Instructor: ${ciUser ? escapeHtml(ciUser.name) : 'Unassigned'}${etPart}`;
}
function courseMetaBlock(course){
  return `<div class="section-meta">${courseMeta(course)}</div><div class="section-meta" style="margin-top:2px;">${assignmentSummary(course.id)}</div>`;
}
function sentBackBanner(course){
  if(!course.sentBack || course.status!=='draft') return '';
  return `<div class="card" style="border-left:3px solid var(--seal-red);">
    <div class="section-title" style="color:var(--seal-red);">Sent back for correction</div>
    <p style="margin:8px 0 0;color:var(--text-soft);">${escapeHtml(course.lastRemark)}</p>
  </div>`;
}

let activeMarksTab = 'cie';

/* Read-only combined table — used by CC / EA / HOD / Examination Branch / print / CSV export */
function marksViewTable(course){
  if(!course.evalType){
    return `<div class="empty-state"><div class="em-title">Evaluation Type not yet fixed</div>The Course Coordinator hasn't fixed an Evaluation Type for this section yet, so no marks components exist to display.</div>`;
  }
  const template = getCourseTemplate(course);
  const cieComponents = template.cie;
  const seeComponents = seeDisplayComponents(template);
  const seeTotalMax = seeComponents.reduce((a,c)=>a+c.scaledMax,0);
  const grandMax = round1(CIE_MAX + seeTotalMax);
  const rows = course.students.map(s=>{
    const gt = computeGrandTotal(s, course);
    const cieCells = cieComponents.map(comp=>{
      const v = s.marks[comp.key];
      const overMax = typeof v==='number' && (v>comp.rawMax || v<0);
      return `<td>${v===undefined||v===null?'—':`<span style="${overMax?'color:var(--seal-red);font-weight:600;':''}">${v}</span>`} <span class="mono" style="color:var(--text-soft);font-size:11px;">/${comp.rawMax}</span></td>`;
    }).join('');
    const seeCells = seeComponents.map(comp=>{
      const v = s.marks[comp.key];
      const overMax = typeof v==='number' && (v>comp.rawMax || v<0);
      return `<td>${v===undefined||v===null?'—':`<span style="${overMax?'color:var(--seal-red);font-weight:600;':''}">${v}</span>`} <span class="mono" style="color:var(--text-soft);font-size:11px;">/${comp.rawMax}</span></td>`;
    }).join('');
    return `<tr>
      <td>${escapeHtml(s.name)}</td>
      ${cieCells}
      <td class="total-cell">${gt.cieTotal} <span class="mono" style="font-weight:400;color:var(--text-soft);font-size:11px;">/${CIE_MAX}</span></td>
      ${seeCells}
      <td class="total-cell">${gt.total} <span class="mono" style="font-weight:400;color:var(--text-soft);font-size:11px;">/${grandMax}</span></td>
    </tr>`;
  }).join('');
  const cieHead = cieComponents.map(comp=>`<th>${comp.label}<br><span style="text-transform:none;">max ${comp.rawMax}</span></th>`).join('');
  const seeHead = seeComponents.map(comp=>`<th>${comp.label}<br><span style="text-transform:none;">max ${comp.rawMax}</span></th>`).join('');
  return `
    <div class="weight-inline">
      <div class="weight-track"><div class="weight-cie"></div><div class="weight-see"></div></div>
      <span>Evaluation Type: <strong>${escapeHtml(template.label)}</strong> · CIE (${cieComponents.map(c=>c.label).join(', ')}) · SEE (${seeComponents.map(c=>c.label).join(', ')})</span>
    </div>
    <div class="table-scroll">
      <table class="data-table" style="margin-top:14px;min-width:920px;">
        <thead><tr><th>Student</th>${cieHead}<th>CIE Total</th>${seeHead}<th>Total</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

/* Editable, tabbed CIE/SEE entry UI — used only on the Course Instructor's entry page.
   The SEE tab stays locked until every student's CIE components for the course's fixed
   Evaluation Type template are fully entered. */
function marksEntryTabs(course){
  if(!course.evalType){
    return `
      <div class="empty-state">
        <div class="em-title">Evaluation Type not yet fixed</div>
        Your Course Coordinator hasn't fixed an Evaluation Type for this section yet. Marks entry opens automatically as soon as they do — Select Subject → Lookup Subject Table → Get Abbreviation → Fetch Evaluation Template → Generate Form Automatically.
      </div>`;
  }
  const template = getCourseTemplate(course);
  const cieComponents = template.cie;
  const seeComponents = seeDisplayComponents(template);
  const seeTotalMax = seeComponents.reduce((a,c)=>a+c.scaledMax,0);
  const grandMax = round1(CIE_MAX + seeTotalMax);
  const cieDone = courseCIEComplete(course);

  const cieRows = course.students.map(s=>{
    const cie = computeCIE(s, cieComponents);
    const cells = cieComponents.map(comp=>{
      const val = s.marks[comp.key];
      const overMax = typeof val==='number' && (val>comp.rawMax || val<0);
      return `<td><input type="number" min="0" max="${comp.rawMax}" step="0.5"
        class="${overMax?'invalid':''}"
        data-course="${course.id}" data-student="${s.id}" data-field="${comp.key}"
        value="${val===undefined||val===null?'':val}" placeholder="/${comp.rawMax}"
        onchange="onMarkChange(this)"></td>`;
    }).join('');
    return `<tr><td>${escapeHtml(s.name)}</td>${cells}<td class="total-cell">${cie.total} <span class="mono" style="font-weight:400;color:var(--text-soft);font-size:11px;">/${CIE_MAX}</span></td></tr>`;
  }).join('');
  const cieHead = cieComponents.map(comp=>`<th>${comp.label}<br><span style="text-transform:none;">max ${comp.rawMax}</span></th>`).join('');

  const seeRows = course.students.map(s=>{
    const gt = computeGrandTotal(s, course);
    const seeCells = seeComponents.map(comp=>{
      const val = s.marks[comp.key];
      const overMax = typeof val==='number' && (val>comp.rawMax || val<0);
      const isTheory = comp.key === 'seeTheory';
      return `<td><input type="number" min="0" max="${comp.rawMax}" step="0.5"
        class="${overMax?'invalid':''}"
        data-course="${course.id}" data-student="${s.id}" data-field="${comp.key}"
        value="${val===undefined||val===null?'':val}" placeholder="${isTheory?'Exam Branch':'/'+comp.rawMax}"
        ${isTheory ? 'disabled title="Entered by the Examination Branch"' : ''}
        onchange="onMarkChange(this)"></td>`;
    }).join('');
    return `<tr>
      <td>${escapeHtml(s.name)}</td>
      ${seeCells}
      <td class="total-cell">${gt.total} <span class="mono" style="font-weight:400;color:var(--text-soft);font-size:11px;">/${grandMax}</span></td>
    </tr>`;
  }).join('');
  const seeHead = seeComponents.map(comp=>`<th>${comp.label}<br><span style="text-transform:none;">max ${comp.rawMax}</span></th>`).join('');

  const cieComponentList = cieComponents.map(c=>`${c.label} (/${c.rawMax}→/${c.scaledMax})`).join(', ');
  const cieNamesOnly = cieComponents.map(c=>c.label).join(', ');
  const seeComponentList = seeComponents.map(c=>`${c.label} (/${c.rawMax}→/${c.scaledMax})`).join(', ');

  return `
    <div class="et-banner" style="margin-bottom:14px;padding:10px 14px;background:var(--parchment-2);border:1px solid var(--rule);border-radius:2px;">
      <span class="section-meta" style="text-transform:uppercase;letter-spacing:0.06em;font-size:10.5px;color:var(--brass);">Evaluation Type fixed by Coordinator</span>
      <div style="font-family:'Fraunces',serif;font-weight:600;color:var(--ink);font-size:15px;margin-top:2px;">${escapeHtml(template.label)} <span style="font-family:inherit;font-weight:400;font-size:12px;color:var(--text-soft);">(${escapeHtml(template.courseType)})</span></div>
    </div>
    <div class="tab-bar">
      <button type="button" class="tab-btn ${activeMarksTab==='cie'?'active':''}" onclick="switchMarksTab('cie')">CIE Marks</button>
      <button type="button" class="tab-btn ${activeMarksTab==='see'?'active':''}" onclick="switchMarksTab('see')">Semester End Exam (SEE)</button>
    </div>
    <div id="tab-cie" class="tab-panel ${activeMarksTab==='cie'?'':'hidden'}">
      <p class="section-meta" style="margin-bottom:8px;">CIE is ${CIE_MAX} marks total: ${cieComponentList}.</p>
      <div class="table-scroll">
        <table class="data-table"><thead><tr><th>Student</th>${cieHead}<th>CIE Total</th></tr></thead><tbody>${cieRows}</tbody></table>
      </div>
    </div>
    <div id="tab-see" class="tab-panel ${activeMarksTab==='see'?'':'hidden'}">
      <p class="section-meta" style="margin-bottom:8px;">SEE counted here is ${seeTotalMax} marks: ${seeComponentList}, folded straight into the Total below (CIE ${CIE_MAX} + SEE ${seeTotalMax} = ${grandMax}). SEE Theory is entered and evaluated separately by the Examination Branch and no longer appears on this screen.</p>
      <div class="table-scroll">
        <table class="data-table"><thead><tr><th>Student</th>${seeHead}<th>Total</th></tr></thead><tbody>${seeRows}</tbody></table>
      </div>
    </div>`;
}
function switchMarksTab(tab){
  activeMarksTab = tab;
  renderContent();
}
window.switchMarksTab = switchMarksTab;

function onMarkChange(input){
  const max = parseFloat(input.max);
  const val = parseFloat(input.value);
  input.classList.toggle('invalid', !isNaN(val) && (val<0 || val>max));
  App.saveMarks(input.dataset.course);
  renderContent();
}
window.onMarkChange = onMarkChange;

/* Grouped <select> of every faculty member already in the directory
   (uploaded by EA / created anywhere in the system), grouped by home
   branch — lets HOD pick a known faculty member to assign as Coordinator
   instead of retyping their email every time. Selecting an option fills
   the email/name fields via fillCoordinatorFromDirectory() below. */
function facultyDropdownOptionsHtml(){
  const entries = App.state.users.filter(u=>u.systemRole==='FACULTY');
  if(entries.length===0) return `<option value="">— No faculty in the directory yet —</option>`;
  const branches = {};
  const noBranch = [];
  entries.forEach(u=>{ if(u.homeBranch){ (branches[u.homeBranch] = branches[u.homeBranch] || []).push(u); } else { noBranch.push(u); } });
  let html = `<option value="">— Pick an existing faculty member (optional) —</option>`;
  Object.keys(branches).sort().forEach(bk=>{
    html += `<optgroup label="${escapeHtml(branchLabel(bk))}">`;
    branches[bk].sort((a,b)=>a.name.localeCompare(b.name)).forEach(u=>{
      html += `<option value="${u.id}">${escapeHtml(u.name)} — ${escapeHtml(u.email)}</option>`;
    });
    html += `</optgroup>`;
  });
  if(noBranch.length){
    html += `<optgroup label="No branch set">`;
    noBranch.sort((a,b)=>a.name.localeCompare(b.name)).forEach(u=>{
      html += `<option value="${u.id}">${escapeHtml(u.name)} — ${escapeHtml(u.email)}</option>`;
    });
    html += `</optgroup>`;
  }
  return html;
}

function getAuditEntries(){
  const entries = [];
  App.state.courses.forEach(c=>{ c.history.forEach(h=> entries.push({...h, code:c.code, name:c.name})); });
  entries.sort((a,b)=>b.ts-a.ts);
  return entries;
}
function auditDateKey(ts){
  const d = new Date(ts);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function auditDateLabel(ts){
  return new Date(ts).toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'});
}
function renderAuditEntriesHtml(entries){
  if(entries.length===0) return emptyStateHtml('No activity on this date', 'Try a different date, or choose "All dates".');
  return `<div class="card">${entries.map(h=>`
    <div class="audit-item">

      <div class="a-body">${escapeHtml(h.user)}${h.remark ? ': "'+escapeHtml(h.remark)+'"' : ''}</div>
      <div class="a-time">${fmtDate(h.ts)}</div>
    </div>`).join('')}</div>`;
}
function renderHODAudit(){
  const entries = getAuditEntries();
  // entries are already newest-first, so the date keys come out sorted too
  const dateKeys = [];
  const dateTsByKey = {};
  entries.forEach(h=>{
    const k = auditDateKey(h.ts);
    if(!(k in dateTsByKey)){ dateKeys.push(k); dateTsByKey[k] = h.ts; }
  });
  const wrap = el('<div></div>');
  wrap.innerHTML = `
    <div class="page-head">

async function exportCSV(courseId){
  const course = await App.ensureCourseStudentsLoaded(courseId);
  const template = getCourseTemplate(course);
  const cieComponents = template.cie, seeComponents = seeDisplayComponents(template);
  const header = ['Student', ...cieComponents.map(c=>c.label), 'CIE Total', ...seeComponents.map(c=>c.label), 'Total'];
  const rows = course.students.map(s=>{
    const gt = computeGrandTotal(s, course);
    return [s.name, ...cieComponents.map(c=>s.marks[c.key] ?? ''), gt.cieTotal, ...seeComponents.map(c=>s.marks[c.key] ?? ''), gt.total];
  });
  const csv = [header, ...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${course.code}_Section${course.section}_results.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// XLSX.js (~1MB minified) is only used by EA/CC import features — loaded on
// demand the first time any of them is actually used, instead of blocking
// every page load (including Admin/Exam Branch/CI sessions that never touch
// it) with the full library. Cached after first load.
let _xlsxLoadPromise = null;
function ensureXLSXLoaded(){
  if(typeof XLSX !== 'undefined') return Promise.resolve();
  if(_xlsxLoadPromise) return _xlsxLoadPromise;
  _xlsxLoadPromise = new Promise((resolve, reject)=>{
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    script.onload = () => resolve();
    script.onerror = () => { _xlsxLoadPromise = null; reject(new Error('Failed to load the spreadsheet reader.')); };
    document.head.appendChild(script);
  });
  return _xlsxLoadPromise;
}

function handleFacultyExcelImport(input){
  const file = input.files && input.files[0];
  if(!file) return;
  ensureXLSXLoaded().then(()=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type:'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });
        App.bulkImportFaculty(rows);
      }catch(err){
        console.warn(err);
        toast('Could not read that file. Please upload a valid .xlsx, .xls, or .csv file.', 'err');
      }
      input.value = '';
    };
    reader.onerror = ()=>{ toast('Could not read that file.', 'err'); input.value=''; };
    reader.readAsArrayBuffer(file);
  }).catch(err=>{
    toast(err.message || 'Could not load the spreadsheet reader. Check your internet connection and try again.', 'err');
    input.value = '';
  });
}

function handleStudentExcelImport(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const batchEl = document.getElementById('sd-import-batch');
  const batch = batchEl ? batchEl.value : '';
  ensureXLSXLoaded().then(()=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type:'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });
        App.bulkImportStudents(rows, batch);
      }catch(err){
        console.warn(err);
        toast('Could not read that file. Please upload a valid .xlsx, .xls, or .csv file.', 'err');
      }
      input.value = '';
    };
    reader.onerror = ()=>{ toast('Could not read that file.', 'err'); input.value=''; };
    reader.readAsArrayBuffer(file);
  }).catch(err=>{
    toast(err.message || 'Could not load the spreadsheet reader. Check your internet connection and try again.', 'err');
    input.value = '';
  });
}

          <input type="file" accept=".xlsx,.xls,.csv" style="display:none;" onchange="handleCCRosterExcelImport(this, '${course.id}')">
        </label>
        <button class="btn btn-outline btn-sm" onclick="downloadStudentTemplate()">Download template</button>
      </div>
    </div>
    `}
    <div class="card">
      <div class="section-title" style="font-size:15px;">Current roster <span class="section-meta">(${roster.length} student${roster.length===1?'':'s'})</span></div>
      ${roster.length===0 ? emptyStateHtml('No students on this roster yet', locked ? 'This roster is empty.' : 'Import a spreadsheet above to get started.') : roster.map(s=>`
        <div class="card card-row">
          <div>
            <div class="section-title">${s.rollNo ? escapeHtml(s.rollNo)+' — ' : ''}${escapeHtml(s.name)}</div>
            <div class="section-meta">${s.email ? escapeHtml(s.email) : 'No email on file'}${!s.dirId ? ' · Not linked to Student Directory' : ''}</div>
          </div>
          ${locked ? '' : `<button class="btn btn-red btn-sm" onclick="if(confirm('Remove ${escapeHtml(s.name)} from this roster?')) removeCCRosterStudent('${course.id}','${s.id}')">Remove</button>`}
        </div>
      `).join('')}
    </div>
    ${locked ? '' : `
    <details class="card">
      <summary style="cursor:pointer;font-weight:600;">Or pick from the Student Directory instead</summary>
      <p class="section-meta" style="margin-top:8px;">Check students already in the Executive Assistant's directory for ${branchLabel(course.branch)}, then Save — this <strong>replaces</strong> directory-linked rows on the roster with your selection (rows added manually above are left alone).</p>
      <input id="cc-roster-search" class="search-input" type="text" placeholder="Search by roll no or name..." oninput="filterCCRosterList(this.value)" style="margin-top:8px;">
      <div id="cc-roster-list" style="margin-top:14px;">
        ${directoryForBranch.length===0 ? emptyStateHtml('No directory students for this branch yet', `The Executive Assistant hasn't uploaded any ${branchLabel(course.branch)} students yet.`) :
          Object.keys(byBatch).sort().map(batch=>`
            <div class="branch-heading">${escapeHtml(BATCH_LABELS[batch] || batch)}</div>
            ${byBatch[batch].sort((a,b)=>a.rollNo.localeCompare(b.rollNo)).map(s=>`
              <label class="card card-row cc-roster-row" data-hay="${escapeHtml((s.rollNo+' '+s.name).toLowerCase())}" style="cursor:pointer;">
                <div>
                  <div class="section-title">${escapeHtml(s.rollNo)} — ${escapeHtml(s.name)}</div>
                  <div class="section-meta">${s.email ? escapeHtml(s.email) : 'No email on file'}${s.semester ? ` · Sem ${escapeHtml(s.semester)}` : ''}</div>
                </div>
                <input type="checkbox" class="cc-roster-check" value="${s.id}" ${currentDirIds.has(s.id) ? 'checked' : ''} style="width:18px;height:18px;">
              </label>
            `).join('')}
          `).join('')
        }
      </div>
      ${directoryForBranch.length>0 ? `<button class="btn" style="margin-top:14px;" onclick="saveCCRoster('${course.id}')">Save Roster</button>` : ''}
    </details>
    `}
  `;
  return wrap;
}
function filterCCRosterList(term){
  const q = (term||'').trim().toLowerCase();
  document.querySelectorAll('#cc-roster-list .cc-roster-row').forEach(row=>{
    row.style.display = (!q || row.getAttribute('data-hay').includes(q)) ? '' : 'none';
  });
}
window.filterCCRosterList = filterCCRosterList;
function saveCCRoster(courseId){
  const ids = Array.from(document.querySelectorAll('.cc-roster-check:checked')).map(el=>el.value);
  App.setCourseRoster(courseId, ids);
}
window.saveCCRoster = saveCCRoster;
function removeCCRosterStudent(courseId, studentId){
  const course = App.getCourse(courseId);
  if(!course) return;
  const actor = App.currentUser();
  if(course.status==='approved' && actor.systemRole!=='ADMIN'){ toast('This course is already approved — the roster is locked. Contact an Administrator if this needs to be corrected.', 'err'); return; }
  const remainingDirIds = (course.students||[]).filter(s=>s.id!==studentId).map(s=>s.dirId).filter(Boolean);
  // route through setCourseRoster's directory-linked handling for directory rows,
  // but a manually-imported row (no dirId) needs a direct delete instead.
  const target = (course.students||[]).find(s=>s.id===studentId);
  if(target && !target.dirId){
    course.students = (course.students||[]).filter(s=>s.id!==studentId);
    deleteStudent(studentId);
    toast(`${target.name} removed from the roster.`, 'err');
    App.navigate('cc-roster', { courseId });
  } else {
    App.setCourseRoster(courseId, remainingDirIds);
  }
}
window.removeCCRosterStudent = removeCCRosterStudent;
function handleCCRosterExcelImport(input, courseId){
  const file = input.files && input.files[0];
  if(!file) return;
  ensureXLSXLoaded().then(()=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type:'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });
        App.importCourseRosterRows(courseId, rows);
      }catch(err){
        console.warn(err);
        toast('Could not read that file. Please upload a valid .xlsx, .xls, or .csv file.', 'err');
      }
      input.value = '';
    };
    reader.onerror = ()=>{ toast('Could not read that file.', 'err'); input.value=''; };
    reader.readAsArrayBuffer(file);
  }).catch(err=>{
    toast(err.message || 'Could not load the spreadsheet reader. Check your internet connection and try again.', 'err');
    input.value = '';
  });
}
window.handleCCRosterExcelImport = handleCCRosterExcelImport;

function renderCCReview(params){
  const course = App.getCourse(params.courseId);
  const actionable = course.status === 'submitted';
  const wrap = el('<div></div>');
  wrap.innerHTML = `
    <div class="page-head">
      <button class="ghost-btn no-print" style="color:var(--ink);border-color:var(--rule);margin-bottom:14px;" onclick="App.navigate('cc-list')">← Back to my coordination</button>
      <div class="page-eyebrow">Stage 2 · Coordinator verification</div>
      <h2>${escapeHtml(course.name)}</h2>
      <p>${courseMeta(course)} ${statusPill(course)} ${etPill(course)}</p>
      <p class="section-meta" style="margin-top:6px;">${assignmentSummary(course.id)}</p>
    </div>
    <div class="card">
      <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;" class="no-print">
        <button class="btn btn-outline btn-sm" onclick="exportCSV('${course.id}')">Export CSV</button>
        <button class="btn btn-sm btn-outline" onclick="exportPrint('${course.id}')">Export / Print PDF</button>
      </div>
      ${marksViewTable(course)}
      ${actionable ? `
        <label class="mono" style="display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-soft);margin-top:18px;">Verification remarks (optional)</label>
        <textarea id="cc-remark-input" class="remark-box" placeholder="Note anything relevant for the Executive Assistant's review..."></textarea>
        <div style="display:flex;gap:10px;margin-top:14px;">
          <button class="btn" onclick="App.ccForward('${course.id}')">Verify &amp; Forward to Executive Assistant</button>
        </div>` : `<p style="margin-top:16px;color:var(--text-soft);font-size:13.5px;">This record is ${STATUS_LABEL[course.status].toLowerCase()} and is not currently actionable.</p>`}
    </div>
  `;
  return wrap;
}

/* ================= FACULTY: no assignments yet ================= */
function renderFacultyEmpty(){
  const wrap = el('<div></div>');
  wrap.innerHTML = `
    <div class="page-head">
      <div class="page-eyebrow">Faculty</div>
      <h2>No active assignments yet</h2>
      <p>Once a Head of Department assigns you as Course Coordinator, or a Course Coordinator assigns you as Course Instructor, your courses will appear here automatically — no separate role request needed.</p>
    </div>
    ${emptyStateHtml('Nothing to show yet','Check back after your department assigns you to a course-section.')}
  `;
  return wrap;
}

/* ---------------- boot ----------------
   No profile data is fetched before sign-in anymore — the login
   screen is just an email/password form now. onAuthStateChange
   (registered above) handles both a fresh sign-in and restoring an
   existing session (INITIAL_SESSION) by calling handleSignedIn(). */
document.addEventListener('DOMContentLoaded', ()=>{
  App.ready = true;

  document.getElementById('logout-btn').addEventListener('click', ()=>App.logout());
  document.getElementById('bell-btn').addEventListener('click', (e)=>{ e.stopPropagation(); toggleNotifPanel(); });
  document.addEventListener('click', (e)=>{
    const panel = document.getElementById('notif-panel');
    if(!panel.classList.contains('hidden') && !panel.contains(e.target) && e.target.id!=='bell-btn'){
      closeNotifPanel();
    }
  });

  const loginForm = document.getElementById('login-form');
  const loginBtn = document.getElementById('login-submit-btn');
  if(loginForm) loginForm.addEventListener('submit', (e)=>{ e.preventDefault(); App.submitLogin(); });
  if(loginBtn) loginBtn.addEventListener('click', ()=>App.submitLogin());
});
</script>
