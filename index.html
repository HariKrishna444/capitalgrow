<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DVS — Digital Valuation System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Firebase Storage (compat build — plain globals, matches this app's
     non-module script style) used only for the Best/Average/Lowest
     scanned answer-script uploads. Fill in FIREBASE_CONFIG further down
     in this file with your own project's keys. -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<style>
:root{
  --ink:#1B2A4A;
  --ink-2:#233457;
  --parchment:#EFE8D9;
  --parchment-2:#E5DCC6;
  --card:#F7F2E7;
  --brass:#A8832F;
  --brass-light:#C9A24A;
  --seal-green:#2F5233;
  --seal-red:#8B2E2E;
  --text:#24211C;
  --text-soft:#5B5546;
  --rule:#C9BFA4;
  --rule-light:#E3DAC3;
  --radius:2px;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--parchment);
  color:var(--text);
  font-family:'Source Serif 4', Georgia, serif;
  line-height:1.55;
}
h1,h2,h3,h4{
  font-family:'Fraunces', Georgia, serif;
  color:var(--ink);
  margin:0;
  letter-spacing:-0.01em;
  font-weight:600;
}
.mono{font-family:'IBM Plex Mono', monospace;}
.hidden{display:none !important;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ---------------- LOGIN ---------------- */
.login-view{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px;
  background:
    repeating-linear-gradient(to bottom, transparent 0 37px, rgba(233,225,201,0.05) 37px 38px),
    radial-gradient(circle at 82% 8%, rgba(200,162,74,0.14), transparent 42%),
    linear-gradient(160deg, var(--ink) 0%, var(--ink-2) 55%, #16233F 100%);
}
.login-card{
  max-width:480px;
  width:100%;
  color:var(--parchment);
}
.eyebrow{
  display:inline-flex;
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:var(--brass-light);
  border:1px solid rgba(201,162,74,0.5);
  padding:5px 12px;
  border-radius:2px;
}
.login-card h1{
  color:#FBF7EC;
  font-size:clamp(28px,4.4vw,38px);
  margin-top:18px;
  line-height:1.1;
}
.login-sub{
  margin-top:14px;
  color:#D8D0BC;
  font-size:15px;
  max-width:46ch;
}
.persona-list{
  margin-top:30px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.persona-group-label{
  margin-top:14px;
  font-size:10.5px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--brass-light);
  opacity:0.85;
}
.persona-group-label:first-child{margin-top:0;}
.persona-btn{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  background:rgba(247,242,231,0.05);
  border:1px solid rgba(201,162,74,0.28);
  color:#EFE8D9;
  padding:14px 16px;
  text-align:left;
  border-radius:2px;
  transition:background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
}
.persona-btn:hover{
  background:rgba(201,162,74,0.12);
  border-color:var(--brass-light);
  transform:translateX(2px);
}
.persona-btn .p-name{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:16px;
  display:block;
}
.persona-btn .p-desc{
  font-size:12.5px;
  color:#B9AF93;
  margin-top:3px;
  display:block;
}
.persona-btn .p-code{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  letter-spacing:0.08em;
  color:var(--brass-light);
  border:1px solid var(--brass-light);
  padding:3px 9px;
  border-radius:2px;
  flex-shrink:0;
}

/* ---------------- SHELL ---------------- */
.shell{min-height:100vh;display:flex;flex-direction:column;}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  height:60px;
  background:var(--ink);
  color:var(--parchment);
  border-bottom:2px solid var(--brass);
  position:relative;
  z-index:20;
}
.brand{display:flex;align-items:baseline;gap:10px;}
.brand-mark{
  font-family:'Fraunces', serif;
  font-weight:700;
  font-size:19px;
  letter-spacing:0.03em;
  color:#FBF7EC;
}
.brand-sub{font-size:11px;color:#B9AF93;letter-spacing:0.05em;}
.topbar-right{display:flex;align-items:center;gap:14px;position:relative;}
.bell-btn{
  background:none;border:none;color:#D8D0BC;
  position:relative;padding:6px;display:flex;
}
.bell-btn:hover{color:var(--brass-light);}
.bell-count{
  position:absolute;top:0;right:0;
  background:var(--seal-red);color:#fff;
  font-family:'IBM Plex Mono', monospace;
  font-size:9px;line-height:1;
  padding:2px 4px;border-radius:8px;
}
.notif-panel{
  position:absolute;top:46px;right:60px;
  width:320px;max-height:380px;overflow-y:auto;
  background:var(--card);color:var(--text);
  border:1px solid var(--rule);
  box-shadow:0 10px 30px rgba(0,0,0,0.25);
  z-index:30;
}
.notif-item{
  padding:12px 14px;border-bottom:1px solid var(--rule-light);
  font-size:13px;
}
.notif-item:last-child{border-bottom:none;}
.notif-item .n-title{font-weight:600;color:var(--seal-red);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.04em;text-transform:uppercase;}
.notif-item .n-body{margin-top:4px;color:var(--text-soft);}
.notif-item .n-time{margin-top:6px;font-size:10.5px;color:#8a8267;font-family:'IBM Plex Mono',monospace;}
.notif-empty{padding:20px;text-align:center;color:var(--text-soft);font-size:13px;}
.user-chip{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;}
.user-name{font-size:13px;color:#FBF7EC;}
.role-tag{font-size:10px;color:var(--brass-light);letter-spacing:0.06em;}
.ghost-btn{
  background:transparent;border:1px solid rgba(201,162,74,0.4);
  color:#D8D0BC;padding:7px 13px;font-size:12px;border-radius:2px;
  transition:all 0.15s ease;
}
.ghost-btn:hover{border-color:var(--brass-light);color:var(--brass-light);}

.body-shell{flex:1;display:flex;}
.sidebar{
  width:220px;flex-shrink:0;
  background:var(--parchment-2);
  border-right:1px solid var(--rule);
  padding:22px 0;
}
.nav-item{
  display:block;width:100%;text-align:left;
  background:none;border:none;
  padding:11px 22px;
  font-family:'IBM Plex Mono', monospace;
  font-size:12.5px;letter-spacing:0.03em;
  color:var(--text-soft);
  border-left:3px solid transparent;
}
.nav-item:hover{color:var(--ink);background:rgba(168,131,47,0.08);}
.nav-item.active{
  color:var(--ink);font-weight:600;
  border-left-color:var(--brass);
  background:rgba(168,131,47,0.1);
}
.content{flex:1;padding:32px 36px 60px;max-width:1080px;}

/* ---------------- SHARED COMPONENTS ---------------- */
.page-head{margin-bottom:24px;}
.page-eyebrow{
  font-family:'IBM Plex Mono', monospace;font-size:11px;
  letter-spacing:0.14em;text-transform:uppercase;color:var(--brass);
}
.page-head h2{font-size:26px;margin-top:6px;}
.page-head p{color:var(--text-soft);margin-top:8px;max-width:60ch;font-size:15px;}

.card{
  background:var(--card);border:1px solid var(--rule);
  padding:20px 22px;margin-bottom:16px;
}
.card-row{
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;flex-wrap:wrap;
}
.section-title{font-size:17px;font-family:'Fraunces',serif;font-weight:600;color:var(--ink);}
.section-meta{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-soft);margin-top:4px;}

.status-pill{
  font-family:'IBM Plex Mono', monospace;font-size:10.5px;
  letter-spacing:0.05em;text-transform:uppercase;
  padding:4px 10px;border-radius:20px;display:inline-block;border:1px solid transparent;
}
.status-draft{background:#E3DAC3;color:var(--text-soft);border-color:var(--rule);}
.status-submitted{background:#DDE6F0;color:#2E5C8A;border-color:#B7CBE0;}
.status-coordinated{background:#E1EEE2;color:#3E6E5B;border-color:#BFDCC2;}
.status-verified{background:#F1E6C9;color:var(--brass);border-color:#E1CE93;}
.status-approved{background:#DCEADD;color:var(--seal-green);border-color:#B9D3BA;}
.status-sentback{background:#F3DEDE;color:var(--seal-red);border-color:#E4B9B9;}
.status-rejected{background:#F3DEDE;color:var(--seal-red);border-color:#E4B9B9;}

.btn{
  border:1px solid var(--ink);background:var(--ink);color:#FBF7EC;
  padding:9px 16px;font-size:13px;border-radius:2px;
  font-family:'Source Serif 4', serif; font-weight:600;
  transition:opacity 0.15s ease;
}
.btn:hover{opacity:0.85;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.btn-outline{
  background:transparent;color:var(--ink);border:1px solid var(--ink);
}
.btn-brass{background:var(--brass);border-color:var(--brass);color:#FBF7EC;}
.btn-green{background:var(--seal-green);border-color:var(--seal-green);color:#fff;}
.btn-red{background:transparent;border-color:var(--seal-red);color:var(--seal-red);}
.btn-red:hover{background:var(--seal-red);color:#fff;}
.btn-sm{padding:6px 12px;font-size:12px;}

table.data-table{
  width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px;margin-top:6px;
  border:1px solid var(--rule);border-radius:8px;overflow:hidden;
  box-shadow:0 1px 3px rgba(43,30,16,0.06);
}
.data-table thead th{
  font-family:'IBM Plex Mono', monospace;font-size:10.5px;
  letter-spacing:0.06em;text-transform:uppercase;color:#FBF7EC;
  text-align:left;padding:11px 12px;background:var(--brass);
  border-bottom:2px solid var(--brass-dark, var(--ink));white-space:nowrap;
}
.data-table tbody td{padding:9px 12px;border-bottom:1px solid var(--rule-light);vertical-align:middle;}
.data-table tbody tr:last-child td{border-bottom:none;}
.data-table tbody tr:nth-child(even){background:var(--parchment-2);}
.data-table tbody tr:hover{background:#F1EAD6;}
/* Student-name column stays put while scrolling horizontally through a wide
   marks table (many question/unit columns) — the same trick as a frozen
   Excel pane, so you always know whose row you're editing. */
.data-table thead th:first-child, .data-table tbody td:first-child{
  position:sticky;left:0;z-index:1;font-weight:600;
  box-shadow:2px 0 4px rgba(43,30,16,0.06);
}
.data-table thead th:first-child{ background:var(--brass); z-index:2; }
.data-table tbody tr:nth-child(even) td:first-child{ background:var(--parchment-2); }
.data-table tbody tr:nth-child(odd) td:first-child{ background:var(--card); }
.data-table tbody tr:hover td:first-child{ background:#F1EAD6; }
.data-table input[type=number]{
  width:64px;padding:5px 7px;border:1px solid var(--rule);
  background:#fff;font-size:13px;border-radius:2px;
}
.data-table input[type=number]:focus{outline:2px solid var(--brass-light);outline-offset:1px;}
.data-table input.invalid{border-color:var(--seal-red);background:#FBEFEF;}
.total-cell{font-family:'IBM Plex Mono', monospace;font-weight:600;color:var(--ink);}

.empty-state{
  padding:40px 20px;text-align:center;color:var(--text-soft);
  border:1px dashed var(--rule);background:var(--card);
}
.empty-state .em-title{font-family:'Fraunces',serif;color:var(--ink);font-size:17px;margin-bottom:6px;}

/* modal */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(20,26,40,0.55);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
}
.modal-box{
  background:var(--parchment);border:1px solid var(--rule);
  max-width:760px;width:100%;max-height:86vh;overflow-y:auto;
  padding:26px 28px 26px;box-shadow:0 20px 60px rgba(0,0,0,0.35);
}
.modal-box h3{font-size:20px;}
.modal-close{
  float:right;background:none;border:none;font-size:20px;color:var(--text-soft);line-height:1;
}
.remark-box{
  width:100%;min-height:80px;border:1px solid var(--rule);padding:10px;
  font-family:'Source Serif 4',serif;font-size:14px;margin-top:10px;background:#fff;
}
.audit-item{
  border-left:2px solid var(--rule);padding:8px 0 8px 14px;margin-bottom:4px;font-size:13px;
}
.audit-item .a-head{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--brass);letter-spacing:0.04em;text-transform:uppercase;}
.audit-item .a-body{margin-top:3px;color:var(--text);}
.audit-item .a-time{font-size:10.5px;color:var(--text-soft);margin-top:3px;font-family:'IBM Plex Mono',monospace;}

/* toast */
.toast-container{
  position:fixed;bottom:20px;right:20px;z-index:200;
  display:flex;flex-direction:column;gap:8px;
}
.toast{
  background:var(--ink);color:#FBF7EC;padding:12px 18px;
  border-left:3px solid var(--brass);font-size:13.5px;
  box-shadow:0 8px 24px rgba(0,0,0,0.3);min-width:240px;
  animation:toast-in 0.25s ease;
}
.toast.err{border-left-color:var(--seal-red);}
.toast.ok{border-left-color:var(--seal-green);}
@keyframes toast-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* weight bar reuse */
.weight-inline{display:flex;align-items:center;gap:10px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-soft);margin-top:4px;}
.weight-track{width:120px;height:7px;background:#DCD3B9;display:flex;overflow:hidden;}
.weight-cie{background:var(--ink);width:50%;}
.weight-see{background:var(--brass);width:50%;}

.config-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:18px;}
.config-field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-soft);margin-bottom:5px;}
.config-field input,.config-field select{
  width:100%;padding:8px 10px;border:1px solid var(--rule);background:#fff;font-size:13.5px;
}

.branch-heading{
  margin-top:22px;margin-bottom:8px;
  font-family:'IBM Plex Mono', monospace;font-size:11px;
  letter-spacing:0.14em;text-transform:uppercase;color:var(--brass);
  border-bottom:1px solid var(--rule-light);padding-bottom:6px;
}
.branch-heading:first-child{margin-top:0;}
.search-input{
  width:100%;padding:10px 12px;border:1px solid var(--rule);
  background:#fff;font-size:13.5px;border-radius:2px;
}
.search-input:focus{outline:2px solid var(--brass-light);outline-offset:1px;}

.table-scroll{overflow-x:auto;}
.tab-bar{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--rule);}
.tab-btn{
  background:none;border:none;padding:10px 16px;
  font-family:'IBM Plex Mono', monospace;font-size:11.5px;letter-spacing:0.04em;text-transform:uppercase;
  color:var(--text-soft);border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab-btn:hover{color:var(--ink);}
.tab-btn.active{color:var(--ink);font-weight:600;border-bottom-color:var(--brass);}
.tab-btn.locked{color:#a89f86;}
.tab-panel.hidden{display:none;}
.import-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px;}
.file-input-label{
  display:inline-flex;align-items:center;gap:8px;
  border:1px dashed var(--rule);padding:9px 14px;font-size:13px;color:var(--text-soft);
  border-radius:2px;cursor:pointer;background:#fff;
}
.file-input-label:hover{border-color:var(--brass);color:var(--ink);}

@media (max-width:820px){
  .body-shell{flex-direction:column;}
  .sidebar{width:100%;display:flex;overflow-x:auto;padding:10px 0;border-right:none;border-bottom:1px solid var(--rule);}
  .nav-item{white-space:nowrap;border-left:none;border-bottom:3px solid transparent;}
  .nav-item.active{border-left-color:transparent;border-bottom-color:var(--brass);}
  .content{padding:22px 16px 50px;}
  .notif-panel{right:16px;width:280px;}
}
/* Marks-entry number inputs: no spin buttons, just a plain typing box —
   faculty type a value and press Enter to jump to the next box. */
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button{
  -webkit-appearance:none;
  margin:0;
}
input[type="number"]{
  -moz-appearance:textfield;
  appearance:textfield;
}
#print-area{display:none;}
@media print{
  #app{display:none !important;}
  #print-area{display:block !important;}
  .topbar,.sidebar,.toast-container,#modal-root .modal-close, .no-print{display:none !important;}
  body{background:#fff;}
  .content{padding:0;max-width:none;}
}
</style>
</head>
<body>

  <div id="app">

    <!-- LOGIN VIEW -->
    <section id="login-view" class="login-view">
      <div class="login-card">
        <span class="eyebrow">Record No. DVS‑07</span>
        <h1>Digital Valuation System</h1>
        <p class="login-sub">Sign in with the email and password issued to you by the System Administrator.</p>
        <form id="login-form" class="login-form" style="margin-top:30px;display:flex;flex-direction:column;gap:14px;" onsubmit="return false;">
          <div class="config-field">
            <label style="color:var(--brass-light);">Email</label>
            <input id="login-email" type="email" autocomplete="username" placeholder="you@suh.in" style="width:100%;">
          </div>
          <div class="config-field">
            <label style="color:var(--brass-light);">Password</label>
            <input id="login-password" type="password" autocomplete="current-password" placeholder="••••••••" style="width:100%;">
          </div>
          <div id="login-error" class="section-meta hidden" style="color:#E38C8C;"></div>
          <button id="login-submit-btn" type="submit" class="btn" style="margin-top:4px;">Sign In</button>
          <p class="section-meta" style="color:#B9AF93;">No account or forgotten password? Contact your System Administrator — accounts and passwords are issued by them, not self-registered.</p>
        </form>
      </div>
    </section>

    <!-- APP SHELL -->
    <div id="shell" class="shell hidden">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">DVS</span>
          <span class="brand-sub mono">Digital Valuation System</span>
        </div>
        <div class="topbar-right">
          <button id="bell-btn" class="bell-btn" aria-label="Notifications">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            <span id="bell-count" class="bell-count hidden">0</span>
          </button>
          <div id="notif-panel" class="notif-panel hidden"></div>
          <div class="user-chip">
            <span id="user-name" class="user-name"></span>
            <span id="user-role" class="role-tag mono"></span>
          </div>
          <button id="logout-btn" class="ghost-btn">Sign out</button>
        </div>
      </header>

      <div class="body-shell">
        <nav id="sidebar" class="sidebar"></nav>
        <main id="content" class="content"></main>
      </div>
    </div>

  </div>

  <div id="toast-container" class="toast-container"></div>
  <div id="modal-root"></div>
  <div id="print-area"></div>

<script>
/* =========================================================
   Digital Valuation System (DVS) — client-side demo engine
   Vanilla JS, backed by a live Supabase Postgres database
   (see the schema/seed SQL — profiles, courses, students,
   assignments, notifications, course_history, app_settings,
   term_test_history).

   Role model:
   - Fixed system roles: ADMIN, HOD, EA, EXAM
   - FACULTY is the only "person" role — whether a faculty
     member currently behaves as a Course Coordinator (CC) or
     Course Instructor (CI) is derived at runtime from the
     `assignments` table, never stored on the user record.
   ========================================================= */

function normalizeCode(code){ return (code||'').toString().trim().toUpperCase().replace(/\s+/g,''); }

// ============================================================================
// MASTER SUBJECTS — the "Courses Applicable" master list now lives in the
// live Supabase `subjects` table (id, code, abbr, course_type, name), not
// hardcoded in this file. App.state.subjects is populated on login/refresh
// by fetchStateFromSupabase(). This is the single source of truth for any
// subject-picker in the app — no hand-typed or invented course codes. Any
// dropdown built from this list is automatically, correctly mapped to its
// Evaluation Type, so a Coordinator can never fix a subject to the wrong ET.
// ============================================================================
function masterSubject(code){ return (App.state.subjects||[]).find(s=>normalizeCode(s.code)===normalizeCode(code)) || null; }
// Powers the auto-detect flow: Select Subject -> Lookup Subject Table ->
// Get Abbreviation -> Fetch Template — now backed by App.state.subjects.
function lookupAbbrForCode(code){ const s = masterSubject(code); return s ? s.abbr : null; }
function subjectNameForCode(code){ const s = masterSubject(code); return s ? s.name : null; }

/* Grouped <select> of every real subject (Courses Applicable), grouped by
   "Abbr — Course Type" so whoever is picking a subject can see exactly which
   Evaluation Type it fixes. Used by the CC's Course Instructor assignment flow. */
function subjectDropdownOptionsHtml(selectedCode){
  const groups = {};
  const order = [];
  (App.state.subjects||[]).forEach(s=>{
    const key = `${s.abbr} — ${s.courseType}`;
    if(!groups[key]){ groups[key] = []; order.push(key); }
    groups[key].push(s);
  });
  let html = `<option value="">— Select Subject (Courses Applicable) —</option>`;
  order.forEach(key=>{
    html += `<optgroup label="${escapeHtml(key)}">`;
    groups[key].forEach(s=>{
      html += `<option value="${escapeHtml(s.code)}" ${normalizeCode(selectedCode)===normalizeCode(s.code)?'selected':''}>${escapeHtml(s.code)} — ${escapeHtml(s.name)}</option>`;
    });
    html += `</optgroup>`;
  });
  return html;
}

}

function seeDisplayComponents(template){

  return hasOther ? seeComps.filter(c=>c.key!=='seeTheory') : seeComps;
}

// ============================================================================
// APPROVAL GROUPING — per the fixed institutional rule:
//   • Term Test 1 + Term Test 2 + Lab Internal (Practical Internal Test) are
//     entered together and need explicit HOD approval before they're locked.
//   • Lab External (SEE Practical) is entered separately and also needs
//     explicit HOD approval before it's locked.
//   • Everything else (SIA, MOOCs/Assignments, Tutorials, Seminars, Skill
//     components, Regular Lab/Skill Performance, Project Assessment, etc.)
//     is scaled per the Evaluation Type as usual and needs NO HOD approval —
//     it stays editable by the Course Instructor like before.
// A given template only shows the groups it actually has components for
// (e.g. a pure-theory ET1/2/3 template has Term Tests but no Lab Internal/
// External at all, so only the Term Test approval group appears).
// ============================================================================
function labInternalComponent(template){ return (template.cie||[]).find(c=>c.key==='pracInternal') || null; }
function labExternalComponent(template){ return (template.see||[]).find(c=>c.key==='seePractical'||c.key==='seePracticalProject') || null; }
function termTestComponentsInTemplate(template){ return (template.cie||[]).filter(c=>c.key==='tt1'||c.key==='tt2'||c.key==='termTest'); }
/* The "Term Test & Lab Internal" HOD-approval group's CIE components. */
function ttLabApprovalComponents(template){
  const comps = termTestComponentsInTemplate(template).slice();
  const lab = labInternalComponent(template);
  if(lab) comps.push(lab);
  return comps;
}
/* The "Lab External" HOD-approval group's SEE component(s) (usually one). */
function labExternalApprovalComponents(template){
  const c = labExternalComponent(template);
  return c ? [c] : [];
}
/* Remaining CIE components — no HOD approval required. */
function otherCieComponents(template){
  const approvalKeys = new Set(ttLabApprovalComponents(template).map(c=>c.key));
  return (template.cie||[]).filter(c=>!approvalKeys.has(c.key));
}
/* Remaining SEE components (after SEE Theory is already excluded and Lab
   External is pulled into its own approval tab) — no HOD approval required. */
function otherSeeComponents(template){
  const labKey = labExternalComponent(template)?.key;
  return seeDisplayComponents(template).filter(c=>c.key!==labKey);
}

// ============================================================================
// TERM TEST QUESTION TEMPLATE — fixed for every student, every course,
// regardless of Evaluation Type. Structure (per the official Term Test
// paper pattern):
//   Short answers: Q1–Q5, 2 marks each = 10 marks, all compulsory.
//   Long answers:  Q6–Q11, arranged as 3 "either/or" choice pairs —
//                  (Q6 or Q7) from Unit 1, (Q8 or Q9) from Unit 2,
//                  (Q10 or Q11) from Unit 3. The student attempts exactly
//                  ONE question per pair (3 attempted out of 6 offered), so
//                  only one side of each pair may carry marks — the app
//                  enforces this. Each long question is further split into
//                  parts (a) and (b) that together make up its total.
//   Q6/Q7 and Q8/Q9 are 16 marks each (full units); Q10/Q11 is 8 marks
//   (half a unit) — the syllabus's 5 units split half for TT1, half for
//   TT2 (TT3 is used only rarely, covering whichever half is needed then).
//   Raw long-answer total (16 + 16 + 8 = 40) needs no further scaling.
//   Term Test total = 10 (short, unscaled) + 40 (long) = 50 marks,
//   matching the raw/50 the existing CIE templates already expect for
//   tt1 / tt2 / termTest.
// ============================================================================
const TT_SHORT_KEYS = ['q1','q2','q3','q4','q5'];
const TT_SHORT_EACH_MAX = 2;
const TT_SHORT_TOTAL_MAX = 10;
const TT_LONG_PAIRS = [
  { a:'q6',  b:'q7',  max:16 },
  { a:'q8',  b:'q9',  max:16 },
  // Q10/Q11 only spans half a unit (5 units total, split across the two
  // half-syllabus Term Tests), so its pair caps at 8 marks instead of 16.
  { a:'q10', b:'q11', max:8  },
];
// Raw long-answer max = sum of each pair's max (16 + 16 + 8 = 40), which now
// equals TT_LONG_SCALED_MAX exactly — so scaling is a straight passthrough
// unless the per-pair maxes above are changed again later.
const TT_LONG_RAW_MAX = TT_LONG_PAIRS.reduce((sum,p)=>sum+p.max, 0);
const TT_LONG_SCALED_MAX = 40;
const TT_TOTAL_MAX = 50;      // 10 short + 40 scaled-long

/* Academic Year (rolling window, "year by year") + Semester — the Admin
   picks both alongside the Term Test cycle, so what's fixed is always
   labelled e.g. "2025-2026 · Semester 1 · Term Test 1". */
function generateAcademicYears(){
  const startY = new Date().getFullYear() - 2;
  const years = [];
  for(let y=startY; y<=startY+6; y++) years.push(`${y}-${y+1}`);
  return years;
}

function catalogEntriesForCode(code){
  const norm = String(code||'').trim().toUpperCase();
  if(!norm) return [];
  return SUBJECT_CATALOG.filter(r=>r.code===norm);
}
/* Returns { semester } if every catalog entry for this code agrees on the
   same semester (the common case — a shared/common-core code, or a code
   that only appears once), or { options: [...] } if the same code somehow
   maps to more than one semester across different regulation/branch rows,
   so the caller can ask the Timetable Incharge to pick instead of guessing. */
function resolveSemesterForCode(code){
  const entries = catalogEntriesForCode(code);
  if(!entries.length) return null;
  const semesters = [...new Set(entries.map(e=>e.sem))];
  if(semesters.length===1) return { semester: semesters[0], entries };
  return { options: entries };
}
/* Subjects available for a given Regulation + Branch + Semester — powers
   the CC's "Add Section & Assign Instructor" subject dropdown, narrowed
   down instead of showing every subject in Courses Applicable at once. */
function catalogSubjectsFor(regulation, branch, semester){
  if(!regulation || !branch || !semester) return [];
  return SUBJECT_CATALOG.filter(r=>regulationFromCode(r.code)===regulation && r.branch===branch && r.sem===semester);
}
function ccSubjectDropdownOptionsHtml(regulation, branch, semester){
  const list = catalogSubjectsFor(regulation, branch, semester);
  if(!regulation || !branch || !semester) return `<option value="">— Pick Regulation, Branch &amp; Semester first —</option>`;
  if(!list.length) return `<option value="">— No subjects in the catalog for this Regulation/Branch/Semester —</option>`;
  return `<option value="">— Select Subject —</option>` +
    list.map(s=>`<option value="${escapeHtml(s.code)}">${escapeHtml(s.code)} — ${escapeHtml(s.name)}</option>`).join('');
}


/* Per-pair Unit + marks-split, set by the Course Instructor before entering
   marks (units are chosen by the CI when setting the question paper, not
   fixed by the app) — one Unit + one split (two equal halves, or a single
   full-mark answer) per long-answer choice pair (Q6/Q7, Q8/Q9, Q10/Q11).
   Split values are derived from each pair's own max, so a 16-mark pair
   splits into "8+8" or "16", while the 8-mark Q10/Q11 pair splits into
   "4+4" or "8". */
const TT_UNIT_OPTIONS = ['Unit 1','Unit 2','Unit 3','Unit 4','Unit 5'];
/* A soft, consistent colour per Unit — used to band together every question
   that belongs to the same Unit (Term Test header, SIA header) so a wide,
   many-column marks table reads at a glance instead of as a wall of
   identical grey cells. Falls back to a neutral tan for "Unit not set". */
const UNIT_BAND_COLORS = ['#FBE6C6','#D9EFD9','#D6E7F7','#F6DCE8','#E6DCF6'];
function unitBandColor(unitLabel){
  const idx = TT_UNIT_OPTIONS.indexOf(unitLabel);
  return idx>=0 ? UNIT_BAND_COLORS[idx % UNIT_BAND_COLORS.length] : '#EDE6D2';
}
/* Groups a column-ordered list of {unit, sub} header entries into a proper
   two-row <thead>: a top row with one colour-banded, colspan-merged cell
   per contiguous run of the same Unit, and a bottom row with each
   question's own label — instead of cramming "Unit + Question" into a
   single squished cell per column. */
function groupedHeaderRows(items){
  let top = '', sub = '';
  let i = 0;
  while(i < items.length){
    let j = i;
    while(j+1 < items.length && items[j+1].unit===items[i].unit) j++;
    const span = j-i+1;
    const color = unitBandColor(items[i].unit);
    const unitText = items[i].unit ? escapeHtml(items[i].unit) : `<span style="color:var(--seal-red);">Unit not set</span>`;
    top += `<th colspan="${span}" style="background:${color};border-bottom:2px solid var(--rule);color:var(--ink);">${unitText}</th>`;
    for(let k=i; k<=j; k++){
      sub += `<th style="background:${color};font-weight:500;color:var(--ink);">${items[k].sub}</th>`;
    }
    i = j+1;
  }
  return { top, sub };
}
function getLongPairForQKey(qKey){ return TT_LONG_PAIRS.find(p=>p.a===qKey||p.b===qKey); }
function getLongPairMax(qKey){ const p = getLongPairForQKey(qKey); return p ? p.max : TT_SHORT_EACH_MAX; }
function getQuestionConfig(course, cycle, qKey){
  const cfg = (((course.ttPaperConfig||{})[cycle]||{})[qKey]) || {};
  const pair = getLongPairForQKey(qKey);
  const fullValue = pair ? String(pair.max) : '';
  const halfValue = pair ? `${pair.max/2}+${pair.max/2}` : '';
  return { unit: cfg.unit || '', split: cfg.split || halfValue, pairMax: pair ? pair.max : null, fullValue, halfValue };
}
const TT_ALL_LONG_QKEYS = TT_LONG_PAIRS.flatMap(p=>[p.a,p.b]);
/* Short answers (Q1-Q5) also carry a Unit — set here, alongside the
   long-answer Units, so the question paper setup covers every question on
   the paper, not just the long-answer choice pairs. Short questions have no
   marks-split (each is fixed at TT_SHORT_EACH_MAX), so only Unit applies. */
const TT_ALL_QKEYS = TT_SHORT_KEYS.concat(TT_ALL_LONG_QKEYS);
function ttSetupComplete(course, cycle){
  return TT_ALL_QKEYS.every(qKey=>!!getQuestionConfig(course, cycle, qKey).unit);
}
/* Whether the Course Coordinator has finished the Question Paper Setup for
   this cycle and forwarded it to the Course Instructor. Stored as a sibling
   key inside the same ttPaperConfig[cycle] jsonb blob (alongside the q-key
   entries) so no Supabase schema change is needed. Before this is true, the
   CI's marks-entry table for this cycle stays locked — units/splits are the
   CC's call, made when the question paper itself is set. */
function isTTForwarded(course, cycle){
  return !!(((course.ttPaperConfig||{})[cycle]||{}).__forwarded);
}
/* Whether the Question Paper Setup panel is expanded (showing the Unit/split
   dropdowns) for a given course. Defaults to expanded until every question
   has a Unit set, then auto-collapses to a compact summary — the CI can
   still reopen it any time with the Edit button. Explicit toggles always
   win over that default, so the CI can reopen/close freely afterwards. */
let ttSetupExpandedMap = {};
function isTTSetupExpanded(course, cycle){
  if(course.id in ttSetupExpandedMap) return ttSetupExpandedMap[course.id];
  return !ttSetupComplete(course, cycle);
}
function toggleTTSetup(courseId, cycle){
  const course = App.getCourse(courseId);
  if(!cycle){ const tt = App.state.currentTermTest; cycle = tt?.cycle; }
  const cur = isTTSetupExpanded(course, cycle);
  ttSetupExpandedMap[courseId] = !cur;
  renderContent();
}
window.toggleTTSetup = toggleTTSetup;

/* Which raw CIE component key (as defined on the Evaluation Type template)
   a given Term Test cycle feeds into. Templates with two separate slots
   (tt1/tt2) map TT1->tt1 and TT2->tt2; templates with a single combined
   slot (termTest) always feed that one slot, whichever cycle is active.
   No template currently defines a third slot, so TT3 has no target unless
   one is added to EVAL_TEMPLATES later. */
function termTestComponentKey(template, cycle){
  if(!template) return null;
  const keys = (template.cie||[]).map(c=>c.key);
  if(cycle==='TT1' && keys.includes('tt1')) return 'tt1';
  if(cycle==='TT2' && keys.includes('tt2')) return 'tt2';
  if(keys.includes('termTest')) return 'termTest';
  return null;
}
/* Reads one student's stored answer-sheet (s.marks.ttDetail[cycle]) and
   computes the short total, long raw/scaled total, and grand /50 total.
   Q6-Q11 are 3 choice pairs (Q6/Q7, Q8/Q9, Q10/Q11); both sides of a pair
   can carry marks, and the higher of the two counts toward that pair's
   score — the CI isn't blocked from entering both while deciding. */
function computeTermTestRaw(detail){
  detail = detail || {};
  let shortTotal = 0;
  TT_SHORT_KEYS.forEach(k=>{
    const v = detail[k];
    if(typeof v === 'number' && !isNaN(v)) shortTotal += Math.min(Math.max(v,0), TT_SHORT_EACH_MAX);
  });
  shortTotal = Math.min(round1(shortTotal), TT_SHORT_TOTAL_MAX);
  let longRaw = 0, attempted = 0;
  TT_LONG_PAIRS.forEach(({a,b,max})=>{
    const da = detail[a] || {}, db = detail[b] || {};
    const totalA = (typeof da.a==='number'?da.a:0) + (typeof da.b==='number'?da.b:0);
    const totalB = (typeof db.a==='number'?db.a:0) + (typeof db.b==='number'?db.b:0);
    if(totalA>0 || totalB>0){
      attempted++;
      longRaw += Math.min(Math.max(Math.max(totalA, totalB), 0), max);
    }
  });
  const longScaled = round1((longRaw / TT_LONG_RAW_MAX) * TT_LONG_SCALED_MAX);
  const total = round1(shortTotal + longScaled);
  return { shortTotal, longRaw, longScaled, attempted, total, errors:[], valid:true };
}

function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ---------------- readable, business-code ids ----------------
   slugId turns any value into an uppercase A-Z0-9 token. bizId joins a
   few natural fields (subject code, roll no, email, etc) behind a
   prefix — e.g. bizId('CRS', ['CSE301','A']) -> 'CRS-CSE301-A' — and
   only falls back to the old random uid() when there's genuinely no
   natural field to build from. `existingIds` is whatever array of ids
   the new row would collide with; a numeric suffix is added until the
   candidate is unique. */
function slugId(v){ return String(v||'').toUpperCase().replace(/[^A-Z0-9]+/g,'').slice(0,24); }
function bizId(prefix, parts, existingIds){
  const base = (parts||[]).filter(p=>p!==null && p!==undefined && p!=='').map(slugId).join('-');
  if(!base) return uid(prefix.toLowerCase());
  const taken = new Set(existingIds||[]);
  let candidate = prefix + '-' + base;
  let n = 2;
  while(taken.has(candidate)){ candidate = prefix + '-' + base + '-' + n; n++; }
  return candidate;
}

/* fills every student's marks with plausible, complete values — used to seed a fully-approved demo record for the Examination Branch */
function fillFullMarks(course){
  const template = getCourseTemplate(course);
  course.students.forEach(s=>{
    [...template.cie, ...template.see].forEach(comp=>{
      s.marks[comp.key] = Math.round((comp.rawMax*0.78 + Math.random()*comp.rawMax*0.15)*2)/2;
    });
  });
}

/* ---------------- Supabase-backed persistence ----------------
   The app still works against one in-memory `state` object (same
   shape as before) so every render function is unchanged. On boot —
   and again right after sign-in — we fetch every table and assemble
   it into that shape. Every mutation happens in memory first (so the
   UI stays instant), then a *targeted* sync function pushes only the
   row(s) that actually changed, instead of re-writing everything. */

async function fetchStateFromSupabase(){
  const [profilesR, coursesR, completionR, assignmentsR, notificationsR, historyR, ttHistoryR, settingsR, subjectsR, studentDirR, courseRegR] = await Promise.all([
    sb.from('profiles').select('*').order('created_at', { ascending:true }),
    sb.from('courses').select('*').order('created_at', { ascending:true }),
    // Lightweight completion status instead of the full students table —
    // dashboards get { student_count, cie_complete, see_complete } per
    // course without downloading a single mark or name. Full roster/marks
    // are fetched lazily per-course by App.ensureCourseStudentsLoaded()
    // only when someone actually opens that section (mark entry, roster,
    // review/approval pages) — see course_completion_status in the DB.
    sb.from('course_completion_status').select('*'),
    sb.from('assignments').select('*').order('assigned_at', { ascending:true }),
    // Append-only logs: capped, most-recent-first. This is a partial
    // mitigation, not full pagination — see the note this was delivered
    // with for why a proper fix needs server-side aggregation instead.
    sb.from('notifications').select('*').order('ts', { ascending:false }).limit(300),
    sb.from('course_history').select('*').order('ts', { ascending:false }).limit(1000),
    sb.from('term_test_history').select('*').order('ts', { ascending:false }).limit(200),
    sb.from('app_settings').select('*'),
    sb.from('subjects').select('*').order('code', { ascending:true }),
    sb.from('student_directory').select('*').order('roll_no', { ascending:true }),
    sb.from('course_registrations').select('*').order('roll_no', { ascending:true }),
  ]);

  const named = [
    ['profiles',profilesR],['courses',coursesR],['course_completion_status',completionR],['assignments',assignmentsR],
    ['notifications',notificationsR],['course_history',historyR],['term_test_history',ttHistoryR],['app_settings',settingsR],
    ['subjects',subjectsR],['student_directory',studentDirR],['course_registrations',courseRegR],
  ];
  const firstErr = named.find(([,r])=>r.error);
  if(firstErr){
    const [table, r] = firstErr;
    const e = r.error;
    throw new Error(`Supabase query on "${table}" failed: ${e.message || JSON.stringify(e)}${e.hint ? ' — hint: '+e.hint : ''}${e.code ? ' (code '+e.code+')' : ''}`);
  }
  if(!profilesR.data || profilesR.data.length===0) throw new Error('The "profiles" table came back empty for this session.');

  const users = profilesR.data.map(p=>({ id:p.id, name:p.name, email:p.email, systemRole:p.system_role, homeBranch:p.home_branch||undefined, authId:p.auth_id||null }));

  const completionByCourse = {};
  (completionR.data||[]).forEach(row=>{ completionByCourse[row.course_id] = row; });

  const courses = coursesR.data.map(c=>{
    const comp = completionByCourse[c.id];
    return {
      id:c.id, code:c.code, name:c.name, section:c.section, branch:c.branch, semester:c.semester||'', regulation:c.regulation||'',
      status:c.status, sentBack:!!c.sent_back, lastRemark:c.last_remark||'', eaRemark:c.ea_remark||'',
      evalType:c.eval_type || null, ciLoadType:c.ci_load_type || null,
      editRequestStatus:c.edit_request_status || null, editRequestRemark:c.edit_request_remark||'', editUnlocked:!!c.edit_unlocked,
      ttLabApproval:c.tt_lab_approval || null, labExternalApproval:c.lab_external_approval || null,
      etRequests: c.et_requests || [], ttPaperConfig: c.tt_paper_config || {},
      // Roster/marks are NOT fetched here — only a lightweight count +
      // completion flags from the view. Call App.ensureCourseStudentsLoaded
      // (courseId) before any page needs the real per-student data; that
      // flips studentsLoaded to true and populates `students` for real.
      students:[], studentsLoaded:false,
      studentCount: comp ? comp.student_count : 0,
      cieComplete: comp ? !!comp.cie_complete : false,
      seeComplete: comp ? !!comp.see_complete : false,
      examDate: c.exam_date || '', scrutinyRemark: c.scrutiny_remark || '',
      frozenAt: c.frozen_at ? new Date(c.frozen_at).getTime() : null, frozenBy: c.frozen_by || '',
      scriptUploads: c.script_uploads || {}, ciAcknowledgedAt: c.ci_acknowledged_at ? new Date(c.ci_acknowledged_at).getTime() : null,
      history:[]
    };
  });
  const courseById = id => courses.find(c=>c.id===id);

  (historyR.data||[]).forEach(h=>{
    const course = courseById(h.course_id);
    if(course) course.history.push({ id:h.id, ts:new Date(h.ts).getTime(), user:h.user_name, role:h.role, action:h.action, remark:h.remark||'' });
  });

  const assignments = (assignmentsR.data||[]).map(a=>({
    id:a.id, type:a.type, courseId:a.course_id, userId:a.user_id, assignedBy:a.assigned_by,
    assignedAt:new Date(a.assigned_at).getTime(), status:a.status,
    revokedAt:a.revoked_at ? new Date(a.revoked_at).getTime() : undefined,
    revokedBy:a.revoked_by || undefined,
  }));

  const notifications = (notificationsR.data||[]).map(n=>({
    id:n.id, forUserId:n.for_user_id, courseId:n.course_id, title:n.title, body:n.body,
    ts:new Date(n.ts).getTime(), read:!!n.read, notifyEmail:!!n.notify_email, fromEmail:n.from_email||null
  }));

  const termTestHistory = (ttHistoryR.data||[]).map(t=>({ id:t.id, ts:new Date(t.ts).getTime(), by:t.by_name, value:t.value, academicYear:t.academic_year||null, semester:t.semester||null, cycle:t.value }));

  let currentTermTest = null;
  const ctRow = (settingsR.data||[]).find(r=>r.key==='current_term_test');
  if(ctRow && ctRow.value!==null && ctRow.value!==undefined){
    let v = ctRow.value;
    // syncAppSetting() writes JSON.stringify(value) into this column, so a
    // plain value is actually stored one JSON-encoding layer deeper than it
    // looks (e.g. the object {cycle:'TT1',...} is stored as the JSON STRING
    // '{"cycle":"TT1",...}'). Unwrap that one layer here — without this,
    // ctRow.value never matches what the rest of the app expects for anyone
    // loading the app fresh (i.e. everyone except the Admin who just set it,
    // whose own browser already had the unwrapped value in local state).
    if(typeof v === 'string'){
      try{ v = JSON.parse(v); }catch(e){ /* already a plain string like 'TT1' — leave as-is */ }
    }
    // Normalize: older data (or a fresh Admin.setTermTest call) may still be
    // a plain cycle string ('TT1'/'TT2'/'TT3') rather than the newer
    // {academicYear, semester, cycle} object — wrap it so every consumer can
    // always assume the object shape.
    currentTermTest = (v && typeof v === 'object') ? v : (v ? { academicYear:null, semester:null, cycle:v } : null);
  }

  const subjects = (subjectsR.data||[]).map(s=>({ id:s.id, code:s.code, abbr:s.abbr, courseType:s.course_type, name:s.name }));
  const studentDirectory = (studentDirR.data||[]).map(s=>({ id:s.id, rollNo:s.roll_no, name:s.name, email:s.email||'', branch:s.branch, batch:s.batch, semester:s.semester||'' }));
  const courseRegistrations = (courseRegR.data||[]).map(r=>({ id:r.id, batch:r.batch, branch:r.branch, regulation:r.regulation||'', semester:r.semester||'', rollNo:r.roll_no, studentName:r.student_name, subjectName:r.subject_name, sectionCode:r.section_code||'', instructorName:r.instructor_name||'' }));

  return { currentUserId:null, users, courses, assignments, notifications, currentTermTest, termTestHistory, subjects, studentDirectory, courseRegistrations };
}

  if(error) throw error;

  return data.map(p=>({ id:p.id, name:p.name, email:p.email, systemRole:p.system_role, homeBranch:p.home_branch||undefined, authId:p.auth_id||null }));
}
